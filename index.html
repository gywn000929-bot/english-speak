<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Speak Up! · 회화 중심 영문법 인터랙티브 학습</title>
<style>
  :root{
    --bg:#0f1220; --bg2:#171a2e; --card:#1b1f38; --card2:#232848;
    --line:#2c3157; --txt:#eef1ff; --mut:#9aa2c8; --muted2:#6f77a3;
    --acc:#6c8bff; --acc2:#8a6cff; --good:#3ecf8e; --bad:#ff6b81; --warn:#ffcf5c;
    --shadow:0 10px 40px rgba(0,0,0,.35);
    --radius:18px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#eef1fb; --bg2:#e4e8f7; --card:#ffffff; --card2:#f3f5ff;
      --line:#dfe3f5; --txt:#1a1e35; --mut:#5b628a; --muted2:#8991b8;
      --acc:#4a68e8; --acc2:#7a5cff; --good:#1fa971; --bad:#e5485f; --warn:#c98a12;
      --shadow:0 10px 40px rgba(60,70,120,.15);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:linear-gradient(160deg,var(--bg),var(--bg2));
    color:var(--txt); min-height:100vh; -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }
  .wrap{max-width:920px;margin:0 auto;padding:20px 16px 90px}
  header.top{display:flex;align-items:center;gap:12px;padding:8px 0 18px}
  .logo{
    width:44px;height:44px;border-radius:13px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--acc),var(--acc2));
    display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow);
  }
  .brand h1{font-size:20px;margin:0;letter-spacing:-.3px}
  .brand p{margin:0;color:var(--mut);font-size:12.5px}
  .prog-wrap{margin-left:auto;text-align:right;min-width:120px}
  .prog-bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:5px}
  .prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--good),var(--acc));transition:width .5s}
  .prog-wrap small{color:var(--mut);font-size:11.5px}

  /* HOME */
  .hero{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 20px;margin-bottom:18px;box-shadow:var(--shadow)
  }
  .hero h2{margin:0 0 6px;font-size:17px}
  .hero p{margin:0;color:var(--mut);font-size:13.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .unit-card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:15px 15px 14px;cursor:pointer;position:relative;overflow:hidden;
    transition:transform .12s ease,border-color .12s ease;
  }
  .unit-card:hover{transform:translateY(-3px);border-color:var(--acc)}
  .unit-card .num{font-size:12px;color:var(--muted2);font-weight:700;letter-spacing:1px}
  .unit-card h3{margin:6px 0 3px;font-size:16px}
  .unit-card .en{color:var(--mut);font-size:12.5px;margin:0 0 10px}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;
    background:var(--card2);color:var(--acc);border:1px solid var(--line)}
  .done-dot{position:absolute;top:14px;right:14px;width:20px;height:20px;border-radius:50%;
    background:var(--good);display:none;place-items:center;color:#fff;font-size:12px}
  .unit-card.done .done-dot{display:grid}
  .unit-card .mini{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--good);transition:width .4s}

  /* UNIT VIEW */
  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--acc);
    font-size:14px;cursor:pointer;padding:6px 0;margin-bottom:6px;font-weight:600}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
  .tab{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:99px;
    padding:8px 15px;font-size:13px;cursor:pointer;font-weight:600;transition:all .12s}
  .tab.active{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
  .panel{display:none;animation:fade .25s ease}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .box h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
  .box .lead{color:var(--txt);font-size:14.5px}
  .kv{color:var(--mut);font-size:13.5px}

  .pat{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px dashed var(--line)}
  .pat:first-of-type{border-top:none}
  .pat .p-en{font-weight:700;font-size:15px}
  .pat .p-ko{color:var(--mut);font-size:13px}

  .ex-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
  .ex-row:first-of-type{border-top:none}
  .ex-row .ex-txt{flex:1}
  .ex-row .ex-en{font-size:15px;font-weight:600}
  .ex-row .ex-ko{color:var(--mut);font-size:13px}
  .say{flex:0 0 auto;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
    background:var(--card2);color:var(--acc);cursor:pointer;font-size:17px;display:grid;place-items:center;transition:all .12s}
  .say:hover{background:var(--acc);color:#fff}
  .say:active{transform:scale(.92)}

  .dlg{display:flex;gap:10px;margin:12px 0}
  .dlg .who{flex:0 0 42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px}
  .dlg.a .who{background:linear-gradient(135deg,var(--acc),#4a68e8)}
  .dlg.b .who{background:linear-gradient(135deg,var(--acc2),#b06cff)}
  .bubble{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 13px;flex:1}
  .bubble .b-en{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;justify-content:space-between}
  .bubble .b-ko{color:var(--mut);font-size:12.5px;margin-top:2px}
  .bubble .say{width:32px;height:32px;font-size:15px}

  /* QUIZ */
  .q{margin-bottom:16px}
  .q .q-txt{font-weight:600;font-size:15px;margin-bottom:10px}
  .q .q-txt .blank{color:var(--acc);font-weight:800}
  .opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);
    color:var(--txt);border-radius:11px;padding:11px 14px;margin-bottom:8px;cursor:pointer;font-size:14px;
    transition:all .12s;font-family:inherit}
  .opt:hover{border-color:var(--acc)}
  .opt.correct{background:rgba(62,207,142,.15);border-color:var(--good);color:var(--good);font-weight:700}
  .opt.wrong{background:rgba(255,107,129,.13);border-color:var(--bad);color:var(--bad)}
  .opt:disabled{cursor:default}
  .explain{font-size:13px;color:var(--mut);margin-top:6px;padding:9px 12px;background:var(--card2);
    border-left:3px solid var(--acc);border-radius:8px;display:none}
  .explain.show{display:block}
  .quiz-done{text-align:center;padding:16px;font-size:15px}
  .quiz-done .score{font-size:34px;font-weight:800;background:linear-gradient(135deg,var(--good),var(--acc));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

  /* SPEAK */
  .speak-card{text-align:center;padding:22px 18px}
  .speak-target{font-size:20px;font-weight:700;margin:6px 0 4px}
  .speak-ko{color:var(--mut);font-size:13.5px;margin-bottom:16px}
  .mic{width:78px;height:78px;border-radius:50%;border:none;cursor:pointer;font-size:32px;color:#fff;
    background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:var(--shadow);transition:transform .12s}
  .mic:active{transform:scale(.9)}
  .mic.rec{animation:pulse 1s infinite;background:linear-gradient(135deg,var(--bad),#ff4d6d)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,129,.5)}70%{box-shadow:0 0 0 22px rgba(255,107,129,0)}100%{box-shadow:0 0 0 0 rgba(255,107,129,0)}}
  .heard{margin-top:16px;min-height:26px;font-size:15px}
  .heard b{color:var(--txt)}
  .speak-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
  .btn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:11px;
    padding:10px 16px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;transition:all .12s}
  .btn:hover{border-color:var(--acc)}
  .btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
  .btn:disabled{opacity:.4;cursor:default}
  .match-good{color:var(--good);font-weight:700}
  .match-bad{color:var(--bad)}
  .hint{font-size:12px;color:var(--muted2);margin-top:12px}

  .done-btn{display:block;width:100%;margin-top:6px;padding:13px;border-radius:13px;border:none;
    background:linear-gradient(135deg,var(--good),var(--acc));color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .footer-note{text-align:center;color:var(--muted2);font-size:11.5px;margin-top:24px;line-height:1.7}
  .diff{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  @media(max-width:520px){.wrap{padding:16px 12px 80px}.prog-wrap{min-width:96px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">🗣️</div>
    <div class="brand">
      <h1>Speak Up!</h1>
      <p>회화 중심 영문법 인터랙티브 학습</p>
    </div>
    <div class="prog-wrap">
      <small><span id="doneCount">0</span> / <span id="totalCount">0</span> 완료</small>
      <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
    </div>
  </header>

  <main id="app"></main>

  <div class="footer-note">
    Grammar in Use Intermediate 커리큘럼 구성을 참고한 오리지널 학습 콘텐츠 ·
    발음 듣기 🔊 와 말하기 🎤 는 브라우저 음성 기능을 사용합니다 (Chrome 권장)
  </div>
</div>

<script>
/* ---------------- 학습 데이터 (회화 중심 15유닛) ---------------- */
const UNITS = [
 {
  id:"u1", tag:"현재시제", title:"지금 하는 중이야", en:"I'm doing (현재진행)",
  intro:"지금 이 순간 진행 중인 일을 말할 때 <b>am/is/are + -ing</b> 를 씁니다. 'What are you doing?'(뭐 해?)은 회화에서 매일 쓰는 표현이에요.",
  patterns:[
   {en:"I'm + ~ing", ko:"나 지금 ~하는 중이야"},
   {en:"Are you + ~ing?", ko:"너 ~하고 있어?"},
   {en:"He/She isn't + ~ing", ko:"그/그녀는 ~하고 있지 않아"}
  ],
  examples:[
   {en:"I'm cooking dinner right now.", ko:"나 지금 저녁 요리하는 중이야."},
   {en:"What are you doing this weekend?", ko:"이번 주말에 뭐 해?"},
   {en:"She's not listening to me.", ko:"걔 내 말 안 듣고 있어."},
   {en:"We're waiting for the bus.", ko:"우리 버스 기다리는 중이야."}
  ],
  dialogue:[
   {w:"A",en:"Hey! What are you doing?",ko:"안녕! 뭐 하고 있어?"},
   {w:"B",en:"I'm making coffee. Do you want some?",ko:"커피 만들고 있어. 좀 마실래?"},
   {w:"A",en:"Yes, please. I'm dying for a cup.",ko:"응, 부탁해. 한 잔이 너무 간절해."},
   {w:"B",en:"Coming right up!",ko:"바로 갈게(만들게)!"}
  ],
  quiz:[
   {q:"Look! It ___ outside.", opts:["rains","is raining","rain"], a:1, ex:"지금 눈앞에서 벌어지는 일 → is raining."},
   {q:"\"뭐 하고 있어?\" 를 영어로?", opts:["What do you do?","What are you doing?","What you doing now?"], a:1, ex:"진행 중 행동은 be+~ing. (What do you do?는 직업을 묻는 말)"},
   {q:"They ___ TV at the moment.", opts:["are watching","watch","watches"], a:0, ex:"at the moment(지금) → 진행형."}
  ],
  speak:["I'm cooking dinner.","What are you doing?","We're waiting for the bus.","I'm learning English."]
 },
 {
  id:"u2", tag:"현재시제", title:"평소에 하는 일", en:"I do (현재단순)",
  intro:"습관, 반복되는 일, 일반적 사실은 <b>현재단순형</b>을 씁니다. 주어가 he/she/it이면 동사에 <b>-s</b>를 붙여요. 자기소개·일상 대화의 기본!",
  patterns:[
   {en:"I / You / We + 동사", ko:"나/너/우리는 ~한다"},
   {en:"He / She + 동사-s", ko:"그/그녀는 ~한다"},
   {en:"Do you ~? / Does he ~?", ko:"너 ~하니? / 그는 ~하니?"}
  ],
  examples:[
   {en:"I work at a design studio.", ko:"나는 디자인 스튜디오에서 일해."},
   {en:"She drinks tea every morning.", ko:"그녀는 매일 아침 차를 마셔."},
   {en:"Do you like spicy food?", ko:"매운 음식 좋아해?"},
   {en:"He doesn't eat meat.", ko:"그는 고기를 안 먹어."}
  ],
  dialogue:[
   {w:"A",en:"So, what do you do?",ko:"그래서, 무슨 일 하세요?"},
   {w:"B",en:"I teach math at a high school. How about you?",ko:"고등학교에서 수학 가르쳐요. 당신은요?"},
   {w:"A",en:"I work from home. I design apps.",ko:"저는 재택근무해요. 앱을 디자인하죠."},
   {w:"B",en:"That sounds interesting!",ko:"흥미롭네요!"}
  ],
  quiz:[
   {q:"She ___ to work by subway.", opts:["go","goes","going"], a:1, ex:"주어 She → 동사에 -s (goes)."},
   {q:"부정: He ___ coffee.", opts:["doesn't drink","don't drinks","not drink"], a:0, ex:"3인칭 부정은 doesn't + 동사원형."},
   {q:"\"매운 거 좋아해?\"", opts:["Do you like spicy food?","Are you like spicy food?","You like spicy food?"], a:0, ex:"일반동사 의문문은 Do you + 동사원형."}
  ],
  speak:["I work from home.","She drinks tea every morning.","Do you like spicy food?","He doesn't eat meat."]
 },
 {
  id:"u3", tag:"완료시제", title:"해본 적 있어 / 방금 했어", en:"I have done (현재완료)",
  intro:"<b>have/has + 과거분사(p.p.)</b>. 경험('~해본 적 있다'), 방금 끝난 일('막 ~했다'), 지금까지의 결과를 말할 때 씁니다. 회화에서 <b>ever, never, just, already, yet</b>과 자주 짝지어요.",
  patterns:[
   {en:"Have you ever + p.p.?", ko:"~해본 적 있어?"},
   {en:"I've just + p.p.", ko:"나 방금 ~했어"},
   {en:"I haven't + p.p. + yet", ko:"아직 ~안 했어"}
  ],
  examples:[
   {en:"Have you ever been to Japan?", ko:"일본 가본 적 있어?"},
   {en:"I've just finished my homework.", ko:"나 방금 숙제 끝냈어."},
   {en:"She has never eaten sushi.", ko:"그녀는 초밥을 먹어본 적이 없어."},
   {en:"I haven't decided yet.", ko:"아직 못 정했어."}
  ],
  dialogue:[
   {w:"A",en:"Have you seen the new Marvel movie?",ko:"새 마블 영화 봤어?"},
   {w:"B",en:"No, I haven't seen it yet. Is it good?",ko:"아니, 아직 못 봤어. 재밌어?"},
   {w:"A",en:"It's amazing! I've already watched it twice.",ko:"완전 대박이야! 나 벌써 두 번 봤어."},
   {w:"B",en:"Wow, let's go this weekend!",ko:"와, 이번 주말에 가자!"}
  ],
  quiz:[
   {q:"___ you ever ___ to Paris?", opts:["Did / been","Have / been","Have / went"], a:1, ex:"경험은 Have + p.p.(been). went는 과거형이라 X."},
   {q:"I've ___ finished. (방금)", opts:["yet","just","ever"], a:1, ex:"'방금'은 just. yet은 부정·의문에서 '아직'."},
   {q:"She has ___ eaten sushi. (전혀)", opts:["never","ever","already"], a:0, ex:"'한 번도 ~없다'는 never."}
  ],
  speak:["Have you ever been to Japan?","I've just finished my homework.","I haven't decided yet.","She has never eaten sushi."]
 },
 {
  id:"u4", tag:"과거시제", title:"어제 뭐 했어", en:"I did (과거단순)",
  intro:"이미 끝난 과거의 일은 <b>과거형</b>으로. 규칙동사는 <b>-ed</b>, 불규칙동사는 형태가 바뀝니다(go→went, eat→ate). 의문·부정은 <b>did</b>를 써요.",
  patterns:[
   {en:"I + 과거형", ko:"나 ~했어"},
   {en:"Did you + 동사원형?", ko:"너 ~했어?"},
   {en:"I didn't + 동사원형", ko:"나 ~안 했어"}
  ],
  examples:[
   {en:"I watched a movie last night.", ko:"나 어젯밤에 영화 봤어."},
   {en:"Did you sleep well?", ko:"잘 잤어?"},
   {en:"We went to the beach yesterday.", ko:"우리 어제 바다에 갔어."},
   {en:"I didn't have time.", ko:"나 시간이 없었어."}
  ],
  dialogue:[
   {w:"A",en:"How was your weekend?",ko:"주말 어땠어?"},
   {w:"B",en:"It was great! I visited my grandparents.",ko:"좋았어! 조부모님 뵈러 갔어."},
   {w:"A",en:"Nice. Did you do anything else?",ko:"좋네. 다른 것도 했어?"},
   {w:"B",en:"We cooked together and played cards.",ko:"같이 요리하고 카드 게임 했어."}
  ],
  quiz:[
   {q:"We ___ to the beach yesterday.", opts:["go","went","gone"], a:1, ex:"go의 과거형은 went (불규칙)."},
   {q:"___ you sleep well?", opts:["Did","Do","Have"], a:0, ex:"과거 의문문은 Did + 주어 + 동사원형."},
   {q:"I ___ have time. (부정)", opts:["didn't","don't","wasn't"], a:0, ex:"일반동사 과거 부정은 didn't + 동사원형."}
  ],
  speak:["I watched a movie last night.","Did you sleep well?","We went to the beach yesterday.","I didn't have time."]
 },
 {
  id:"u5", tag:"미래시제", title:"~할 거야", en:"will / be going to (미래)",
  intro:"미래는 두 가지! <b>will</b>은 지금 즉흥적으로 정한 결정·약속·예측, <b>be going to</b>는 이미 정해둔 계획을 말할 때 씁니다.",
  patterns:[
   {en:"I'll + 동사원형", ko:"(방금 결정) 내가 ~할게"},
   {en:"I'm going to + 동사원형", ko:"(계획) ~할 예정이야"},
   {en:"Will you + 동사원형?", ko:"~해줄래?"}
  ],
  examples:[
   {en:"I'll call you later.", ko:"이따 전화할게."},
   {en:"I'm going to travel next month.", ko:"다음 달에 여행 갈 거야."},
   {en:"It's going to rain.", ko:"비 올 것 같아.(먹구름을 보며)"},
   {en:"Will you help me?", ko:"나 좀 도와줄래?"}
  ],
  dialogue:[
   {w:"A",en:"I'm going to start a new job next week.",ko:"다음 주에 새 직장 시작할 거야."},

  id:"u15", tag:"구동사", title:"원어민이 쓰는 구동사", en:"phrasal verbs (구동사)",
  intro:"<b>동사 + 부사/전치사</b>로 새 뜻이 되는 구동사! 원어민 일상 회화의 핵심이에요. get up(일어나다), give up(포기하다), look for(찾다)처럼 덩어리로 외우면 회화가 확 자연스러워집니다.",
  patterns:[
   {en:"get up / wake up", ko:"일어나다 / 잠에서 깨다"},
   {en:"look for / find out", ko:"~을 찾다 / 알아내다"},
   {en:"give up / turn on", ko:"포기하다 / (기기를) 켜다"}
  ],
  examples:[
   {en:"I get up at 6 every day.", ko:"난 매일 6시에 일어나."},
   {en:"I'm looking for my glasses.", ko:"내 안경 찾고 있어."},
   {en:"Don't give up!", ko:"포기하지 마!"},
   {en:"Can you turn on the light?", ko:"불 좀 켜줄래?"}
  ],
  dialogue:[
   {w:"A",en:"You look tired. What time did you get up?",ko:"피곤해 보여. 몇 시에 일어났어?"},
   {w:"B",en:"At 5. I couldn't find out why my alarm didn't ring.",ko:"5시에. 알람이 왜 안 울렸는지 못 알아냈어."},
   {w:"A",en:"Oh no. You should turn it up louder.",ko:"저런. 소리를 더 키우는 게 좋겠어."},
   {w:"B",en:"Good idea. I won't give up on being early!",ko:"좋은 생각이야. 일찍 일어나기 포기 안 할래!"}
  ],
  quiz:[
   {q:"I ___ at 6 every morning. (일어나다)", opts:["get up","get on","get in"], a:0, ex:"일어나다 = get up."},
   {q:"I'm ___ my keys. (찾는 중)", opts:["looking at","looking for","looking up"], a:1, ex:"~을 찾다 = look for."},
   {q:"Please ___ the TV. (켜다)", opts:["turn on","turn up","turn into"], a:0, ex:"(기기) 켜다 = turn on."}
  ],
  speak:["I get up at 6 every day.","I'm looking for my glasses.","Don't give up!","Can you turn on the light?"]
 }
];

/* ---------------- 상태 & 저장 ---------------- */
const STORE_KEY = "speakup_progress_v1";
let progress = {};
try{ progress = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ progress = {}; }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }catch(e){} }

const app = document.getElementById("app");
document.getElementById("totalCount").textContent = UNITS.length;

function refreshProgress(){
  const done = Object.keys(progress).filter(k=>progress[k]).length;
  document.getElementById("doneCount").textContent = done;
  document.getElementById("progFill").style.width = (done/UNITS.length*100)+"%";
}

/* ---------------- 음성: 듣기(TTS) ---------------- */
let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, rate=0.95){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = rate;
  const v = voices.find(v=>/en-US/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ---------------- 화면: 홈 ---------------- */
function renderHome(){
  refreshProgress();
  let cards = UNITS.map((u,i)=>`
    <div class="unit-card ${progress[u.id]?'done':''}" onclick="openUnit('${u.id}')">
      <div class="done-dot">✓</div>
      <div class="num">UNIT ${String(i+1).padStart(2,'0')}</div>
      <h3>${u.title}</h3>
      <p class="en">${u.en}</p>
      <span class="tag">${u.tag}</span>
      <div class="mini" style="width:${progress[u.id]?100:0}%"></div>
    </div>`).join("");
  app.innerHTML = `
    <div class="hero">
      <h2>👋 회화가 되는 영문법, 직접 말하며 배우기</h2>
      <p>15개 유닛마다 <b>핵심 설명 → 예문 듣기 → 실전 대화 → 퀴즈 → 말하기 연습</b> 순서로 익혀요.
      🔊 버튼으로 원어민 발음을 듣고, 🎤 로 직접 따라 말하면 발음까지 체크됩니다.</p>
    </div>
    <div class="grid">${cards}</div>`;
  window.scrollTo(0,0);
}

/* ---------------- 화면: 유닛 ---------------- */
function openUnit(id){
  const u = UNITS.find(x=>x.id===id);
  const idx = UNITS.findIndex(x=>x.id===id);
  app.innerHTML = `
    <button class="back" onclick="renderHome()">← 유닛 목록</button>
    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
      <span class="tag">UNIT ${String(idx+1).padStart(2,'0')} · ${u.tag}</span>
    </div>
    <h2 style="margin:8px 0 2px;font-size:22px">${u.title}</h2>
    <p style="margin:0 0 4px;color:var(--mut);font-size:14px">${u.en}</p>
    <div class="tabs">
      <button class="tab active" data-t="learn" onclick="switchTab(this)">📖 설명</button>
      <button class="tab" data-t="ex" onclick="switchTab(this)">🔊 예문</button>
      <button class="tab" data-t="dlg" onclick="switchTab(this)">💬 대화</button>
      <button class="tab" data-t="quiz" onclick="switchTab(this)">✏️ 퀴즈</button>
      <button class="tab" data-t="speak" onclick="switchTab(this)">🎤 말하기</button>
    </div>
    <div class="panel active" data-p="learn">${renderLearn(u)}</div>
    <div class="panel" data-p="ex">${renderExamples(u)}</div>
    <div class="panel" data-p="dlg">${renderDialogue(u)}</div>
    <div class="panel" data-p="quiz">${renderQuiz(u)}</div>
    <div class="panel" data-p="speak">${renderSpeak(u)}</div>
  `;
  window.__unit = u;
  window.scrollTo(0,0);
}

function switchTab(btn){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  btn.classList.add("active");
  const t = btn.dataset.t;
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active", p.dataset.p===t));
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderLearn(u){
  const pats = u.patterns.map(p=>`
    <div class="pat">
      <div>
        <div class="p-en">${p.en}</div>
        <div class="p-ko">${p.ko}</div>
      </div>
    </div>`).join("");
  return `
    <div class="box">
      <h3>💡 핵심 개념</h3>
      <p class="lead">${u.intro}</p>
    </div>
    <div class="box">
      <h3>🔑 핵심 패턴</h3>
      ${pats}
    </div>`;
}

function renderExamples(u){
  const rows = u.examples.map(e=>`
    <div class="ex-row">
      <div class="ex-txt">
        <div class="ex-en">${e.en}</div>
        <div class="ex-ko">${e.ko}</div>
      </div>
      <button class="say" onclick="speak('${e.en.replace(/'/g,"\\'")}')" title="발음 듣기">🔊</button>
    </div>`).join("");
  return `<div class="box"><h3>🔊 예문 듣기</h3><p class="kv" style="margin:-4px 0 6px">🔊 를 눌러 원어민 발음을 들어보세요.</p>${rows}</div>`;
}

function renderDialogue(u){
  const lines = u.dialogue.map(d=>`
    <div class="dlg ${d.w==='A'?'a':'b'}">
      <div class="who">${d.w}</div>
      <div class="bubble">
        <div class="b-en"><span>${d.en}</span><button class="say" onclick="speak('${d.en.replace(/'/g,"\\'")}')">🔊</button></div>
        <div class="b-ko">${d.ko}</div>
      </div>
    </div>`).join("");
  const full = u.dialogue.map(d=>d.en).join(" ... ");
  return `
    <div class="box">
      <h3>💬 실전 대화</h3>
      <p class="kv" style="margin:-4px 0 10px">이 표현이 실제 대화에서 어떻게 쓰이는지 보세요.</p>
      ${lines}
      <button class="btn primary" style="margin-top:8px" onclick="speak('${full.replace(/'/g,"\\'")}', 0.92)">▶ 대화 전체 듣기</button>
    </div>`;
}

function renderQuiz(u){
  const qs = u.quiz.map((q,qi)=>{
    const opts = q.opts.map((o,oi)=>`
      <button class="opt" data-q="${qi}" data-o="${oi}" onclick="answer(this,${qi},${oi},${q.a})">${o}</button>`).join("");
    return `
      <div class="q" data-qi="${qi}">
        <div class="q-txt">${qi+1}. ${q.q.replace(/___/g,'<span class="blank">____</span>')}</div>
        ${opts}
        <div class="explain" data-ex="${qi}">💡 ${q.ex}</div>
      </div>`;
  }).join("");
  return `
    <div class="box">
      <h3>✏️ 연습 퀴즈</h3>
      ${qs}
      <div id="quizResult"></div>
    </div>`;
}

let quizState = {};
function answer(btn, qi, chosen, correct){
  const wrap = btn.closest(".q");
  if(wrap.dataset.answered) return;
  wrap.dataset.answered = "1";
  wrap.querySelectorAll(".opt").forEach((b,i)=>{
    b.disabled = true;
    if(i===correct) b.classList.add("correct");
    if(i===chosen && chosen!==correct) b.classList.add("wrong");
  });
  wrap.querySelector('.explain').classList.add("show");
  quizState[qi] = (chosen===correct);
  checkQuizDone();
}
function checkQuizDone(){
  const u = window.__unit;
  if(Object.keys(quizState).length < u.quiz.length) return;
  const score = Object.values(quizState).filter(Boolean).length;
  document.getElementById("quizResult").innerHTML = `
    <div class="quiz-done">
      <div class="score">${score} / ${u.quiz.length}</div>
      <div style="color:var(--mut);margin-top:4px">${score===u.quiz.length?'완벽해요! 🎉':'좋아요, 오답 설명을 다시 읽어보세요 👍'}</div>
    </div>
    <button class="done-btn" onclick="markDone('${u.id}')">✓ 이 유닛 완료 표시하고 목록으로</button>`;
}

function markDone(id){
  progress[id] = true; save();
  renderHome();
}

/* ---------------- 말하기 연습 (음성인식) ---------------- */
let SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let sIndex = 0;
function renderSpeak(u){
  sIndex = 0;
  const supported = !!SR;
  setTimeout(()=>updateSpeakCard(u), 0);
  return `
    <div class="box speak-card" id="speakBox">
      <div class="kv"><span id="spCount">1</span> / ${u.speak.length}</div>
      <div class="speak-target" id="spTarget"></div>
      <div class="speak-ko" id="spKo"></div>
      <button class="say" style="width:44px;height:44px;font-size:19px;margin:0 auto 14px" onclick="speak(document.getElementById('spTarget').textContent)">🔊</button>
      <div>
        <button class="mic" id="micBtn" onclick="startRec()" ${supported?'':'disabled'}>🎤</button>
      </div>
      <div class="heard" id="heard">${supported?'🎤 버튼을 누르고 문장을 따라 말해보세요':'⚠️ 이 브라우저는 음성인식을 지원하지 않아요. Chrome을 사용하면 말하기 채점이 가능합니다. (듣기 🔊 는 사용 가능)'}</div>
      <div class="speak-nav">
        <button class="btn" id="prevBtn" onclick="moveSpeak(-1)">← 이전</button>
        <button class="btn primary" id="nextBtn" onclick="moveSpeak(1)">다음 →</button>
      </div>
      <div class="hint">발음이 완벽하지 않아도 괜찮아요. 여러 번 반복이 최고의 연습! 💪</div>
    </div>`;
}
function updateSpeakCard(u){
  const arr = u.speak;
  document.getElementById("spCount").textContent = sIndex+1;
  document.getElementById("spTarget").textContent = arr[sIndex];
  // 한국어 힌트: 예문/대화에서 매칭되면 보여주기
  const match = u.examples.find(e=>e.en===arr[sIndex]);
  document.getElementById("spKo").textContent = match ? match.ko : "";
  document.getElementById("heard").innerHTML = SR ? '🎤 버튼을 누르고 문장을 따라 말해보세요' : document.getElementById("heard").innerHTML;
  document.getElementById("prevBtn").disabled = (sIndex===0);
  const nb = document.getElementById("nextBtn");
  nb.textContent = (sIndex===arr.length-1) ? '완료 ✓' : '다음 →';
}
function moveSpeak(dir){
  const u = window.__unit;
  if(dir>0 && sIndex===u.speak.length-1){ markDone(u.id); return; }
  sIndex = Math.max(0, Math.min(u.speak.length-1, sIndex+dir));
  updateSpeakCard(u);
}
function normalize(s){ return s.toLowerCase().replace(/[^a-z0-9']+/g," ").trim(); }
function similarity(a,b){
  a=normalize(a).split(" "); b=normalize(b).split(" ");
  const setB = {}; b.forEach(w=>setB[w]=(setB[w]||0)+1);
  let hit=0; a.forEach(w=>{ if(setB[w]>0){hit++; setB[w]--;} });
  return Math.round(hit/Math.max(a.length,1)*100);
}
function startRec(){
  if(!SR) return;
  const u = window.__unit;
  const target = u.speak[sIndex];
  const rec = new SR();
  rec.lang="en-US"; rec.interimResults=false; rec.maxAlternatives=3;
  const btn = document.getElementById("micBtn");
  const heard = document.getElementById("heard");
  btn.classList.add("rec"); heard.textContent="🎙️ 듣는 중...";
  rec.onresult = (e)=>{
    let best="", bestScore=-1;
    for(let i=0;i<e.results[0].length;i++){
      const t = e.results[0][i].transcript;
      const sc = similarity(t, target);
      if(sc>bestScore){bestScore=sc; best=t;}
    }
    const cls = bestScore>=70 ? 'match-good' : 'match-bad';
    const emoji = bestScore>=90?'🌟 완벽해요!':bestScore>=70?'👍 좋아요!':'🔁 다시 해볼까요?';
    heard.innerHTML = `내가 말한 것: <b>“${best}”</b><br><span class="${cls}">일치율 ${bestScore}% · ${emoji}</span>`;
  };
  rec.onerror = ()=>{ heard.textContent="⚠️ 인식 실패. 마이크 권한을 확인하고 다시 시도하세요."; btn.classList.remove("rec"); };
  rec.onend = ()=>{ btn.classList.remove("rec"); };
  try{ rec.start(); }catch(err){ btn.classList.remove("rec"); }
}

/* ---------------- 시작 ---------------- */
renderHome();
</script>
</body>
</html>
