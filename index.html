ut it is said to be amazing.","ko":"아직, 근데 엄청 좋다고들 하더라."},{"w":"A","en":"Let's go. We are supposed to relax today.","ko":"가자. 오늘 우리 쉬기로 했잖아."},{"w":"B","en":"True. It is said that their coffee is the best.","ko":"맞아. 거기 커피가 최고라고들 해."}],"quiz":[{"q":"'그가 부자라고들 해요.'","opts":["It is said that he is rich.","It says that he is rich.","He said to be rich."],"a":0,"ex":"전언 수동은 It is said that ... 형태예요."},{"q":"be supposed to의 뜻으로 알맞은 것은?","opts":["~하기로 되어 있다","~하고 싶다","~할 수 없다"],"a":0,"ex":"be supposed to는 하기로 되어 있다는 뜻이에요."},{"q":"'그녀는 요리를 잘한다고들 해요.'","opts":["She is said to be a great cook.","She says to be a great cook.","She is say a great cook."],"a":0,"ex":"사람 주어 전언 수동은 be said to + 동사 예요."}],"speak":["It is said that he is very rich.","She is said to be a great cook.","We are supposed to meet at noon.","This movie is supposed to be good."]},{"id":"u46","tag":"수동태","title":"have/get + 목적어 + p.p.","en":"Have something done","intro":"남에게 시켜서 어떤 일을 하게 할 때 \u003cb>have/get + 목적어 + 과거분사(p.p.)\u003c/b>를 써요. \u003cb>I had my hair cut.\u003c/b>(나 머리 잘랐어 = 미용사가 잘라줌)처럼, 내가 직접 한 게 아니라 \u003cb>남이 해준 것\u003c/b>을 나타냅니다.","patterns":[{"en":"I had my hair cut yesterday.","ko":"나 어제 머리 잘랐어."},{"en":"I need to get my car fixed.","ko":"나 차 수리 맡겨야 해."}],"examples":[{"en":"She had her nails done for the party.","ko":"그녀는 파티를 위해 네일을 받았어요."},{"en":"We got the walls painted last week.","ko":"우리는 지난주에 벽을 칠하게 했어요."},{"en":"He had his watch repaired.","ko":"그는 시계를 수리 맡겼어요."},{"en":"You should get your eyes checked.","ko":"너 눈 검사 받아야 해."}],"dialogue":[{"w":"A","en":"Your hair looks different today.","ko":"너 오늘 머리 좀 달라 보인다."},{"w":"B","en":"Yeah, I had it cut this morning.","ko":"응, 오늘 아침에 잘랐어."},{"w":"A","en":"Nice. I need to get mine done too.","ko":"좋다. 나도 좀 해야 하는데."},{"w":"B","en":"You should. Get it colored as well.","ko":"해. 염색도 같이 해."}],"quiz":[{"q":"'나 머리 잘랐어.'(남이 잘라줌)","opts":["I had my hair cut.","I had my hair cutting.","I cut my hair to someone."],"a":0,"ex":"have + 목적어 + p.p.로 남이 해준 일을 나타내요."},{"q":"'나 차 수리 맡겨야 해.'","opts":["I need to get my car fixed.","I need to get my car fix.","I need to fix my car by someone."],"a":0,"ex":"get + 목적어 + p.p. 형태로 써요."},{"q":"have something done의 뜻은?","opts":["남을 시켜서 ~하게 하다","직접 ~하다","~할 수 없다"],"a":0,"ex":"남이 대신 해주는 일을 나타내는 사역 수동이에요."}],"speak":["I had my hair cut yesterday.","I need to get my car fixed.","She had her nails done.","You should get your eyes checked."]},{"id":"u47","tag":"화법","title":"간접화법 1","en":"Reported speech 1","intro":"다른 사람의 말을 그대로 옮기지 않고 전달할 때 \u003cb>He said that ...\u003c/b> 형태를 씁니다. 전달동사가 과거이면 안의 시제를 한 칸 뒤로 옮기고, this는 that, here는 there로 바꿉니다.","patterns":[{"en":"He said (that) he was tired.","ko":"그는 피곤하다고 말했어요."},{"en":"She told me (that) she liked it.","ko":"그녀는 그것이 마음에 든다고 말했어요."}],"examples":[{"en":"He said he was busy that day.","ko":"그는 그날 바쁘다고 말했어요."},{"en":"She said she had finished her work.","ko":"그녀는 일을 끝냈다고 말했어요."},{"en":"They said they would come later.","ko":"그들은 나중에 오겠다고 말했어요."},{"en":"I said I didn't know the answer.","ko":"나는 답을 모른다고 말했어요."}],"dialogue":[{"w":"A","en":"Did you talk to Tom?","ko":"톰이랑 얘기했어요?"},{"w":"B","en":"Yes, he said he was moving to Busan.","ko":"네, 그가 부산으로 이사한다고 했어요."},{"w":"A","en":"Really? When did he say that?","ko":"정말요? 언제 그렇게 말했어요?"},{"w":"B","en":"He told me it would happen next month.","ko":"다음 달에 그렇게 될 거라고 말해줬어요."}],"quiz":[{"q":"He said, I am tired. -> He said that ___ tired.","opts":["he was","he is","I am"],"a":0,"ex":"전달동사가 과거(said)라 am이 was로 바뀌어요."},{"q":"She said, I like this. -> She said she liked ___.","opts":["this","that","here"],"a":1,"ex":"간접화법에서 this는 보통 that으로 바뀝니다."},{"q":"다음 중 자연스러운 것은?","opts":["He said he will come.","He said he would come.","He said he come."],"a":1,"ex":"said가 과거라 will이 would로 시제가 한 칸 뒤로 갑니다."}],"speak":["He said he was tired.","She said she liked the movie.","They said they would help us.","I said I didn't have time."]},{"id":"u48","tag":"화법","title":"간접화법 2","en":"Reported speech 2","intro":"say 뒤에는 사람을 바로 쓰지 않지만 \u003cb>tell\u003c/b> 뒤에는 사람이 옵니다. 명령은 tell/ask + 사람 + to do로, 의문문은 if/whether로 전달하며 평서문 어순을 씁니다.","patterns":[{"en":"He told me to wait.","ko":"그는 나에게 기다리라고 했어요."},{"en":"She asked if I was ready.","ko":"그녀는 내가 준비됐는지 물었어요."}],"examples":[{"en":"He said hello to everyone.","ko":"그는 모두에게 인사했어요."},{"en":"She told him to close the door.","ko":"그녀는 그에게 문을 닫으라고 했어요."},{"en":"They asked me not to be late.","ko":"그들은 나에게 늦지 말라고 했어요."},{"en":"I asked her if she was okay.","ko":"나는 그녀에게 괜찮은지 물었어요."}],"dialogue":[{"w":"A","en":"What did the doctor tell you?","ko":"의사가 뭐라고 했어요?"},{"w":"B","en":"He told me to rest for a week.","ko":"일주일 쉬라고 했어요."},{"w":"A","en":"Did he say anything else?","ko":"다른 말은 없었어요?"},{"w":"B","en":"He asked if I had any pain.","ko":"통증이 있는지 물어봤어요."}],"quiz":[{"q":"빈칸: She ___ me that it was true.","opts":["said","told","asked"],"a":1,"ex":"사람(me)이 바로 오면 tell을 씁니다."},{"q":"명령 전달: He said, Wait here. -> He told me ___.","opts":["wait here","to wait there","waited there"],"a":1,"ex":"명령은 tell + 사람 + to do, here는 there로 바뀌어요."},{"q":"의문문 전달: Are you ready? -> She asked if I ___.","opts":["was ready","were ready?","am ready"],"a":0,"ex":"간접의문문은 평서문 어순(주어+동사)이고 시제도 뒤로 갑니다."}],"speak":["She told me to sit down.","He asked me to help him.","They asked if I was busy.","I told her not to worry."]},{"id":"u49","tag":"의문문","title":"의문문 만들기 1","en":"Questions 1","intro":"일반동사 의문문은 \u003cb>do/does/did\u003c/b>로 시작합니다. 부정의문문(Don't you ...?)은 놀람이나 확인을 나타내고, 전치사는 보통 문장 끝에 옵니다(What ... for?).","patterns":[{"en":"Do you like coffee?","ko":"커피 좋아해요?"},{"en":"What are you looking for?","ko":"무엇을 찾고 있어요?"}],"examples":[{"en":"Does she work here?","ko":"그녀는 여기서 일해요?"},{"en":"Did they call you?","ko":"그들이 전화했어요?"},{"en":"Don't you remember me?","ko":"저 기억 안 나세요?"},{"en":"Who are you waiting for?","ko":"누구를 기다리고 있어요?"}],"dialogue":[{"w":"A","en":"Don't you have class today?","ko":"오늘 수업 없어요?"},{"w":"B","en":"No, it was canceled.","ko":"네, 취소됐어요."},{"w":"A","en":"What are you studying for then?","ko":"그럼 뭐 때문에 공부해요?"},{"w":"B","en":"I have a test next week.","ko":"다음 주에 시험이 있어요."}],"quiz":[{"q":"빈칸: ___ she speak English?","opts":["Do","Does","Is"],"a":1,"ex":"주어가 3인칭 단수(she)라 Does를 씁니다."},{"q":"무엇을 위한 거예요? 의 자연스러운 표현은?","opts":["For what is it?","What is it for?","What for is it?"],"a":1,"ex":"전치사 for는 보통 문장 끝으로 갑니다."},{"q":"부정의문문: ___ you like it?","opts":["Don't","Not do","No do"],"a":0,"ex":"Don't you ...? 형태로 놀람이나 확인을 나타내요."}],"speak":["Do you know him?","Does he live near here?","What are you looking for?","Don't you like it?"]},{"id":"u50","tag":"의문문","title":"간접의문문","en":"Questions 2","intro":"의문문이 다른 문장 안에 들어가면 \u003cb>평서문 어순\u003c/b>을 씁니다. Do you know where it is?처럼 where 뒤에 주어+동사 순서로 말해요.","patterns":[{"en":"Do you know where he is?","ko":"그가 어디 있는지 알아요?"},{"en":"I don't know what she wants.","ko":"그녀가 뭘 원하는지 모르겠어요."}],"examples":[{"en":"Can you tell me where the station is?","ko":"역이 어디인지 알려주실래요?"},{"en":"I wonder why he is late.","ko":"그가 왜 늦는지 궁금해요."},{"en":"Do you know when the store opens?","ko":"가게가 언제 여는지 알아요?"},{"en":"She asked where I lived.","ko":"그녀는 내가 어디 사는지 물었어요."}],"dialogue":[{"w":"A","en":"Do you know where the bathroom is?","ko":"화장실이 어디인지 아세요?"},{"w":"B","en":"Yes, it's down the hall.","ko":"네, 복도 끝에 있어요."},{"w":"A","en":"Can you tell me how far it is?","ko":"얼마나 먼지 알려주실래요?"},{"w":"B","en":"It's just around the corner.","ko":"바로 모퉁이만 돌면 돼요."}],"quiz":[{"q":"옳은 것은?","opts":["Do you know where is it?","Do you know where it is?","Do you know where does it?"],"a":1,"ex":"간접의문문은 평서문 어순(주어+동사)입니다."},{"q":"빈칸: I don't know ___ he wants.","opts":["what","what does","does what"],"a":0,"ex":"what 뒤에 바로 주어+동사가 옵니다."},{"q":"She asked where I ___.","opts":["lived","did I live","do live"],"a":0,"ex":"전달된 의문문은 평서문 어순에 과거시제를 씁니다."}],"speak":["Do you know where he is?","Can you tell me what this is?","I don't know when it starts.","I wonder why she left."]},{"id":"u51","tag":"의문문","title":"대동사와 응답","en":"Auxiliary verbs","intro":"앞 문장의 동사를 반복하지 않으려고 \u003cb>So do I\u003c/b>(나도 그래), \u003cb>Neither do I\u003c/b>(나도 안 그래)를 씁니다. 또 I think so, I hope not처럼 짧게 응답할 수 있어요.","patterns":[{"en":"So do I.","ko":"나도 그래요."},{"en":"Neither do I.","ko":"나도 안 그래요."}],"examples":[{"en":"I love pizza. So do I.","ko":"나 피자 좋아해. 나도 그래."},{"en":"I can't swim. Neither can I.","ko":"나 수영 못 해. 나도 못 해."},{"en":"Is it going to rain? I think so.","ko":"비 올까? 그럴 것 같아."},{"en":"Did we fail? I hope not.","ko":"우리 떨어졌나? 안 그랬으면 좋겠어."}],"dialogue":[{"w":"A","en":"I'm really tired today.","ko":"나 오늘 정말 피곤해."},{"w":"B","en":"So am I. It was a long week.","ko":"나도 그래. 긴 한 주였어."},{"w":"A","en":"Do you think we can rest tomorrow?","ko":"내일 쉴 수 있을까?"},{"w":"B","en":"I hope so.","ko":"그러길 바라."}],"quiz":[{"q":"I like tea. ___ (나도 그래)","opts":["So do I.","So am I.","Neither do I."],"a":0,"ex":"일반동사 긍정에는 So do I를 씁니다."},{"q":"I don't like it. ___ (나도 안 그래)","opts":["So do I.","Neither do I.","So am I."],"a":1,"ex":"부정에 동의할 때는 Neither do I를 씁니다."},{"q":"Will it be okay? 안 그럴까 걱정할 때:","opts":["I hope not.","I think so.","So do I."],"a":0,"ex":"부정적 결과를 바라지 않을 때 I hope not을 씁니다."}],"speak":["So do I.","Neither can I.","I think so.","I hope not."]},{"id":"u52","tag":"의문문","title":"부가의문문","en":"Question tags","intro":"말끝에 붙여 확인하거나 동의를 구할 때 \u003cb>부가의문문\u003c/b>을 씁니다. 긍정문 뒤에는 부정 태그(isn't it?), 부정문 뒤에는 긍정 태그(do you?)를 붙여요.","patterns":[{"en":"It's cold today, isn't it?","ko":"오늘 춥죠, 그렇죠?"},{"en":"You don't smoke, do you?","ko":"담배 안 피우죠, 그렇죠?"}],"examples":[{"en":"She's nice, isn't she?","ko":"그녀 착하죠, 그렇죠?"},{"en":"You can drive, can't you?","ko":"운전할 수 있죠, 그렇죠?"},{"en":"He didn't call, did he?","ko":"그가 전화 안 했죠, 그렇죠?"},{"en":"They live here, don't they?","ko":"그들 여기 살죠, 그렇죠?"}],"dialogue":[{"w":"A","en":"This coffee is great, isn't it?","ko":"이 커피 맛있죠, 그렇죠?"},{"w":"B","en":"Yes, it really is.","ko":"네, 정말 그래요."},{"w":"A","en":"You come here often, don't you?","ko":"여기 자주 오시죠, 그렇죠?"},{"w":"B","en":"Actually, this is my first time.","ko":"사실 오늘이 처음이에요."}],"quiz":[{"q":"It's a nice day, ___?","opts":["isn't it","is it","doesn't it"],"a":0,"ex":"긍정문 뒤에는 부정 태그(isn't it)를 붙여요."},{"q":"You don't like it, ___?","opts":["don't you","do you","are you"],"a":1,"ex":"부정문 뒤에는 긍정 태그(do you)를 붙입니다."},{"q":"He can swim, ___?","opts":["can't he","can he","doesn't he"],"a":0,"ex":"조동사 can 긍정문에는 can't he를 씁니다."}],"speak":["It's cold, isn't it?","You like it, don't you?","He didn't come, did he?","You can help, can't you?"]},{"id":"u53","tag":"동사구","title":"동사 + -ing","en":"Verb + -ing (enjoy/stop/finish)","intro":"어떤 동사들은 목적어로 \u003cb>동명사(-ing)\u003c/b>를 취해요. enjoy, mind, finish, stop, suggest, admit 같은 동사 뒤에는 to부정사가 아니라 -ing 형태를 씁니다.","patterns":[{"en":"I enjoy + -ing","ko":"나는 ~하는 것을 즐긴다"},{"en":"Do you mind + -ing?","ko":"~해도 괜찮을까요?"},{"en":"She finished + -ing","ko":"그녀는 ~하는 것을 끝냈다"}],"examples":[{"en":"I enjoy cooking on weekends.","ko":"나는 주말에 요리하는 것을 즐겨."},{"en":"Would you mind closing the window?","ko":"창문 좀 닫아 주시겠어요?"},{"en":"He finished reading the report.","ko":"그는 보고서 읽기를 끝냈어."},{"en":"Let's stop talking and start working.","ko":"이제 그만 얘기하고 일을 시작하자."}],"dialogue":[{"w":"A","en":"What do you usually do after work?","ko":"퇴근 후에 보통 뭐 해?"},{"w":"B","en":"I enjoy watching movies at home.","ko":"나는 집에서 영화 보는 걸 즐겨."},{"w":"A","en":"Nice. Do you mind sharing some recommendations?","ko":"좋네. 추천 좀 나눠줄래?"},{"w":"B","en":"Sure, I just finished making a list.","ko":"물론이지, 방금 목록을 다 만들었어."}],"quiz":[{"q":"Do you mind ___ the door?","opts":["to open","opening","open"],"a":1,"ex":"mind 뒤에는 -ing 형태를 써요."},{"q":"I enjoy ___ new languages.","opts":["learning","to learn","learn"],"a":0,"ex":"enjoy는 동명사를 목적어로 취해요."},{"q":"Please stop ___ so loudly.","opts":["to talk","talk","talking"],"a":2,"ex":"stop + -ing는 하던 것을 멈춘다는 뜻이에요."}],"speak":["I enjoy reading before bed.","Would you mind waiting a moment?","I finished cleaning the kitchen.","Let's stop worrying about it."]},{"id":"u54","tag":"동사구","title":"동사 + to ...","en":"Verb + to ... (decide/hope/offer)","intro":"어떤 동사들은 목적어로 \u003cb>to부정사\u003c/b>를 취해요. decide, hope, offer, promise, refuse, learn 같은 동사 뒤에는 to + 동사원형을 씁니다.","patterns":[{"en":"I decided to + 동사원형","ko":"나는 ~하기로 결정했다"},{"en":"I hope to + 동사원형","ko":"나는 ~하기를 바란다"},{"en":"He promised to + 동사원형","ko":"그는 ~하기로 약속했다"}],"examples":[{"en":"I decided to change my job.","ko":"나는 직업을 바꾸기로 결정했어."},{"en":"We hope to see you again soon.","ko":"곧 다시 뵙기를 바랍니다."},{"en":"She offered to help me move.","ko":"그녀가 이사를 도와주겠다고 제안했어."},{"en":"He refused to answer the question.","ko":"그는 그 질문에 답하기를 거부했어."}],"dialogue":[{"w":"A","en":"Have you made a decision about the trip?","ko":"여행에 대해 결정했어?"},{"w":"B","en":"Yes, I decided to go to Japan.","ko":"응, 일본에 가기로 했어."},{"w":"A","en":"Great! I hope to visit there too someday.","ko":"좋네! 나도 언젠가 가보고 싶어."},{"w":"B","en":"My friend offered to be our guide.","ko":"내 친구가 가이드가 되어 주겠다고 했어."}],"quiz":[{"q":"She promised ___ me later.","opts":["calling","call","to call"],"a":2,"ex":"promise 뒤에는 to부정사를 써요."},{"q":"We hope ___ the game.","opts":["to win","winning","win"],"a":0,"ex":"hope는 to부정사를 목적어로 취해요."},{"q":"He refused ___ his mistake.","opts":["admit","to admit","admitting"],"a":1,"ex":"refuse 뒤에는 to부정사를 써요."}],"speak":["I decided to start exercising.","I hope to travel next year.","She offered to give me a ride.","He promised to be on time."]},{"id":"u55","tag":"동사구","title":"동사 + 목적어 + to","en":"Verb + object + to ... (I want you to ...)","intro":"want, ask, tell, expect, advise 같은 동사는 \u003cb>목적어 + to부정사\u003c/b> 구조를 써요. '누가 ~하기를 원한다/부탁한다'처럼 다른 사람의 행동을 말할 때 씁니다.","patterns":[{"en":"I want you to + 동사원형","ko":"나는 네가 ~하기를 원한다"},{"en":"She asked me to + 동사원형","ko":"그녀는 나에게 ~해달라고 부탁했다"},{"en":"They told him to + 동사원형","ko":"그들은 그에게 ~하라고 말했다"}],"examples":[{"en":"I want you to be honest with me.","ko":"나는 네가 나에게 솔직하기를 원해."},{"en":"She asked me to lock the door.","ko":"그녀가 나에게 문을 잠가달라고 했어."},{"en":"My boss expects us to arrive early.","ko":"상사는 우리가 일찍 오기를 기대해."},{"en":"The doctor advised him to rest more.","ko":"의사는 그에게 더 쉬라고 조언했어."}],"dialogue":[{"w":"A","en":"Can you do me a favor?","ko":"부탁 하나 들어줄래?"},{"w":"B","en":"Sure, what do you want me to do?","ko":"물론이지, 내가 뭘 하길 원해?"},{"w":"A","en":"I want you to check this email for me.","ko":"이 이메일 좀 확인해줬으면 해."},{"w":"B","en":"No problem, but tell me to fix anything wrong.","ko":"문제없어, 잘못된 게 있으면 고치라고 말해줘."}],"quiz":[{"q":"I want you ___ here on time.","opts":["being","to be","be"],"a":1,"ex":"want + 목적어 + to부정사 구조예요."},{"q":"She asked me ___ her.","opts":["to help","help","helping"],"a":0,"ex":"ask + 목적어 + to부정사를 써요."},{"q":"They told us ___ quiet.","opts":["stay","staying","to stay"],"a":2,"ex":"tell + 목적어 + to부정사 구조예요."}],"speak":["I want you to call me tonight.","She asked me to wait outside.","They expect me to finish today.","He advised me to take a break."]},{"id":"u56","tag":"동사구","title":"-ing냐 to냐 1","en":"Verb + -ing or to 1 (remember/forget/regret/go on)","intro":"remember, forget, regret, go on 같은 동사는 뒤에 \u003cb>-ing\u003c/b>가 오느냐 \u003cb>to\u003c/b>가 오느냐에 따라 의미가 달라져요. to는 앞으로 할 일, -ing는 이미 한 일을 뜻하는 경우가 많아요.","patterns":[{"en":"remember to do (앞으로 할 일) / remember doing (이미 한 일)","ko":"~할 것을 기억하다 / ~한 것을 기억하다"},{"en":"forget to do / forget doing","ko":"~할 것을 잊다 / ~한 것을 잊다"},{"en":"regret to say / regret saying","ko":"말하게 되어 유감이다 / 말한 것을 후회하다"}],"examples":[{"en":"Remember to lock the door before you leave.","ko":"나가기 전에 문 잠그는 거 잊지 마."},{"en":"I remember meeting her at the party.","ko":"나는 파티에서 그녀를 만난 걸 기억해."},{"en":"Don't forget to send the email.","ko":"이메일 보내는 거 잊지 마."},{"en":"I regret telling him the truth.","ko":"나는 그에게 진실을 말한 걸 후회해."}],"dialogue":[{"w":"A","en":"Did you remember to buy milk?","ko":"우유 사는 거 기억했어?"},{"w":"B","en":"Oh no, I forgot to stop by the store.","ko":"아 이런, 가게 들르는 걸 깜빡했어."},{"w":"A","en":"I remember reminding you this morning!","ko":"내가 아침에 상기시킨 거 기억나는데!"},{"w":"B","en":"You did. I regret not writing it down.","ko":"그랬지. 적어두지 않은 게 후회돼."}],"quiz":[{"q":"Please remember ___ the lights off.","opts":["turning","to turn","turn"],"a":1,"ex":"앞으로 할 일은 remember to do로 표현해요."},{"q":"I'll never forget ___ the ocean for the first time.","opts":["seeing","to see","see"],"a":0,"ex":"이미 한 경험은 forget doing으로 표현해요."},{"q":"She went on ___ after a short pause.","opts":["to talk","talk","talking"],"a":2,"ex":"go on -ing는 하던 것을 계속하다는 뜻이에요."}],"speak":["Remember to bring your ID.","I remember locking the door.","Don't forget to call your mom.","I regret not studying harder."]},{"id":"u57","tag":"동사구","title":"-ing냐 to냐 2","en":"Verb + -ing or to 2 (try/need/help)","intro":"try, need, help도 뒤에 오는 형태에 따라 뜻이 달라져요. \u003cb>try to do\u003c/b>는 애써 시도하다, \u003cb>try doing\u003c/b>은 시험 삼아 해보다예요. need doing은 수동의 의미(~될 필요가 있다)를 가져요.","patterns":[{"en":"try to do (노력하다) / try doing (시험 삼아 해보다)","ko":"~하려고 애쓰다 / 한번 ~해보다"},{"en":"need to do / need doing (=need to be done)","ko":"~할 필요가 있다 / ~될 필요가 있다"},{"en":"help (to) do","ko":"~하는 것을 돕다"}],"examples":[{"en":"I tried to open the jar, but it was too tight.","ko":"병을 열려고 했지만 너무 꽉 닫혀 있었어."},{"en":"Try adding more salt to the soup.","ko":"수프에 소금을 좀 더 넣어봐."},{"en":"My car needs washing.","ko":"내 차는 세차될 필요가 있어."},{"en":"Can you help me carry these boxes?","ko":"이 상자들 옮기는 것 좀 도와줄래?"}],"dialogue":[{"w":"A","en":"This app keeps crashing on my phone.","ko":"이 앱이 내 폰에서 계속 멈춰."},{"w":"B","en":"Try restarting it first.","ko":"일단 재시작해봐."},{"w":"A","en":"I tried to do that, but it didn't help.","ko":"그렇게 해봤는데 소용없었어."},{"w":"B","en":"Then it needs updating. I can help you fix it.","ko":"그럼 업데이트가 필요해. 내가 고치는 거 도와줄게."}],"quiz":[{"q":"If you're cold, try ___ a blanket.","opts":["to use","use","using"],"a":2,"ex":"시험 삼아 해보는 것은 try doing으로 표현해요."},{"q":"The report needs ___ before Monday.","opts":["finishing","to finish","finish"],"a":0,"ex":"need doing은 '~될 필요가 있다'는 수동의 뜻이에요."},{"q":"Can you help me ___ dinner?","opts":["cooking","cook","cooked"],"a":1,"ex":"help 뒤에는 (to) 동사원형을 써요."}],"speak":["I tried to fix it myself.","Try calling him again later.","This shirt needs washing.","Let me help you move the sofa."]},{"id":"u58","tag":"동사구","title":"-ing냐 to냐 3","en":"Verb + -ing or to 3 (like / would like)","intro":"like, love, hate는 보통 \u003cb>-ing\u003c/b>로 일반적인 취향을 말해요. 하지만 \u003cb>would like/love to\u003c/b>는 지금 이 순간의 구체적인 바람이나 정중한 표현에 씁니다.","patterns":[{"en":"I like + -ing (일반적 취향)","ko":"나는 ~하는 것을 좋아한다"},{"en":"I would like to + 동사원형 (지금 원함/정중)","ko":"나는 ~하고 싶다"},{"en":"Would you like to + 동사원형?","ko":"~하시겠어요?"}],"examples":[{"en":"I like walking in the park.","ko":"나는 공원에서 걷는 것을 좋아해."},{"en":"I would like to order a coffee, please.","ko":"커피 한 잔 주문하고 싶어요."},{"en":"She loves painting in her free time.","ko":"그녀는 여가에 그림 그리는 걸 아주 좋아해."},{"en":"Would you like to join us for dinner?","ko":"저녁 같이 하시겠어요?"}],"dialogue":[{"w":"A","en":"What do you like doing on weekends?","ko":"주말에 뭐 하는 거 좋아해?"},{"w":"B","en":"I like hiking and taking photos.","ko":"나는 등산하고 사진 찍는 걸 좋아해."},{"w":"A","en":"That sounds fun. Would you like to go this Saturday?","ko":"재밌겠다. 이번 토요일에 갈래?"},{"w":"B","en":"Yes, I'd love to come with you.","ko":"응, 너랑 같이 가고 싶어."}],"quiz":[{"q":"I ___ swimming in the summer.","opts":["would like","like","am liking"],"a":1,"ex":"일반적 취향은 like -ing로 표현해요."},{"q":"I would ___ to speak with the manager.","opts":["like","liking","likes"],"a":0,"ex":"would like to + 동사원형은 정중한 바람이에요."},{"q":"Would you like ___ some tea?","opts":["having","have","to have"],"a":2,"ex":"Would you like to + 동사원형 형태예요."}],"speak":["I like listening to music.","I would like to book a table.","She loves reading novels.","Would you like to sit here?"]},{"id":"u59","tag":"동사구","title":"prefer와 would rather","en":"Prefer and would rather","intro":"선호를 말할 때 \u003cb>prefer A to B\u003c/b> 또는 \u003cb>prefer to do rather than\u003c/b>을 써요. \u003cb>would rather\u003c/b>는 '차라리 ~하겠다'는 뜻이고, 뒤에 동사원형이 옵니다. would rather you did는 상대가 ~해주길 바랄 때 써요.","patterns":[{"en":"I prefer A to B","ko":"나는 B보다 A를 더 좋아한다"},{"en":"I would rather + 동사원형","ko":"나는 차라리 ~하겠다"},{"en":"I would rather you + 과거형","ko":"나는 네가 ~해주면 좋겠다"}],"examples":[{"en":"I prefer tea to coffee.","ko":"나는 커피보다 차를 더 좋아해."},{"en":"I prefer to walk rather than drive.","ko":"나는 운전하기보다 걷는 걸 더 좋아해."},{"en":"I would rather stay home tonight.","ko":"나는 오늘 밤 차라리 집에 있을래."},{"en":"I would rather you didn't smoke here.","ko":"여기서 담배를 피우지 않았으면 좋겠어."}],"dialogue":[{"w":"A","en":"Should we eat out or cook at home?","ko":"외식할까 아니면 집에서 요리할까?"},{"w":"B","en":"I would rather cook something simple tonight.","ko":"오늘 밤엔 차라리 간단히 요리할래."},{"w":"A","en":"Okay. Do you prefer pasta to rice?","ko":"알겠어. 밥보다 파스타가 더 좋아?"},{"w":"B","en":"Yes, but I'd rather you chose this time.","ko":"응, 근데 이번엔 네가 골라주면 좋겠어."}],"quiz":[{"q":"I prefer summer ___ winter.","opts":["than","to","from"],"a":1,"ex":"prefer A to B 형태로 써요."},{"q":"I would rather ___ at home tonight.","opts":["staying","to stay","stay"],"a":2,"ex":"would rather 뒤에는 동사원형이 와요."},{"q":"I would rather you ___ late again.","opts":["weren't","aren't","not be"],"a":0,"ex":"would rather you + 과거형으로 바람을 표현해요."}],"speak":["I prefer tea to soda.","I would rather walk than wait.","I'd rather not talk about it.","I would rather you told me first."]},{"id":"u60","tag":"동사구","title":"전치사 + -ing","en":"Preposition (in/for/about etc.) + -ing","intro":"in, for, about, of 같은 \u003cb>전치사 뒤에는 항상 동명사(-ing)\u003c/b>가 와요. to부정사가 아니라 -ing 형태를 쓴다는 점을 꼭 기억하세요.","patterns":[{"en":"interested in + -ing","ko":"~하는 데 관심이 있다"},{"en":"Thank you for + -ing","ko":"~해줘서 고마워요"},{"en":"think about + -ing","ko":"~하는 것을 생각하다"}],"examples":[{"en":"I'm interested in learning Spanish.","ko":"나는 스페인어 배우는 데 관심이 있어."},{"en":"Thank you for coming to my party.","ko":"내 파티에 와줘서 고마워."},{"en":"She is good at solving problems.","ko":"그녀는 문제 해결을 잘해."},{"en":"I'm thinking about changing my career.","ko":"나는 직업을 바꿀까 생각 중이야."}],"dialogue":[{"w":"A","en":"Thank you for helping me today.","ko":"오늘 도와줘서 고마워."},{"w":"B","en":"No problem. I'm interested in learning this too.","ko":"천만에. 나도 이거 배우는 데 관심 있어."},{"w":"A","en":"Are you good at using this software?","ko":"이 소프트웨어 잘 다뤄?"},{"w":"B","en":"Not yet, but I'm thinking about taking a class.","ko":"아직은 아니지만, 수업을 들을까 생각 중이야."}],"quiz":[{"q":"She's interested in ___ abroad.","opts":["to study","study","studying"],"a":2,"ex":"전치사 in 뒤에는 동명사를 써요."},{"q":"Thank you for ___ me.","opts":["helping","to help","help"],"a":0,"ex":"전치사 for 뒤에는 -ing 형태가 와요."},{"q":"He's good at ___ the guitar.","opts":["play","playing","to play"],"a":1,"ex":"at 뒤에는 동명사를 써요."}],"speak":["I'm interested in joining the club.","Thank you for waiting for me.","She's good at cooking Italian food.","I'm thinking about moving to Seoul."]},{"id":"u61","tag":"동사구","title":"~에 익숙하다","en":"Be/get used to something","intro":"\u003cb>be used to + 명사/-ing\u003c/b>는 '~에 익숙하다'라는 뜻이에요. \u003cb>get used to\u003c/b>는 '익숙해지다'로 변화를 나타내죠. 과거 습관을 말하는 \u003cb>used to do\u003c/b>(예전에 ~하곤 했다)와는 완전히 다르니 헷갈리지 마세요.","patterns":[{"en":"I'm used to + noun/-ing","ko":"나는 ~에 익숙해요"},{"en":"I'm getting used to + noun/-ing","ko":"나는 ~에 익숙해지고 있어요"}],"examples":[{"en":"I'm used to waking up early now.","ko":"이제 일찍 일어나는 게 익숙해요."},{"en":"She's not used to the cold weather here.","ko":"그녀는 여기 추운 날씨에 익숙하지 않아요."},{"en":"You'll get used to your new job soon.","ko":"곧 새 직장에 익숙해질 거예요."},{"en":"I used to play the piano when I was young.","ko":"어렸을 때 피아노를 치곤 했어요."}],"dialogue":[{"w":"A","en":"How's living in Seoul so far?","ko":"서울 생활은 지금까지 어때요?"},{"w":"B","en":"It's busy, but I'm getting used to it.","ko":"바쁘지만 점점 익숙해지고 있어요."},{"w":"A","en":"Are you used to the subway crowds yet?","ko":"지하철 인파에는 이제 익숙해졌어요?"},{"w":"B","en":"Almost. I used to hate them, but not anymore.","ko":"거의요. 예전엔 싫어했는데 이젠 아니에요."}],"quiz":[{"q":"'나는 매운 음식에 익숙해요'?","opts":["I'm used to spicy food.","I use to spicy food.","I used to spicy food."],"a":0,"ex":"be used to + 명사는 '~에 익숙하다'예요."},{"q":"'예전에 ~하곤 했다'는?","opts":["be used to doing","used to do","get used to do"],"a":1,"ex":"과거 습관은 used to + 동사원형이에요."},{"q":"'그녀는 점점 익숙해지고 있어요'?","opts":["She's getting used to it.","She used to it.","She's used to do it."],"a":0,"ex":"변화는 get used to로 표현해요."}],"speak":["I'm used to working late.","I'm getting used to my new phone.","She's not used to driving here.","I used to live in Busan."]},{"id":"u62","tag":"동사구","title":"동사+전치사+동명사","en":"Verb + preposition + -ing","intro":"\u003cb>succeed in doing\u003c/b>, \u003cb>apologize for doing\u003c/b>, \u003cb>accuse someone of doing\u003c/b>처럼 동사 뒤에 전치사가 오면 그 다음은 항상 \u003cb>-ing\u003c/b> 형태예요. 전치사 뒤에는 동사원형이 아니라 동명사가 온다는 걸 기억하세요.","patterns":[{"en":"succeed in + -ing","ko":"~하는 데 성공하다"},{"en":"apologize for + -ing","ko":"~한 것에 대해 사과하다"},{"en":"accuse someone of + -ing","ko":"누군가를 ~했다고 비난하다"}],"examples":[{"en":"She succeeded in passing the exam.","ko":"그녀는 시험에 합격하는 데 성공했어요."},{"en":"He apologized for being late.","ko":"그는 늦은 것에 대해 사과했어요."},{"en":"They accused him of stealing the money.","ko":"그들은 그가 돈을 훔쳤다고 비난했어요."},{"en":"Thank you for helping me today.","ko":"오늘 도와줘서 고마워요."}],"dialogue":[{"w":"A","en":"Did you finally finish the project?","ko":"드디어 프로젝트를 끝냈어요?"},{"w":"B","en":"Yes, I succeeded in getting it done on time.","ko":"네, 제때 끝내는 데 성공했어요."},{"w":"A","en":"Sorry for asking so much of you.","ko":"너무 많이 부탁해서 미안해요."},{"w":"B","en":"No worries, thank you for trusting me.","ko":"괜찮아요, 믿어줘서 고마워요."}],"quiz":[{"q":"'그는 늦은 것을 사과했어요'?","opts":["He apologized for being late.","He apologized for be late.","He apologized to be late."],"a":0,"ex":"전치사 for 뒤에는 -ing가 와요."},{"q":"'우리는 시험에 합격하는 데 성공했어요'?","opts":["We succeeded to pass.","We succeeded in passing.","We succeed pass."],"a":1,"ex":"succeed in + -ing 형태예요."},{"q":"'그들은 그가 거짓말했다고 비난했어요'?","opts":["accused him of lying","accused him to lie","accused him for lie"],"a":0,"ex":"accuse someone of + -ing예요."}],"speak":["Thank you for coming.","He apologized for forgetting.","She succeeded in finding a job.","They accused me of cheating."]},{"id":"u63","tag":"동사구","title":"-ing 관용 표현","en":"Expressions + -ing","intro":"\u003cb>-ing\u003c/b>를 쓰는 유용한 관용 표현들이 있어요. \u003cb>there's no point in doing\u003c/b>(~해봤자 소용없다), \u003cb>it's worth doing\u003c/b>(~할 가치가 있다), \u003cb>spend time doing\u003c/b>(~하는 데 시간을 쓰다), \u003cb>have difficulty doing\u003c/b>(~하는 데 어려움을 겪다).","patterns":[{"en":"There's no point in + -ing","ko":"~해봤자 소용없다"},{"en":"It's worth + -ing","ko":"~할 가치가 있다"},{"en":"spend time + -ing","ko":"~하는 데 시간을 쓰다"}],"examples":[{"en":"There's no point in worrying about it.","ko":"그것에 대해 걱정해봤자 소용없어요."},{"en":"This movie is worth watching.","ko":"이 영화는 볼 가치가 있어요."},{"en":"I spend too much time checking my phone.","ko":"저는 폰 확인하는 데 시간을 너무 많이 써요."},{"en":"He has difficulty understanding English.","ko":"그는 영어를 이해하는 데 어려움을 겪어요."}],"dialogue":[{"w":"A","en":"Should I keep waiting for his reply?","ko":"계속 그의 답장을 기다려야 할까요?"},{"w":"B","en":"There's no point in waiting all day.","ko":"하루 종일 기다려봤자 소용없어요."},{"w":"A","en":"Then how should I spend my time?","ko":"그럼 시간을 어떻게 보내야 할까요?"},{"w":"B","en":"Reading that book is worth trying.","ko":"그 책을 읽어보는 게 시도할 가치가 있어요."}],"quiz":[{"q":"'걱정해봤자 소용없어요'?","opts":["No point in worry.","There's no point in worrying.","There's no point to worry."],"a":1,"ex":"no point in + -ing 형태예요."},{"q":"'이건 볼 가치가 있어요'?","opts":["It's worth watching.","It's worth to watch.","It's worth watch."],"a":0,"ex":"worth + -ing 형태예요."},{"q":"'나는 공부하는 데 시간을 써요'?","opts":["I spend time to study.","I spend time study.","I spend time studying."],"a":2,"ex":"spend time + -ing 형태예요."}],"speak":["There's no point in arguing.","This place is worth visiting.","I spend time cooking on weekends.","She has difficulty sleeping."]},{"id":"u64","tag":"동사구","title":"목적 표현하기","en":"To ..., for ... and so that ...","intro":"목적을 나타내는 세 가지 방법이 있어요. \u003cb>to + 동사원형\u003c/b>(~하기 위해), \u003cb>for + 명사\u003c/b>(~을 위해), \u003cb>so that + 절\u003c/b>(~하도록). 동작의 목적은 to, 명사 목적은 for, 완전한 문장이 필요하면 so that을 써요.","patterns":[{"en":"to + verb (purpose)","ko":"~하기 위해"},{"en":"for + noun","ko":"~을 위해"},{"en":"so that + clause","ko":"~하도록"}],"examples":[{"en":"I went to the store to buy milk.","ko":"우유를 사기 위해 가게에 갔어요."},{"en":"We stopped for lunch on the way.","ko":"가는 길에 점심을 먹으려고 멈췄어요."},{"en":"Speak slowly so that I can understand.","ko":"제가 이해할 수 있도록 천천히 말해주세요."},{"en":"She left early to catch the train.","ko":"그녀는 기차를 타려고 일찍 떠났어요."}],"dialogue":[{"w":"A","en":"Why did you come to the library?","ko":"도서관에 왜 왔어요?"},{"w":"B","en":"I came here to study for my test.","ko":"시험 공부하러 왔어요."},{"w":"A","en":"Do you want to sit near the window?","ko":"창가에 앉고 싶어요?"},{"w":"B","en":"Yes, so that I can see outside.","ko":"네, 밖을 볼 수 있도록요."}],"quiz":[{"q":"'우유를 사기 위해'?","opts":["for buy milk","to buy milk","so that buy milk"],"a":1,"ex":"동작의 목적은 to + 동사원형이에요."},{"q":"'점심을 위해 멈췄어요'?","opts":["stopped for lunch","stopped to lunch","stopped lunch"],"a":0,"ex":"명사 앞에는 for를 써요."},{"q":"'제가 들을 수 있도록'?","opts":["to I can hear","for I can hear","so that I can hear"],"a":2,"ex":"절 앞에는 so that을 써요."}],"speak":["I called to say hello.","We met for coffee.","Turn it up so that I can hear.","He runs to stay healthy."]},{"id":"u65","tag":"동사구","title":"형용사 + to 부정사","en":"Adjective + to ...","intro":"\u003cb>It's easy to do\u003c/b>(~하기 쉽다)처럼 형용사 뒤에 to 부정사가 오는 표현들이 있어요. 사람의 성격을 칭찬할 땐 \u003cb>It's nice/kind of you to do\u003c/b>(~해주시다니 친절하네요). 또 \u003cb>the first person to do\u003c/b>처럼 순서를 나타낼 수도 있어요.","patterns":[{"en":"It's easy/hard to + verb","ko":"~하기 쉽다/어렵다"},{"en":"It's nice/kind of you to + verb","ko":"~해주시다니 친절하세요"},{"en":"the first person to + verb","ko":"~한 첫 번째 사람"}],"examples":[{"en":"This app is easy to use.","ko":"이 앱은 사용하기 쉬워요."},{"en":"It's nice of you to help me.","ko":"저를 도와주시다니 친절하시네요."},{"en":"She was the first person to arrive.","ko":"그녀가 가장 먼저 도착한 사람이었어요."},{"en":"It's hard to learn a new language.","ko":"새 언어를 배우는 건 어려워요."}],"dialogue":[{"w":"A","en":"I brought you some coffee.","ko":"커피 좀 가져왔어요."},{"w":"B","en":"That's so kind of you to think of me.","ko":"저를 생각해주시다니 정말 친절하시네요."},{"w":"A","en":"Is the new software easy to use?","ko":"새 소프트웨어는 사용하기 쉬워요?"},{"w":"B","en":"Yes, and I was the first person to try it.","ko":"네, 제가 제일 먼저 써본 사람이었어요."}],"quiz":[{"q":"'이 책은 읽기 쉬워요'?","opts":["This book is easy to read.","This book is easy reading.","This book is easy read."],"a":0,"ex":"형용사 뒤에는 to + 동사원형이에요."},{"q":"'도와주시다니 친절하세요'?","opts":["It's kind to you help.","It's kind of you to help.","It's kind you helping."],"a":1,"ex":"kind of you to + 동사원형 형태예요."},{"q":"'가장 먼저 도착한 사람'?","opts":["the first person arriving","the first person to arrive","the first person arrive"],"a":1,"ex":"the first person to + 동사원형이에요."}],"speak":["This game is easy to learn.","It's nice of you to come.","He was the last person to leave.","It's hard to say goodbye."]},{"id":"u66","tag":"동사구","title":"afraid to vs afraid of","en":"Afraid to do vs afraid of -ing","intro":"\u003cb>afraid to do\u003c/b>는 무서워서 '일부러 안 하는' 것이고, \u003cb>afraid of doing\u003c/b>은 '~할까 봐 두려운' 것이에요. 비슷하게 \u003cb>interested to\u003c/b>는 특정 반응, \u003cb>interested in\u003c/b>은 관심 분야를 나타내요. 미묘한 차이를 느껴보세요.","patterns":[{"en":"afraid to do","ko":"(꺼려서) ~하지 못하다"},{"en":"afraid of doing","ko":"~할까 봐 두렵다"},{"en":"interested in + -ing","ko":"~에 관심이 있다"}],"examples":[{"en":"She was afraid to ask for help.","ko":"그녀는 도움을 청하기를 꺼렸어요."},{"en":"I'm afraid of making mistakes.","ko":"저는 실수할까 봐 두려워요."},{"en":"I'm interested in learning Spanish.","ko":"저는 스페인어 배우는 데 관심이 있어요."},{"en":"He was interested to hear the news.","ko":"그는 그 소식을 듣고 흥미로워했어요."}],"dialogue":[{"w":"A","en":"Why didn't you speak up in the meeting?","ko":"회의에서 왜 말을 안 했어요?"},{"w":"B","en":"I was afraid to sound silly.","ko":"바보처럼 들릴까 봐 말하기 꺼렸어요."},{"w":"A","en":"Are you afraid of speaking in public?","ko":"사람들 앞에서 말하는 게 두려워요?"},{"w":"B","en":"A little, but I'm interested in improving.","ko":"조금요, 하지만 나아지는 데 관심이 있어요."}],"quiz":[{"q":"'실수할까 봐 두려워요'?","opts":["afraid to make mistakes","afraid of making mistakes","afraid making mistakes"],"a":1,"ex":"~할까 봐 두려운 건 afraid of + -ing예요."},{"q":"'무서워서 물어보지 못했어요'?","opts":["afraid to ask","afraid of ask","afraid asking"],"a":0,"ex":"꺼려서 안 하는 건 afraid to do예요."},{"q":"'요리에 관심이 있어요'?","opts":["interested to cooking","interested in cooking","interested of cook"],"a":1,"ex":"관심 분야는 interested in + -ing예요."}],"speak":["I'm afraid to tell her.","She's afraid of failing.","I'm interested in photography.","He was interested to see it."]},{"id":"u67","tag":"동사구","title":"지각동사 활용","en":"See somebody do and see somebody doing","intro":"see, hear 같은 지각동사는 목적어 뒤에 \u003cb>동사원형\u003c/b> 또는 \u003cb>-ing\u003c/b>를 쓸 수 있어요. \u003cb>see somebody do\u003c/b>는 동작 전체를 봤을 때, \u003cb>see somebody doing\u003c/b>은 진행 중인 일부를 봤을 때 써요. 완료와 진행의 차이예요.","patterns":[{"en":"see somebody + verb (whole action)","ko":"누군가 ~하는 것을(전체) 보다"},{"en":"see somebody + -ing (in progress)","ko":"누군가 ~하고 있는 것을 보다"}],"examples":[{"en":"I saw him leave the building.","ko":"그가 건물을 나가는 걸 봤어요."},{"en":"I saw her waiting at the bus stop.","ko":"그녀가 버스 정류장에서 기다리고 있는 걸 봤어요."},{"en":"We heard the baby cry all night.","ko":"우리는 아기가 밤새 우는 걸 들었어요."},{"en":"I heard someone singing in the room.","ko":"누군가 방에서 노래하고 있는 걸 들었어요."}],"dialogue":[{"w":"A","en":"Did you notice Tom this morning?","ko":"오늘 아침에 톰 봤어요?"},{"w":"B","en":"Yes, I saw him run to catch the bus.","ko":"네, 버스 타려고 뛰어가는 걸 봤어요."},{"w":"A","en":"Where was Anna when you arrived?","ko":"당신이 도착했을 때 안나는 어디 있었어요?"},{"w":"B","en":"I saw her working at her desk.","ko":"책상에서 일하고 있는 걸 봤어요."}],"quiz":[{"q":"'그가 나가는 걸(전체) 봤어요'?","opts":["I saw him leave.","I saw him to leave.","I saw him leaves."],"a":0,"ex":"동작 전체는 동사원형을 써요."},{"q":"'그녀가 기다리고 있는 걸 봤어요'?","opts":["I saw her wait whole time.","I saw her waiting.","I saw her to wait."],"a":1,"ex":"진행 중인 모습은 -ing를 써요."},{"q":"'누군가 노래하는 걸 들었어요(진행)'?","opts":["I heard someone singing.","I heard someone to sing.","I heard someone sings."],"a":0,"ex":"진행 중이면 hear + 목적어 + -ing예요."}],"speak":["I saw you dance last night.","I saw them playing outside.","We heard her laugh loudly.","I heard him talking on the phone."]},{"id":"u68","tag":"동사구","title":"분사구문","en":"-ing clauses","intro":"\u003cb>-ing 분사구문\u003c/b>은 이유나 동시에 일어나는 동작을 간결하게 표현해요. \u003cb>Feeling tired, I went to bed.\u003c/b>(피곤해서 잤어요)처럼요. 완료는 \u003cb>Having done ...\u003c/b>, 수동은 \u003cb>Being ...\u003c/b>로 시작할 수 있어요. 접속사를 생략하고 -ing로 줄이는 거예요.","patterns":[{"en":"-ing clause, main clause (reason)","ko":"~해서, ~했다"},{"en":"Having + p.p., main clause","ko":"~한 후에, ~했다"}],"examples":[{"en":"Feeling tired, I went to bed early.","ko":"피곤해서 일찍 잤어요."},{"en":"Living near the sea, we swim a lot.","ko":"바다 근처에 살아서 수영을 많이 해요."},{"en":"Having finished work, she went home.","ko":"일을 끝낸 후에 그녀는 집에 갔어요."},{"en":"Not knowing the way, he asked for help.","ko":"길을 몰라서 그는 도움을 청했어요."}],"dialogue":[{"w":"A","en":"You look exhausted today.","ko":"오늘 정말 피곤해 보여요."},{"w":"B","en":"Feeling sick, I couldn't sleep well.","ko":"몸이 안 좋아서 잠을 잘 못 잤어요."},{"w":"A","en":"Did you finish the report at least?","ko":"그래도 보고서는 끝냈어요?"},{"w":"B","en":"Having worked all night, I finally did.","ko":"밤새 일한 끝에 드디어 끝냈어요."}],"quiz":[{"q":"'피곤해서, 나는 잤어요'?","opts":["Feeling tired, I went to bed.","Feel tired, I went to bed.","To feel tired, I went to bed."],"a":0,"ex":"이유를 나타내는 분사구문은 -ing로 시작해요."},{"q":"'일을 끝낸 후에'?","opts":["Have finished work","Having finished work","Finish work"],"a":1,"ex":"완료 분사구문은 Having + p.p.예요."},{"q":"'길을 몰라서'?","opts":["Not knowing the way","No know the way","Don't know the way"],"a":0,"ex":"부정은 Not + -ing로 시작해요."}],"speak":["Feeling hungry, I made a sandwich.","Living in the city, I walk everywhere.","Having eaten, we left the restaurant.","Not feeling well, she stayed home."]},{"id":"u69","tag":"관사·명사","title":"셀 수 있는 명사 1","en":"Countable and uncountable 1","intro":"명사는 \u003cb>셀 수 있는 것\u003c/b>과 \u003cb>셀 수 없는 것\u003c/b>으로 나뉘어요. 셀 수 있으면 a/an을 붙이거나 복수로 쓰고, 셀 수 없으면 관사 없이 단수로 취급해요. water, money, information 같은 말은 셀 수 없어서 앞에 a를 붙이지 않아요.","patterns":[{"en":"a/an + 단수, 복수형 (셀 수 있는 명사)","ko":"셀 수 있는 명사는 a/an이나 복수로 써요"},{"en":"관사 없이 단수 (셀 수 없는 명사)","ko":"셀 수 없는 명사는 무관사, 단수 취급이에요"}],"examples":[{"en":"I need a pen and some paper.","ko":"펜 하나랑 종이가 좀 필요해요."},{"en":"There is a lot of water in the bottle.","ko":"병 안에 물이 많이 있어요."},{"en":"She gave me some good information.","ko":"그녀가 좋은 정보를 좀 줬어요."},{"en":"We have three apples in the fridge.","ko":"냉장고에 사과가 세 개 있어요."}],"dialogue":[{"w":"A","en":"Can I have a coffee, please?","ko":"커피 한 잔 주시겠어요?"},{"w":"B","en":"Sure. Do you need any sugar?","ko":"네. 설탕 필요하세요?"},{"w":"A","en":"No, thanks. But I need some information about the menu.","ko":"아뇨, 괜찮아요. 그런데 메뉴에 대한 정보가 좀 필요해요."},{"w":"B","en":"Of course, here is a menu for you.","ko":"물론이죠, 여기 메뉴 드릴게요."}],"quiz":[{"q":"빈칸: I need ___ information.","opts":["a","an","some"],"a":2,"ex":"information은 셀 수 없어서 a 대신 some을 써요."},{"q":"빈칸: There is ___ apple on the table.","opts":["an","some","a lot"],"a":0,"ex":"apple은 셀 수 있고 모음으로 시작하니 an이에요."},{"q":"셀 수 없는 명사는?","opts":["pen","water","apple"],"a":1,"ex":"water는 셀 수 없어서 무관사 단수로 써요."}],"speak":["I need a pen and some paper.","Can I have a coffee, please?","There is a lot of water here.","She gave me some information."]},{"id":"u70","tag":"관사·명사","title":"셀 수 있는 명사 2","en":"Countable and uncountable 2","intro":"같은 명사가 \u003cb>의미에 따라\u003c/b> 셀 수 있기도 하고 없기도 해요. paper는 종이(셀 수 없음)지만 a paper는 신문 한 부예요. coffee는 커피(물질)지만 a coffee는 커피 한 잔이에요.","patterns":[{"en":"paper (종이) / a paper (신문)","ko":"의미에 따라 셀 수 있고 없어요"},{"en":"coffee (커피) / a coffee (커피 한 잔)","ko":"한 잔을 뜻할 땐 a를 붙여요"}],"examples":[{"en":"I bought a paper this morning.","ko":"오늘 아침에 신문 한 부를 샀어요."},{"en":"I need some paper to write on.","ko":"쓸 종이가 좀 필요해요."},{"en":"Two coffees, please.","ko":"커피 두 잔 주세요."},{"en":"I don't drink much coffee.","ko":"저는 커피를 많이 안 마셔요."}],"dialogue":[{"w":"A","en":"What can I get you?","ko":"무엇을 드릴까요?"},{"w":"B","en":"Two coffees and a paper, please.","ko":"커피 두 잔이랑 신문 한 부 주세요."},{"w":"A","en":"Sure. Do you want some paper for notes too?","ko":"네. 메모용 종이도 좀 드릴까요?"},{"w":"B","en":"Yes, that would be great.","ko":"네, 그럼 좋죠."}],"quiz":[{"q":"신문 한 부를 뜻하는 것은?","opts":["a paper","paper","some paper"],"a":0,"ex":"a paper는 신문 한 부를 뜻해요."},{"q":"빈칸: Two ___, please. (커피 두 잔)","opts":["coffee","coffees","a coffee"],"a":1,"ex":"잔을 셀 땐 복수 coffees로 써요."},{"q":"빈칸: I need ___ to write on. (종이)","opts":["a paper","some paper","papers"],"a":1,"ex":"종이 재료를 뜻할 땐 some paper예요."}],"speak":["I bought a paper this morning.","Two coffees, please.","I need some paper to write on.","I don't drink much coffee."]},{"id":"u71","tag":"관사·명사","title":"a/an과 some","en":"Countable nouns with a/an and some","intro":"셀 수 있는 명사가 하나면 \u003cb>a/an\u003c/b>, 여럿이면 \u003cb>some\u003c/b>을 써요. 처음 말하는 것에는 a/an을 쓰는 게 자연스러워요. some은 정확한 수를 말하지 않을 때 편해요.","patterns":[{"en":"a/an + 단수 명사","ko":"하나일 때는 a/an을 써요"},{"en":"some + 복수 명사","ko":"여럿일 때는 some을 써요"}],"examples":[{"en":"I have a question for you.","ko":"당신에게 질문이 하나 있어요."},{"en":"There are some students in the room.","ko":"방에 학생들이 좀 있어요."},{"en":"She bought an umbrella yesterday.","ko":"그녀는 어제 우산을 하나 샀어요."},{"en":"Can I ask you some questions?","ko":"질문 몇 개 해도 될까요?"}],"dialogue":[{"w":"A","en":"I have a question about the trip.","ko":"여행에 대해 질문이 하나 있어요."},{"w":"B","en":"Sure, and I have some ideas too.","ko":"네, 저도 아이디어가 좀 있어요."},{"w":"A","en":"Great. Should we bring an umbrella?","ko":"좋아요. 우산을 챙겨야 할까요?"},{"w":"B","en":"Yes, and let's pack some snacks.","ko":"네, 그리고 간식도 좀 싸요."}],"quiz":[{"q":"빈칸: I have ___ question.","opts":["a","some","an"],"a":0,"ex":"question은 단수이고 자음 소리라 a예요."},{"q":"빈칸: There are ___ students here.","opts":["a","an","some"],"a":2,"ex":"복수 명사 앞에는 some을 써요."},{"q":"빈칸: She bought ___ umbrella.","opts":["a","an","some"],"a":1,"ex":"umbrella는 모음 소리로 시작해서 an이에요."}],"speak":["I have a question for you.","There are some students in the room.","She bought an umbrella.","Can I ask you some questions?"]},{"id":"u72","tag":"관사·명사","title":"a/an과 the","en":"A/an and the","intro":"처음 말하는 것에는 \u003cb>a/an\u003c/b>, 이미 말했거나 서로 아는 특정한 것에는 \u003cb>the\u003c/b>를 써요. 'a dog'로 시작했다가 다시 그 개를 말할 때는 'the dog'이 돼요.","patterns":[{"en":"a/an (처음 언급)","ko":"처음 말하는 것에 a/an을 써요"},{"en":"the (다시 언급, 특정)","ko":"서로 아는 특정한 것에 the를 써요"}],"examples":[{"en":"I saw a movie last night.","ko":"어젯밤에 영화를 하나 봤어요."},{"en":"The movie was really exciting.","ko":"그 영화는 정말 재미있었어요."},{"en":"She has a car and a bike.","ko":"그녀는 차 한 대와 자전거 한 대가 있어요."},{"en":"The car is new, but the bike is old.","ko":"그 차는 새것이지만 자전거는 오래됐어요."}],"dialogue":[{"w":"A","en":"I read a book about space.","ko":"우주에 관한 책을 하나 읽었어요."},{"w":"B","en":"Was the book interesting?","ko":"그 책 재미있었어요?"},{"w":"A","en":"Yes, and there was a great chapter on the moon.","ko":"네, 달에 관한 멋진 챕터가 하나 있었어요."},{"w":"B","en":"I want to read the book too.","ko":"저도 그 책 읽고 싶어요."}],"quiz":[{"q":"빈칸: I saw ___ movie. It was good.","opts":["the","a","some"],"a":1,"ex":"처음 언급하는 영화라 a를 써요."},{"q":"빈칸: ___ movie was really exciting. (앞서 말한)","opts":["A","An","The"],"a":2,"ex":"이미 말한 그 영화라 the를 써요."},{"q":"the를 쓰는 경우는?","opts":["처음 말하는 것","서로 아는 특정한 것","셀 수 없는 물질"],"a":1,"ex":"the는 서로 아는 특정한 것에 써요."}],"speak":["I saw a movie last night.","The movie was really exciting.","She has a car and a bike.","The car is new."]},{"id":"u73","tag":"관사·명사","title":"the의 쓰임 1","en":"The 1","intro":"세상에 \u003cb>하나뿐인 것\u003c/b>에는 the를 써요. the sun, the moon, the sky처럼요. 또 the same, 최상급(the best), 상황상 유일한 것(the door)에도 the를 붙여요.","patterns":[{"en":"the + 유일한 것 (the sun)","ko":"하나뿐인 것에 the를 써요"},{"en":"the + 최상급 / the same","ko":"최상급과 the same에도 the를 써요"}],"examples":[{"en":"The sun is very bright today.","ko":"오늘 해가 아주 밝아요."},{"en":"This is the best coffee in town.","ko":"이건 동네에서 가장 좋은 커피예요."},{"en":"We live in the same building.","ko":"우리는 같은 건물에 살아요."},{"en":"Can you close the door, please?","ko":"문 좀 닫아 주시겠어요?"}],"dialogue":[{"w":"A","en":"The sky :[{"en":"the + adjective = a whole group of people","ko":"the + 형용사 = 그런 사람들 전체 집단"},{"en":"the + singular noun = the species in general","ko":"the + 단수 명사 = 그 종족 전체를 대표"}],"examples":[{"en":"The government should help the poor.","ko":"정부는 가난한 사람들을 도와야 해요."},{"en":"The young often want to change the world.","ko":"젊은 사람들은 종종 세상을 바꾸고 싶어 해요."},{"en":"The giraffe has a very long neck.","ko":"기린은 목이 아주 길어요."},{"en":"The elephant is the largest land animal.","ko":"코끼리는 가장 큰 육지 동물이에요."}],"dialogue":[{"w":"A","en":"Why do you volunteer at the shelter?","ko":"왜 그 보호소에서 봉사해요?"},{"w":"B","en":"I just want to help the homeless.","ko":"그냥 노숙자들을 돕고 싶어서요."},{"w":"A","en":"That is really kind of you.","ko":"정말 친절하시네요."},{"w":"B","en":"The old and the sick need us the most.","ko":"노인과 아픈 사람들이 우리를 가장 필요로 해요."}],"quiz":[{"q":"'부자들'을 뜻하는 것은?","opts":["the rich","a rich","rich ones only"],"a":0,"ex":"the + 형용사는 그런 사람들의 집단을 뜻해요."},{"q":"종족 전체를 대표하는 표현은?","opts":["a giraffe eats","The giraffe eats leaves.","giraffe eat leaves"],"a":1,"ex":"the + 단수 명사로 종족 전체를 대표할 수 있어요."},{"q":"빈칸: ___ young love new trends.","opts":["A","The","One"],"a":1,"ex":"the young은 '젊은 사람들'이라는 집단이에요."}],"speak":["The government helps the poor.","The young love new music.","The giraffe has a long neck.","The elephant is a huge animal."]},{"id":"u77","tag":"관사·명사","title":"이름과 the 1","en":"Names with and without the 1","intro":"사람 이름, 대륙, 나라, 도시, 거리 이름 앞에는 \u003cb>보통 the를 안 써요\u003c/b>. Korea, Seoul, Main Street처럼요. 하지만 \u003cb>강, 바다, 산맥\u003c/b> 앞에는 the를 붙여요. the Han River, the Pacific, the Alps처럼요.","patterns":[{"en":"No the: people, continents, countries, cities, streets","ko":"무관사: 인명·대륙·나라·도시·거리"},{"en":"Use the: rivers, seas, mountain ranges","ko":"the 사용: 강·바다·산맥"}],"examples":[{"en":"She lives in Seoul near Main Street.","ko":"그녀는 메인 스트리트 근처 서울에 살아요."},{"en":"We flew from Korea to France last year.","ko":"우리는 작년에 한국에서 프랑스로 날아갔어요."},{"en":"The Han River runs through the city.","ko":"한강은 도시를 가로질러 흘러요."},{"en":  of mine","a mine friend","a friend of me"],"a":0,"ex":"of + 소유대명사(mine) 형태를 씁니다."},{"q":"'혼자서'라는 뜻이 아닌 것은?","opts":["on my own","by myself","on my own room"],"a":2,"ex":"my own room은 '나만의 방'이라는 뜻입니다."},{"q":"'나만의 공간'은?","opts":["my own space","a space of me","myself space"],"a":0,"ex":"my own + 명사로 소유를 강조합니다."}],"speak":["He is a friend of mine.","I have my own room.","I did it on my own.","She lives by herself."]},{"id":"u83","tag":"대명사·한정사","title":"재귀대명사 myself","en":"myself / yourself / themselves","intro":"주어와 목적어가 같은 사람일 때 \u003cb>재귀대명사\u003c/b>를 씁니다. I hurt myself처럼요. \u003cb>by myself\u003c/b>는 '혼자서'라는 뜻이고, \u003cb>each other\u003c/b>는 '서로'라는 뜻이라 구별해야 합니다.","patterns":[{"en":"주어 + 동사 + myself/yourself/himself...","ko":"주어가 자기 자신을 목적어로 (재귀)"},{"en":"by myself","ko":"나 혼자서 (도움 없이)"},{"en":"each other","ko":"서로 (두 명 이상이 상대에게)"}],"examples":[{"en":"I taught myself how to cook.","ko":"저는 요리를 독학했어요."},{"en":"Please help yourself to some coffee.","ko":"커피 마음껏 드세요."},{"en":"They painted the house by themselves.","ko":"그들은 그 집을 자기들끼리 페인트칠했어요."},{"en":"We have known each other for years.","ko":"우리는 서로 안 지 몇 년 됐어요."}],"dialogue":[{"w":"A","en":"Did someone help you move all this?","ko":"이거 다 옮기는 거 누가 도와줬어?"},{"w":"B","en":"No, I did it all by myself.","ko":"아니, 나 혼자 다 했어."},{"w":"A","en":"Wow, be careful not to hurt yourself.","ko":"와, 다치지 않게 조심해."},{"w":"B","en":"Thanks, we should look out for each other.","ko":"고마워, 우리 서로 챙겨줘야지."}],"quiz":[{"q":"'저는 저 자신을 봤어요(거울에서)'는?","opts":["I saw me.","I saw myself.","I saw my."],"a":1,"ex":"주어와 목적어가 같으면 재귀대명사 myself를 씁니다."},{"q":"'서로'를 뜻하는 표현은?","opts":["each other","by myself","himself"],"a":0,"ex":"each other는 '서로'라는 뜻입니다."},{"q":"'그는 혼자서 살아요'는?","opts":["He lives by himself.","He lives by his.","He lives himself."],"a":0,"ex":"by + 재귀대명사 = 혼자서."}],"speak":["I taught myself English.","Help yourself to the food.","They did it by themselves.","We help each other."]},{"id":"u84","tag":"대명사·한정사","title":"there와 it 구별","en":"there "ko":"질문 있으세요?"},{"en":"Would you like some tea?","ko":"차 좀 드시겠어요?"},{"en":"I did not see anyone at the office.","ko":"사무실에서 아무도 못 봤어요."}],"dialogue":[{"w":"A","en":"Do we have any eggs left?","ko":"달걀 남은 거 있어?"},{"w":"B","en":"Yes, there are some in the fridge.","ko":"응, 냉장고에 좀 있어."},{"w":"A","en":"Great. Do you need anything from the store?","ko":"잘됐다. 가게에서 뭐 필요한 거 있어?"},{"w":"B","en":"Could you grab some bread?","ko":"빵 좀 사다 줄래?"}],"quiz":[{"q":"'질문 있나요?'의 빈칸: Do you have ___ questions?","opts":["some","any","a"],"a":1,"ex":"의문문에서는 보통 any를 씁니다."},{"q":"'물 좀 드시겠어요?'의 빈칸: Would you like ___ water?","opts":["some","any","no"],"a":0,"ex":"권유·제안에는 some을 씁니다."},{"q":"'아무도 안 왔어요'의 빈칸: Nobody came, I did not see ___.","opts":["someone","anyone","no one"],"a":1,"ex":"부정문에서는 anyone을 씁니다."}],"speak":["I need some help.","Do you have any plans?","Would you like some coffee?","I did not buy anything."]},{"id":"u86","tag":"대명사·한정사","title":"no와 none","en":"no / none / any; nothing / nobody","intro":"\u003cb>no + 명사\u003c/b>는 '전혀 없다'는 뜻이고, \u003cb>none\u003c/b>은 명사 없이 단독으로 씁니다. \u003cb>not ... any\u003c/b>는 no와 같은 의미예요. \u003cb>nothing = not anything\u003c/b>, \u003cb>nobody = not anybody\u003c/b>로 이해하면 쉽습니다.","patterns":[{"en":"no + 명사 / not ... any","ko":"전혀 없는 (같은 의미)"},{"en":"none (단독 사용)","ko":"하나도 없음 (뒤에 명사 X)"},{"en":"nothing / nobody","ko":"아무것도 / 아무도 (부정어 포함)"}],"examples":[{"en":"I have no time to talk right now.","ko":"지금은 얘기할 시간이 전혀 없어요."},{"en":"How many are left? None.","ko":"몇 개 남았어요? 하나도 없어요."},{"en":"There is nothing in the box.","ko":"상자 안에 아무것도 없어요."},{"en":"Nobody answered the phone.","ko":"아무도 전화를 받지 않았어요."}],"dialogue":[{"w":"A","en":"Is there any coffee left in the pot?","ko":"주전자에 커피 남은 거 있어?"},{"w":"B","en":"No, there is none left.","ko":"아니, 하나도 안 남았어."},{"w":"A","en":"Did anybody make more?","ko":"누가 더 만들었어?"},{"w":"B","en":"No, nobody did.","ko":"아니, 아무도 안 만들었어."}],"quiz":[{"q":"'나는 돈이 전혀 없다'의 자연스러운 표현은?","opts":["I have no money.","I have any money.","I have none money."],"a":0,"ex":"no + 명사로 '전혀 없다'를 나타냅니다."},{"q":"'nothing'과 같은 뜻은?","opts":["not anything","some thing","any thing"],"a":0,"ex":"nothing = not anything입니다."},{"q":"'몇 개 남았어? 하나도 없어'의 답으로 알맞은 것은?","opts":["No one.","None.","Nothing of."],"a":1,"ex":"명사 없이 단독으로 쓸 때는 None을 씁니다."}],"speak":["I have no money.","There is none left.","There is nothing here.","Nobody knows the answer."]},{"id":"u87","tag":"대명사·한정사","title":"수량 한정사","en":"much, many, little, few, a lot","intro":"셀 수 없는 명사에는 \u003cb>much\u003c/b>와 \u003cb>little\u003c/b>을, 셀 수 있는 명사에는 \u003cb>many\u003c/b>와 \u003cb>few\u003c/b>를 씁니다. \u003cb>a little/a few\u003c/b>는 '조금 있는', \u003cb>little/few\u003c/b>는 '거의 없는'이라는 부정적 어감입니다. \u003cb>a lot of, plenty of\u003c/b>는 둘 다에 쓸 수 있어요.","patterns":[{"en":"much + 불가산 / many + 가산","ko":"많은 (물/시간 vs 사람/책)"},{"en":"a little / a few (조금 있는)","ko":"약간의 (긍정적)"},{"en":"little / few (거의 없는)","ko":"거의 없는 (부정적)"}],"examples":[{"en":"I do not have much time today.","ko":"저는 오늘 시간이 별로 없어요."},{"en":"There are many restaurants downtown.","ko":"시내에 식당이 많아요."},{"en":"We have a little sugar left.","ko":"설탕이 조금 남아 있어요."},{"en":"Few people showed up to the meeting.","ko":"회의에 온 사람이 거의 없었어요."}],"dialogue":[{"w":"A","en":"Do we have enough milk for the recipe?","ko":"레시피에 쓸 우유 충분히 있어?"},{"w":"B","en":"We have a little, but not much.","ko":"조금 있는데, 많지는 않아."},{"w":"A","en":"How many eggs do we need?","ko":"달걀은 몇 개 필요해?"},{"w":"B","en":"A lot, actually. Let us buy plenty.","ko":"사실 많이. 넉넉히 사자."}],"quiz":[{"q":"'많은 물'을 나타내는 빈칸: ___ water","opts":["many","much","few"],"a":1,"ex":"물은 불가산 명사라서 much를 씁니다."},{"q":"'많은 친구들'의 빈칸: ___ friends","opts":["much","many","little"],"a":1,"ex":"friends는 셀 수 있으므로 many를 씁니다."},{"q":"'설탕이 조금 있다(긍정)'의 빈칸: I have ___ sugar.","opts":["a little","little","few"],"a":0,"ex":"a little은 '조금 있는'이라는 긍정적 어감입니다."}],"speak":["I do not have much time.","There are many people here.","I have a few questions.","We have a lot of work."]},{"id":"u88","tag":"대명사·한정사","title":"most of 용법","en":"all / most / none of","intro":"일반적인 것을 말할 때는 \u003cb>most people\u003c/b>처럼 of 없이 씁니다. 특정한 대상을 가리킬 때는 \u003cb>most of the people\u003c/b>처럼 of the를 붙여요. \u003cb>all of the, none of the\u003c/b>도 같은 원리입니다.","patterns":[{"en":"most people (일반적)","ko":"대부분의 사람들 (일반론)"},{"en":"most of the people (특정)","ko":"그 사람들 중 대부분 (특정 집단)"},{"en":"all (of) the... / none of the...","ko":"그 ~ 전부 / 그 ~ 중 하나도 안"}],"examples":[{"en":"Most people enjoy weekends.","ko":"대부분의 사람들은 주말을 즐겨요."},{"en":"Most of the students passed the exam.","ko":"그 학생들 중 대부분이 시험에 합격했어요."},{"en":"All of the seats were taken.","ko":"그 좌석들이 전부 찼어요."},{"en":"None of my friends could come.","ko":"제 친구들 중 아무도 못 왔어요."}],"dialogue":[{"w":"A","en":"Did everyone finish the project?","ko":"다들 프로젝트 끝냈어?"},{"w":"B","en":"Most of the team did, but not all.","ko":"팀 대부분은 했는데, 전부는 아니야."},{"w":"A","en":"What about the interns?","ko":"인턴들은?"},{"w":"B","en":"None of them started yet.","ko":"그들 중 아무도 아직 시작 안 했어."}],"quiz":[{"q":"'대부분의 사람들은(일반적으로)'의 자연스러운 표현은?","opts":["most of people","most people","most the people"],"a":1,"ex":"일반론에는 of 없이 most people을 씁니다."},{"q":"'그 학생들 중 대부분'의 빈칸: most ___ the students","opts":["of","in","at"],"a":0,"ex":"특정 집단을 가리킬 때 most of the를 씁니다."},{"q":"'그들 중 아무도 안 왔다'는?","opts":["None of them came.","No of them came.","All of them came."],"a":0,"ex":"None of the/them으로 '하나도 안'을 나타냅니다."}],"speak":["Most people like music.","Most of the students passed.","All of the seats are full.","None of them came."]},{"id":"u89","tag":"대명사·한정사","title":"both과 either","en":"both / neither / either","intro":"\u003cb>both\u003c/b>은 '둘 다', \u003cb>neither\u003c/b>은 '둘 다 아님', \u003cb>either\u003c/b>은 '둘 중 하나'를 뜻합니다. \u003cb>both A and B\u003c/b>, \u003cb>neither A nor B\u003c/b>, \u003cb>either A or B\u003c/b> 형태로 자주 씁니다.","patterns":[{"en":"both (of) / both A and B","ko":"둘 다, A와 B 둘 다"},{"en":"neither (of) / neither A nor B","ko":"둘 다 아닌, A도 B도 아닌"},{"en":"either (of) / either A or B","ko":"둘 중 하나, A 또는 B"}],"examples":[{"en":"Both of my parents are teachers.","ko":"저희 부모님 두 분 다 선생님이세요."},{"en":"Neither answer was correct.","ko":"두 답 다 틀렸어요."},{"en":"You can take either bus to get there.","ko":"거기 가려면 둘 중 아무 버스나 타면 돼요."},{"en":"She speaks both English and French.","ko":"그녀는 영어와 프랑스어 둘 다 해요."}],"dialogue":[{"w":"A","en":"Do you want tea or coffee?","ko":"차 마실래, 커피 마실래?"},{"w":"B","en":"Either one is fine with me.","ko":"둘 중 아무거나 괜찮아."},{"w":"A","en":"Are both cafes open right now?","ko":"두 카페 다 지금 열었어?"},{"w":"B","en":"No, neither of them opens this early.","ko":"아니, 둘 다 이렇게 일찍은 안 열어."}],"quiz":[{"q":"'둘 다 아니다'를 뜻하는 것은?","opts":["both","either","neither"],"a":2,"ex":"neither은 '둘 다 아님'입니다."},{"q":"'A와 B 둘 다'의 빈칸: ___ A and B","opts":["both","neither","either"],"a":0,"ex":"both A and B 형태를 씁니다."},{"q":"'A 또는 B'의 빈칸: ___ A or B","opts":["both","either","neither"],"a":1,"ex":"either A or B로 '둘 중 하나'를 나타냅니다."}],"speak":["Both of them are nice.","Neither answer is right.","Either one is fine.","She speaks both English and Korean."]},{"id":"u90","tag":"대명사·한정사","title":"all과 every","en":"all, every and whole","intro":"\u003cb>every\u003c/b> 뒤에는 단수 명사가 오고, \u003cb>all\u003c/b> 뒤에는 복수 또는 불가산 명사가 옵니다. \u003cb>the whole\u003c/b>은 '전체의'라는 뜻으로 단수 명사와 함께 써요. every day와 all day의 차이도 알아두세요.","patterns":[{"en":"every + 단수 명사","ko":"모든 ~ (하나하나)"},{"en":"all + 복수/불가산 명사","ko":"모든 ~ (전체)"},{"en":"the whole + 단수 명사","ko":"~ 전체, 온 ~"}],"examples":[{"en":"I exercise every morning.","ko":"저는 매일 아침 운동해요."},{"en":"All the students are here.","ko":"모든 학생이 여기 있어요."},{"en":"We spent the whole day at the beach.","ko":"우리는 온종일 해변에서 보냈어요."},{"en":"Every seat was full.","ko":"모든 좌석이 꽉 찼어요."}],"dialogue":[{"w":"A","en":"How was your weekend?","ko":"주말 어땠어?"},{"w":"B","en":"I slept the whole day on Sunday.","ko":"일요일에 온종일 잤어."},{"w":"A","en":"Do you always sleep that much?","ko":"항상 그렇게 많이 자?"},{"w":"B","en":"No, but I was tired all week.","ko":"아니, 근데 한 주 내내 피곤했거든."}],"quiz":[{"q":"'every' 뒤에 오는 명사 형태는?","opts":["복수 명사","단수 명사","불가산만"],"a":1,"ex":"every 뒤에는 단수 명사가 옵니다."},{"q":"'모든 학생들'의 빈칸: ___ the students","opts":["Every","All","Whole"],"a":1,"ex":"복수 명사에는 all을 씁니다."},{"q":"'하루 종일'을 뜻하는 것은?","opts":["the whole day","every day","all days"],"a":0,"ex":"the whole day는 '하루 전체'를 뜻합니다."}],"speak":["I read every day.","All the seats are taken.","We stayed the whole week.","Every room was clean."]},{"id":"u91","tag":"대명사·한정사","title":"each와 every","en":"each and every","intro":"\u003cb>each\u003c/b>는 둘 이상에서 '개별 하나하나'에 초점을 두고, \u003cb>every\u003c/b>는 셋 이상에서 '전체를 하나의 집단'으로 봅니다. 둘 다 단수 명사·단수 동사와 쓰지만 미묘한 차이가 있어요.","patterns":[{"en":"each + 단수 명사 (개별)","ko":"각각의 (하나씩 강조, 둘 이상)"},{"en":"every + 단수 명사 (전체)","ko":"모든 (전체를 하나로, 셋 이상)"},{"en":"each of + 복수 / every one of + 복수","ko":"~ 각각 / ~ 모두 하나하나"}],"examples":[{"en":"Each student got a different topic.","ko":"각 학생은 서로 다른 주제를 받았어요."},{"en":"Every child needs love and care.","ko":"모든 아이는 사랑과 보살핌이 필요해요."},{"en":"Each of the rooms has a window.","ko":"각 방마다 창문이 있어요."},{"en":"She greeted every guest warmly.","ko":"그녀는 모든 손님을 따뜻하게 맞이했어요."}],"dialogue":[{"w":"A","en":"How should we split the tasks?","ko":"일을 어떻게 나눌까?"},{"w":"B","en":"Each person can take one section.","ko":"각자 한 파트씩 맡으면 돼."},{"w":"A","en":"Does every section need a review?","ko":"모든 파트가 검토가 필요해?"},{"w":"B","en":"Yes, we should check each one carefully.","ko":"응, 하나하나 꼼꼼히 확인해야 해."}],"quiz":[{"q":"'each'와 'every' 뒤에 오는 명사는?","opts":["복수 명사","단수 명사","불가산 명사"],"a":1,"ex":"each와 every 모두 단수 명사와 함께 씁니다."},{"q":"개별 하나하나를 강조하는 단어는?","opts":["each","every","all"],"a":0,"ex":"each는 개별 하나하나에 초점을 둡니다."},{"q":"'각 방마다 창문이 있다'의 빈칸: ___ of the rooms has a window.","opts":["Every","Each","All"],"a":1,"ex":"each of + 복수 명사 형태를 씁니다."}],"speak":["Each student has a book.","Every child is special.","Each of us has a role.","She knows every name."]},{"id":"u92","tag":"관계사","title":"관계대명사 1","en":"Relative clauses 1 (who/that/which)","intro":"두 문장을 하나로 이어주는 \u003cb>주격 관계대명사\u003c/b>예요. 사람이 주어면 \u003cb>who\u003c/b>, 사물이면 \u003cb>which/that\u003c/b>를 써요. 관계대명사 바로 뒤에 동사가 오는 게 특징이에요.","patterns":[{"en":"the person who ...","ko":"~하는 사람"},{"en":"the thing which/that ...","ko":"~하는 것"}],"examples":[{"en":"I know a woman who speaks five languages.","ko":"나는 5개 국어를 하는 여자를 알아."},{"en":"He is the guy who helped me yesterday.","ko":"그가 어제 나를 도와준 남자야."},{"en":"This is the app that saves my time.","ko":"이게 내 시간을 아껴주는 앱이야."},{"en":"I bought a phone which has a great camera.","ko":"나는 카메라가 좋은 폰을 샀어."}],"dialogue":[{"w":"A","en":"Who is that man over there?","ko":"저기 있는 저 남자 누구야?"},{"w":"B","en":"He is the teacher who taught me English.","ko":"나에게 영어를 가르쳐 준 선생님이셔."},{"w":"A","en":"Nice. And what is that book?","ko":"멋지다. 그리고 저 책은 뭐야?"},{"w":"B","en":"It is a novel that changed my life.","ko":"내 인생을 바꾼 소설이야."}],"quiz":[{"q":"사람을 꾸밀 때 주격 관계대명사는?","opts":["who","which","where"],"a":0,"ex":"사람 주어에는 who를 써요."},{"q":"빈칸: This is the car ___ won the race.","opts":["who","that","whose"],"a":1,"ex":"사물이므로 that(또는 which)을 써요."},{"q":"주격 관계대명사 바로 뒤에 오는 것은?","opts":["동사","목적어","전치사"],"a":0,"ex":"주격이라 바로 뒤에 동사가 와요."}],"speak":["I know a woman who speaks five languages.","He is the guy who helped me.","This is the app that saves my time.","I bought a phone which has a great camera."]},{"id":"u93","tag":"관계사","title":"관계대명사 2 생략","en":"Relative clauses 2 (omitting who/that/which)","intro":"관계대명사가 \u003cb>목적격\u003c/b>일 때는 생략할 수 있어요. 관계대명사 뒤에 \u003cb>주어+동사\u003c/b>가 바로 오면 목적격이라는 신호예요. the book (that) I read처럼요.","patterns":[{"en":"the book (that) I read","ko":"내가 읽은 책"},{"en":"the person (who) I met","ko":"내가 만난 사람"}],"examples":[{"en":"The movie I watched last night was great.","ko":"내가 어젯밤에 본 영화는 정말 좋았어."},{"en":"The man I called did not answer.","ko":"내가 전화한 남자는 받지 않았어."},{"en":"This is the song I love the most.","ko":"이게 내가 제일 좋아하는 노래야."},{"en":"The email she sent was very kind.","ko":"그녀가 보낸 이메일은 정말 친절했어."}],"dialogue":[{"w":"A","en":"Did you finish the book I lent you?","ko":"내가 빌려준 책 다 읽었어?"},{"w":"B","en":"Yes, the story you recommended was amazing.","ko":"응, 네가 추천한 이야기 정말 대단했어."},{"w":"A","en":"The part I liked most was the ending.","ko":"내가 제일 좋아한 부분은 결말이었어."},{"w":"B","en":"Same here. It was a book I could not put down.","ko":"나도 그래. 손에서 놓을 수 없는 책이었어."}],"quiz":[{"q":"생략 가능한 관계대명사는?","opts":["주격","목적격","소유격"],"a":1,"ex":"목적격 관계대명사만 생략할 수 있어요."},{"q":"빈칸: The house ___ we bought is old. (생략 가능형)","opts":["who","that","where"],"a":1,"ex":"목적격 that이라 생략도 가능해요."},{"q":"관계대명사 생략의 신호는?","opts":["뒤에 동사","뒤에 주어+동사","뒤에 명사"],"a":1,"ex":"뒤에 주어+동사가 오면 목적격이라 생략 가능해요."}],"speak":["The movie I watched was great.","This is the song I love the most.","The man I called did not answer.","It was a book I could not put down."]},{"id":"u94","tag":"관계사","title":"관계대명사 3 whose","en":"Relative clauses 3 (whose/whom/where)","intro":"소유는 \u003cb>whose\u003c/b>, 장소는 \u003cb>where\u003c/b>, 사람 목적격은 \u003cb>whom\u003c/b>을 써요. 시간을 나타낼 때는 \u003cb>when\u003c/b>도 쓸 수 있어요. the day when처럼요.","patterns":[{"en":"the man whose car ...","ko":"차가 ~한 남자"},{"en":"the place where ...","ko":"~한 장소"},{"en":"the day when ...","ko":"~한 날"}],"examples":[{"en":"I met a boy whose father is a pilot.","ko":"나는 아버지가 조종사인 소년을 만났어."},{"en":"This is the cafe where we first met.","ko":"여기가 우리가 처음 만난 카페야."},{"en":"She is the woman whom I trust the most.","ko":"그녀는 내가 가장 신뢰하는 여자야."},{"en":"I remember the day when we moved here.","ko":"우리가 여기로 이사 온 날이 기억나."}],"dialogue":[{"w":"A","en":"Do you know a girl whose brother plays guitar?","ko":"오빠가 기타 치는 여자애 알아?"},{"w":"B","en":"Yes, she lives in the house where I grew up.","ko":"응, 내가 자란 집에 살아."},{"w":"A","en":"Really? Is she the friend whom you often mention?","ko":"정말? 네가 자주 말하는 친구야?"},{"w":"B","en":"Exactly. I still remember the day when we met.","ko":"맞아. 우리가 만난 날이 아직도 기억나."}],"quiz":[{"q":"소유를 나타내는 관계사는?","opts":["whose","where","when"],"a":0,"ex":"소유격에는 whose를 써요."},{"q":"빈칸: This is the town ___ I was born.","opts":["who","where","whose"],"a":1,"ex":"장소에는 where를 써요."},{"q":"빈칸: I will never forget the day ___ we met.","opts":["when","which","whom"],"a":0,"ex":"시간을 나타낼 때는 when을 써요."}],"speak":["I met a boy whose father is a pilot.","This is the cafe where we first met.","She is the woman whom I trust the most.","I remember the day when we moved here."]},{"id":"u95","tag":"관계사","title":"관계대명사 4 콤마","en":"Relative clauses 4 (extra information, commas 1)","intro":"콤마를 쓰는 \u003cb>계속적 용법\u003c/b>은 꼭 필요한 정보가 아니라 \u003cb>추가 정보\u003c/b>를 덧붙여요. 사람은 who, 사물은 which를 쓰고, 이때는 \u003cb>that을 쓸 수 없어요\u003c/b>.","patterns":[{"en":"..., who ..., ...","ko":"그런데 그 사람은 ~"},{"en":"..., which ..., ...","ko":"그런데 그것은 ~"}],"examples":[{"en":"My sister, who lives in Busan, is a nurse.","ko":"내 여동생은, 부산에 사는데, 간호사야."},{"en":"This laptop, which I bought last year, is still fast.","ko":"이 노트북은, 작년에 샀는데, 아직 빨라."},{"en":"Mr. Kim, who teaches math, is very kind.","ko":"김 선생님은, 수학을 가르치시는데, 정말 친절해."},{"en":"Our new house, which has a garden, is lovely.","ko":"우리 새 집은, 정원이 있는데, 아주 예뻐."}],"dialogue":[{"w":"A","en":"Is that your friend, who studied in London?","ko":"저 사람이 런던에서 공부한 네 친구야?"},{"w":"B","en":"Yes, and this phone, which she gave me, is great.","ko":"응, 그리고 이 폰은, 그녀가 준 건데, 정말 좋아."},{"w":"A","en":"Nice. Her brother, who I met once, seemed kind.","ko":"좋다. 그녀 오빠는, 내가 한 번 만났는데, 친절해 보였어."},{"w":"B","en":"He is. Their dog, which barks a lot, is cute too.","ko":"맞아. 그들 강아지도, 많이 짖는데, 귀여워."}],"quiz":[{"q":"계속적 용법(콤마)에서 사물에 쓸 수 없는 것은?","opts":["which","that","who"],"a":1,"ex":"콤마 뒤에는 that을 쓸 수 없어요."},{"q":"계속적 용법의 역할은?","opts":["필수 정보","추가 정보","질문"],"a":1,"ex":"추가 정보를 덧붙이는 용법이에요."},{"q":"빈칸: My car, ___ is red, is new.","opts":["that","which","who"],"a":1,"ex":"콤마 뒤 사물에는 which를 써요."}],"speak":["My sister, who lives in Busan, is a nurse.","This laptop, which I bought last year, is still fast.","Mr. Kim, who teaches math, is very kind.","Our new house, which has a garden, is lovely."]},{"id":"u96","tag":"관계사","title":"관계대명사 5 앞 문장","en":"Relative clauses 5 (extra information 2; which = whole sentence)","intro":"콤마 뒤의 \u003cb>which\u003c/b>는 앞의 단어가 아니라 \u003cb>앞 문장 전체\u003c/b>를 받을 수 있어요. some of whom, some of which처럼 \u003cb>양·수 표현\u003c/b>과도 함께 써요.","patterns":[{"en":"..., which was ...","ko":"그리고 그것은 ~였다 (앞 문장 전체)"},{"en":"some of whom / which","ko":"그중 일부는 ~"}],"examples":[{"en":"He passed the exam, which made everyone happy.","ko":"그가 시험에 합격했고, 그것이 모두를 기쁘게 했어."},{"en":"She was late again, which annoyed the boss.","ko":"그녀가 또 늦었는데, 그것이 상사를 짜증나게 했어."},{"en":"I have many friends, some of whom live abroad.","ko":"나는 친구가 많은데, 그중 일부는 해외에 살아."},{"en":"We tried five plans, none of which worked.","ko":"우리는 다섯 계획을 시도했는데, 어느 것도 되지 않았어."}],"dialogue":[{"w":"A","en":"He got a promotion, which surprised us all.","ko":"그가 승진했는데, 그것이 우리 모두를 놀라게 했어."},{"w":"B","en":"Wow. He has many rivals, some of whom quit.","ko":"와. 그는 경쟁자가 많은데, 그중 일부는 그만뒀어."},{"w":"A","en":"They made three offers, all of which he refused.","ko":"그들이 세 제안을 했는데, 모두 그가 거절했어."},{"w":"B","en":"He stayed calm, which impressed everyone.","ko":"그는 침착했고, 그것이 모두를 감동시켰어."}],"quiz":[{"q":"콤마 뒤 which가 받을 수 있는 것은?","opts":["앞 문장 전체","사람만","미래만"],"a":0,"ex":"which는 앞 문장 전체를 받을 수 있어요."},{"q":"빈칸: I have five books, some of ___ are old.","opts":["whom","which","who"],"a":1,"ex":"사물이므로 some of which를 써요."},{"q":"빈칸: I met ten people, some of ___ were doctors.","opts":["whom","which","that"],"a":0,"ex":"사람이므로 some of whom을 써요."}],"speak":["He passed the exam, which made everyone happy.","She was late again, which annoyed the boss.","I have many friends, some of whom live abroad.","We tried five plans, none of which worked."]},{"id":"u97","tag":"관계사","title":"분사 수식","en":"-ing and -ed clauses","intro":"명사를 뒤에서 꾸밀 때 \u003cb>-ing\u003c/b>는 능동·진행(하고 있는), \u003cb>-ed\u003c/b>는 수동(당한)을 나타내요. the man standing there(서 있는 남자), the money stolen(도난당한 돈)처럼요.","patterns":[{"en":"the man standing there","ko":"저기 서 있는 남자 (능동)"},{"en":"the money stolen","ko":"도난당한 돈 (수동)"}],"examples":[{"en":"The woman talking to Tom is my boss.","ko":"톰과 이야기하는 여자가 내 상사야."},{"en":"Do you know the boy playing the piano?","ko":"피아노 치는 소년 알아?"},{"en":"The window broken by the storm is fixed now.","ko":"폭풍에 깨진 창문은 이제 고쳐졌어."},{"en":"I found the wallet lost last week.","ko":"나는 지난주에 잃어버린 지갑을 찾았어."}],"dialogue":[{"w":"A","en":"Who is the man standing by the door?","ko":"문 옆에 서 있는 남자 누구야?"},{"w":"B","en":"He is the guest invited to the party.","ko":"파티에 초대된 손님이야."},{"w":"A","en":"And the girl singing on the stage?","ko":"그리고 무대에서 노래하는 여자애는?"},{"w":"B","en":"She found the ring lost yesterday.","ko":"그녀가 어제 잃어버린 반지를 찾았어."}],"quiz":[{"q":"능동·진행의 의미를 가진 것은?","opts":["-ing (현재분사)","-ed (과거분사)","to부정사"],"a":0,"ex":"-ing는 능동·진행을 나타내요."},{"q":"빈칸: the money ___ (도난당한)","opts":["stealing","stolen","steal"],"a":1,"ex":"수동이므로 과거분사 stolen을 써요."},{"q":"빈칸: the man ___ there (서 있는)","opts":["stood","standing","stand"],"a":1,"ex":"능동·진행이므로 현재분사 standing을 써요."}],"speak":["The woman talking to Tom is my boss.","Do you know the boy playing the piano?","The window broken by the storm is fixed now.","I found the wallet lost last week."]},{"id":"u98","tag":"형용사·부사","title":"boring vs bored","en":"Adjectives ending in -ing and -ed","intro":"감정 형용사는 두 가지예요. \u003cb>-ing\u003c/b>는 대상이 그런 감정을 만들 때(그 영화는 지루해), \u003cb>-ed\u003c/b>는 사람이 그렇게 느낄 때(나는 지루해) 써요. The movie was boring. I was bored.","patterns":[{"en":"The + thing + is/was + -ing.","ko":"그 대상이 ~하게 만든다."},{"en":"I am/was + -ed.","ko":"나는 ~하게 느낀다."}],"examples":[{"en":"This class is really interesting.","ko":"이 수업은 정말 흥미로워요."},{"en":"I am so tired after work.","ko":"일하고 나니 너무 피곤해요."},{"en":"The news was surprising to everyone.","ko":"그 소식은 모두에게 놀라웠어요."},{"en":"She felt excited about the trip.","ko":"그녀는 여행이 신났어요."}],"dialogue":[{"w":"A","en":"How was the lecture today?","ko":"오늘 강의 어땠어요?"},{"w":"B","en":"Honestly, it was boring and I got sleepy.","ko":"솔직히 지루해서 졸렸어요."},{"w":"A","en":"Really? I found it fascinating.","ko":"정말요? 저는 아주 흥미로웠는데요."},{"w":"B","en":"Maybe I was just too tired to enjoy it.","ko":"제가 너무 피곤해서 못 즐긴 걸 수도 있어요."}],"quiz":[{"q":"그 영화 지루했어. The movie was ___.","opts":["boring","bored","bore"],"a":0,"ex":"대상이 지루하게 만들면 -ing를 써요."},{"q":"나는 그 결과에 놀랐어. I was ___ at the result.","opts":["surprising","surprised","surprise"],"a":1,"ex":"사람이 느끼는 감정은 -ed를 써요."},{"q":"이 책은 흥미로워. This book is ___.","opts":["interested","interest","interesting"],"a":2,"ex":"책이 흥미를 주므로 -ing가 맞아요."}],"speak":["This game is so exciting.","I was really bored yesterday.","The story sounds interesting.","Are you tired right now?"]},{"id":"u99","tag":"형용사·부사","title":"형용사 어순","en":"Adjectives: a nice new house; you look tired","intro":"형용사가 여러 개면 순서가 있어요. \u003cb>의견\u003c/b> 다음에 크기, 색 같은 사실이 와요(a nice new house). 또 look, feel, seem 같은 동사 뒤에는 형용사가 와요(You look tired).","patterns":[{"en":"opinion + size/color + noun","ko":"의견 형용사 + 사실 형용사 + 명사"},{"en":"look / feel / seem + adjective","ko":"~해 보인다 / 느낀다 / ~인 것 같다 + 형용사"}],"examples":[{"en":"She bought a lovely little bag.","ko":"그녀는 예쁜 작은 가방을 샀어요."},{"en":"We live in a big old house.","ko":"우리는 크고 오래된 집에 살아요."},{"en":"You look happy today.","ko":"오늘 행복해 보이네요."},{"en":"This soup tastes delicious.","ko":"이 수프 맛있네요."}],"dialogue":[{"w":"A","en":"You look tired this morning.","ko":"오늘 아침 피곤해 보여요."},{"w":"B","en":"Yeah, I moved into a small new apartment.","ko":"네, 작고 새로운 아파트로 이사했거든요."},{"w":"A","en":"Nice! Does it feel comfortable?","ko":"좋네요! 편안해요?"},{"w":"B","en":"It does, but everything still seems messy.","ko":"그렇긴 한데 아직 다 어수선해 보여요."}],"quiz":[{"q":"자연스러운 어순은? a ___ car","opts":["red nice","nice red","red nice fast"],"a":1,"ex":"의견(nice)이 색(red)보다 앞에 와요."},{"q":"너 피곤해 보여. You ___ tired.","opts":["look","see","watch"],"a":0,"ex":"상태를 보이는 것은 look + 형용사예요."},{"q":"이 케이크 맛있어. This cake ___ great.","opts":["tastes","eats","cooks"],"a":0,"ex":"맛을 표현할 때 taste + 형용사를 써요."}],"speak":["You look great today.","I bought a nice warm coat.","This place feels cozy.","He seems a little nervous."]},{"id":"u100","tag":"형용사·부사","title":"quick vs quickly","en":"Adjectives and adverbs 1","intro":"형용사는 명사를 꾸미고, \u003cb>부사\u003c/b>는 동사를 꾸며요. 보통 형용사 뒤에 \u003cb>-ly\u003c/b>를 붙여 부사를 만들어요(quick to quickly). y로 끝나면 easy to easily처럼 바뀌어요.","patterns":[{"en":"adjective + noun / verb + adverb","ko":"형용사+명사 / 동사+부사"},{"en":"adjective + ly = adverb","ko":"형용사 + ly = 부사"}],"examples":[{"en":"He is a careful driver.","ko":"그는 조심스러운 운전자예요."},{"en":"He drives carefully.","ko":"그는 조심스럽게 운전해요."},{"en":"She speaks English fluently.","ko":"그녀는 영어를 유창하게 말해요."},{"en":"Please finish it quickly.","ko":"그것을 빨리 끝내 주세요."}],"dialogue":[{"w":"A","en":"Can you explain this slowly?","ko":"이거 천천히 설명해 줄래요?"},{"w":"B","en":"Sure, I will speak more clearly.","ko":"그럼요, 더 또렷하게 말할게요."},{"w":"A","en":"Thanks. You learn things easily.","ko":"고마워요. 당신은 뭐든 쉽게 배우네요."},{"w":"B","en":"I just study hard every day.","ko":"그냥 매일 열심히 공부할 뿐이에요."}],"quiz":[{"q":"그는 빨리 달린다. He runs ___.","opts":["quick","quickly","quicker"],"a":1,"ex":"동사(runs)를 꾸미므로 부사 quickly를 써요."},{"q":"easy의 부사 형태는?","opts":["easyly","easy","easily"],"a":2,"ex":"y로 끝나면 y를 i로 바꾸고 ly를 붙여요."},{"q":"그녀는 좋은 가수다. She is a ___ singer.","opts":["good","well","goodly"],"a":0,"ex":"명사(singer)를 꾸미므로 형용사 good을 써요."}],"speak":["Please speak slowly.","She sings beautifully.","He answered the question quickly.","They work very carefully."]},{"id":"u101","tag":"형용사·부사","title":"hard, late, well","en":"Adjectives and adverbs 2","intro":"헷갈리는 단어들이에요. \u003cb>hard\u003c/b>는 열심히, \u003cb>hardly\u003c/b>는 거의 ~않다. \u003cb>late\u003c/b>는 늦게, \u003cb>lately\u003c/b>는 최근에. good은 형용사, \u003cb>well\u003c/b>은 부사예요.","patterns":[{"en":"hard = 열심히 / hardly = 거의 ~않다","ko":"hard와 hardly는 뜻이 완전히 달라요"},{"en":"good (adj) / well (adv)","ko":"good은 형용사, well은 부사"}],"examples":[{"en":"He works hard every day.","ko":"그는 매일 열심히 일해요."},{"en":"I can hardly hear you.","ko":"당신 목소리가 거의 안 들려요."},{"en":"I have been busy lately.","ko":"저는 최근에 바빴어요."},{"en":"She sings very well.","ko":"그녀는 노래를 아주 잘해요."}],"dialogue":[{"w":"A","en":"You have been studying hard lately.","ko":"당신 요즘 열심히 공부하네요."},{"w":"B","en":"I have to. I can hardly speak English.","ko":"그래야 해요. 영어를 거의 못 하거든요."},{"w":"A","en":"Come on, you speak really well.","ko":"에이, 정말 잘하시는데요."},{"w":"B","en":"Thanks, but I got here late again today.","ko":"고마워요, 그런데 오늘도 늦게 왔어요."}],"quiz":[{"q":"나는 거의 잠을 못 잤다. I ___ slept.","opts":["hard","hardly","hardness"],"a":1,"ex":"거의 ~않다는 hardly예요."},{"q":"그녀는 요리를 잘한다. She cooks ___.","opts":["good","well","goodly"],"a":1,"ex":"동사(cooks)를 꾸미므로 부사 well을 써요."},{"q":"나는 최근에 그를 봤다. I saw him ___.","opts":["late","lately","later"],"a":1,"ex":"최근에라는 뜻은 lately예요."}],"speak":["I work hard to improve.","I have hardly slept this week.","Have you traveled lately?","You did really well today."]},{"id":"u102","tag":"형용사·부사","title":"so와 such","en":"So and such","intro":"강조할 때 \u003cb>so\u003c/b>는 형용사나 부사 앞에(so nice), \u003cb>such\u003c/b>는 명사구 앞에(such a nice day) 써요. 수를 강조할 땐 so many, so much를 써요.","patterns":[{"en":"so + adjective / adverb","ko":"so + 형용사/부사"},{"en":"such + (a) + noun phrase","ko":"such + (a) + 명사구"}],"examples":[{"en":"This coffee is so good.","ko":"이 커피 정말 맛있어요."},{"en":"It was such a lovely day.","ko":"정말 사랑스러운 날이었어요."},{"en":"You have so many books.","ko":"당신은 책이 정말 많네요."},{"en":"She talks so fast.","ko":"그녀는 말을 정말 빨리 해요."}],"dialogue":[{"w":"A","en":"The party was so much fun!","ko":"파티 정말 재미있었어요!"},{"w":"B","en":"I know, it was such a great night.","ko":"맞아요, 정말 멋진 밤이었어요."},{"w":"A","en":"And the food was so delicious.","ko":"그리고 음식도 정말 맛있었어요."},{"w":"B","en":"There were such kind people there too.","ko":"거기 정말 친절한 사람들도 많았어요."}],"quiz":[{"q":"정말 좋은 생각이야! It is ___ a good idea!","opts":["so","such","very"],"a":1,"ex":"명사구(a good idea) 앞에는 such를 써요."},{"q":"그녀는 정말 친절하다. She is ___ kind.","opts":["so","such","such a"],"a":0,"ex":"형용사(kind) 앞에는 so를 써요."},{"q":"일이 정말 많아. I have ___ work.","opts":["so many","so much","such many"],"a":1,"ex":"셀 수 없는 명사(work)에는 so much를 써요."}],"speak":["You are so kind.","It was such a fun trip.","I have so much to do.","There are so many people here."]},{"id":"u103","tag":"형용사·부사","title":"enough와 too","en":"Enough and too","intro":"\u003cb>enough\u003c/b>는 명사 앞(enough time), 형용사 뒤(big enough)에 와요. \u003cb>too\u003c/b>는 형용사 앞에 와서 지나침을 뜻해요(too hot). too ~ to, enough to로 이어 쓸 수 있어요.","patterns":[{"en":"enough + noun / adjective + enough","ko":"enough+명사 / 형용사+enough"},{"en":"too + adjective (+ to), enough + to","ko":"too는 지나침, ~ to로 연결"}],"examples":[{"en":"We do not have enough time.","ko":"우리는 시간이 충분하지 않아요."},{"en":"This box is not big enough.","ko":"이 상자는 충분히 크지 않아요."},{"en":"The coffee is too hot to drink.","ko":"커피가 너무 뜨거워서 못 마셔요."},{"en":"She is old enough to drive.","ko":"그녀는 운전할 만큼 나이가 들었어요."}],"dialogue":[{"w":"A","en":"Can we buy that TV?","ko":"저 TV 살 수 있을까요?"},{"w":"B","en":"No, it is too expensive for us.","ko":"아니요, 우리에겐 너무 비싸요."},{"w":"A","en":"Do we have enough money for a smaller one?","ko":"더 작은 걸 살 돈은 충분해요?"},{"w":"B","en":"Maybe, but this room is not big enough anyway.","ko":"아마도요, 그런데 이 방이 어차피 충분히 크지 않아요."}],"quiz":[{"q":"충분한 돈이 없어. I do not have ___ money.","opts":["enough","too","too much"],"a":0,"ex":"명사(money) 앞에는 enough를 써요."},{"q":"너무 추워서 나갈 수 없어. It is ___ cold to go out.","opts":["enough","too","so much"],"a":1,"ex":"지나침을 나타낼 때 too + 형용사를 써요."},{"q":"그는 이걸 들 만큼 힘이 세. He is strong ___ to lift this.","opts":["too","enough","such"],"a":1,"ex":"형용사 뒤 enough to 형태예요."}],"speak":["This bag is too heavy.","We have enough food for everyone.","It is warm enough to swim.","I am too tired to cook."]},{"id":"u104","tag":"형용사·부사","title":"정도를 나타내는 부사","en":"Quite, pretty, rather, fairly","intro":"정도를 나타내는 부사예요. \u003cb>quite\u003c/b>와 \u003cb>fairly\u003c/b>는 어느 정도, \u003cb>pretty\u003c/b>는 꽤(회화체), \u003cb>rather\u003c/b>는 다소인데 부정적 느낌을 줄 때가 많아요.","patterns":[{"en":"quite / fairly + adjective","ko":"어느 정도 ~한"},{"en":"rather + adjective (부정적 뉘앙스 가능)","ko":"다소 ~한 (약간 부정적)"}],"examples":[{"en":"The movie was quite good.","ko":"그 영화는 꽤 괜찮았어요."},{"en":"It is pretty cold outside.","ko":"밖이 꽤 추워요."},{"en":"The test was rather difficult.","ko":"시험이 다소 어려웠어요."},{"en":"Her English is fairly good.","ko":"그녀의 영어는 어느 정도 괜찮아요."}],"dialogue":[{"w":"A","en":"How was your new job?","ko":"새 직장은 어땠어요?"},{"w":"B","en":"It is quite interesting, actually.","ko":"사실 꽤 흥미로워요."},{"w":"A","en":"That is great. Is it hard?","ko":"좋네요. 힘들어요?"},{"w":"B","en":"The hours are rather long, but the pay is pretty good.","ko":"근무 시간이 다소 길지만 급여는 꽤 좋아요."}],"quiz":[{"q":"다소 부정적인 느낌을 줄 수 있는 것은?","opts":["quite","rather","fairly"],"a":1,"ex":"rather는 부정적 뉘앙스를 담을 때가 많아요."},{"q":"밖이 꽤 더워. It is ___ hot outside.","opts":["pretty","such","enough"],"a":0,"ex":"회화에서 꽤라는 뜻으로 pretty를 써요."},{"q":"그 식당은 어느 정도 괜찮았어. It was ___ good.","opts":["too","fairly","such"],"a":1,"ex":"어느 정도라는 뜻은 fairly예요."}],"speak":["This book is quite good.","It is pretty busy today.","The room was rather small.","The weather is fairly nice."]},{"id":"u105","tag":"형용사·부사","title":"비교급 만들기","en":"Comparison 1 (cheaper, more expensive)","intro":"두 대상을 비교할 때 비교급을 써요. \u003cb>짧은 말\u003c/b>은 -er(cheaper), \u003cb>긴 말\u003c/b>은 more(more expensive)를 붙여요. good은 \u003cb>better\u003c/b>처럼 불규칙 변화도 있어요. 뒤에는 보통 than이 와요.","patterns":[{"en":"short word + er + than","ko":"짧은 형용사 + er + than"},{"en":"more + long word + than","ko":"긴 형용사는 more + 형용사 + than"}],"examples":[{"en":"This phone is cheaper than that one.","ko":"이 휴대폰이 저것보다 싸요."},{"en":"Today is hotter than yesterday.","ko":"오늘이 어제보다 더워요."},{"en":"This book is more interesting than the film.","ko":"이 책이 그 영화보다 더 흥미로워요."},{"en":"Her English is better than mine.","ko":"그녀의 영어가 제 것보다 나아요."}],"dialogue":[{"w":"A","en":"Which laptop should I buy?","ko":"어떤 노트북을 사야 할까요?"},{"w":"B","en":"This one is cheaper, but that one is faster.","ko":"이게 더 싸지만 저게 더 빨라요."},{"w":"A","en":"Is the faster one much more expensive?","ko":"빠른 게 훨씬 더 비싼가요?"},{"w":"B","en":"A little, but it is better for your work.","ko":"조금요, 그래도 당신 일에는 더 나아요."}],"quiz":[{"q":"이 차가 더 싸다. This car is ___.","opts":["cheaper","more cheap","cheapest"],"a":0,"ex":"짧은 형용사는 -er을 붙여요."},{"q":"이게 더 비싸다. This is ___ than that.","opts":["expensiver","more expensive","expensivest"],"a":1,"ex":"긴 형용사는 more를 붙여요."},{"q":"good의 비교급은?","opts":["gooder","more good","better"],"a":2,"ex":"good은 불규칙하게 better로 바뀌어요."}],"speak":["This is cheaper than that.","Today is colder than yesterday.","Your idea is more interesting.","This one is better for me."]},{"id":"u106","tag":"형용사·부사","title":"비교급 강조·점점 더","en":"Comparison 2: much/far, better and better","intro":"비교급을 강조할 때는 \u003cb>much, far, a lot, a bit\u003c/b>를 앞에 붙여요. \u003cb>비교급 and 비교급\u003c/b>은 점점 더, \u003cb>the 비교급 ~, the 비교급 ~\u003c/b>은 더 ~할수록 더 ~하다는 뜻이에요.","patterns":[{"en":"much/far/a lot/a bit + 비교급","ko":"훨씬/조금 더 ~한"},{"en":"비교급 and 비교급","ko":"점점 더 ~한"},{"en":"the 비교급 ~, the 비교급 ~","ko":"~할수록 더 ~하다"}],"examples":[{"en":"This car is much faster than mine.","ko":"이 차는 내 차보다 훨씬 빨라요."},{"en":"The weather is a bit warmer today.","ko":"오늘은 날씨가 조금 더 따뜻해요."},{"en":"Your English is getting better and better.","ko":"네 영어가 점점 더 좋아지고 있어."},{"en":"The more you practice, the easier it gets.","ko":"더 연습할수록 더 쉬워져요."}],"dialogue":[{"w":"A","en":"How is your new apartment?","ko":"새 아파트는 어때?"},{"w":"B","en":"It's much bigger than the old one.","ko":"예전 집보다 훨씬 커."},{"w":"A","en":"And the neighborhood?","ko":"동네는?"},{"w":"B","en":"The longer I stay, the more I like it.","ko":"오래 있을수록 더 마음에 들어."}],"quiz":[{"q":"This one is ___ better than that one. (훨씬)","opts":["much","very","so"],"a":0,"ex":"비교급 강조는 much, very는 형용사 원급을 강조해요."},{"q":"It's getting colder and ___.","opts":["cold","colder","coldest"],"a":1,"ex":"점점 더는 비교급 and 비교급 형태예요."},{"q":"___ you eat, the fuller you feel.","opts":["More","The more","Much more"],"a":1,"ex":"the 비교급 ~, the 비교급 ~ 구조예요."}],"speak":["This is much better than before.","The days are getting longer and longer.","The more I read, the more I learn.","It's a bit colder today."]},{"id":"u107","tag":"형용사·부사","title":"as ... as 원급 비교","en":"Comparison 3: as ... as; than","intro":"두 대상이 같은 정도일 때 \u003cb>as + 형용사/부사 + as\u003c/b>를 써요. 부정은 \u003cb>not as ... as\u003c/b>(~만큼 ~하지 않다)예요. than 뒤에는 \u003cb>me\u003c/b> 또는 \u003cb>I do\u003c/b>처럼 써요.","patterns":[{"en":"as + 원급 + as","ko":"~만큼 ~한"},{"en":"not as + 원급 + as","ko":"~만큼 ~하지 않은"},{"en":"비교급 + than me / than I do","ko":"나보다 더 ~한"}],"examples":[{"en":"She is as tall as her brother.","ko":"그녀는 오빠만큼 키가 커요."},{"en":"This test is not as hard as the last one.","ko":"이 시험은 지난번만큼 어렵지 않아요."},{"en":"He runs faster than me.","ko":"그는 나보다 빨리 달려요."},{"en":"You work harder than I do.","ko":"너는 나보다 더 열심히 일해."}],"dialogue":[{"w":"A","en":"Is the new phone as good as the old one?","ko":"새 폰이 예전 것만큼 좋아?"},{"w":"B","en":"It's not as fast as I hoped.","ko":"내가 바란 만큼 빠르진 않아."},{"w":"A","en":"Really? Mine feels quicker than yours.","ko":"정말? 내 건 네 것보다 빠른 것 같아."},{"w":"B","en":"Yeah, yours is better than mine.","ko":"응, 네 게 내 것보다 나아."}],"quiz":[{"q":"She sings as ___ as a professional.","opts":["well","better","best"],"a":0,"ex":"as ... as 사이에는 원급을 써요."},{"q":"This bag is not as ___ as that one.","opts":["expensive","more expensive","most expensive"],"a":0,"ex":"not as ... as 사이에도 원급이 들어가요."},{"q":"He is taller than ___.","opts":["me","my","mine"],"a":0,"ex":"than 뒤에는 목적격 me를 자연스럽게 써요."}],"speak":["You are as busy as me.","It's not as cold as yesterday.","She is smarter than I am.","This is as easy as that."]},{"id":"u108","tag":"형용사·부사","title":"최상급 표현","en":"Superlatives: the longest, the best","intro":"셋 이상 중 가장 ~할 때 \u003cb>the + 최상급\u003c/b>을 써요. 범위는 \u003cb>in\u003c/b>(장소·집단)이나 \u003cb>of\u003c/b>(복수)로 나타내고, \u003cb>one of the 최상급 + 복수명사\u003c/b>는 가장 ~한 것들 중 하나예요.","patterns":[{"en":"the + 최상급 (-est / most)","ko":"가장 ~한"},{"en":"in + 장소 / of + 복수","ko":"~에서 / ~ 중에서"},{"en":"one of the 최상급 + 복수명사","ko":"가장 ~한 것들 중 하나"
