<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Speak Up! · 회화 중심 영문법 인터랙티브 학습 (전체 145유닛)</title>
<style>
  :root{
    --bg:#0f1220; --bg2:#171a2e; --card:#1b1f38; --card2:#232848;
    --line:#2c3157; --txt:#eef1ff; --mut:#9aa2c8; --muted2:#6f77a3;
    --acc:#6c8bff; --acc2:#8a6cff; --good:#3ecf8e; --bad:#ff6b81; --warn:#ffcf5c;
    --shadow:0 10px 40px rgba(0,0,0,.35);
    --radius:18px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#eef1fb; --bg2:#e4e8f7; --card:#ffffff; --card2:#f3f5ff;
      --line:#dfe3f5; --txt:#1a1e35; --mut:#5b628a; --muted2:#8991b8;
      --acc:#4a68e8; --acc2:#7a5cff; --good:#1fa971; --bad:#e5485f; --warn:#c98a12;
      --shadow:0 10px 40px rgba(60,70,120,.15);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:linear-gradient(160deg,var(--bg),var(--bg2));
    color:var(--txt); min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.6;
  }
  .wrap{max-width:960px;margin:0 auto;padding:20px 16px 90px}
  header.top{display:flex;align-items:center;gap:12px;padding:8px 0 16px;position:sticky;top:0;z-index:20;
    background:linear-gradient(160deg,var(--bg),var(--bg2));}
  .logo{width:44px;height:44px;border-radius:13px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow)}
  .brand h1{font-size:20px;margin:0;letter-spacing:-.3px}
  .brand p{margin:0;color:var(--mut);font-size:12.5px}
  .prog-wrap{margin-left:auto;text-align:right;min-width:120px}
  .prog-bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:5px}
  .prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--good),var(--acc));transition:width .5s}
  .prog-wrap small{color:var(--mut);font-size:11.5px}

  .hero{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
  .hero h2{margin:0 0 6px;font-size:16px}
  .hero p{margin:0;color:var(--mut);font-size:13px}

  .search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:11px 15px;margin-bottom:16px;box-shadow:var(--shadow);position:sticky;top:70px;z-index:15}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:15px;font-family:inherit}
  .search input::placeholder{color:var(--muted2)}
  .search .ico{font-size:16px;color:var(--mut)}
  .search .clear{background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:8px;
    padding:4px 9px;cursor:pointer;font-size:12px;display:none}

  .section{margin-bottom:22px}
  .sec-head{display:flex;align-items:baseline;gap:9px;margin:0 2px 10px}
  .sec-head h3{margin:0;font-size:15px;letter-spacing:-.2px}
  .sec-head .cnt{color:var(--muted2);font-size:12px;font-weight:600}
  .sec-head .bar{flex:1;height:1px;background:var(--line);margin-left:4px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:11px}
  .unit-card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 14px 12px;
    cursor:pointer;position:relative;overflow:hidden;transition:transform .12s ease,border-color .12s ease}
  .unit-card:hover{transform:translateY(-3px);border-color:var(--acc)}
  .unit-card .num{font-size:11px;color:var(--muted2);font-weight:700;letter-spacing:.7px}
  .unit-card h4{margin:5px 0 2px;font-size:15px;font-weight:700}
  .unit-card .en{color:var(--mut);font-size:11.5px;margin:0;line-height:1.4}
  .done-dot{position:absolute;top:12px;right:12px;width:18px;height:18px;border-radius:50%;
    background:var(--good);display:none;place-items:center;color:#fff;font-size:11px}
  .unit-card.done .done-dot{display:grid}
  .unit-card.done{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
  .no-res{color:var(--mut);text-align:center;padding:40px 0;font-size:14px}

  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--acc);
    font-size:14px;cursor:pointer;padding:6px 0;margin-bottom:4px;font-weight:600}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;
    background:var(--card2);color:var(--acc);border:1px solid var(--line)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px;position:sticky;top:66px;z-index:12;
    padding:6px 0;background:linear-gradient(160deg,var(--bg),var(--bg2))}
  .tab{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:99px;
    padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600;transition:all .12s;font-family:inherit}
  .tab.active{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
  .panel{display:none;animation:fade .25s ease}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .box h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
  .box .lead{color:var(--txt);font-size:14.5px}
  .kv{color:var(--mut);font-size:13.5px}

  .pat{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px dashed var(--line)}
  .pat:first-of-type{border-top:none}
  .pat .p-en{font-weight:700;font-size:15px}
  .pat .p-ko{color:var(--mut);font-size:13px}

  .ex-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
  .ex-row:first-of-type{border-top:none}
  .ex-row .ex-txt{flex:1}
  .ex-row .ex-en{font-size:15px;font-weight:600}
  .ex-row .ex-ko{color:var(--mut);font-size:13px}
  .say{flex:0 0 auto;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
    background:var(--card2);color:var(--acc);cursor:pointer;font-size:17px;display:grid;place-items:center;transition:all .12s}
  .say:hover{background:var(--acc);color:#fff}
  .say:active{transform:scale(.92)}

  .dlg{display:flex;gap:10px;margin:12px 0}
  .dlg .who{flex:0 0 42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px}
  .dlg.a .who{background:linear-gradient(135deg,var(--acc),#4a68e8)}
  .dlg.b .who{background:linear-gradient(135deg,var(--acc2),#b06cff)}
  .bubble{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 13px;flex:1}
  .bubble .b-en{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;justify-content:space-between}
  .bubble .b-ko{color:var(--mut);font-size:12.5px;margin-top:2px}
  .bubble .say{width:32px;height:32px;font-size:15px}

  .q{margin-bottom:16px}
  .q .q-txt{font-weight:600;font-size:15px;margin-bottom:10px}
  .q .q-txt .blank{color:var(--acc);font-weight:800}
  .opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);
    color:var(--txt);border-radius:11px;padding:11px 14px;margin-bottom:8px;cursor:pointer;font-size:14px;transition:all .12s;font-family:inherit}
  .opt:hover{border-color:var(--acc)}
  .opt.correct{background:rgba(62,207,142,.15);border-color:var(--good);color:var(--good);font-weight:700}
  .opt.wrong{background:rgba(255,107,129,.13);border-color:var(--bad);color:var(--bad)}
  .opt:disabled{cursor:default}
  .explain{font-size:13px;color:var(--mut);margin-top:6px;padding:9px 12px;background:var(--card2);
    border-left:3px solid var(--acc);border-radius:8px;display:none}
  .explain.show{display:block}
  .quiz-done{text-align:center;padding:16px}
  .quiz-done .score{font-size:34px;font-weight:800;background:linear-gradient(135deg,var(--good),var(--acc));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

  .speak-card{text-align:center;padding:22px 18px}
  .speak-target{font-size:20px;font-weight:700;margin:6px 0 4px}
  .speak-ko{color:var(--mut);font-size:13.5px;margin-bottom:16px}
  .mic{width:78px;height:78px;border-radius:50%;border:none;cursor:pointer;font-size:32px;color:#fff;
    background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:var(--shadow);transition:transform .12s}
  .mic:active{transform:scale(.9)}
  .mic.rec{animation:pulse 1s infinite;background:linear-gradient(135deg,var(--bad),#ff4d6d)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,129,.5)}70%{box-shadow:0 0 0 22px rgba(255,107,129,0)}100%{box-shadow:0 0 0 0 rgba(255,107,129,0)}}
  .heard{margin-top:16px;min-height:26px;font-size:15px}
  .heard b{color:var(--txt)}
  .speak-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
  .btn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:11px;
    padding:10px 16px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;transition:all .12s}
  .btn:hover{border-color:var(--acc)}
  .btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
  .btn:disabled{opacity:.4;cursor:default}
  .match-good{color:var(--good);font-weight:700}
  .match-bad{color:var(--bad)}
  .hint{font-size:12px;color:var(--muted2);margin-top:12px}
  .done-btn{display:block;width:100%;margin-top:6px;padding:13px;border-radius:13px;border:none;
    background:linear-gradient(135deg,var(--good),var(--acc));color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .unit-foot{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
  .footer-note{text-align:center;color:var(--muted2);font-size:11.5px;margin-top:24px;line-height:1.7}
  @media(max-width:520px){.wrap{padding:16px 12px 80px}.prog-wrap{min-width:92px}.search{top:66px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">🗣️</div>
    <div class="brand">
      <h1>Speak Up!</h1>
      <p>회화 중심 영문법 · 전체 <span id="totalCount">0</span>유닛</p>
    </div>
    <div class="prog-wrap">
      <small><span id="doneCount">0</span> / <span id="totalCount2">0</span> 완료</small>
      <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
    </div>
  </header>
  <main id="app"></main>
  <div class="footer-note">
    Grammar in Use Intermediate 커리큘럼(145유닛 · 16개 파트) 구성을 참고한 오리지널 학습 콘텐츠 ·
    발음 듣기 🔊 와 말하기 🎤 는 브라우저 음성 기능을 사용합니다 (Chrome 권장)
  </div>
</div>

<script type="application/json" id="unitData">[{"id":"u1","tag":"현재·과거","title":"지금 하는 중","en":"Present continuous (I am doing)","intro":"지금 이 순간 진행 중인 일을 말할 때 \u003cb>am/is/are + -ing\u003c/b>를 씁니다. 대화에서 \u003cb>What are you doing?\u003c/b>처럼 상대가 지금 뭘 하는지 물을 때 아주 자주 나옵니다.","patterns":[{"en":"I'm + -ing","ko":"나는 지금 ~하는 중이야"},{"en":"What are you doing?","ko":"너 지금 뭐 해?"},{"en":"He/She is + -ing","ko":"그/그녀는 지금 ~하는 중이야"}],"examples":[{"en":"I'm making coffee right now.","ko":"나 지금 커피 만드는 중이야."},{"en":"What are you doing this evening?","ko":"너 오늘 저녁에 뭐 해?"},{"en":"She's talking on the phone.","ko":"그녀는 지금 전화 통화 중이야."},{"en":"We're waiting for the bus.","ko":"우리는 버스를 기다리고 있어."}],"dialogue":[{"w":"A","en":"Hey, what are you doing?","ko":"야, 너 지금 뭐 해?"},{"w":"B","en":"I'm cooking dinner. Why?","ko":"나 저녁 요리하는 중이야. 왜?"},{"w":"A","en":"I'm heading to your place now.","ko":"나 지금 너희 집으로 가는 중이야."},{"w":"B","en":"Great, I'm setting the table.","ko":"좋아, 나 상 차리고 있어."}],"quiz":[{"q":"What ___ you doing right now?","opts":["are","do","is"],"a":0,"ex":"you와 함께 지금 진행 중이므로 are를 씁니다."},{"q":"그녀는 지금 자고 있어.","opts":["She sleeps.","She is sleeping.","She sleep."],"a":1,"ex":"지금 진행 중이므로 is + -ing 형태를 씁니다."},{"q":"We ___ watching a movie.","opts":["is","are","am"],"a":1,"ex":"We와 함께 쓰는 be동사는 are입니다."}],"speak":["I'm making coffee right now.","What are you doing this evening?","She's talking on the phone.","We're waiting for the bus."]},{"id":"u2","tag":"현재·과거","title":"평소에 하는 일","en":"Present simple (I do)","intro":"습관, 반복되는 일, 일반적인 사실을 말할 때 현재형을 씁니다. 주어가 3인칭 단수면 동사에 \u003cb>-s\u003c/b>를 붙이고, 의문·부정은 \u003cb>do/does\u003c/b>를 씁니다.","patterns":[{"en":"I/You/We + verb","ko":"나는/너는/우리는 ~해"},{"en":"He/She + verb-s","ko":"그/그녀는 ~해"},{"en":"Do/Does you...? / don't/doesn't","ko":"~해? / ~안 해"}],"examples":[{"en":"I usually get up at seven.","ko":"나는 보통 7시에 일어나."},{"en":"She works at a hospital.","ko":"그녀는 병원에서 일해."},{"en":"Do you drink coffee in the morning?","ko":"너 아침에 커피 마셔?"},{"en":"He doesn't eat meat.","ko":"그는 고기를 안 먹어."}],"dialogue":[{"w":"A","en":"What do you do on weekends?","ko":"너 주말에 뭐 해?"},{"w":"B","en":"I usually go hiking with my dad.","ko":"보통 아빠랑 등산 가."},{"w":"A","en":"Nice. Does he like it too?","ko":"좋다. 아빠도 좋아하셔?"},{"w":"B","en":"Yeah, but he doesn't wake up early.","ko":"응, 근데 아빠는 일찍 안 일어나셔."}],"quiz":[{"q":"She ___ to work by subway.","opts":["go","goes","going"],"a":1,"ex":"3인칭 단수 She이므로 goes를 씁니다."},{"q":"너 커피 마셔?","opts":["Do you drink coffee?","Are you drink coffee?","Does you drink coffee?"],"a":0,"ex":"you의 의문문은 Do you로 시작합니다."},{"q":"He ___ eat meat.","opts":["don't","doesn't","isn't"],"a":1,"ex":"3인칭 단수 부정은 doesn't를 씁니다."}],"speak":["I usually get up at seven.","She works at a hospital.","Do you drink coffee in the morning?","He doesn't eat meat."]},{"id":"u3","tag":"현재·과거","title":"지금 vs 평소","en":"Present continuous vs present simple 1","intro":"\u003cb>진행형\u003c/b>은 지금 이 순간 하는 일에, \u003cb>단순현재\u003c/b>는 평소·반복되는 일에 씁니다. want, know, like, believe 같은 \u003cb>상태동사\u003c/b>는 진행형으로 잘 쓰지 않습니다.","patterns":[{"en":"I'm doing (now) vs I do (usually)","ko":"지금 하는 중 vs 평소에 함"},{"en":"I know / I want (not -ing)","ko":"상태동사는 진행형 안 씀"},{"en":"right now vs every day","ko":"지금 vs 매일"}],"examples":[{"en":"I'm reading a book right now.","ko":"나 지금 책 읽고 있어."},{"en":"I read before bed every night.","ko":"나는 매일 밤 자기 전에 책을 읽어."},{"en":"I know the answer.","ko":"나 답 알아."},{"en":"She wants a cup of tea.","ko":"그녀는 차 한 잔을 원해."}],"dialogue":[{"w":"A","en":"Are you busy? What are you doing?","ko":"바빠? 지금 뭐 해?"},{"w":"B","en":"I'm studying, but I need a break.","ko":"공부 중인데, 좀 쉬어야겠어."},{"w":"A","en":"Do you want some coffee?","ko":"커피 좀 마실래?"},{"w":"B","en":"Yes, I really want one right now.","ko":"응, 지금 진짜 마시고 싶어."}],"quiz":[{"q":"Right now I ___ dinner.","opts":["cook","am cooking","cooks"],"a":1,"ex":"right now는 지금 진행이므로 am cooking입니다."},{"q":"나 답 알아. (상태동사)","opts":["I'm knowing the answer.","I know the answer.","I knows the answer."],"a":1,"ex":"know는 상태동사라 진행형을 쓰지 않습니다."},{"q":"I ___ to the gym every day.","opts":["am going","go","going"],"a":1,"ex":"every day는 습관이므로 단순현재 go를 씁니다."}],"speak":["I'm reading a book right now.","I read before bed every night.","I know the answer.","She wants a cup of tea."]},{"id":"u4","tag":"현재·과거","title":"생각과 불평","en":"Present continuous vs present simple 2","intro":"\u003cb>I think\u003c/b>는 의견을, \u003cb>I'm thinking\u003c/b>은 지금 머릿속으로 궁리 중임을 뜻해 의미가 다릅니다. 또 \u003cb>always + -ing\u003c/b>는 반복되는 일에 대한 불평을 나타냅니다.","patterns":[{"en":"I think (opinion) vs I'm thinking (considering)","ko":"의견 vs 궁리 중"},{"en":"always + -ing","ko":"맨날 ~해 (불평)"},{"en":"state vs action","ko":"상태 vs 동작"}],"examples":[{"en":"I think it's a great idea.","ko":"나는 그게 좋은 생각이라고 봐."},{"en":"I'm thinking about changing jobs.","ko":"나 이직할까 고민 중이야."},{"en":"You're always leaving your dishes in the sink.","ko":"넌 맨날 설거지를 안 하고 놔둬."},{"en":"He's always complaining about work.","ko":"그는 맨날 일에 대해 불평해."}],"dialogue":[{"w":"A","en":"What do you think of my plan?","ko":"내 계획 어떻게 생각해?"},{"w":"B","en":"I think it's good, but I'm thinking about the cost.","ko":"좋다고 생각해, 근데 비용을 고민 중이야."},{"w":"A","en":"You're always worrying about money.","ko":"넌 맨날 돈 걱정이야."},{"w":"B","en":"I know, but I want to be careful.","ko":"알아, 근데 신중하고 싶어."}],"quiz":[{"q":"나 이직 고민 중이야.","opts":["I think about a new job.","I'm thinking about a new job.","I thinks about a new job."],"a":1,"ex":"지금 궁리 중일 때는 I'm thinking을 씁니다."},{"q":"You're always ___ late!","opts":["arrive","arriving","arrives"],"a":1,"ex":"always + -ing로 반복되는 일에 대한 불평을 나타냅니다."},{"q":"I ___ you're right. (의견)","opts":["am thinking","think","thinks"],"a":1,"ex":"의견을 말할 때는 단순현재 I think를 씁니다."}],"speak":["I think it's a great idea.","I'm thinking about changing jobs.","You're always leaving your dishes in the sink.","He's always complaining about work."]},{"id":"u5","tag":"현재·과거","title":"이미 끝난 과거","en":"Past simple (I did)","intro":"이미 끝난 과거의 일을 말할 때 씁니다. 규칙동사는 \u003cb>-ed\u003c/b>를 붙이고 불규칙동사는 형태가 바뀌며, 의문·부정에는 \u003cb>did\u003c/b>를 씁니다.","patterns":[{"en":"verb-ed / irregular","ko":"규칙 -ed / 불규칙"},{"en":"Did you...?","ko":"너 ~했어?"},{"en":"didn't + verb","ko":"~안 했어"}],"examples":[{"en":"I watched a movie last night.","ko":"나 어젯밤에 영화 봤어."},{"en":"We went to Busan last weekend.","ko":"우리 지난 주말에 부산에 갔어."},{"en":"Did you finish your homework?","ko":"너 숙제 다 했어?"},{"en":"I didn't sleep well.","ko":"나 잘 못 잤어."}],"dialogue":[{"w":"A","en":"How was your weekend?","ko":"주말 어땠어?"},{"w":"B","en":"I visited my grandma in the countryside.","ko":"시골에 계신 할머니 뵈러 갔어."},{"w":"A","en":"Nice! Did you have a good time?","ko":"좋다! 즐거웠어?"},{"w":"B","en":"Yeah, but I didn't get much sleep.","ko":"응, 근데 잠은 별로 못 잤어."}],"quiz":[{"q":"I ___ a great movie yesterday.","opts":["watch","watched","watching"],"a":1,"ex":"yesterday는 과거이므로 watched를 씁니다."},{"q":"너 아침 먹었어?","opts":["Did you eat breakfast?","Do you ate breakfast?","Are you eat breakfast?"],"a":0,"ex":"과거 의문문은 Did you + 동사원형입니다."},{"q":"We ___ go to school on Sunday.","opts":["don't","didn't","doesn't"],"a":1,"ex":"과거 부정은 didn't + 동사원형입니다."}],"speak":["I watched a movie last night.","We went to Busan last weekend.","Did you finish your homework?","I didn't sleep well."]},{"id":"u6","tag":"현재·과거","title":"그때 하던 중","en":"Past continuous (I was doing)","intro":"과거의 특정 시점에 진행 중이던 일을 말할 때 \u003cb>was/were + -ing\u003c/b>를 씁니다. \u003cb>when\u003c/b> 뒤에는 과거단순(짧은 사건), \u003cb>while\u003c/b> 뒤에는 과거진행(길게 이어진 일)이 자주 옵니다.","patterns":[{"en":"I was + -ing","ko":"나는 ~하고 있었어"},{"en":"when + past simple","ko":"~했을 때 (짧은 사건)"},{"en":"while + past continuous","ko":"~하는 동안 (진행)"}],"examples":[{"en":"I was taking a shower when you called.","ko":"네가 전화했을 때 나 샤워 중이었어."},{"en":"They were watching TV at nine last night.","ko":"그들은 어젯밤 9시에 TV를 보고 있었어."},{"en":"While I was cooking, the phone rang.","ko":"내가 요리하는 동안 전화가 울렸어."},{"en":"What were you doing at midnight?","ko":"너 자정에 뭐 하고 있었어?"}],"dialogue":[{"w":"A","en":"I called you last night, but you didn't answer.","ko":"어젯밤에 전화했는데 안 받더라."},{"w":"B","en":"Sorry, I was sleeping when you called.","ko":"미안, 네가 전화했을 때 자고 있었어."},{"w":"A","en":"Oh, what were you doing before that?","ko":"아, 그 전엔 뭐 하고 있었어?"},{"w":"B","en":"I was studying while my roommate was cooking.","ko":"룸메이트가 요리하는 동안 나는 공부하고 있었어."}],"quiz":[{"q":"I ___ dinner when you arrived.","opts":["cook","was cooking","cooks"],"a":1,"ex":"과거 그 시점에 진행 중이던 일이므로 was cooking입니다."},{"q":"네가 전화했을 때 나 자고 있었어.","opts":["I slept when you called.","I was sleeping when you called.","I am sleeping when you called."],"a":1,"ex":"진행 중이던 일은 was + -ing, 짧은 사건은 when + 과거단순입니다."},{"q":"The phone rang ___ I was cooking.","opts":["while","when","did"],"a":0,"ex":"진행 중인 일에는 while을 자주 씁니다."}],"speak":["I was taking a shower when you called.","They were watching TV at nine last night.","While I was cooking, the phone rang.","What were you doing at midnight?"]},{"id":"u7","tag":"완료시제","title":"현재완료 1","en":"Present perfect 1 (I have done)","intro":"현재완료는 \u003cb>have/has + 과거분사(p.p.)\u003c/b> 형태로, 과거에 일어난 일이 지금 결과나 영향을 남길 때 씁니다. just(방금), already(이미), yet(아직)과 자주 함께 쓰여 대화에서 방금 끝난 일을 전할 때 아주 유용합니다.","patterns":[{"en":"I have just finished my homework.","ko":"나 방금 숙제 끝냈어."},{"en":"She has already left.","ko":"그녀는 이미 떠났어."},{"en":"Have you eaten yet?","ko":"너 밥 먹었어 아직?"}],"examples":[{"en":"I have just talked to him.","ko":"나 방금 그와 얘기했어."},{"en":"We have already seen that movie.","ko":"우리 그 영화 이미 봤어."},{"en":"He hasn't called me yet.","ko":"그는 아직 나한테 전화 안 했어."},{"en":"I have lost my keys, so I can't get in.","ko":"열쇠를 잃어버려서 못 들어가."}],"dialogue":[{"w":"A","en":"Have you finished the report yet?","ko":"보고서 다 끝냈어?"},{"w":"B","en":"Yes, I have just sent it to you.","ko":"응, 방금 너한테 보냈어."},{"w":"A","en":"Great, but I haven't received it yet.","ko":"좋아, 근데 아직 못 받았는데."},{"w":"B","en":"Oh, check again. I have already resent it.","ko":"아, 다시 확인해봐. 이미 다시 보냈어."}],"quiz":[{"q":"I have ___ finished lunch. (방금)","opts":["just","yet","ago"],"a":0,"ex":"just는 '방금'이라는 뜻으로 현재완료와 잘 쓰입니다."},{"q":"Have you called her ___?","opts":["already","yet","just"],"a":1,"ex":"의문문에서 '아직'은 문장 끝에 yet을 씁니다."},{"q":"'그는 이미 떠났어'를 영어로?","opts":["He has already left.","He leaves already.","He is already left."],"a":0,"ex":"have/has + 과거분사(left)로 현재완료를 만듭니다."}],"speak":["I have just woken up.","She has already gone home.","Have you finished yet?","I haven't decided yet."]},{"id":"u8","tag":"완료시제","title":"현재완료 경험","en":"Present perfect 2 (experience)","intro":"현재완료는 지금까지 살면서 해본 \u003cb>경험\u003c/b>을 말할 때도 씁니다. ever(한 번이라도), never(한 번도 안), before(전에)와 함께 자주 쓰며, \u003cb>gone to\u003c/b>(가서 아직 없음)와 \u003cb>been to\u003c/b>(가봤다, 지금은 돌아옴)를 구분하는 게 중요합니다.","patterns":[{"en":"Have you ever been to Japan?","ko":"일본에 가본 적 있어?"},{"en":"I have never tried sushi.","ko":"나 초밥 한 번도 안 먹어봤어."},{"en":"He has gone to the store.","ko":"그는 가게에 갔어 (지금 없어)."}],"examples":[{"en":"I have been to Paris twice.","ko":"나 파리에 두 번 가봤어."},{"en":"Have you ever seen a whale?","ko":"고래 본 적 있어?"},{"en":"She has never eaten Korean food before.","ko":"그녀는 전에 한국 음식을 한 번도 안 먹어봤어."},{"en":"My dad has gone to work.","ko":"우리 아빠는 일하러 가셨어 (지금 안 계셔)."}],"dialogue":[{"w":"A","en":"Have you ever been to New York?","ko":"뉴욕 가본 적 있어?"},{"w":"B","en":"No, I have never traveled to the US.","ko":"아니, 미국은 한 번도 안 가봤어."},{"w":"A","en":"Really? I have been there three times.","ko":"정말? 나는 거기 세 번 가봤어."},{"w":"B","en":"Wow, you have seen a lot of places!","ko":"와, 너 진짜 많은 곳을 봤구나!"}],"quiz":[{"q":"Have you ___ ridden a horse?","opts":["ever","yet","just"],"a":0,"ex":"경험을 묻는 의문문에서 '한 번이라도'는 ever를 씁니다."},{"q":"He isn't here. He has ___ to the bank.","opts":["been","gone","went"],"a":1,"ex":"지금 자리에 없으면 gone to(가서 없음)를 씁니다."},{"q":"'나 그 영화 전에 본 적 있어'를 영어로?","opts":["I have seen it before.","I saw it before now.","I have see it before."],"a":0,"ex":"경험은 have + 과거분사(seen)로 표현합니다."}],"speak":["I have never been abroad.","Have you ever tried Thai food?","She has been to London before.","He has gone to the airport."]},{"id":"u9","tag":"완료시제","title":"현재완료진행","en":"Present perfect continuous (I have been doing)","intro":"현재완료진행은 \u003cb>have/has been + -ing\u003c/b> 형태로, 과거부터 최근까지 \u003cb>계속 이어온 동작\u003c/b>을 강조합니다. How long(얼마나 오래)과 함께 자주 쓰며, 지금도 하고 있거나 방금까지 하던 일을 말할 때 씁니다.","patterns":[{"en":"I have been studying English for two hours.","ko":"나 두 시간째 영어 공부하고 있어."},{"en":"How long have you been waiting?","ko":"얼마나 오래 기다린 거야?"},{"en":"It has been raining all day.","ko":"하루 종일 비가 오고 있어."}],"examples":[{"en":"She has been working here since 2020.","ko":"그녀는 2020년부터 여기서 일해오고 있어."},{"en":"We have been living in Seoul for five years.","ko":"우리는 서울에서 5년째 살고 있어."},{"en":"You look tired. Have you been running?","ko":"너 피곤해 보여. 달리기 하고 있었어?"},{"en":"They have been talking on the phone for an hour.","ko":"그들은 한 시간째 통화하고 있어."}],"dialogue":[{"w":"A","en":"You look exhausted. What have you been doing?","ko":"너 완전 지쳐 보여. 뭐 하고 있었어?"},{"w":"B","en":"I have been cleaning the house all morning.","ko":"아침 내내 집 청소하고 있었어."},{"w":"A","en":"Wow, how long have you been cleaning?","ko":"와, 얼마나 오래 청소한 거야?"},{"w":"B","en":"For about four hours. I need a break.","ko":"약 네 시간째야. 좀 쉬어야겠어."}],"quiz":[{"q":"I have been ___ TV for two hours.","opts":["watching","watch","watched"],"a":0,"ex":"have been 뒤에는 -ing 형태가 옵니다."},{"q":"How long have you ___ learning the piano?","opts":["been","being","be"],"a":0,"ex":"현재완료진행은 have/has been + -ing입니다."},{"q":"'비가 계속 오고 있어'를 영어로?","opts":["It has been raining.","It is been raining.","It has raining."],"a":0,"ex":"has been + -ing로 최근까지 이어진 동작을 나타냅니다."}],"speak":["I have been working all day.","How long have you been here?","She has been studying hard.","It has been snowing since noon."]},{"id":"u10","tag":"완료시제","title":"진행 vs 완료","en":"Present perfect continuous vs simple","intro":"\u003cb>have been doing\u003c/b>은 동작의 \u003cb>진행·과정\u003c/b>을 강조하고, \u003cb>have done\u003c/b>은 동작의 \u003cb>완료·결과\u003c/b>를 강조합니다. 얼마나 오래 했는지엔 진행형을, 몇 개를 끝냈는지 결과엔 완료형을 씁니다.","patterns":[{"en":"I have been reading this book.","ko":"나 이 책 읽고 있었어 (과정)."},{"en":"I have read this book.","ko":"나 이 책 다 읽었어 (완료)."},{"en":"She has been painting all day.","ko":"그녀는 하루 종일 페인트칠하고 있어."}],"examples":[{"en":"He has been writing emails all morning.","ko":"그는 아침 내내 이메일을 쓰고 있어 (과정)."},{"en":"He has written ten emails today.","ko":"그는 오늘 이메일을 열 개 썼어 (결과)."},{"en":"We have been cooking for the party.","ko":"우리는 파티를 위해 요리하고 있어 (과정)."},{"en":"We have cooked enough food for everyone.","ko":"우리는 모두를 위한 음식을 충분히 만들었어 (결과)."}],"dialogue":[{"w":"A","en":"You have paint on your hands. What have you been doing?","ko":"손에 페인트 묻었네. 뭐 하고 있었어?"},{"w":"B","en":"I have been painting my room all day.","ko":"하루 종일 방 페인트칠하고 있었어."},{"w":"A","en":"Nice! Have you finished it?","ko":"멋지다! 다 끝냈어?"},{"w":"B","en":"Yes, I have painted three walls already.","ko":"응, 벽 세 개 이미 다 칠했어."}],"quiz":[{"q":"I have ___ five pages so far. (결과)","opts":["read","been reading","reading"],"a":0,"ex":"몇 페이지를 끝냈는지 결과는 완료형 have read를 씁니다."},{"q":"My hands are dirty. I have been ___ the car.","opts":["washing","washed","wash"],"a":0,"ex":"과정·이유를 강조할 때 have been + -ing를 씁니다."},{"q":"'그녀는 편지 세 통을 다 썼어'를 영어로?","opts":["She has written three letters.","She has been writing three letters.","She has write three letters."],"a":0,"ex":"완료된 개수 결과는 완료형 has written을 씁니다."}],"speak":["I have been fixing my bike.","I have fixed the problem.","She has been cleaning all day.","She has cleaned the whole house."]},{"id":"u11","tag":"완료시제","title":"How long 질문","en":"How long have you (been) ...?","intro":"\u003cb>How long have you been -ing?\u003c/b> 또는 \u003cb>How long have you + 과거분사?\u003c/b>로 어떤 일을 얼마나 오래 해왔는지 묻습니다. 상태에는 완료형, 계속되는 동작에는 완료진행형을 쓰며, 대답엔 보통 for나 since를 씁니다.","patterns":[{"en":"How long have you been learning English?","ko":"영어 배운 지 얼마나 됐어?"},{"en":"How long have you known her?","ko":"그녀를 안 지 얼마나 됐어?"},{"en":"How long have you lived here?","ko":"여기 산 지 얼마나 됐어?"}],"examples":[{"en":"How long have you been waiting for me?","ko":"나 얼마나 오래 기다렸어?"},{"en":"How long have you had that car?","ko":"그 차 산 지 얼마나 됐어?"},{"en":"How long have you been working out?","ko":"운동한 지 얼마나 됐어?"},{"en":"How long have you two been friends?","ko":"너희 둘 친구 된 지 얼마나 됐어?"}],"dialogue":[{"w":"A","en":"How long have you been playing the guitar?","ko":"기타 친 지 얼마나 됐어?"},{"w":"B","en":"I have been playing for about three years.","ko":"한 3년째 치고 있어."},{"w":"A","en":"That's cool! How long have you known Mike?","ko":"멋지다! 마이크는 안 지 얼마나 됐어?"},{"w":"B","en":"I have known him since high school.","ko":"고등학교 때부터 알았어."}],"quiz":[{"q":"How long have you ___ studying?","opts":["been","being","be"],"a":0,"ex":"완료진행 질문은 have you been + -ing 형태입니다."},{"q":"How long have you ___ in this city?","opts":["lived","living","live"],"a":0,"ex":"have you + 과거분사(lived)로 얼마나 오래인지 묻습니다."},{"q":"'그를 안 지 얼마나 됐어?'를 영어로?","opts":["How long have you known him?","How long do you know him?","How long you have known him?"],"a":0,"ex":"How long have you + 과거분사(known)로 묻습니다."}],"speak":["How long have you been waiting?","How long have you lived here?","How long have you known each other?","How long have you been studying English?"]},{"id":"u12","tag":"완료시제","title":"for와 since","en":"For and since","intro":"\u003cb>for\u003c/b>는 기간의 길이(two years, an hour), \u003cb>since\u003c/b>는 시작 시점(2020, Monday)과 함께 씁니다. 시작 시점을 물을 땐 \u003cb>When ...?\u003c/b>, 얼마나 오래인지 물을 땐 \u003cb>How long ...?\u003c/b>을 씁니다.","patterns":[{"en":"I have lived here for ten years.","ko":"나 여기 10년째 살고 있어."},{"en":"I have lived here since 2015.","ko":"나 2015년부터 여기 살고 있어."},{"en":"When did you move here?","ko":"언제 여기로 이사 왔어?"}],"examples":[{"en":"She has worked there for five months.","ko":"그녀는 거기서 다섯 달째 일하고 있어."},{"en":"We have been friends since childhood.","ko":"우리는 어릴 때부터 친구야."},{"en":"I haven't seen him for a long time.","ko":"나 그를 오랫동안 못 봤어."},{"en":"He has been sick since Monday.","ko":"그는 월요일부터 아팠어."}],"dialogue":[{"w":"A","en":"How long have you been studying Korean?","ko":"한국어 공부한 지 얼마나 됐어?"},{"w":"B","en":"I have been studying it for two years.","ko":"2년째 공부하고 있어."},{"w":"A","en":"When did you start?","ko":"언제 시작했어?"},{"w":"B","en":"I have studied it since college.","ko":"대학교 때부터 공부했어."}],"quiz":[{"q":"I have known her ___ 2018.","opts":["for","since","from"],"a":1,"ex":"since는 시작 시점(2018) 앞에 씁니다."},{"q":"We have waited ___ two hours.","opts":["since","for","in"],"a":1,"ex":"for는 기간의 길이(two hours) 앞에 씁니다."},{"q":"얼마나 오래 했는지 물을 때 알맞은 것은?","opts":["How long ...?","When ...?","What time ...?"],"a":0,"ex":"기간을 물을 땐 How long, 시점을 물을 땐 When을 씁니다."}],"speak":["I have been here for an hour.","She has worked here since May.","We have known each other for years.","When did you start learning it?"]},{"id":"u13","tag":"완료시제","title":"현재완료 vs 과거1","en":"Present perfect vs past 1","intro":"언제 했는지 시점이 안 중요하고 \u003cb>지금의 결과\u003c/b>가 중요하면 have done을 써요. 하지만 yesterday처럼 끝난 과거 시점이 나오면 did(과거)를 써야 해요.","patterns":[{"en":"I have finished my homework.","ko":"나 숙제 다 끝냈어."},{"en":"I finished it yesterday.","ko":"나 그거 어제 끝냈어."},{"en":"Have you ever been to Japan?","ko":"일본 가 본 적 있어?"}],"examples":[{"en":"I have lost my keys, so I can't get in.","ko":"열쇠를 잃어버려서 못 들어가."},{"en":"I lost my keys last night.","ko":"어젯밤에 열쇠를 잃어버렸어."},{"en":"She has already left the office.","ko":"그녀는 벌써 사무실을 나갔어."},{"en":"He called me two hours ago.","ko":"그는 두 시간 전에 나한테 전화했어."}],"dialogue":[{"w":"A","en":"Have you seen my phone anywhere?","ko":"내 폰 어디서 못 봤어?"},{"w":"B","en":"You left it on the table this morning.","ko":"너 오늘 아침에 테이블 위에 뒀잖아."},{"w":"A","en":"Oh, I have found it now. Thanks!","ko":"아, 이제 찾았어. 고마워!"},{"w":"B","en":"No problem, it was right there.","ko":"천만에, 바로 거기 있었어."}],"quiz":[{"q":"I ___ my wallet yesterday.","opts":["lost","have lost","lose"],"a":0,"ex":"yesterday(끝난 과거 시점)가 있으면 과거형."},{"q":"She ___ finished her report already.","opts":["did","has","was"],"a":1,"ex":"already와 함께 현재완료 has finished."},{"q":"'너 그 영화 본 적 있어?' -> ?","opts":["Did you ever see that movie now?","Have you ever seen that movie?","Are you seeing that movie?"],"a":1,"ex":"경험을 물을 때 Have you ever seen."}],"speak":["I have finished my work.","I finished it yesterday.","Have you ever tried this?","She has already gone home."]},{"id":"u14","tag":"완료시제","title":"현재완료 vs 과거2","en":"Present perfect vs past 2","intro":"today, this week처럼 \u003cb>아직 끝나지 않은 기간\u003c/b> 안의 일은 현재완료로 말할 수 있어요. 하지만 last week처럼 명확히 끝난 과거 시점은 과거형을 써요.","patterns":[{"en":"I have had three coffees today.","ko":"나 오늘 커피 세 잔 마셨어."},{"en":"I drank a lot last night.","ko":"나 어젯밤에 많이 마셨어."},{"en":"We have been busy this week.","ko":"우리 이번 주 바빴어."}],"examples":[{"en":"I have called her twice this morning.","ko":"오늘 아침에 그녀에게 두 번 전화했어."},{"en":"I called her twice yesterday morning.","ko":"어제 아침에 그녀에게 두 번 전화했어."},{"en":"Have you eaten anything today?","ko":"오늘 뭐라도 먹었어?"},{"en":"Did you eat well last weekend?","ko":"지난 주말에 잘 먹었어?"}],"dialogue":[{"w":"A","en":"Have you seen Mia this week?","ko":"이번 주에 미아 봤어?"},{"w":"B","en":"Yes, we had lunch on Monday.","ko":"응, 월요일에 점심 같이 먹었어."},{"w":"A","en":"I haven't talked to her this week at all.","ko":"난 이번 주에 그녀랑 얘기도 못 했어."},{"w":"B","en":"You should call her today then.","ko":"그럼 오늘 전화해 봐."}],"quiz":[{"q":"I ___ two meetings today.","opts":["have had","had have","having"],"a":0,"ex":"today(진행 중인 기간)에는 현재완료 have had."},{"q":"We ___ a great time last summer.","opts":["have had","had","have"],"a":1,"ex":"last summer는 끝난 과거이므로 had."},{"q":"'오늘 그를 봤어?' -> ?","opts":["Did you see him today?","Have you seen him today?","Are you seeing him?"],"a":1,"ex":"today와 함께 Have you seen him today가 자연스러워요."}],"speak":["I have been busy this week.","I was busy last week.","Have you had lunch today?","We finished the project last month."]},{"id":"u15","tag":"완료시제","title":"과거완료","en":"Past perfect (I had done)","intro":"과거의 \u003cb>어떤 시점보다 더 이전\u003c/b>에 일어난 일을 말할 때 had + 과거분사를 써요. 두 사건의 순서를 분명하게 보여줄 때 유용해요.","patterns":[{"en":"The train had already left when I arrived.","ko":"내가 도착했을 때 기차는 이미 떠났었어."},{"en":"She had never seen snow before that day.","ko":"그녀는 그날 전에는 눈을 본 적이 없었어."},{"en":"I knew I had met him somewhere.","ko":"그를 어디선가 만난 적이 있다는 걸 알았어."}],"examples":[{"en":"When we got there, the movie had started.","ko":"우리가 도착했을 때 영화는 이미 시작했었어."},{"en":"He had finished dinner before I called.","ko":"내가 전화하기 전에 그는 저녁을 다 먹었었어."},{"en":"I couldn't pay because I had left my wallet at home.","ko":"지갑을 집에 두고 와서 계산을 못 했어."},{"en":"They had lived there for years before moving.","ko":"그들은 이사하기 전에 거기서 몇 년을 살았었어."}],"dialogue":[{"w":"A","en":"Why were you so late to the party?","ko":"파티에 왜 그렇게 늦었어?"},{"w":"B","en":"By the time I got there, everyone had left.","ko":"내가 도착했을 땐 다들 떠났더라고."},{"w":"A","en":"Really? Had the food gone too?","ko":"정말? 음식도 없어졌었어?"},{"w":"B","en":"Yeah, they had eaten everything already.","ko":"응, 이미 다 먹어치웠더라."}],"quiz":[{"q":"When I arrived, the bus ___ already left.","opts":["has","had","have"],"a":1,"ex":"과거보다 더 이전 -> had left."},{"q":"She ___ never flown before that trip.","opts":["had","has","did"],"a":0,"ex":"그 여행 전(과거의 더 이전) -> had never flown."},{"q":"'내가 도착하기 전에 그는 떠났었다' -> ?","opts":["He leaves before I arrived.","He had left before I arrived.","He has left before I arrive."],"a":1,"ex":"먼저 일어난 일에 had left."}],"speak":["The train had already left.","I had never seen it before.","She had finished before I came.","They had left when I called."]},{"id":"u16","tag":"완료시제","title":"과거완료 진행","en":"Past perfect continuous (I had been doing)","intro":"과거의 어떤 시점 \u003cb>이전부터 계속 이어지던\u003c/b> 동작을 말할 때 had been + -ing를 써요. 얼마나 오래 하고 있었는지 강조할 때 좋아요.","patterns":[{"en":"I had been waiting for an hour when she came.","ko":"그녀가 왔을 때 난 한 시간째 기다리고 있었어."},{"en":"He was tired because he had been working all day.","ko":"그는 하루 종일 일해서 피곤했어."},{"en":"They had been living there before I met them.","ko":"그들은 내가 만나기 전부터 거기 살고 있었어."}],"examples":[{"en":"My eyes hurt because I had been reading too long.","ko":"너무 오래 읽어서 눈이 아팠어."},{ 미래완료","en":"will be doing and will have done","intro":"미래의 어느 시점에 진행 중일 일은 \u003cb>will be + -ing\u003c/b>로 말해요. 그 시점까지 끝나 있을 일은 \u003cb>will have + p.p.\u003c/b>를 씁니다.","patterns":[{"en":"This time tomorrow, I'll be flying to Paris.","ko":"내일 이맘때면 나 파리로 날아가는 중일 거야."},{"en":"By next year, I'll have finished my degree.","ko":"내년쯤이면 나 학위를 마쳤을 거야."},{"en":"She'll be working at nine tonight.","ko":"그녀는 오늘 밤 9시에 일하고 있을 거야."}],"examples":[{"en":"Don't call at eight. I'll be having dinner.","ko":"8시엔 전화하지 마. 저녁 먹고 있을 거야."},{"en":"By Friday, we'll have moved into the new house.","ko":"금요일쯤이면 우리 새 집으로 이사했을 거야."},{"en":"This time next week, you'll be relaxing on a beach.","ko":"다음 주 이맘때면 넌 해변에서 쉬고 있을 거야."},{"en":"By 2030, they'll have built the new bridge.","ko":"2030년쯤이면 그들은 새 다리를 다 지었을 거야."}],"dialogue":[{"w":"A","en":"Can we meet at noon tomorrow?","ko":"내일 정오에 만날 수 있어?"},{"w":"B","en":"Sorry, I'll be giving a presentation then.","ko":"미안, 그때 발표하고 있을 거야."},{"w":"A","en":"How about later in the day?","ko":"그날 좀 늦게는 어때?"},{"w":"B","en":"By three, I'll have finished everything.","ko":"3시쯤이면 다 끝냈을 거야."}],"quiz":[{"q":"미래의 특정 시점에 진행 중일 일을 말할 때?","opts":["I'll work at nine.","I'll be working at nine.","I work at nine now."],"a":1,"ex":"미래진행은 will be + -ing로 말해요."},{"q":"미래 시점까지 완료될 일을 말할 때?","opts":["I'll have finished by Friday.","I'll finishing by Friday.","I finish by Friday now."],"a":0,"ex":"미래완료는 will have + 과거분사로 표현해요."},{"q":"빈칸: By next month, we ___ saved enough.","opts":["will have","will be","are"],"a":0,"ex":"완료를 나타내므로 will have saved가 맞아요."}],"speak":["I'll be studying all evening.","By ten, I'll have gone to bed.","This time tomorrow, we'll be driving south.","By June, she'll have graduated."]},{"id":"u25","tag":"미래","title":"when과 if 절","en":"When I do / When I've done; when and if","intro":"시간이나 조건을 나타내는 절에서는 미래라도 \u003cb>현재형\u003c/b>으로 말해요. \u003cb>when\u003c/b>은 확실히 일어날 일, \u003cb>if\u003c/b>는 일어날지 모르는 일에 씁니다.","patterns":[{"en":"I'll call you when I get home.","ko":"집에 도착하면 전화할게."},{"en":"When I've finished, I'll let you know.","ko":"다 끝내면 알려줄게."},{"en":"If it rains, we'll stay inside.","ko":"비가 오면 우리 안에 있을 거야."}],"examples":[{"en":"Text me when you arrive at the station.","ko":"역에 도착하면 문자해."},{"en":"When I have time, I'll fix the sink.","ko":"시간 나면 싱크대 고칠게."},{"en":"If you need help, just ask me.","ko":"도움이 필요하면 그냥 나한테 물어봐."},{"en":"We'll start when everyone is ready.","ko":"다들 준비되면 시작할게."}],"dialogue":[{"w":"A","en":"When will you send the report?","ko":"보고서 언제 보낼 거야?"},{"w":"B","en":"I'll send it when I finish it.","ko":"다 끝내면 보낼게."},{"w":"A","en":"Okay. What if you need more time?","ko":"알았어. 시간이 더 필요하면?"},{"w":"B","en":"If I do, I'll tell you right away.","ko":"그러면 바로 말할게."}],"quiz":[{"q":"시간 부사절에서 알맞은 형태는?","opts":["I'll call you when I will arrive.","I'll call you when I arrive.","I call you when I arrived."],"a":1,"ex":"when 절에서는 미래라도 현재형을 써요."},{"q":"확실히 일어날 일에 쓰는 단어는?","opts":["when","if","unless"],"a":0,"ex":"when은 반드시 일어날 일에 써요."},{"q":"일어날지 확실하지 않은 조건에 쓰는 것은?","opts":["If it rains, we'll cancel.","When it rains sure, we cancel.","If it will rain, we cancel."],"a":0,"ex":"불확실한 조건은 if를 쓰고, 조건절은 현재형이에요."}],"speak":["I'll text you when I leave.","When I've eaten, I'll help you.","If you're busy, we can meet later.","Call me if you get lost."]},{"id":"u26","tag":"조동사","title":"능력 표현","en":"Can, could and (be) able to","intro":"능력이나 가능성을 말할 때 씁니다. \u003cb>can\u003c/b>은 현재, \u003cb>could\u003c/b>는 과거의 일반적인 능력을 나타내요. 특정 상황에서 실제로 해낸 일은 \u003cb>was/were able to\u003c/b>를 씁니다.","patterns":[{"en":"I can speak two languages.","ko":"저는 두 개 언어를 할 수 있어요."},{"en":"She could read when she was four.","ko":"그녀는 네 살 때 글을 읽을 수 있었어요."},{"en":"We were able to finish it on time.","ko":"우리는 제시간에 그것을 끝낼 수 있었어요."}],"examples":[{"en":"Can you help me for a minute?","ko":"잠깐 저를 도와줄 수 있어요?"},{"en":"My grandfather could run very fast.","ko":"우리 할아버지는 아주 빨리 달릴 수 있었어요."},{"en":"The fire spread quickly, but everyone was able to escape.","ko":"불이 빠르게 번졌지만 모두가 탈출할 수 있었어요."},{"en":"I can't drive, so I take the bus.","ko":"저는 운전을 못해서 버스를 타요."}],"dialogue":[{"w":"A","en":"Can you swim?","ko":"너 수영할 수 있어?"},{"w":"B","en":"Yes, I could swim before I could walk.","ko":"응, 걷기도 전에 수영할 수 있었어."},{"w":"A","en":"Wow, how far can you go now?","ko":"와, 지금은 얼마나 멀리 갈 수 있어?"},{"w":"B","en":"Last week I was able to swim a whole kilometer.","ko":"지난주에는 1킬로미터를 다 헤엄칠 수 있었어."}],"quiz":[{"q":"특정 상황에서 실제로 해낸 일을 말할 때 알맞은 표현은?","opts":["could","was able to","can"],"a":1,"ex":"실제로 성공한 일은 was/were able to를 씁니다."},{"q":"빈칸: When I was young, I ___ climb trees easily.","opts":["could","am able to","can"],"a":0,"ex":"과거의 일반적 능력은 could를 씁니다."},{"q":"빈칸: I ___ speak English now.","opts":["could","can","was able to"],"a":1,"ex":"현재 능력은 can을 씁니다."}],"speak":["I can cook simple meals.","She could sing very well as a child.","We were able to catch the last train.","Can you open this window?"]},{"id":"u27","tag":"조동사","title":"가능성과 후회","en":"Could (do) and could have (done)","intro":"\u003cb>could + 동사원형\u003c/b>은 지금이나 미래의 가능성을 뜻해요. \u003cb>could have + 과거분사\u003c/b>는 과거에 할 수 있었지만 실제로는 하지 않은 일을 나타냅니다.","patterns":[{"en":"We could go to the beach tomorrow.","ko":"우리 내일 해변에 갈 수도 있어요."},{"en":"You could have called me.","ko":"너 나한테 전화할 수도 있었잖아."},{"en":"I could help you if you want.","ko":"원하면 제가 도와줄 수 있어요."}],"examples":[{"en":"It could rain later, so take an umbrella.","ko":"이따 비가 올 수도 있으니 우산을 챙겨요."},{"en":"She could have won the race, but she stopped.","ko":"그녀는 경주에서 이길 수도 있었지만 멈췄어요."},{"en":"We could meet for coffee this weekend.","ko":"우리 이번 주말에 커피 마시러 만날 수도 있어요."},{"en":"You could have told me the truth.","ko":"너는 나에게 진실을 말할 수도 있었잖아."}],"dialogue":[{"w":"A","en":"What could we do this evening?","ko":"오늘 저녁에 우리 뭘 할 수 있을까?"},{"w":"B","en":"We could watch a movie at home.","ko":"집에서 영화 볼 수도 있지."},{"w":"A","en":"Good idea. I was so bored last night.","ko":"좋은 생각이야. 어젯밤엔 너무 심심했어."},{"w":"B","en":"You could have joined us at the park.","ko":"너 우리랑 공원에 올 수도 있었잖아."}],"quiz":[{"q":"'너 나한테 물어볼 수도 있었잖아'를 뜻하는 것은?","opts":["You could ask me.","You could have asked me.","You can ask me."],"a":1,"ex":"과거에 안 한 일은 could have done을 씁니다."},{"q":"빈칸: It ___ snow tonight.","opts":["could","could have","can have"],"a":0,"ex":"미래 가능성은 could + 동사원형입니다."},{"q":"could have done의 의미로 맞는 것은?","opts":["지금 하는 중","과거에 했으나 성공","과거에 할 수 있었으나 안 함"],"a":2,"ex":"could have done은 가능했지만 하지 않은 일입니다."}],"speak":["We could go for a walk now.","You could have waited for me.","It could be a great idea.","I could have finished it yesterday."]},{"id":"u28","tag":"조동사","title":"강한 추측","en":"Must and can't (deduction)","intro":"확실한 근거로 추측할 때 씁니다. \u003cb>must be\u003c/b>는 틀림없이 그렇다는 강한 확신, \u003cb>can't be\u003c/b>는 그럴 리 없다는 강한 부정을 나타내요.","patterns":[{"en":"You must be tired after that trip.","ko":"그 여행 뒤라 틀림없이 피곤하겠어요."},{"en":"That can't be true.","ko":"그건 사실일 리 없어요."},{"en":"He must know the answer.","ko":"그는 틀림없이 답을 알 거예요."}],"examples":[{"en":"The lights are off. They must be asleep.","ko":"불이 꺼져 있어요. 그들은 틀림없이 자고 있어요."},{"en":"She can't be at home; her car is gone.","ko":"그녀가 집에 있을 리 없어요. 차가 없어요."},{"en":"You must be joking!","ko":"너 틀림없이 농담하는 거지!"},{"en":"This can't be the right address.","ko":"이게 맞는 주소일 리 없어요."}],"dialogue":[{"w":"A","en":"Look, the shop is empty already.","ko":"봐, 가게가 벌써 비었어."},{"w":"B","en":"It must be closed for the day.","ko":"틀림없이 오늘 영업이 끝났나 봐."},{"w":"A","en":"But it's only five o'clock.","ko":"근데 이제 겨우 다섯 시야."},{"w":"B","en":"Then that sign can't be right.","ko":"그럼 저 안내판이 맞을 리가 없네."}],"quiz":[{"q":"'그가 부자일 리 없어'를 뜻하는 것은?","opts":["He must be rich.","He can't be rich.","He may be rich."],"a":1,"ex":"강한 부정 추측은 can't be입니다."},{"q":"빈칸: You've worked all day. You ___ be hungry.","opts":["can't","must","couldn't"],"a":1,"ex":"강한 확신 추측은 must be입니다."},{"q":"must be의 의미로 맞는 것은?","opts":["틀림없이 ~다","~해야만 한다(의무)","~일 리 없다"],"a":0,"ex":"여기서 must be는 강한 확신의 추측입니다."}],"speak":["You must be the new manager.","That can't be his brother.","They must be very happy today.","She can't be serious."]},{"id":"u29","tag":"조동사","title":"약한 추측 1","en":"May and might 1","intro":"확실하지 않은 일을 추측할 때 씁니다. \u003cb>may\u003c/b>와 \u003cb>might\u003c/b>는 '~일지도 모른다'라는 뜻으로, 현재나 미래의 가능성을 나타내요. 부정은 \u003cb>may not / might not\u003c/b>입니다.","patterns":[{"en":"It may rain this afternoon.","ko":"오후에 비가 올지도 몰라요."},{"en":"She might be late today.","ko":"그녀는 오늘 늦을지도 몰라요."},{"en":"I might not come to the party.","ko":"저는 파티에 안 갈지도 몰라요."}],"examples":[{"en":"He may know her phone number.","ko":"그는 그녀의 전화번호를 알지도 몰라요."},{"en":"We might go to Japan next year.","ko":"우리는 내년에 일본에 갈지도 몰라요."},{"en":"The store may not be open on Sunday.","ko":"그 가게는 일요일에 안 열지도 몰라요."},{"en":"This might be the best choice.","ko":"이게 최선의 선택일지도 몰라요."}],"dialogue":[{"w":"A","en":"Do you think Sam will call?","ko":"샘이 전화할 것 같아?"},{"w":"B","en":"He may call later tonight.","ko":"오늘 밤 늦게 전화할지도 몰라."},{"w":"A","en":"And if he doesn't?","ko":"만약 안 하면?"},{"w":"B","en":"Then he might be too busy at work.","ko":"그럼 회사에서 너무 바쁜 걸지도 몰라."}],"quiz":[{"q":"'그녀가 안 올지도 몰라'를 뜻하는 것은?","opts":["She might not come.","She can't come.","She must not come."],"a":0,"ex":"약한 부정 추측은 might not입니다."},{"q":"빈칸: It ___ be cold tomorrow.","opts":["may","must","can't"],"a":0,"ex":"불확실한 추측은 may를 씁니다."},{"q":"may/might의 의미로 맞는 것은?","opts":["틀림없이 ~다","~일지도 모른다","~일 리 없다"],"a":1,"ex":"may/might는 약한 추측입니다."}],"speak":["I may be free this weekend.","They might not agree with us.","It may take a few days.","She might know the answer."]},{"id":"u30","tag":"조동사","title":"약한 추측 2","en":"May and might 2","intro":"\u003cb>might be doing\u003c/b>은 지금이나 미래에 하고 있을 일을 추측해요. \u003cb>might as well\u003c/b>은 '차라리 ~하는 게 낫다', \u003cb>may/might have done\u003c/b>은 과거 일에 대한 추측입니다.","patterns":[{"en":"She might be sleeping now.","ko":"그녀는 지금 자고 있을지도 몰라요."},{"en":"We might as well take a taxi.","ko":"우리 차라리 택시를 타는 게 낫겠어요."},{"en":"He may have missed the bus.","ko":"그는 버스를 놓쳤을지도 몰라요."}],"examples":[{"en":"Don't call him; he might be driving.","ko":"그에게 전화하지 마요. 운전 중일지도 몰라요."},{"en":"It's raining, so we might as well stay home.","ko":"비가 오니 차라리 집에 있는 게 낫겠어요."},{"en":"They might have forgotten the meeting.","ko":"그들은 회의를 잊었을지도 몰라요."},{"en":"She may have left already.","ko":"그녀는 벌써 떠났을지도 몰라요."}],"dialogue":[{"w":"A","en":"Nobody is answering the door.","ko":"아무도 문을 안 여네."},{"w":"B","en":"They might be working in the garden.","ko":"정원에서 일하고 있을지도 몰라."},{"w":"A","en":"We've waited ten minutes already.","ko":"벌써 십 분이나 기다렸어."},{"w":"B","en":"We might as well come back later.","ko":"차라리 나중에 다시 오는 게 낫겠어."}],"quiz":[{"q":"'그는 열쇠를 잃어버렸을지도 몰라'를 뜻하는 것은?","opts":["He might lose his keys.","He might have lost his keys.","He must lose his keys."],"a":1,"ex":"과거 추측은 might have done입니다."},{"q":"빈칸: The bus is late. We ___ walk.","opts":["might as well","may have","might be"],"a":0,"ex":"'차라리 ~하는 게 낫다'는 might as well입니다."},{"q":"might be doing의 의미로 맞는 것은?","opts":["지금 ~하고 있을지도 모른다","~했어야 했다","~할 리 없다"],"a":0,"ex":"might be doing은 현재 진행 중인 일의 추측입니다."}],"speak":["She might be studying right now.","We might as well order some food.","He may have taken the wrong train.","They might have arrived early."]},{"id":"u31","tag":"조동사","title":"의무 표현","en":"Have to and must","intro":"의무를 말할 때 씁니다. \u003cb>have to\u003c/b>는 외부의 규칙이나 상황 때문에, \u003cb>must\u003c/b>는 화자의 강한 의지나 필요를 나타내요. 과거의 의무는 \u003cb>had to\u003c/b>를 씁니다.","patterns":[{"en":"I have to wear a uniform at work.","ko":"저는 직장에서 유니폼을 입어야 해요."},{"en":"You must see this movie.","ko":"너 이 영화 꼭 봐야 해."},{"en":"We had to wait for two hours.","ko":"우리는 두 시간을 기다려야 했어요."}],"examples":[{"en":"Students have to bring their ID cards.","ko":"학생들은 신분증을 가져와야 해요."},{"en":"I must call my mother tonight.","ko":"저는 오늘 밤 엄마에게 꼭 전화해야 해요."},{"en":"She had to leave early yesterday.","ko":"그녀는 어제 일찍 떠나야 했어요."},{"en":"Do you have to work on weekends?","ko":"주말에 일해야 해요?"}],"dialogue":[{"w":"A","en":"Why are you leaving so soon?","ko":"왜 이렇게 빨리 가?"},{"w":"B","en":"I have to catch the last train.","ko":"막차를 타야 하거든."},{"w":"A","en":"That's a pity. Text me when you arrive.","ko":"아쉽다. 도착하면 문자해."},{"w":"B","en":"I will. I really must sleep early tonight.","ko":"그럴게. 오늘 밤엔 정말 일찍 자야 해."}],"quiz":[{"q":"외부 규칙 때문에 지켜야 하는 의무에 알맞은 것은?","opts":["have to","may","could"],"a":0,"ex":"규칙이나 상황에 의한 의무는 have to를 씁니다."},{"q":"빈칸: Yesterday we ___ finish the report by five.","opts":["have to","had to","must"],"a":1,"ex":"과거의 의무는 had to를 씁니다."},{"q":"화자의 강한 의지를 담은 의무 표현은?","opts":["must","had to","have to"],"a":0,"ex":"화자의 강한 필요나 의지는 must로 표현합니다."}],"speak":["I have to finish my homework first.","You must be careful on the road.","We had to cancel the trip.","Does he have to go now?"]},{"id":"u32","tag":"조동사","title":"금지와 불필요","en":"Must, mustn't, needn't","intro":"\u003cb>mustn't\u003c/b>은 절대 하면 안 되는 \u003cb>금지\u003c/b>를 뜻하고, \u003cb>needn't\u003c/b>나 \u003cb>don't have to\u003c/b>는 안 해도 되는 \u003cb>불필요\u003c/b>를 뜻해요. 둘을 헷갈리면 의미가 정반대가 되니 조심하세요.","patterns":[{"en":"You mustn't ...","ko":"너는 ~하면 안 돼 (금지)"},{"en":"You needn't ... / don't have to ...","ko":"너는 ~하지 않아도 돼 (불필요)"}],"examples":[{"en":"You mustn't touch that button.","ko":"그 버튼을 만지면 안 돼요."},{"en":"You don't have to come if you're tired.","ko":"피곤하면 안 와도 돼요."},{"en":"We mustn't be late for the interview.","ko":"면접에 늦으면 안 돼요."},{"en":"You needn't worry about the money.","ko":"돈은 걱정 안 해도 돼요."}],"dialogue":[{"w":"A","en":"Should I bring my passport?","ko":"여권을 가져가야 하나요?"},{"w":"B","en":"You must bring it. You mustn't forget it.","ko":"꼭 가져가야 해요. 잊으면 안 돼요."},{"w":"A","en":"And do I have to print the ticket?","ko":"그리고 표를 인쇄해야 하나요?"},{"w":"B","en":"No, you needn't. Just show it on your phone.","ko":"아니요, 안 해도 돼요. 폰으로 보여주면 돼요."}],"quiz":[{"q":"'주차 금지'를 강하게 말할 때?","opts":["You mustn't park here.","You needn't park here.","You don't have to park here."],"a":0,"ex":"mustn't은 금지를 나타내요."},{"q":"'안 와도 된다'는 표현은?","opts":["You mustn't come.","You don't have to come.","You must come."],"a":1,"ex":"don't have to는 불필요예요."},{"q":"빈칸: You ___ worry, it's fine.","opts":["mustn't","needn't","must"],"a":1,"ex":"걱정할 필요 없다는 needn't."}],"speak":["You mustn't tell anyone.","You don't have to answer that.","We mustn't be late again.","You needn't bring anything."]},{"id":"u33","tag":"조동사","title":"조언할 때 should","en":"Should 1","intro":"\u003cb>should\u003c/b>와 \u003cb>ought to\u003c/b>는 조언이나 의견을 말할 때 써요. 뜻은 거의 같아요. 과거에 대해 \u003cb>should have done\u003c/b>이라고 하면 '했어야 했는데 안 했다'는 후회를 나타냅니다.","patterns":[{"en":"You should / ought to ...","ko":"너는 ~하는 게 좋아 (조언)"},{"en":"You should have (p.p.) ...","ko":"~했어야 했는데 (후회)"}],"examples":[{"en":"You should get more sleep.","ko":"잠을 더 자는 게 좋아요."},{"en":"You ought to see a doctor.","ko":"병원에 가보는 게 좋겠어요."},{"en":"I should have called you earlier.","ko":"더 일찍 전화했어야 했는데요."},{"en":"We shouldn't have spent so much.","ko":"그렇게 많이 쓰지 말았어야 했어요."}],"dialogue":[{"w":"A","en":"I'm so tired at work these days.","ko":"요즘 회사에서 너무 피곤해요."},{"w":"B","en":"You should go to bed earlier.","ko":"더 일찍 자는 게 좋겠어요."},{"w":"A","en":"You're right. I stayed up late again last night.","ko":"맞아요. 어젯밤에도 늦게까지 깨어 있었어요."},{"w":"B","en":"You shouldn't have watched that whole show.","ko":"그 드라마를 다 보지 말았어야 했어요."}],"quiz":[{"q":"조언을 뜻하는 문장은?","opts":["You should rest.","You mustn't rest.","You needn't rest."],"a":0,"ex":"should는 조언이에요."},{"q":"'전화했어야 했는데 안 했다'는?","opts":["I should call.","I should have called.","I shouldn't call."],"a":1,"ex":"should have p.p.는 과거 후회."},{"q":"ought to와 뜻이 같은 것은?","opts":["must","should","can"],"a":1,"ex":"ought to는 should와 비슷해요."}],"speak":["You should take a break.","You ought to apologize to her.","I should have listened to you.","We shouldn't have left so late."]},{"id":"u34","tag":"조동사","title":"제안 뒤의 should","en":"Should 2","intro":"\u003cb>suggest\u003c/b>, \u003cb>insist\u003c/b>, \u003cb>important that\u003c/b> 같은 제안·요구·중요를 나타내는 표현 뒤에는 \u003cb>should\u003c/b>를 쓸 수 있어요. \u003cb>It's strange that ... should\u003c/b>처럼 놀라움을 표현하기도 합니다.","patterns":[{"en":"I suggest that you should ...","ko":"나는 네가 ~하기를 제안해요"},{"en":"It's important that ... should ...","ko":"~하는 것이 중요해요"}],"examples":[{"en":"I suggest that we should leave now.","ko":"지금 출발하자고 제안해요."},{"en":"She insisted that he should stay.","ko":"그녀는 그가 머물러야 한다고 주장했어요."},{"en":"It's important that everyone should be on time.","ko":"모두가 시간을 지키는 게 중요해요."},{"en":"It's strange that she should say that.","ko":"그녀가 그런 말을 하다니 이상하네요."}],"dialogue":[{"w":"A","en":"The report is due tomorrow.","ko":"보고서가 내일까지예요."},{"w":"B","en":"I suggest that we should start now.","ko":"지금 시작하자고 제안해요."},{"w":"A","en":"Okay. Is it important that I should join too?","ko":"알겠어요. 저도 참여하는 게 중요한가요?"},{"w":"B","en":"Yes, the boss insisted that everyone should help.","ko":"네, 사장님이 모두 도와야 한다고 주장했어요."}],"quiz":[{"q":"'제안'을 나타내는 동사는?","opts":["suggest","enjoy","finish"],"a":0,"ex":"suggest 뒤에 should를 써요."},{"q":"빈칸: It's important that he ___ be here.","opts":["should","will","can"],"a":0,"ex":"important that 뒤엔 should."},{"q":"놀라움을 나타내는 표현은?","opts":["It's strange that she should say that.","She can say that.","She will say that."],"a":0,"ex":"strange that ... should는 놀라움."}],"speak":["I suggest that we should wait.","She insisted that I should apologize.","It's important that you should rest.","It's strange that he should refuse."]},{"id":"u35","tag":"조동사","title":"had better, 이제 할 때","en":"Had better; It's time ...","intro":"\u003cb>'d better\u003c/b>는 '안 그러면 문제가 생긴다'는 뜻의 강한 조언이에요. should보다 더 급하고 세죠. \u003cb>It's time you did ...\u003c/b>는 '이제 ~할 때다'라는 뜻으로 뒤에 과거형을 씁니다.","patterns":[{"en":"You'd better ...","ko":"~하는 게 좋을 거야 (안 그러면 문제)"},{"en":"It's time you did ...","ko":"이제 네가 ~할 때야"}],"examples":[{"en":"You'd better hurry, or we'll miss the train.","ko":"서두르는 게 좋아요, 안 그러면 기차를 놓쳐요."},{"en":"We'd better not tell him yet.","ko":"아직 그에게 말하지 않는 게 좋아요."},{"en":"It's time you found a new job.","ko":"이제 새 직장을 구할 때예요."},{"en":"It's time we went home.","ko":"이제 집에 갈 시간이에요."}],"dialogue":[{"w":"A","en":"The movie starts in ten minutes.","ko":"영화가 10분 뒤에 시작해요."},{"w":"B","en":"We'd better leave now, then.","ko":"그럼 지금 출발하는 게 좋겠어요."},{"w":"A","en":"You're right. I'm always so slow.","ko":"맞아요. 저는 늘 너무 느려요."},{"w":"B","en":"It's time you got a bit faster!","ko":"이제 좀 빨라질 때도 됐어요!"}],"quiz":[{"q":"'안 그러면 문제 생긴다'는 강한 조언은?","opts":["You'd better hurry.","You needn't hurry.","You may hurry."],"a":0,"ex":"'d better는 강한 조언."},{"q":"빈칸: It's time you ___ to bed.","opts":["go","went","will go"],"a":1,"ex":"It's time 뒤엔 과거형."},{"q":"'d better의 부정형은?","opts":["'d better not","don't better","not better"],"a":0,"ex":"had better not이 맞아요."}],"speak":["You'd better call her now.","We'd better not be late.","It's time you made a decision.","It's time we left."]},{"id":"u36","tag":"조동사","title":"would의 여러 쓰임","en":"Would","intro":"\u003cb>would\u003c/b>는 정중하거나 가정하는 상황에서 자주 써요. \u003cb>Would you like ...?\u003c/b>는 정중한 권유, \u003cb>I'd love to\u003c/b>는 기꺼이 하겠다는 뜻이에요. 과거의 반복된 습관을 말할 때 \u003cb>used to\u003c/b> 대신 쓰기도 합니다.","patterns":[{"en":"Would you like ...?","ko":"~드릴까요? / ~하시겠어요?"},{"en":"I would (often) ... / I'd love to","ko":"예전엔 ~하곤 했어요 / 정말 하고 싶어요"}],"examples":[{"en":"Would you like some coffee?","ko":"커피 좀 드릴까요?"},{"en":"I'd love to join you.","ko":"정말 함께하고 싶어요."},{"en":"When I was young, we would play outside all day.","ko":"어릴 때 우리는 하루 종일 밖에서 놀곤 했어요."},{"en":"It would be nice to travel more.","ko":"여행을 더 다니면 좋을 텐데요."}],"dialogue":[{"w":"A","en":"Would you like to have dinner with us?","ko":"저희와 저녁 드시겠어요?"},{"w":"B","en":"I'd love to. Thank you!","ko":"정말 좋아요. 고마워요!"},{"w":"A","en":"Great. My grandma would cook this every Sunday.","ko":"좋아요. 할머니가 일요일마다 이걸 요리하곤 하셨어요."},{"w":"B","en":"That sounds lovely. It would be nice to try it.","ko":"멋지네요. 맛보면 좋겠어요."}],"quiz":[{"q":"정중하게 권할 때?","opts":["Would you like some tea?","You must drink tea.","You needn't tea."],"a":0,"ex":"Would you like은 정중한 권유."},{"q":"'정말 하고 싶어요'는?","opts":["I'd love to.","I mustn't.","I'd better not."],"a":0,"ex":"I'd love to는 기꺼이 하겠다는 뜻."},{"q":"used to 대신 과거 습관을 나타내는 것은?","opts":["would","should","can"],"a":0,"ex":"would도 과거의 반복 습관을 나타내요."}],"speak":["Would you like something to drink?","I'd love to see you again.","We would visit the beach every summer.","It would be great to work together."]},{"id":"u37","tag":"조동사","title":"부탁과 제안, 허락","en":"Can/Could/Would you ...?","intro":"\u003cb>Can you ...?\u003c/b>와 \u003cb>Could you ...?\u003c/b>는 부탁할 때 써요. Could가 더 정중해요. \u003cb>Can I ...?\u003c/b>는 허락을 구하고, \u003cb>Would you like ...?\u003c/b>는 제안이나 초대에 씁니다.","patterns":[{"en":"Could you ...? / Can you ...?","ko":"~해 주시겠어요? (부탁)"},{"en":"Can I ...? / Would you like ...?","ko":"~해도 될까요? / ~하시겠어요?"}],"examples":[{"en":"Could you pass me the salt?","ko":"소금 좀 건네주시겠어요?"},{"en":"Can I open the window?","ko":"창문 좀 열어도 될까요?"},{"en":"Would you like to join us for lunch?","ko":"저희와 점심 함께하시겠어요?"},{"en":"Can I help you with that bag?","ko":"그 가방 도와드릴까요?"}],"dialogue":[{"w":"A","en":"Could you help me carry these boxes?","ko":"이 상자 옮기는 것 좀 도와주시겠어요?"},{"w":"B","en":"Sure. Can I put them in the car?","ko":"물론이죠. 차에 넣어도 될까요?"},{"w":"A","en":"Yes, please. And would you like some coffee after?","ko":"네, 부탁해요. 그리고 끝나고 커피 드시겠어요?"},{"w":"B","en":"That would be great, thanks!","ko":"그럼 정말 좋죠, 고마워요!"}],"quiz":[{"q":"가장 정중한 부탁은?","opts":["Could you help me?","Help me.","You must help me."],"a":0,"ex":"Could you가 가장 정중해요."},{"q":"허락을 구하는 표현은?","opts":["Can I sit here?","You needn't sit.","You'd better sit."],"a":0,"ex":"Can I ...?는 허락 요청."},{"q":"초대할 때 쓰는 표현은?","opts":["Would you like to come?","You mustn't come.","You should come or else."],"a":0,"ex":"Would you like은 초대·제안."}],"speak":["Could you say that again, please?","Can I use your phone?","Would you like to sit down?","Can I get you anything?"]},{"id":"u38","tag":"가정법","title":"현실 조건 vs 상상","en":"If I do ... vs If I did ...","intro":"\u003cb>If + 현재, will\u003c/b>은 일어날 수 있는 \u003cb>현실적인 조건\u003c/b>을 말해요. \u003cb>If + 과거, would\u003c/b>는 지금 사실과 다른 \u003cb>상상이나 가정\u003c/b>을 말할 때 써요. 예를 들어 If I have time, I will call you는 시간이 있을 수도 있는 현실이고, If I had time, I would call you는 사실은 시간이 없다는 뜻이에요.","patterns":[{"en":"If + 현재동사, 주어 + will + 동사","ko":"만약 ~하면, ~할 것이다 (현실 조건)"},{"en":"If + 과거동사, 주어 + would + 동사","ko":"만약 ~라면, ~할 텐데 (상상·가정)"}],"examples":[{"en":"If it rains tomorrow, I will stay home.","ko":"내일 비가 오면 집에 있을 거예요."},{"en":"If I were rich, I would travel the world.","ko":"내가 부자라면 세계 여행을 할 텐데요."},{"en":"If you study hard, you will pass the test.","ko":"열심히 공부하면 시험에 합격할 거예요."},{"en":"If I lived near the beach, I would swim every day.","ko":"바닷가 근처에 산다면 매일 수영할 텐데요."}],"dialogue":[{"w":"A","en":"If I get a bonus, I will buy a new laptop.","ko":"보너스를 받으면 새 노트북을 살 거예요."},{"w":"B","en":"Nice! And if you had a million dollars?","ko":"좋네요! 그럼 백만 달러가 있다면요?"},{"w":"A","en":"If I had that much, I would quit my job.","ko":"그만큼 있다면 저는 일을 그만둘 텐데요."},{"w":"B","en":"Ha, that is just a dream for now.","ko":"하하, 지금은 그냥 꿈일 뿐이네요."}],"quiz":[{"q":"실제로 일어날 수 있는 조건은?","opts":["If I win, I will celebrate.","If I were you, I would go.","If I had wings, I would fly."],"a":0,"ex":"If + 현재, will은 일어날 수 있는 현실적 조건이에요."},{"q":"지금 사실과 다른 상상: If I ___ taller, I would play basketball.","opts":["am","were","will be"],"a":1,"ex":"가정법에서는 be동사로 were를 주로 써요."},{"q":"빈칸: If it snows, we ___ stay inside.","opts":["will","would","had"],"a":0,"ex":"현실적 조건이라 If + 현재, will을 써요."}],"speak":["If it rains, I will take an umbrella.","If I were you, I would rest more.","If you call me, I will come.","If I had a car, I would drive there."]},{"id":"u39","tag":"가정법","title":"지금 반대 가정과 wish","en":"If I knew ... / I wish I knew ...","intro":"지금 사실의 \u003cb>반대\u003c/b>를 상상할 때 \u003cb>If + 과거동사, would\u003c/b>를 써요. 그리고 지금 이루지 못한 것을 아쉬워하며 바랄 때는 \u003cb>wish + 과거형\u003c/b>을 써요. I wish I knew는 사실은 지금 모른다는 뜻으로 알면 좋겠다는 아쉬움을 담아요.","patterns":[{"en":"If I knew ..., I would ...","ko":"내가 ~을 안다면, ~할 텐데 (사실은 모름)"},{"en":"I wish + 주어 + 과거동사","ko":"지금 ~라면 좋겠다 (현재의 아쉬움)"}],"examples":[{"en":"If I knew her number, I would call her.","ko":"그녀의 번호를 안다면 전화할 텐데요."},{"en":"I wish I had more free time.","ko":"시간이 더 많으면 좋겠어요."},{"en":"I wish I could speak French.","ko":"프랑스어를 할 수 있으면 좋겠어요."},{"en":"If she lived closer, we would meet often.","ko":"그녀가 더 가까이 살면 자주 만날 텐데요."}],"dialogue":[{"w":"A","en":"I wish I knew how to fix this computer.","ko":"이 컴퓨터 고치는 법을 알면 좋겠어요."},{"w":"B","en":"Me too. If I knew, I would help you.","ko":"저도요. 제가 안다면 도와드릴 텐데요."},{"w":"A","en":"I wish we had a tech friend right now.","ko":"지금 기술 잘 아는 친구가 있으면 좋겠네요."},{"w":"B","en":"Let us just search for a guide online.","ko":"그냥 온라인으로 안내를 찾아봐요."}],"quiz":[{"q":"I wish I ___ taller. (지금 키가 작아서 아쉬움)","opts":["was","were","am"],"a":1,"ex":"wish 뒤 be동사는 were를 주로 써요."},{"q":"If I knew the answer, I ___ tell you.","opts":["will","would","did"],"a":1,"ex":"사실 반대 가정이라 would를 써요."},{"q":"지금 아쉬움을 나타내는 문장은?","opts":["I wish I lived by the sea.","I will live by the sea.","I lived by the sea."],"a":0,"ex":"wish + 과거형은 현재의 아쉬운 바람이에요."}],"speak":["I wish I knew the answer.","If I knew her, I would say hello.","I wish I had more money.","I wish I could sing well."]},{"id":"u40","tag":"가정법","title":"과거 반대 가정과 wish","en":"If I had known ... / I wish I had known ...","intro":"이미 지나간 \u003cb>과거 사실의 반대\u003c/b>를 상상할 때 \u003cb>If + had p.p., would have p.p.\u003c/b>를 써요. 그리고 그때 못한 일을 후회할 때는 \u003cb>wish + had p.p.\u003c/b>를 써요. I wish I had known은 사실은 그때 몰랐다는 후회를 담아요.","patterns":[{"en":"If I had known ..., I would have ...","ko":"내가 ~을 알았더라면, ~했을 텐데"},{"en":"I wish + 주어 + had + p.p.","ko":"그때 ~했더라면 (과거의 후회)"}],"examples":[{"en":"If I had known, I would have come earlier.","ko":"알았더라면 더 일찍 왔을 텐데요."},{"en":"I wish I had studied harder in school.","ko":"학교에서 더 열심히 공부했더라면 좋았을 텐데요."},{"en":"If she had asked, I would have helped her.","ko":"그녀가 부탁했더라면 도와줬을 텐데요."},{"en":"I wish I had saved more money last year.","ko":"작년에 돈을 더 모았더라면 좋았을 텐데요."}],"dialogue":[{"w":"A","en":"The train left five d","were"],"a":0,"ex":"상대 행동에 대한 바람은 wish + would를 써요."},{"q":"현재의 아쉬움: I wish I ___ a car now.","opts":["had","have had","would have"],"a":0,"ex":"현재 아쉬움은 wish + 과거형을 써요."},{"q":"과거의 후회: I wish I ___ that chance.","opts":["take","had taken","would take"],"a":1,"ex":"과거 후회는 wish + had p.p.를 써요."}],"speak":["I wish you would call me back.","I wish it would stop raining.","I wish I had a day off today.","I wish I had said yes."]},{"id":"u42","tag":"수동태","title":"수동태 1 (기본)","en":"Passive 1 (is done / was done)","intro":"수동태는 \u003cb>be동사 + 과거분사(p.p.)\u003c/b> 형태예요. 누가 했는지보다 \u003cb>무슨 일이 일어났는지, 대상이 더 중요할 때\u003c/b> 씁니다. 행위자를 밝히고 싶으면 뒤에 \u003cb>by + 사람\u003c/b>을 붙이면 돼요.","patterns":[{"en":"This is made in Korea.","ko":"이것은 한국에서 만들어져요."},{"en":"The window was broken by a kid.","ko":"그 창문은 한 아이에 의해 깨졌어요."}],"examples":[{"en":"English is spoken all over the world.","ko":"영어는 전 세계에서 쓰여요."},{"en":"The cake was eaten in five minutes.","ko":"그 케이크는 5분 만에 다 먹혔어요."},{"en":"These photos were taken by my dad.","ko":"이 사진들은 우리 아빠가 찍은 거예요."},{"en":"My car was washed yesterday.","ko":"제 차는 어제 세차됐어요."}],"dialogue":[{"w":"A","en":"Wow, this bread smells amazing.","ko":"와, 이 빵 냄새 정말 좋다."},{"w":"B","en":"Thanks. It was baked this morning.","ko":"고마워. 오늘 아침에 구운 거야."},{"w":"A","en":"Was it made by you?","ko":"네가 만든 거야?"},{"w":"B","en":"Yes, the whole thing was made by me.","ko":"응, 전부 내가 만들었어."}],"quiz":[{"q":"'그 편지는 어제 보내졌어요.' 알맞은 것은?","opts":["The letter was sent yesterday.","The letter sent yesterday.","The letter is send yesterday."],"a":0,"ex":"과거 수동태는 was/were + p.p. 예요. send의 p.p.는 sent."},{"q":"수동태의 기본 형태는?","opts":["be동사 + 과거분사","have + 동사원형","do + 동사원형"],"a":0,"ex":"수동태는 be + p.p. 형태입니다."},{"q":"행위자를 나타낼 때 쓰는 말은?","opts":["by + 사람","to + 사람","for + 사람"],"a":0,"ex":"행위자는 by + 사람으로 나타내요."}],"speak":["This is made in Korea.","The window was broken.","These photos were taken by my dad.","English is spoken everywhere."]},{"id":"u43","tag":"수동태","title":"수동태 2 (시제·조동사)","en":"Passive 2 (be done / been done / being done)","intro":"수동태도 여러 시제와 조동사로 쓸 수 있어요. \u003cb>will be done\u003c/b>(될 것이다), \u003cb>has been done\u003c/b>(다 되었다), \u003cb>is being done\u003c/b>(지금 되고 있다)처럼요. be동사 부분만 시제에 맞게 바꾸면 됩니다.","patterns":[{"en":"It will be finished by Friday.","ko":"그건 금요일까지 끝날 거예요."},{"en":"The room is being cleaned now.","ko":"그 방은 지금 청소되고 있어요."}],"examples":[{"en":"Your order has been shipped already.","ko":"당신의 주문은 이미 발송되었어요."},{"en":"The bridge is being built right now.","ko":"그 다리는 지금 지어지고 있어요."},{"en":"The report will be sent tomorrow.","ko":"그 보고서는 내일 보내질 거예요."},{"en":"The problem has been solved.","ko":"그 문제는 해결되었어요."}],"dialogue":[{"w":"A","en":"Has my package been delivered yet?","ko":"제 소포가 벌써 배달됐나요?"},{"w":"B","en":"Not yet. It is being processed now.","ko":"아직요. 지금 처리되고 있어요."},{"w":"A","en":"When will it be delivered?","ko":"언제 배달될까요?"},{"w":"B","en":"It will be delivered by Thursday.","ko":"목요일까지는 배달될 거예요."}],"quiz":[{"q":"'그 일은 지금 되고 있어요.' 알맞은 것은?","opts":["It is being done now.","It is been done now.","It is do now."],"a":0,"ex":"진행 수동태는 be + being + p.p. 예요."},{"q":"'그것은 이미 끝났어요.'(완료 수동)","opts":["It has been finished.","It has finished.","It is finish."],"a":0,"ex":"완료 수동태는 have/has + been + p.p. 입니다."},{"q":"'그건 내일 보내질 거예요.'","opts":["It will be sent tomorrow.","It will send tomorrow.","It will been sent tomorrow."],"a":0,"ex":"조동사 수동태는 will + be + p.p. 예요."}],"speak":["Your order has been shipped.","The room is being cleaned now.","It will be finished by Friday.","The problem has been solved."]},{"id":"u44","tag":"수동태","title":"수동태 3 (사람 주어)","en":"Passive 3","intro":"수여동사(주다 종류)는 사람을 주어로 수동태를 만들 수 있어요. \u003cb>I was given a gift.\u003c/b>(나는 선물을 받았어요)처럼요. 또 \u003cb>think/know/consider\u003c/b> 같은 동사도 수동으로 자주 써요: He is known to everyone.","patterns":[{"en":"I was given a second chance.","ko":"나는 두 번째 기회를 받았어요."},{"en":"She is considered a genius.","ko":"그녀는 천재로 여겨져요."}],"examples":[{"en":"We were told to wait outside.","ko":"우리는 밖에서 기
