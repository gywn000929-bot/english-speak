}],"examples":[{"en":"This is the longest river in the country.","ko":"이건 그 나라에서 가장 긴 강이에요."},{"en":"She is the best student in the class.","ko":"그녀는 반에서 가장 뛰어난 학생이에요."},{"en":"It was the happiest day of my life.","ko":"그날은 내 인생에서 가장 행복한 날이었어요."},{"en":"It's one of the tallest buildings here.","ko":"여기서 가장 높은 건물들 중 하나예요."}],"dialogue":[{"w":"A","en":"What was the best part of the trip?","ko":"여행에서 제일 좋았던 게 뭐야?"},{"w":"B","en":"The beach was the most beautiful place.","ko":"해변이 가장 아름다운 곳이었어."},{"w":"A","en":"Was it crowded?","ko":"붐볐어?"},{"w":"B","en":"It's one of the quietest spots in town.","ko":"동네에서 가장 조용한 곳들 중 하나야."}],"quiz":[{"q":"This is the ___ movie I have ever seen.","opts":["good","better","best"],"a":2,"ex":"최상급은 the + best 형태예요."},{"q":"He is the tallest ___ the team.","opts":["in","of","at"],"a":0,"ex":"집단·장소 범위에는 in을 써요."},{"q":"It's one of the most popular ___.","opts":["song","songs","song's"],"a":1,"ex":"one of the 최상급 뒤에는 복수명사가 와요."}],"speak":["This is the best coffee here.","She is the youngest of them all.","It was the hardest test of the year.","It's one of the biggest cities in the world."]},{"id":"u109","tag":"형용사·부사","title":"어순 1: 목적어·장소·시간","en":"Word order 1: verb + object; place before time","intro":"영어는 \u003cb>동사와 목적어를 붙여서\u003c/b> 써요. 문장 끝에 장소와 시간이 함께 오면 \u003cb>장소를 먼저, 시간을 나중에\u003c/b> 놓아요(I went to London yesterday).","patterns":[{"en":"동사 + 목적어 (붙여 쓰기)","ko":"~을 ...하다"},{"en":"동사 + 장소 + 시간","ko":"장소 먼저, 시간 나중"}],"examples":[{"en":"I like coffee very much.","ko":"나는 커피를 아주 좋아해요."},{"en":"She speaks English well.","ko":"그녀는 영어를 잘해요."},{"en":"We went to London yesterday.","ko":"우리는 어제 런던에 갔어요."},{"en":"He arrived at the office this morning.","ko":"그는 오늘 아침 사무실에 도착했어요."}],"dialogue":[{"w":"A","en":"Did you finish the report?","ko":"보고서 끝냈어?"},{"w":"B","en":"Yes, I sent it to my boss this morning.","ko":"응, 오늘 아침에 상사한테 보냈어."},{"w":"A","en":"Where did you go after that?","ko":"그 다음엔 어디 갔어?"},{"w":"B","en":"I went to the gym at six.","ko":"여섯 시에 체육관에 갔어."}],"quiz":[{"q":"Which is correct?","opts":["I like very much coffee.","I like coffee very much.","I very much like."],"a":1,"ex":"동사 뒤에 목적어를 바로 붙여요."},{"q":"We went ___.","opts":["yesterday to Paris","to Paris yesterday","Paris to yesterday"],"a":1,"ex":"장소가 먼저, 시간이 나중에 와요."},{"q":"She saw ___.","opts":["the movie last night","last night the movie","movie the last night"],"a":0,"ex":"목적어 뒤에 시간을 놓아요."}],"speak":["I read the news every morning.","We met her at the cafe yesterday.","He plays soccer very well.","They arrived home late last night."]},{"id":"u110","tag":"형용사·부사","title":"어순 2: 빈도부사 위치","en":"Word order 2: adverbs with the verb","intro":"always, usually, often, never 같은 \u003cb>빈도부사\u003c/b>는 \u003cb>일반동사 앞\u003c/b>, \u003cb>be동사와 조동사 뒤\u003c/b>에 놓아요. 이 규칙만 기억하면 위치가 헷갈리지 않아요.","patterns":[{"en":"빈도부사 + 일반동사","ko":"일반동사 앞"},{"en":"be동사 / 조동사 + 빈도부사","ko":"be·조동사 뒤"}],"examples":[{"en":"I always drink coffee in the morning.","ko":"나는 아침에 항상 커피를 마셔요."},{"en":"She is usually late for class.","ko":"그녀는 보통 수업에 늦어요."},{"en":"We never eat out on weekdays.","ko":"우리는 평일엔 절대 외식하지 않아요."},{"en":"He can often help you.","ko":"그는 자주 너를 도와줄 수 있어요."}],"dialogue":[{"w":"A","en":"Do you often work late?","ko":"너 자주 늦게까지 일해?"},{"w":"B","en":"I usually leave the office at six.","ko":"난 보통 여섯 시에 퇴근해."},{"w":"A","en":"Are you always this busy?","ko":"너 항상 이렇게 바빠?"},{"w":"B","en":"No, I am never busy on Fridays.","ko":"아니, 금요일엔 절대 안 바빠."}],"quiz":[{"q":"I ___ eat breakfast.","opts":["always","eat always","am always"],"a":0,"ex":"빈도부사는 일반동사 앞에 와요."},{"q":"She ___ late.","opts":["usually is","is usually","usually"],"a":1,"ex":"be동사 뒤에 빈도부사를 놓아요."},{"q":"We ___ go there.","opts":["never","are never","go never"],"a":0,"ex":"일반동사 go 앞에 never를 써요."}],"speak":["I always check my phone first.","She is never late for work.","We usually meet on Sundays.","He can often come early."]},{"id":"u111","tag":"형용사·부사","title":"still, yet, already 등","en":"Still, yet, already; not any more","intro":"\u003cb>still\u003c/b>은 여전히, \u003cb>yet\u003c/b>은 아직·벌써(부정·의문문), \u003cb>already\u003c/b>는 이미 예상보다 빨리라는 뜻이에요. \u003cb>not any more\u003c/b>와 \u003cb>no longer\u003c/b>는 더 이상 ~ 아니다예요.","patterns":[{"en":"still / yet / already","ko":"여전히 / 아직·벌써 / 이미"},{"en":"not ... any more","ko":"더 이상 ~ 아니다"},{"en":"no longer","ko":"더 이상 ~ 않다"}],"examples":[{"en":"I still live with my parents.","ko":"나는 여전히 부모님과 살아요."},{"en":"Have you finished your homework yet?","ko":"숙제 벌써 끝냈어요?"},{"en":"She has already left.","ko":"그녀는 이미 떠났어요."},{"en":"He no longer works here.","ko":"그는 더 이상 여기서 일하지 않아요."}],"dialogue":[{"w":"A","en":"Are you still waiting for the bus?","ko":"아직도 버스 기다려?"},{"w":"B","en":"No, it has already come.","ko":"아니, 벌써 왔어."},{"w":"A","en":"Have you eaten yet?","ko":"밥은 벌써 먹었어?"},{"w":"B","en":"No, but I'm not hungry any more.","ko":"아니, 근데 더 이상 배 안 고파."}],"quiz":[{"q":"I haven't seen it ___.","opts":["yet","still","already"],"a":0,"ex":"부정문에서 아직은 yet을 써요."},{"q":"He has ___ finished. That was fast!","opts":["yet","already","still"],"a":1,"ex":"예상보다 빨리는 already예요."},{"q":"She ___ works here.","opts":["no longer","not any","yet"],"a":0,"ex":"더 이상 ~ 않다는 no longer로 표현해요."}],"speak":["I still remember your name.","Has the movie started yet?","They have already gone home.","I don't play games any more."]},{"id":"u112","tag":"형용사·부사","title":"even 심지어","en":"Even","intro":"\u003cb>even\u003c/b>은 심지어라는 뜻으로 놀라움을 강조해요. 보통 강조하는 말 앞이나 동사 앞에 놓아요. \u003cb>even though\u003c/b>(~인데도), \u003cb>even if\u003c/b>(~라도), \u003cb>even so\u003c/b>(그렇더라도)도 함께 익혀요.","patterns":[{"en":"even + 강조어 / 동사","ko":"심지어 ~조차"},{"en":"even though / even if","ko":"~인데도 / ~라도"},{"en":"even so","ko":"그렇더라도"}],"examples":[{"en":"Even a child can do this.","ko":"심지어 아이도 이걸 할 수 있어요."},{"en":"He didn't even say goodbye.","ko":"그는 심지어 작별 인사도 안 했어요."},{"en":"Even though it was raining, we went out.","ko":"비가 왔는데도 우리는 나갔어요."},{"en":"Even if you are tired, please try.","ko":"피곤하더라도 한번 해 보세요."}],"dialogue":[{"w":"A","en":"The test was really hard.","ko":"시험 정말 어려웠어."},{"w":"B","en":"Even the smart students struggled.","ko":"심지어 똑똑한 학생들도 힘들어했어."},{"w":"A","en":"I studied a lot, even so I failed.","ko":"많이 공부했는데 그래도 떨어졌어."},{"w":"B","en":"Even though you failed, keep trying.","ko":"떨어졌더라도 계속 도전해."}],"quiz":[{"q":"___ a beginner can learn this.","opts":["Even","Still","Yet"],"a":0,"ex":"심지어 ~조차는 even으로 강조해요."},{"q":"___ it was cold, we walked.","opts":["Even though","Even so","Even if"],"a":0,"ex":"실제 사실에는 even though(~인데도)를 써요."},{"q":"It's expensive. ___, I'll buy it.","opts":["Even so","Even though","Even"],"a":0,"ex":"그렇더라도는 even so예요."}],"speak":["Even I can understand it.","He didn't even call me.","Even though it's late, I'm not tired.","Even if it rains, we will go."]},{"id":"u113","tag":"접속사","title":"although과 despite","en":"Although / In spite of","intro":"예상과 반대되는 상황을 말할 때 씁니다. \u003cb>although\u003c/b>는 뒤에 \u003cb>주어+동사(절)\u003c/b>가 오고, \u003cb>in spite of / despite\u003c/b>는 뒤에 \u003cb>명사\u003c/b>나 \u003cb>-ing\u003c/b>가 옵니다.","patterns":[{"en":"Although + 주어 + 동사, ...","ko":"비록 ~이지만"},{"en":"In spite of / Despite + 명사","ko":"~에도 불구하고"}],"examples":[{"en":"Although it was raining, we went out.","ko":"비가 오고 있었지만 우리는 나갔어요."},{"en":"He passed the test even though he did not study.","ko":"그는 공부를 안 했는데도 시험에 붙었어요."},{"en":"In spite of the noise, I fell asleep.","ko":"시끄러운데도 나는 잠들었어요."},{"en":"Despite feeling tired, she kept working.","ko":"피곤한데도 그녀는 계속 일했어요."}],"dialogue":[{"w":"A","en":"You look happy today.","ko":"오늘 기분 좋아 보이네."},{"w":"B","en":"I am, although I did not sleep much.","ko":"응, 잠을 많이 못 잤는데도 그래."},{"w":"A","en":"Really? Despite that, you seem full of energy.","ko":"정말? 그런데도 힘이 넘쳐 보여."},{"w":"B","en":"I know, in spite of being tired I feel great.","ko":"그러니까, 피곤한데도 기분이 좋아."}],"quiz":[{"q":"___ the cold, we walked home.","opts":["Despite","Although","Even though"],"a":0,"ex":"명사 the cold 앞에는 Despite를 씁니다."},{"q":"___ it was late, she called me.","opts":["Despite","In spite of","Although"],"a":2,"ex":"절(it was late) 앞에는 Although를 씁니다."},{"q":"He smiled ___ feeling sad.","opts":["although","in spite of","even though"],"a":1,"ex":"-ing(feeling) 앞에는 in spite of를 씁니다."}],"speak":["Although it was hard, I finished.","Despite the rain, we had fun.","In spite of everything, I am okay.","Even though I was tired, I helped."]},{"id":"u114","tag":"접속사","title":"in case 대비하기","en":"In case","intro":"\u003cb>in case\u003c/b>는 어떤 일이 생길 경우에 \u003cb>미리 대비할 때\u003c/b> 씁니다. 뒤에 \u003cb>절\u003c/b>이 오면 ~할 경우에 대비해서, \u003cb>in case of + 명사\u003c/b>는 ~의 경우에 라는 뜻입니다.","patterns":[{"en":"... in case + 주어 + 동사","ko":"~할 경우에 대비해서"},{"en":"In case of + 명사","ko":"~의 경우에는"}],"examples":[{"en":"Take an umbrella in case it rains.","ko":"비 올 경우에 대비해서 우산 가져가."},{"en":"I saved the file in case the computer crashed.","ko":"컴퓨터가 멈출 경우에 대비해서 파일을 저장했어요."},{"en":"Write down my number in case you need help.","ko":"도움이 필요할 경우에 대비해 내 번호 적어 둬."},{"en":"In case of fire, use the stairs.","ko":"화재의 경우에는 계단을 이용하세요."}],"dialogue":[{"w":"A","en":"Why are you bringing a jacket?","ko":"왜 재킷을 챙겨?"},{"w":"B","en":"In case it gets cold at night.","ko":"밤에 추워질 경우에 대비해서."},{"w":"A","en":"Good idea. Should I bring snacks too?","ko":"좋은 생각이야. 나도 간식 챙길까?"},{"w":"B","en":"Yes, in case we get hungry later.","ko":"응, 이따 배고파질 경우에 대비해서."}],"quiz":[{"q":"Save your work ___ the app closes.","opts":["in case","in case of","despite"],"a":0,"ex":"절 앞에는 in case를 씁니다."},{"q":"___ emergency, call this number.","opts":["In case","In case of","Although"],"a":1,"ex":"명사 emergency 앞에는 In case of를 씁니다."},{"q":"Take water ___ you get thirsty.","opts":["in case of","despite","in case"],"a":2,"ex":"절(you get thirsty) 앞에는 in case를 씁니다."}],"speak":["Take a map in case you get lost.","I brought cash in case.","In case of rain, we stay inside.","Call me in case you need me."]},{"id":"u115","tag":"접속사","title":"조건: unless와 as long as","en":"Unless / As long as","intro":"\u003cb>unless\u003c/b>는 ~하지 않는 한 이라는 뜻으로 if...not과 비슷합니다. \u003cb>as long as\u003c/b>와 \u003cb>provided (that)\u003c/b>는 ~하기만 하면 이라는 조건을 나타냅니다.","patterns":[{"en":"Unless + 주어 + 동사","ko":"~하지 않는 한"},{"en":"As long as / Provided (that) + 절","ko":"~하기만 하면"}],"examples":[{"en":"You will be late unless you hurry.","ko":"서두르지 않으면 늦을 거예요."},{"en":"I will not go unless you come with me.","ko":"네가 함께 가지 않는 한 나는 안 가."},{"en":"You can stay as long as you are quiet.","ko":"조용히 하기만 하면 있어도 돼요."},{"en":"We can start provided that everyone agrees.","ko":"모두가 동의하기만 하면 시작할 수 있어요."}],"dialogue":[{"w":"A","en":"Can I borrow your car?","ko":"차 좀 빌려도 돼?"},{"w":"B","en":"Sure, as long as you fill the tank.","ko":"물론이지, 기름만 채워 주면."},{"w":"A","en":"No problem. When do you need it back?","ko":"문제없어. 언제 돌려주면 돼?"},{"w":"B","en":"Tonight, unless you tell me sooner.","ko":"오늘 밤, 네가 미리 말하지 않는 한."}],"quiz":[{"q":"You cannot enter ___ you have a ticket.","opts":["unless","as long as","provided"],"a":0,"ex":"티켓이 없으면 못 들어간다는 뜻이므로 unless."},{"q":"I will help ___ you ask nicely.","opts":["unless","as long as","despite"],"a":1,"ex":"정중히 부탁하기만 하면 이므로 as long as."},{"q":"We can go ___ that it stops raining.","opts":["unless","in case","provided"],"a":2,"ex":"~하기만 하면 은 provided (that)."}],"speak":["I will wait as long as you need.","You cannot pass unless you try.","Call me provided you have time.","It is fine as long as you are safe."]},{"id":"u116","tag":"접속사","title":"as의 여러 뜻","en":"As (time and reason)","intro":"\u003cb>as\u003c/b>는 ~할 때(동시 동작), ~때문에(이유)를 나타낼 수 있습니다. \u003cb>as I walked\u003c/b>처럼 두 가지 일이 동시에 일어날 때 자주 씁니다. \u003cb>as usual\u003c/b>은 평소처럼 이라는 표현입니다.","patterns":[{"en":"As + 주어 + 동사 (동시)","ko":"~할 때, ~하면서"},{"en":"As + 주어 + 동사 (이유)","ko":"~때문에"}],"examples":[{"en":"I saw her as I walked to work.","ko":"출근하면서 그녀를 봤어요."},{"en":"As I was cooking, the phone rang.","ko":"요리하고 있을 때 전화가 울렸어요."},{"en":"As it was late, we went home.","ko":"늦었기 때문에 우리는 집에 갔어요."},{"en":"She was late as usual.","ko":"그녀는 평소처럼 늦었어요."}],"dialogue":[{"w":"A","en":"Did you see the accident?","ko":"그 사고 봤어?"},{"w":"B","en":"Yes, as I was crossing the street.","ko":"응, 길을 건너고 있을 때."},{"w":"A","en":"That is scary. Did you stop?","ko":"무섭다. 멈췄어?"},{"w":"B","en":"I did, as everyone was watching.","ko":"응, 다들 보고 있었기 때문에."}],"quiz":[{"q":"___ I opened the door, the cat ran out.","opts":["As","Unless","Despite"],"a":0,"ex":"~할 때(동시)를 나타내는 As."},{"q":"We left early ___ we were tired.","opts":["in case","as","although"],"a":1,"ex":"~때문에(이유)를 나타내는 as."},{"q":"He arrived late, ___ usual.","opts":["in case","unless","as"],"a":2,"ex":"평소처럼 은 as usual."}],"speak":["As I left, it started to rain.","As it was cold, I wore a coat.","She smiled as she spoke.","As usual, he was on time."]},{"id":"u117","tag":"접속사","title":"like와 as의 차이","en":"Like and as","intro":"\u003cb>like\u003c/b>는 뒤에 \u003cb>명사\u003c/b>가 와서 ~처럼 이라는 뜻입니다. \u003cb>as\u003c/b>는 뒤에 \u003cb>절\u003c/b>이 오거나, 직업이나 자격을 나타내어 ~로서 라는 뜻으로 씁니다.","patterns":[{"en":"Like + 명사","ko":"~처럼"},{"en":"As + 절 / 직업·자격","ko":"~하는 대로 / ~로서"}],"examples":[{"en":"She sings like a professional.","ko":"그녀는 전문가처럼 노래해요."},{"en":"Do it like this.","ko":"이렇게 해 보세요."},{"en":"As I said, we are ready.","ko":"내가 말한 대로, 우리는 준비됐어요."},{"en":"She works as a nurse.","ko":"그녀는 간호사로 일해요."}],"dialogue":[{"w":"A","en":"Your brother cooks really well.","ko":"네 형은 요리를 정말 잘해."},{"w":"B","en":"Yes, he cooks like a chef.","ko":"응, 요리사처럼 요리해."},{"w":"A","en":"Does he work in a restaurant?","ko":"식당에서 일해?"},{"w":"B","en":"He works as a chef downtown.","ko":"시내에서 요리사로 일해."}],"quiz":[{"q":"He talks ___ his father.","opts":["like","as","unless"],"a":0,"ex":"명사(his father) 앞에는 like."},{"q":"I work ___ a teacher.","opts":["like","as","in case"],"a":1,"ex":"직업(자격)을 나타낼 때는 as."},{"q":"___ you know, I am busy.","opts":["Like","Despite","As"],"a":2,"ex":"절(you know) 앞에는 As."}],"speak":["You look like your mother.","Do it as I showed you.","She runs like the wind.","I work as a designer."]},{"id":"u118","tag":"접속사","title":"as if 마치 ~처럼","en":"Like / As if","intro":"마치 ~인 것처럼 이라고 말할 때 \u003cb>as if\u003c/b>나 \u003cb>as though\u003c/b>를 씁니다. 회화에서는 \u003cb>like\u003c/b>도 자주 씁니다. \u003cb>It looks like ...\u003c/b>는 ~인 것 같다 라는 표현입니다.","patterns":[{"en":"As if / As though + 절","ko":"마치 ~인 것처럼"},{"en":"It looks like + 절","ko":"~인 것 같다"}],"examples":[{"en":"He acts as if he knows everything.","ko":"그는 마치 다 아는 것처럼 행동해요."},{"en":"She looked as though she had cried.","ko":"그녀는 마치 울었던 것처럼 보였어요."},{"en":"It looks like it is going to rain.","ko":"비가 올 것 같아요."},{"en":"You look like you have seen a ghost.","ko":"너 마치 귀신 본 것 같은 얼굴이야."}],"dialogue":[{"w":"A","en":"Why is he so quiet today?","ko":"그는 오늘 왜 이렇게 조용해?"},{"w":"B","en":"He acts as if something is wrong.","ko":"뭔가 잘못된 것처럼 행동해."},{"w":"A","en":"It looks like he is worried.","ko":"걱정하는 것 같아 보여."},{"w":"B","en":"Yes, as though he lost something.","ko":"응, 마치 뭘 잃어버린 것처럼."}],"quiz":[{"q":"She smiled ___ she was happy.","opts":["as if","unless","despite"],"a":0,"ex":"마치 ~인 것처럼 은 as if."},{"q":"It looks ___ it will snow.","opts":["as","like","in case"],"a":1,"ex":"It looks like + 절 형태입니다."},{"q":"He talks ___ he owns the place.","opts":["like","in case","as though"],"a":2,"ex":"마치 ~인 것처럼 은 as though도 됩니다."}],"speak":["You look as if you are tired.","It looks like a nice day.","He talks as though he is rich.","She felt like she was dreaming."]},{"id":"u119","tag":"접속사","title":"for, during, while","en":"For, during and while","intro":"\u003cb>for\u003c/b>는 얼마나 오래인지 \u003cb>기간의 길이\u003c/b>와 씁니다. \u003cb>during\u003c/b>은 \u003cb>명사\u003c/b>와 함께 어떤 사건 동안, \u003cb>while\u003c/b>은 \u003cb>절\u003c/b>과 함께 ~하는 동안 이라는 뜻입니다.","patterns":[{"en":"For + 기간의 길이","ko":"~동안 (얼마나 오래)"},{"en":"During + 명사 / While + 절","ko":"~동안 (언제)"}],"examples":[{"en":"I studied for two hours.","ko":"나는 두 시간 동안 공부했어요."},{"en":"She slept during the movie.","ko":"그녀는 영화 보는 동안 잤어요."},{"en":"He called while I was cooking.","ko":"내가 요리하는 동안 그가 전화했어요."},{"en":"We talked during the break.","ko":"우리는 쉬는 시간 동안 이야기했어요."}],"dialogue":[{"w":"A","en":"How long did you wait?","ko":"얼마나 기다렸어?"},{"w":"B","en":"For about an hour.","ko":"한 시간쯤."},{"w":"A","en":"What did you do during that time?","ko":"그동안 뭐 했어?"},{"w":"B","en":"I read a book while I waited.","ko":"기다리는 동안 책을 읽었어."}],"quiz":[{"q":"I lived there ___ three years.","opts":["for","during","while"],"a":0,"ex":"기간의 길이(three years)에는 for."},{"q":"He fell asleep ___ the lesson.","opts":["for","during","while"],"a":1,"ex":"명사(the lesson) 앞에는 during."},{"q":"She sang ___ she cleaned.","opts":["for","during","while"],"a":2,"ex":"절(she cleaned) 앞에는 while."}],"speak":["I waited for ten minutes.","We met during the trip.","He read while I drove.","It rained during the night."]},{"id":"u120","tag":"접속사","title":"by와 until","en":"By and until","intro":"\u003cb>until\u003c/b>은 어떤 시점까지 \u003cb>계속\u003c/b>되는 것을, \u003cb>by\u003c/b>는 그 시점까지 \u003cb>완료\u003c/b>되는 것을 나타냅니다. \u003cb>by the time\u003c/b>은 ~할 때쯤이면 이라는 뜻입니다.","patterns":[{"en":"Until + 시점","ko":"~까지 (계속)"},{"en":"By + 시점 / By the time + 절","ko":"~까지 (완료) / ~할 때쯤"}],"examples":[{"en":"I will wait until six.","ko":"여섯 시까지 기다릴게요."},{"en":"Please finish by Friday.","ko":"금요일까지 끝내 주세요."},{"en":"We stayed until the party ended.","ko":"파티가 끝날 때까지 있었어요."},{"en":"By the time I arrived, they had left.","ko":"내가 도착했을 때쯤 그들은 떠났어요."}],"dialogue":[{"w":"A","en":"When do you need the report?","ko":"보고서 언제까지 필요해?"},{"w":"B","en":"By tomorrow morning, please.","ko":"내일 아침까지 부탁해."},{"w":"A","en":"Okay, I will work until midnight then.","ko":"알겠어, 그럼 자정까지 일할게."},{"w":"B","en":"Thanks. By the time you sleep, it will be done.","ko":"고마워. 네가 잘 때쯤이면 다 되겠네."}],"quiz":[{"q":"Send it ___ 5 p.m., not later.","opts":["by","until","for"],"a":0,"ex":"~까지 완료는 by."},{"q":"I will stay here ___ you come back.","opts":["by","until","during"],"a":1,"ex":"~까지 계속은 until."},{"q":"___ we got there, the shop was closed.","opts":["Until","For","By the time"],"a":2,"ex":"~할 때쯤이면 은 By the time."}],"speak":["I will finish by noon.","Wait here until I return.","Can you send it by tonight?","By the time we left, it was dark."]},{"id":"u121","tag":"전치사","title":"시간 at/on/in","en":"At, on, in for time","intro":"시간을 말할 때 세 전치사를 씁니다. \u003cb>at\u003c/b>은 시각이나 특정 시점, \u003cb>on\u003c/b>은 요일과 날짜, \u003cb>in\u003c/b>은 월, 연도, 계절, 그리고 아침 같은 긴 시간대에 씁니다.","patterns":[{"en":"at + time / on + day, date / in + month, year","ko":"at 시각 / on 요일, 날짜 / in 월, 연도"},{"en":"in the morning, at night","ko":"아침에, 밤에"}],"examples":[{"en":"The meeting starts at three o'clock.","ko":"회의는 3시에 시작해요."},{"en":"I was born on July 12th.","ko":"저는 7월 12일에 태어났어요."},{"en":"It gets cold in December.","ko":"12월에는 추워져요."},{"en":"She reads in the morning.","ko":"그녀는 아침에 책을 읽어요."}],"dialogue":[{"w":"A","en":"What time does the movie start?","ko":"영화 몇 시에 시작해?"},{"w":"B","en":"It starts at seven, on Friday.","ko":"금요일 7시에 시작해."},{"w":"A","en":"Great, are you free in the evening?","ko":"좋아, 저녁에 시간 돼?"},{"w":"B","en":"Yes, I'm free after five.","ko":"응, 5시 이후로 한가해."}],"quiz":[{"q":"'3시에'는?","opts":["at three","on three","in three"],"a":0,"ex":"시각 앞에는 at을 씁니다."},{"q":"'월요일에'는?","opts":["in Monday","on Monday","at Monday"],"a":1,"ex":"요일 앞에는 on을 씁니다."},{"q":"'2025년에'는?","opts":["on 2025","at 2025","in 2025"],"a":2,"ex":"연도 앞에는 in을 씁니다."}],"speak":["The class begins at nine.","We meet on Sunday.","It snows in winter.","I study in the morning."]},{"id":"u122","tag":"전치사","title":"on time과 in the end","en":"On time, in time, at the end, in the end","intro":"\u003cb>on time\u003c/b>은 정시에, \u003cb>in time\u003c/b>은 늦지 않게 제때라는 뜻입니다. \u003cb>at the end\u003c/b>는 무언가의 끝에, \u003cb>in the end\u003c/b>는 마침내, 결국이라는 뜻이에요.","patterns":[{"en":"on time = punctual / in time = not late","ko":"on time 정시에 / in time 늦지 않게"},{"en":"at the end of ~ / in the end = finally","ko":"at the end ~의 끝에 / in the end 결국"}],"examples":[{"en":"The train left exactly on time.","ko":"기차가 정확히 정시에 떠났어요."},{"en":"We got there just in time.","ko":"우리는 딱 늦지 않게 도착했어요."},{"en":"There is a test at the end of the class.","ko":"수업 끝에 시험이 있어요."},{"en":"In the end, they became friends.","ko":"결국 그들은 친구가 되었어요."}],"dialogue":[{"w":"A","en":"Did the bus come on time today?","ko":"오늘 버스 정시에 왔어?"},{"w":"B","en":"No, but I still got to work in time.","ko":"아니, 그래도 늦지 않게 출근했어."},{"w":"A","en":"Good. How did the project go?","ko":"다행이다. 프로젝트는 어떻게 됐어?"},{"w":"B","en":"In the end, we finished everything.","ko":"결국 우리는 다 끝냈어."}],"quiz":[{"q":"'정시에'는?","opts":["on time","in time","at time"],"a":0,"ex":"정시에는 on time입니다."},{"q":"'늦지 않게'는?","opts":["on time","in time","by time"],"a":1,"ex":"제때, 늦지 않게는 in time입니다."},{"q":"'결국'은?","opts":["at the end","in the end","on the end"],"a":1,"ex":"마침내, 결국은 in the end입니다."}],"speak":["Please be on time tomorrow.","We arrived in time for dinner.","There is a song at the end.","In the end, it worked out."]},{"id":"u123","tag":"전치사","title":"위치 in/at/on 1","en":"In, at, on for position 1","intro":"위치를 말할 때 \u003cb>in\u003c/b>은 어떤 공간의 안, \u003cb>at\u003c/b>은 특정 지점, \u003cb>on\u003c/b>은 표면 위를 나타냅니다. 이 기본 개념을 먼저 익혀 두면 응용이 쉬워요.","patterns":[{"en":"in a room / at a point / on a surface","ko":"in 공간 안 / at 지점 / on 표면 위"},{"en":"in the box, at the bus stop, on the table","ko":"상자 안, 버스 정류장에, 탁자 위에"}],"examples":[{"en":"The keys are in my bag.","ko":"열쇠가 내 가방 안에 있어요."},{"en":"I'll wait for you at the entrance.","ko":"입구에서 기다릴게요."},{"en":"Your phone is on the desk.","ko":"네 전화기는 책상 위에 있어."},{"en":"There is water in the glass.","ko":"유리잔 안에 물이 있어요."}],"dialogue":[{"w":"A","en":"Where did you put my notebook?","ko":"내 공책 어디에 뒀어?"},{"w":"B","en":"It's on the shelf, next to the books.","ko":"선반 위, 책 옆에 있어."},{"w":"A","en":"And where are my glasses?","ko":"그럼 내 안경은?"},{"w":"B","en":"They're in the drawer.","ko":"서랍 안에 있어."}],"quiz":[{"q":"'가방 안에'는?","opts":["in the bag","at the bag","on the bag"],"a":0,"ex":"공간 안은 in입니다."},{"q":"'탁자 위에'는?","opts":["in the table","on the table","at the table"],"a":1,"ex":"표면 위는 on입니다."},{"q":"'그 지점에'를 나타내는 것은?","opts":["in","on","at"],"a":2,"ex":"특정 지점은 at입니다."}],"speak":["The cat is in the box.","Meet me at the corner.","The cup is on the table.","My coat is in the closet."]},{"id":"u124","tag":"전치사","title":"위치 in/at/on 2","en":"In, at, on for position 2","intro":"세부 구분을 배웁니다. \u003cb>at\u003c/b>은 the door, the station, the party처럼 지점이나 행사에, 탈것은 승용차는 \u003cb>in a car\u003c/b>, 버스나 기차는 \u003cb>on a bus\u003c/b>처럼 씁니다.","patterns":[{"en":"at the door / at the station / at the party","ko":"문 앞에 / 역에서 / 파티에서"},{"en":"in a car / on a bus, on a train","ko":"승용차 안에 / 버스에, 기차에"}],"examples":[{"en":"Someone is at the door.","ko":"누가 문 앞에 있어요."},{"en":"We met a lot of people at the party.","ko":"우리는 파티에서 많은 사람을 만났어요."},{"en":"She is waiting in the car.","ko":"그녀는 차 안에서 기다리고 있어요."},{"en":"I read a book on the train.","ko":"저는 기차에서 책을 읽었어요."}],"dialogue":[{"w":"A","en":"Where should I meet you?","ko":"어디서 만날까?"},{"w":"B","en":"Let's meet at the station at noon.","ko":"정오에 역에서 만나자."},{"w":"A","en":"How are you getting there?","ko":"거기 어떻게 가?"},{"w":"B","en":"I'll be on the bus, so I might be late.","ko":"버스 타고 가니까 좀 늦을 수도 있어."}],"quiz":[{"q":"'역에서'는?","opts":["at the station","in the station","on the station"],"a":0,"ex":"지점을 나타낼 때 at the station을 씁니다."},{"q":"'승용차 안에'는?","opts":["on a car","in a car","at a car"],"a":1,"ex":"승용차는 in a car입니다."},{"q":"'버스에'는?","opts":["in a bus","at a bus","on a bus"],"a":2,"ex":"버스나 기차는 on을 씁니다."}],"speak":["He is at the door.","We had fun at the party.","Please wait in the car.","I slept on the train."]},{"id":"u125","tag":"전치사","title":"위치 in/at/on 3","en":"In, at, on for position 3","intro":"관용 표현을 익힙니다. 방 안 모서리는 \u003cb>in the corner\u003c/b>, 길모퉁이는 \u003cb>at the corner\u003c/b>, 왼쪽에는 \u003cb>on the left\u003c/b>, 사진 속은 \u003cb>in a photo\u003c/b>, 맨 위는 \u003cb>at the top\u003c/b>입니다.","patterns":[{"en":"in the corner (room) / at the corner (street)","ko":"방 모서리에 / 길모퉁이에"},{"en":"on the left, in a photo, at the top","ko":"왼쪽에, 사진 속에, 맨 위에"}],"examples":[{"en":"The lamp is in the corner of the room.","ko":"램프가 방 모서리에 있어요."},{"en":"Turn left at the corner.","ko":"길모퉁이에서 왼쪽으로 도세요."},{"en":"The bank is on the left.","ko":"은행은 왼쪽에 있어요."},{"en":"Who is this person in the photo?","ko":"사진 속 이 사람은 누구예요?"}],"dialogue":[{"w":"A","en":"Where is the coffee shop?","ko":"커피숍 어디 있어?"},{"w":"B","en":"It's at the corner, on the left.","ko":"길모퉁이, 왼쪽에 있어."},{"w":"A","en":"Is that you in this old photo?","ko":"이 오래된 사진 속 사람 너야?"},{"w":"B","en":"Yes, I'm the one at the top.","ko":"응, 맨 위에 있는 사람이 나야."}],"quiz":[{"q":"'길모퉁이에서'는?","opts":["in the corner","at the corner","on the corner"],"a":1,"ex":"길모퉁이는 at the corner입니다."},{"q":"'왼쪽에'는?","opts":["on the left","in the left","at the left"],"a":0,"ex":"왼쪽에는 on the left입니다."},{"q":"'사진 속에'는?","opts":["at a photo","on a photo","in a photo"],"a":2,"ex":"사진 속은 in a photo입니다."}],"speak":["The plant is in the corner.","Stop at the corner.","The store is on the right.","Her name is at the top."]},{"id":"u126","tag":"전치사","title":"to/at/in/into","en":"To, at, in, into","intro":"이동에는 \u003cb>to\u003c/b>, 위치에는 \u003cb>at\u003c/b>이나 \u003cb>in\u003c/b>, 안으로 들어가는 움직임에는 \u003cb>into\u003c/b>를 씁니다. 또한 승용차는 \u003cb>get in\u003c/b>, 버스는 \u003cb>get on\u003c/b>이라고 해요.","patterns":[{"en":"go to ~ / be at, in ~ / go into ~","ko":"to 이동 / at, in 위치 / into 안으로"},{"en":"get in a car, get on a bus","ko":"차에 타다, 버스에 타다"}],"examples":[{"en":"I go to school every day.","ko":"저는 매일 학교에 가요."},{"en":"She is at home right now.","ko":"그녀는 지금 집에 있어요."},{"en":"The dog ran into the house.","ko":"개가 집 안으로 뛰어들어갔어요."},{"en":"Let's get in the car.","ko":"차에 타자."}],"dialogue":[{"w":"A","en":"Are you going to the office today?","ko":"오늘 사무실에 가?"},{"w":"B","en":"No, I'm staying at home.","ko":"아니, 집에 있을 거야."},{"w":"A","en":"Okay, I'll get on the bus then.","ko":"알겠어, 그럼 나는 버스 탈게."},{"w":"B","en":"Text me when you get into town.","ko":"시내에 들어오면 문자해."}],"quiz":[{"q":"'학교에 가다'는?","opts":["go to school","go at school","go in school"],"a":0,"ex":"이동에는 to를 씁니다."},{"q":"'방 안으로 들어가다'에 알맞은 것은?","opts":["at the room","into the room","to the room"],"a":1,"ex":"안으로 들어가는 움직임은 into입니다."},{"q":"'버스에 타다'는?","opts":["get in a bus","get into a bus","get on a bus"],"a":2,"ex":"버스에 타는 것은 get on a bus입니다."}],"speak":["I go to work by train.","She is at the library.","He walked into the room.","Please get in the car."]},{"id":"u127","tag":"전치사","title":"기타 in/on/at","en":"In, on, at other uses","intro":"그 밖의 용법입니다. 교통수단은 \u003cb>by car\u003c/b>, 걸어서는 \u003cb>on foot\u003c/b>, 통화 중은 \u003cb>on the phone\u003c/b>, 텔레비전에서는 \u003cb>on TV\u003c/b>, 영어로는 \u003cb>in English\u003c/b>라고 합니다.","patterns":[{"en":"by car, by bus / on foot","ko":"차로, 버스로 / 걸어서"},{"en":"on the phone, on TV, in English","ko":"통화 중, TV에서, 영어로"}],"examples":[{"en":"I usually go to work by car.","ko":"저는 보통 차로 출근해요."},{"en":"We went there on foot.","ko":"우리는 거기에 걸어서 갔어요."},{"en":"She is on the phone with her mom.","ko":"그녀는 엄마와 통화 중이에요."},{"en":"Please say it in English.","ko":"그것을 영어로 말해 주세요."}],"dialogue":[{"w":"A","en":"How do you get to school?","ko":"학교에 어떻게 가?"},{"w":"B","en":"By bus, but sometimes on foot.","ko":"버스로, 근데 가끔은 걸어서."},{"w":"A","en":"Is your favorite show on TV tonight?","ko":"네가 좋아하는 프로 오늘 밤 TV에 나와?"},{"w":"B","en":"Yes, and it's all in English.","ko":"응, 그리고 전부 영어로 나와."}],"quiz":[{"q":"'차로'는?","opts":["by car","on car","in car"],"a":0,"ex":"교통수단 수단은 by car입니다."},{"q":"'걸어서'는?","opts":["by foot","on foot","in foot"],"a":1,"ex":"걸어서는 on foot입니다."},{"q":"'영어로'는?","opts":["on English","by English","in English"],"a":2,"ex":"어떤 언어로 말할 때는 in을 씁니다."}],"speak":["I travel by train.","They came on foot.","He is on the phone.","Answer in English, please."]},{"id":"u128","tag":"전치사","title":"by의 여러 쓰임","en":"By and its uses","intro":"\u003cb>by\u003c/b>는 여러 뜻이 있습니다. 수단은 by car, 행위자는 written \u003cb>by\u003c/b>, 차이는 \u003cb>by\u003c/b> 10%, 그리고 by + 시점은 그 시점까지라는 마감의 의미로 씁니다.","patterns":[{"en":"by car / written by ~ / by 10%","ko":"차로 / ~에 의해 쓰인 / 10퍼센트만큼"},{"en":"by + time = not later than","ko":"by 시점 = 그때까지"}],"examples":[{"en":"This book was written by a famous author.","ko":"이 책은 유명한 작가가 썼어요."},{"en":"Prices went up by ten percent.","ko":"가격이 10퍼센트 올랐어요."},{"en":"Please finish it by Friday.","ko":"금요일까지 그것을 끝내 주세요."},{"en":"We traveled around the city by taxi.","ko":"우리는 택시로 도시를 돌아다녔어요."}],"dialogue":[{"w":"A","en":"When do you need the report?","ko":"보고서 언제까지 필요해?"},{"w":"B","en":"I need it by Monday morning.","ko":"월요일 아침까지 필요해."},{"w":"A","en":"Who made these slides?","ko":"이 슬라이드는 누가 만들었어?"},{"w":"B","en":"They were made by the design team.","ko":"디자인 팀이 만들었어."}],"quiz":[{"q":"'금요일까지'는?","opts":["by Friday","on Friday","in Friday"],"a":0,"ex":"마감 시점을 나타낼 때 by를 씁니다."},{"q":"'그에 의해 쓰인'은?","opts":["written on him","written by him","written at him"],"a":1,"ex":"행위자는 by로 나타냅니다."},{"q":"'택시로'는?","opts":["on taxi","in taxi","by taxi"],"a":2,"ex":"교통수단은 by taxi입니다."}],"speak":["Send it by tomorrow.","This song was written by her.","Sales grew by five percent.","We went home by bus."]},{"id":"u129","tag":"전치사","title":"명사+전치사","en":"Noun + preposition (reason for, cause of)","intro":"명사 뒤에는 정해진 전치사가 함께 옵니다. \u003cb>reason for\u003c/b>(~의 이유), \u003cb>cause of\u003c/b>(~의 원인), \u003cb>increase in\u003c/b>(~의 증가), \u003cb>damage to\u003c/b>(~에 대한 손상), \u003cb>need for\u003c/b>(~에 대한 필요)를 통째로 외워 두세요.","patterns":[{"en":"the reason for the delay","ko":"지연의 이유"},{"en":"the cause of the problem","ko":"그 문제의 원인"},{"en":"there is a need for change","ko":"변화가 필요하다"}],"examples":[{"en":"What is the reason for the change?","ko":"그 변경의 이유가 뭐예요?"},{"en":"Nobody knows the cause of the fire.","ko":"아무도 그 화재의 원인을 몰라요."},{"en":"There was a big increase in prices.","ko":"가격이 크게 올랐어요."},{"en":"The storm did serious damage to the roof.","ko":"폭풍이 지붕에 심한 손상을 입혔어요."}],"dialogue":[{"w":"A","en":"Do you know the reason for the delay?","ko":"지연 이유를 알아요?"},{"w":"B","en":"I think the cause of it is bad weather.","ko":"원인은 나쁜 날씨인 것 같아요."},{"w":"A","en":"There is a real need for a backup plan.","ko":"정말 대비책이 필요하네요."},{"w":"B","en":"Agreed. Let me check the damage to our schedule.","ko":"동의해요. 일정에 준 영향을 확인해 볼게요."}],"quiz":[{"q":"What is the reason ___ the delay?","opts":["for","of","to"],"a":0,"ex":"reason 뒤에는 for를 써요."},{"q":"Nobody knows the cause ___ the fire.","opts":["for","of","in"],"a":1,"ex":"cause 뒤에는 of를 써요."},{"q":"The storm did damage ___ the roof.","opts":["of","for","to"],"a":2,"ex":"damage 뒤에는 to를 써요."}],"speak":["What is the reason for this?","Do you know the cause of it?","There is a need for change.","It did damage to the car."]},{"id":"u130","tag":"전치사","title":"형용사+전치사 1","en":"Adjective + preposition 1 (afraid of, good at)","intro":"형용사 뒤에도 짝이 되는 전치사가 있어요. \u003cb>afraid/scared of\u003c/b>(~을 무서워하는), \u003cb>good/bad at\u003c/b>(~을 잘/못하는), \u003cb>interested in\u003c/b>(~에 관심 있는), \u003cb>full of\u003c/b>(~로 가득한), \u003cb>proud of\u003c/b>(~을 자랑스러워하는)를 익혀 보세요.","patterns":[{"en":"I am afraid of dogs","ko":"나는 개를 무서워해요"},{"en":"she is good at math","ko":"그녀는 수학을 잘해요"},{"en":"I am interested in music","ko":"나는 음악에 관심 있어요"}],"examples":[{"en":"I am scared of spiders.","ko":"나는 거미가 무서워요."},{"en":"He is really good at cooking.","ko":"그는 요리를 정말 잘해요."},{"en":"Are you interested in art?","ko":"미술에 관심 있어요?"},{"en":"The box is full of old photos.","ko":"그 상자는 오래된 사진으로 가득해요."}],"dialogue":[{"w":"A","en":"Are you good at swimming?","ko":"수영 잘해요?"},{"w":"B","en":"Not really. I am a bit afraid of deep water.","ko":"별로요. 깊은 물이 좀 무서워요."},{"w":"A","en":"I understand. I am bad at it too.","ko":"이해해요. 저도 수영을 못해요."},{"w":"B","en":"But I am proud of my little progress.","ko":"그래도 조금씩 나아진 게 자랑스러워요."}],"quiz":[{"q":"I am afraid ___ dogs.","opts":["of","at","in"],"a":0,"ex":"afraid 뒤에는 of를 써요."},{"q":"She is good ___ math.","opts":["of","at","on"],"a":1,"ex":"good 뒤에는 at을 써요."},{"q":"Are you interested ___ music?","opts":["at","of","in"],"a":2,"ex":"interested 뒤에는 in을 써요."}],"speak":["I am afraid of spiders.","She is good at cooking.","Are you interested in art?","I am proud of you."]},{"id":"u131","tag":"전치사","title":"형용사+전치사 2","en":"Adjective + preposition 2 (kind to, married to)","intro":"사람 관계를 나타내는 형용사 전치사예요. \u003cb>nice/kind to somebody\u003c/b>(~에게 친절한), \u003cb>angry with somebody about something\u003c/b>(~에게 ~로 화난), \u003cb>married to\u003c/b>(~와 결혼한), \u003cb>different from\u003c/b>(~와 다른), \u003cb>similar to\u003c/b>(~와 비슷한).","patterns":[{"en":"she is kind to everyone","ko":"그녀는 모두에게 친절해요"},{"en":"he is married to my sister","ko":"그는 내 여동생과 결혼했어요"},{"en":"this is similar to that","ko":"이건 저것과 비슷해요"}],"examples":[{"en":"The staff were very nice to us.","ko":"직원들이 우리에게 아주 친절했어요."},{"en":"She is angry with me about the mess.","ko":"그녀는 어질러 놓은 것 때문에 나에게 화났어요."},{"en":"My style is different from yours.","ko":"내 스타일은 당신 것과 달라요."},{"en":"This song is similar to the old one.","ko":"이 노래는 예전 곡과 비슷해요."}],"dialogue":[{"w":"A","en":"Your new coworker is really kind to everyone.","ko":"새 동료가 모두에게 정말 친절하네요."},{"w":"B","en":"Yes, but she is different from the last manager.","ko":"네, 그런데 예전 매니저와는 달라요."},{"w":"A","en":"Is she still angry with you about the report?","ko":"보고서 때문에 아직 당신에게 화났어요?"},{"w":"B","en":"No, that is similar to old news now.","ko":"아니요, 이제 그건 지난 일이나 마찬가지예요."}],"quiz":[{"q":"She is very kind ___ everyone.","opts":["to","with","of"],"a":0,"ex":"kind 뒤에는 to somebody를 써요."},{"q":"My style is different ___ yours.","opts":["to","from","with"],"a":1,"ex":"different 뒤에는 from을 써요."},{"q":"This is similar ___ that one.","opts":["from","with","to"],"a":2,"ex":"similar 뒤에는 to를 써요."}],"speak":["She is kind to everyone.","He is married to my friend.","This is different from that.","It is similar to mine."]},{"id":"u132","tag":"전치사","title":"동사+전치사 1","en":"Verb + preposition 1 (to and at)","intro":"\u003cb>to\u003c/b>와 \u003cb>at\u003c/b>은 방향이 달라요. \u003cb>talk/listen/happen to\u003c/b>(~에게 말하다/듣다, ~에게 일어나다), \u003cb>look/shout/point at\u003c/b>(~을 보다/향해 소리치다/가리키다). \u003cb>throw something at\u003c/b>은 공격, \u003cb>throw something to\u003c/b>는 건네줌이에요.","patterns":[{"en":"I need to talk to you","ko":"당신에게 할 말이 있어요"},{"en":"look at this photo","ko":"이 사진 좀 봐요"},{"en":"throw the ball to me","ko":"공을 나에게 던져요"}],"examples":[{"en":"Please listen to me for a second.","ko":"잠깐만 제 말 좀 들어 주세요."},{"en":"What happened to your phone?","ko":"당신 휴대폰 무슨 일 있었어요?"},{"en":"Do not shout at the kids.","ko":"아이들에게 소리치지 마세요."},{"en":"He threw a rock at the window.","ko":"그가 창문에 돌을 던졌어요."}],"dialogue":[{"w":"A","en":"Can I talk to you for a minute?","ko":"잠깐 얘기 좀 할 수 있어요?"},{"w":"B","en":"Sure. But please do not shout at me.","ko":"그럼요. 근데 저한테 소리치진 마세요."},{"w":"A","en":"Sorry. Just look at this weird message.","ko":"미안해요. 이 이상한 메시지 좀 봐요."},{"w":"B","en":"Whoa, what happened to your account?","ko":"이런, 계정에 무슨 일이 생긴 거예요?"}],"quiz":[{"q":"Please listen ___ me.","opts":["to","at","for"],"a":0,"ex":"listen 뒤에는 to를 써요."},{"q":"Look ___ this photo.","opts":["to","at","on"],"a":1,"ex":"look 뒤에는 at을 써요."},{"q":"He threw a rock ___ the window (to break it).","opts":["to","for","at"],"a":2,"ex":"공격의 의미일 때는 throw at을 써요."}],"speak":["Can I talk to you?","Please listen to me.","Look at this photo.","Throw the ball to me."]},{"id":"u133","tag":"전치사","title":"동사+전치사 2","en":"Verb + preposition 2 (about/for/of)","intro":"자주 쓰는 동사 짝이에요. \u003cb>care about\u003c/b>(~에 신경 쓰다), \u003cb>apply for\u003c/b>(~에 지원하다), \u003cb>wait for\u003c/b>(~을 기다리다), \u003cb>apologize for\u003c/b>(~에 대해 사과하다), \u003cb>dream of/about\u003c/b>(~을 꿈꾸다).","patterns":[{"en":"I care about my friends","ko":"나는 친구들을 소중히 여겨요"},{"en":"I applied for the job","ko":"나는 그 일자리에 지원했어요"},{"en":"wait for me here","ko":"여기서 나를 기다려요"}],"examples":[{"en":"She really cares about her work.","ko":"그녀는 자기 일을 정말 소중히 여겨요."},{"en":"I want to apply for that position.","ko":"나는 그 자리에 지원하고 싶어요."},{"en":"Sorry for the wait, thanks for waiting.","ko":"기다리게 해서 죄송해요, 기다려 줘서 고마워요."},{"en":"I dream of traveling the world.","ko":"나는 세계 여행을 꿈꿔요."}],"dialogue":[{"w":"A","en":"Did you apply for the new job?","ko":"새 일자리에 지원했어요?"},{"w":"B","en":"Yes. Now I just wait for their reply.","ko":"네. 이제 답변을 기다리기만 하면 돼요."},{"w":"A","en":"I know you care about this a lot.","ko":"당신이 이걸 정말 신경 쓴다는 거 알아요."},{"w":"B","en":"I do. I have dreamed of this for years.","ko":"맞아요. 몇 년 동안 이걸 꿈꿔 왔어요."}],"quiz":[{"q":"I really care ___ my friends.","opts":["about","for","of"],"a":0,"ex":"care 뒤에는 about을 써요."},{"q":"I want to apply ___ the job.","opts":["about","for","to"],"a":1,"ex":"apply 뒤에는 for를 써요."},{"q":"Please apologize ___ being late.","opts":["about","of","for"],"a":2,"ex":"apologize 뒤에는 for를 써요."}],"speak":["I care about you.","I applied for the job.","Wait for me, please.","I dream of traveling."]},{"id":"u134","tag":"전치사","title":"동사+전치사 3","en":"Verb + preposition 3 (about and of)","intro":"\u003cb>about\u003c/b>과 \u003cb>of\u003c/b>의 미묘한 차이예요. \u003cb>remind somebody of/about\u003c/b>(~을 떠올리게 하다/상기시키다), \u003cb>think of/about\u003c/b>(~을 생각하다), \u003cb>warn somebody about/of\u003c/b>(~에 대해 경고하다), \u003cb>complain about\u003c/b>(~에 대해 불평하다).","patterns":[{"en":"you remind me of my brother","ko":"당신은 내 형을 떠올리게 해요"},{"en":"what do you think about it","ko":"그것에 대해 어떻게 생각해요"},{"en":"stop complaining about the food","ko":"음식에 대해 불평 좀 그만해요"}],"examples":[{"en":"This song reminds me of summer.","ko":"이 노래는 여름을 떠올리게 해요."},{"en":"Remind me about the meeting tomorrow.","ko":"내일 회의 나한테 알려 줘요."},{"en":"I warned you about the traffic.","ko":"교통 체증에 대해 경고했잖아요."},{"en":"He always complains about his job.","ko":"그는 늘 자기 일에 대해 불평해요."}],"dialogue":[{"w":"A","en":"This place reminds me of our old office.","ko":"이 곳은 우리 예전 사무실을 떠올리게 해요."},{"w":"B","en":"True. What do you think about moving back?","ko":"그러네요. 다시 돌아가는 거 어떻게 생각해요?"},{"w":"A","en":"I warned you about the long commute there.","ko":"거기 통근 길어지는 거 내가 경고했잖아요."},{"w":"B","en":"Right. I should stop complaining about it.","ko":"맞아요. 그거 불평은 그만해야겠네요."}],"quiz":[{"q":"You remind me ___ my brother.","opts":["of","for","to"],"a":0,"ex":"remind somebody of는 닮아서 떠오를 때 써요."},{"q":"He always complains ___ his job.","opts":["of","about","for"],"a":1,"ex":"complain 뒤에는 about을 써요."},{"q":"What do you ___ about it?","opts":["remind","warn","think"],"a":2,"ex":"think about은 의견을 물을 때 써요."}],"speak":["You remind me of him.","What do you think about it?","I warned you about that.","Stop complaining about it."]},{"id":"u135","tag":"전치사","title":"동사+전치사 4","en":"Verb + preposition 4 (of/for/from/on)","intro":"구성과 의존을 나타내는 짝이에요. \u003cb>consist of\u003c/b>(~로 구성되다), \u003cb>pay for\u003c/b>(~의 값을 내다), \u003cb>suffer from\u003c/b>(~로 고생하다), \u003cb>protect from\u003c/b>(~로부터 보호하다), \u003cb>depend/rely on\u003c/b>(~에 의존하다).","patterns":[{"en":"the team consists of five people","ko":"그 팀은 다섯 명으로 구성돼요"},{"en":"I paid for the tickets","ko":"내가 표 값을 냈어요"},{"en":"it depends on the weather","ko":"그건 날씨에 달렸어요"}],"examples":[{"en":"The course consists of six lessons.","ko":"그 과정은 여섯 개 수업으로 구성돼요."},{"en":"Let me pay for lunch today.","ko":"오늘 점심은 제가 낼게요."},{"en":"He suffers from bad allergies.","ko":"그는 심한 알레르기로 고생해요."},{"en":"You can always rely on me.","ko":"언제든 저를 믿고 의지해도 돼요."}],"dialogue":[{"w":"A","en":"Our plan depends on the budget.","ko":"우리 계획은 예산에 달렸어요."},{"w":"B","en":"True. Who will pay for the extra costs?","ko":"맞아요. 추가 비용은 누가 내죠?"},{"w":"A","en":"The team consists of five members, so we split it.","ko":"팀이 다섯 명이니까 나눠서 내요."},{"w":"B","en":"Good. I know I can rely on all of you.","ko":"좋아요. 여러분 모두를 믿을 수 있겠네요."}],"quiz":[{"q":"The team consists ___ five people.","opts":["of","from","on"],"a":0,"ex":"consist 뒤에는 of를 써요."},{"q":"He suffers ___ bad allergies.","opts":["of","from","for"],"a":1,"ex":"suffer 뒤에는 from을 써요."},{"q":"It depends ___ the weather.","opts":["of","from","on"],"a":2,"ex":"depend 뒤에는 on을 써요."}],"speak":["It consists of three parts.","Let me pay for it.","She suffers from allergies.","You can rely on me."]},{"id":"u136","tag":"전치사","title":"동사+전치사 5","en":"Verb + preposition 5 (in/into/with/to/on)","intro":"마지막 묶음이에요. \u003cb>believe in\u003c/b>(~을 믿다), \u003cb>succeed in\u003c/b>(~에 성공하다), \u003cb>crash into\u003c/b>(~에 부딪히다), \u003cb>provide with\u003c/b>(~에게 ~을 제공하다), \u003cb>happen to\u003c/b>(~에게 일어나다), \u003cb>congratulate on\u003c/b>(~을 축하하다).","patterns":[{"en":"I believe in you","ko":"나는 당신을 믿어요"},{"en":"the car crashed into a tree","ko":"차가 나무에 부딪혔어요"},{"en":"congratulate her on the win","ko":"그녀의 우승을 축하해요"}],"examples":[{"en":"She succeeded in passing the exam.","ko":"그녀는 시험에 합격하는 데 성공했어요."},{"en":"The hotel provided us with towels.","ko":"호텔이 우리에게 수건을 제공했어요."},{"en":"What happened to your car?","ko":"당신 차에 무슨 일 있었어요?"},{"en":"Congratulations on your new job!","ko":"새 직장 축하해요!"}],"dialogue":[{"w":"A","en":"Congratulations on passing the test!","ko":"시험 합격 축하해요!"},{"w":"B","en":"Thanks. I always believed in myself.","ko":"고마워요. 늘 저 자신을 믿었어요."},{"w":"A","en":"You succeeded in something really hard.","ko":"정말 어려운 일에 성공한 거예요."},{"w":"B","en":"By the way, what happened to the party plan?","ko":"그나저나 파티 계획은 어떻게 됐어요?"}],"quiz":[{"q":"I really believe ___ you.","opts":["in","on","to"],"a":0,"ex":"believe 뒤에는 in을 써요."},{"q":"The car crashed ___ a tree.","opts":["in","into","to"],"a":1,"ex":"crash 뒤에는 into를 써요."},{"q":"Congratulations ___ your new job!","opts":["in","to","on"],"a":2,"ex":"congratulate 뒤에는 on을 써요."}],"speak":["I believe in you.","She succeeded in the exam.","The car crashed into a wall.","Congratulations on your win!"]},{"id":"u137","tag":"구동사","title":"1: 구동사 개념","en":"Phrasal Verbs 1: Introduction","intro":"구동사는 \u003cb>동사 + 부사/전치사\u003c/b>가 만나 완전히 새로운 뜻을 만드는 표현이에요. 예를 들어 get은 얻다지만 \u003cb>get up\u003c/b>은 일어나다예요. 원어민 대화에서 정말 자주 쓰이니 통째로 익히세요. 목적어가 대명사면 보통 동사와 부사 사이에 넣어요.","patterns":[{"en":"I get up at seven.","ko":"나는 7시에 일어나."},{"en":"Go on, tell me more.","ko":"계속해, 더 말해줘."},{"en":"Please come back soon.","ko":"곧 돌아와 줘."}],"examples":[{"en":"What time do you get up?","ko":"너 몇 시에 일어나?"},{"en":"I picked it up, not I picked up it.","ko":"'picked it up'이지 'picked up it'이 아니야."},{"en":"He went on talking for an hour.","ko":"그는 한 시간 동안 계속 말했어."},{"en":"She came back from work late.","ko":"그녀는 일에서 늦게 돌아왔어."}],"dialogue":[{"w":"A","en":"What time do you usually get up?","ko":"너 보통 몇 시에 일어나?"},{"w":"B","en":"Around six, so please go on without me.","ko":"6시쯤이야, 그러니 나 없이 계속 진행해."},{"w":"A","en":"No worries, just come back when you can.","ko":"괜찮아, 그냥 올 수 있을 때 돌아와."},{"w":"B","en":"Thanks, I will pick it up later.","ko":"고마워, 나중에 이어서 할게."}],"quiz":[{"q":"'일어나다'를 뜻하는 구동사는?","opts":["get up","get down","get in"],"a":0,"ex":"get up = 일어나다, 기상하다."},{"q":"'계속하다'를 뜻하는 것은?","opts":["go out","go on","go back"],"a":1,"ex":"go on = 계속하다."},{"q":"대명사 목적어의 올바른 위치는?","opts":["pick up it","pick it up","pick it"],"a":1,"ex":"대명사는 동사와 부사 사이에 와요."}],"speak":["I get up at seven.","Go on, please.","Come back soon.","I picked it up."]},{"id":"u138","tag":"구동사","title":"2: in/out","en":"Phrasal Verbs 2: in/out","intro":"\u003cb>in\u003c/b>은 안으로, \u003cb>out\u003c/b>은 밖으로 향하는 이미지예요. come in(들어오다), go out(나가다), get in/out(타다/내리다), fill in(작성하다), work out(운동하다/해결되다)처럼 방향 감각으로 기억하면 쉬워요.","patterns":[{"en":"Come in and sit down.","ko":"들어와서 앉아."},{"en":"Let's go out tonight.","ko":"오늘 밤 나가자."},{"en":"Fill in this form, please.","ko":"이 양식을 작성해 주세요."}],"examples":[{"en":"Please come in, the door is open.","ko":"들어오세요, 문 열려 있어요."},{"en":"We went out for dinner last night.","ko":"우리 어젯밤에 저녁 먹으러 나갔어."},{"en":"Get in the car, we are late.","ko":"차에 타, 우리 늦었어."},{"en":"I work out three times a week.","ko":"나는 일주일에 세 번 운동해."}],"dialogue":[{"w":"A","en":"Do you want to go out tonight?","ko":"오늘 밤 나갈래?"},{"w":"B","en":"Sure, but first come in for a coffee.","ko":"좋아, 근데 먼저 들어와서 커피 한잔해."},{"w":"A","en":"Okay, should I fill in this form first?","ko":"알겠어, 이 양식 먼저 작성할까?"},{"w":"B","en":"Yes, then we can work out our plans.","ko":"응, 그러고 나서 계획을 짜자."}],"quiz":[{"q":"'들어오다'는?","opts":["come in","go out","get out"],"a":0,"ex":"come in = 들어오다."},{"q":"'차에서 내리다'는?","opts":["get in","get out","fill in"],"a":1,"ex":"get out = 내리다, 밖으로 나가다."},{"q":"'운동하다'를 뜻하는 것은?","opts":["work out","fill in","come in"],"a":0,"ex":"work out = 운동하다, 해결되다."}],"speak":["Please come in.","Let's go out tonight.","Get in the car.","I work out every day."]},{"id":"u139","tag":"구동사","title":"3: out","en":"Phrasal Verbs 3: out","intro":"\u003cb>out\u003c/b>은 완료, 제거, 소진의 느낌도 있어요. run out(다 떨어지다), find out(알아내다), sort out(정리·해결하다), cross out(줄 긋다), eat out(외식하다). 무언가가 끝까지 가거나 완전히 없어지는 이미지예요.","patterns":[{"en":"We ran out of milk.","ko":"우유가 다 떨어졌어."},{"en":"I need to find out the truth.","ko":"나는 진실을 알아내야 해."},{"en":"Let's eat out tonight.","ko":"오늘 밤 외식하자."}],"examples":[{"en":"We ran out of coffee this morning.","ko":"오늘 아침에 커피가 다 떨어졌어."},{"en":"I found out he moved to Busan.","ko":"나는 그가 부산으로 이사한 걸 알아냈어."},{"en":"I will sort out this problem soon.","ko":"이 문제를 곧 해결할게."},{"en":"Cross out any word that is wrong.","ko":"틀린 단어는 줄을 그어 지워."}],"dialogue":[{"w":"A","en":"We ran out of food again.","ko":"우리 또 음식이 다 떨어졌어."},{"w":"B","en":"Then let's just eat out tonight.","ko":"그럼 오늘 밤 그냥 외식하자."},{"w":"A","en":"Good idea, can you find out where is open?","ko":"좋은 생각이야, 어디 문 열었는지 알아봐 줄래?"},{"w":"B","en":"Sure, I will sort out the details.","ko":"물론이야, 세부 사항은 내가 정리할게."}],"quiz":[{"q":"'다 떨어지다'는?","opts":["run out","find out","eat out"],"a":0,"ex":"run out (of) = 다 떨어지다, 소진되다."},{"q":"'알아내다'는?","opts":["cross out","find out","sort out"],"a":1,"ex":"find out = 알아내다."},{"q":"'외식하다'는?","opts":["eat out","run out","sort out"],"a":0,"ex":"eat out = 외식하다."}],"speak":["We ran out of milk.","I found out the truth.","Let's eat out.","I will sort it out."]},{"id":"u140","tag":"구동사","title":"4: on/off 1","en":"Phrasal Verbs 4: on/off (1)","intro":"on은 붙어서 계속되는 느낌, off는 떨어지는 느낌이에요. get on/off(타다/내리다, 교통), go on(계속하다), \u003cb>hold on\u003c/b>(잠깐 기다려), come on(어서, 자자). 일상 대화에서 정말 많이 나와요.","patterns":[{"en":"Get on the bus quickly.","ko":"버스에 빨리 타."},{"en":"Hold on a second.","ko":"잠깐만 기다려."},{"en":"Come on, we can do it.","ko":"자, 우린 할 수 있어."}],"examples":[{"en":"We got on the wrong train.","ko":"우리 잘못된 기차를 탔어."},{"en":"Get off at the next stop.","ko":"다음 정류장에서 내려."},{"en":"Hold on, I am almost ready.","ko":"기다려, 나 거의 다 됐어."},{"en":"Come on, we are going to be late.","ko":"어서, 우리 늦겠어."}],"dialogue":[{"w":"A","en":"Hold on, is this the right bus?","ko":"잠깐, 이거 맞는 버스야?"},{"w":"B","en":"Yes, get on before it leaves.","ko":"응, 떠나기 전에 타."},{"w":"A","en":"Where do we get off?","ko":"우리 어디서 내려?"},{"w":"B","en":"Come on, I will show you.","ko":"자, 내가 알려줄게."}],"quiz":[{"q":"'버스에 타다'는?","opts":["get off","get on","hold on"],"a":1,"ex":"get on = (교통수단에) 타다."},{"q":"'잠깐 기다려'는?","opts":["hold on","come on","go on"],"a":0,"ex":"hold on = 잠깐 기다려."},{"q":"'다음 정류장에서 내려'의 빈칸: Get ___ at the next stop.","opts":["on","off","in"],"a":1,"ex":"get off = 내리다."}],"speak":["Get on the bus.","Get off here.","Hold on a second.","Come on, let's go."]},{"id":"u141","tag":"구동사","title":"5: on/off 2","en":"Phrasal Verbs 5: on/off (2)","intro":"기계나 옷에도 on/off를 써요. \u003cb>turn on/off\u003c/b>, switch on/off(켜다/끄다), \u003cb>put on\u003c/b>(입다) / \u003cb>take off\u003c/b>(벗다), call off(취소하다). on은 작동·착용, off는 정지·제거로 기억하세요.","patterns":[{"en":"Turn on the light, please.","ko":"불 좀 켜 줘."},{"en":"Put on your jacket.","ko":"재킷 입어."},{"en":"They called off the meeting.","ko":"그들은 회의를 취소했어."}],"examples":[{"en":"Can you turn off the TV?","ko":"TV 좀 꺼 줄래?"},{"en":"Switch on the fan, it is hot.","ko":"선풍기 켜, 더워."},{"en":"Take off your shoes at the door.","ko":"문에서 신발을 벗어."},{"en":"They called off the game because of rain.","ko":"그들은 비 때문에 경기를 취소했어."}],"dialogue":[{"w":"A","en":"It is cold, can you turn on the heater?","ko":"추워, 히터 좀 켜 줄래?"},{"w":"B","en":"Sure, and put on a sweater too.","ko":"그래, 그리고 스웨터도 입어."},{"w" ith\u003c/b>(참다), make up(화해하다/지어내다), set up(설치·준비하다). 뜻이 다양하니 예문으로 익히세요.","patterns":[{"en":"Don't give up now.","ko":"지금 포기하지 마."},{"en":"I will pick you up at eight.","ko":"8시에 데리러 갈게."},{"en":"I can't put up with this noise.","ko":"이 소음을 참을 수 없어."}],"examples":[{"en":"Never give up on your dream.","ko":"네 꿈을 절대 포기하지 마."},{"en":"Can you pick up some bread?","ko":"빵 좀 사다 줄래?"},{"en":"They made up after the fight.","ko":"그들은 싸운 후 화해했어."},{"en":"Let's set up the meeting for Friday.","ko":"회의를 금요일로 잡자."}],"dialogue":[{"w":"A","en":"I want to give up learning English.","ko":"나 영어 배우는 걸 포기하고 싶어."},{"w":"B","en":"Don't give up, you are doing great.","ko":"포기하지 마, 너 정말 잘하고 있어."},{"w":"A","en":"But I can't put up with all the grammar.","ko":"근데 이 모든 문법을 참을 수가 없어."},{"w":"B","en":"I will pick you up and we can study together.","ko":"내가 데리러 갈게, 같이 공부하자."}],"quiz":[{"q":"'포기하다'는?","opts":["give up","pick up","set up"],"a":0,"ex":"give up = 포기하다."},{"q":"'참다, 견디다'는?","opts":["make up","put up with","pick up"],"a":1,"ex":"put up with = 참다, 견디다."},{"q":"'화해하다'는?","opts":["set up","give up","make up"],"a":2,"ex":"make up = 화해하다 (또는 지어내다)."}],"speak":["Don't give up.","I will pick you up.","I can't put up with it.","Let's make up."]},{"id":"u144","tag":"구동사","title":"8: up 3","en":"Phrasal Verbs 8: up (3)","intro":"여기서 \u003cb>up\u003c/b>은 완료나 증가의 느낌이에요. end up(결국 ~하게 되다), cheer up(기운 내다), hurry up(서두르다), fill up(가득 채우다), use up(다 써버리다). 무언가가 끝까지 차거나 완성되는 이미지예요.","patterns":[{"en":"We ended up staying home.","ko":"우리는 결국 집에 있게 됐어."},{"en":"Cheer up, it will be okay.","ko":"기운 내, 괜찮을 거야."},{"en":"Hurry up, we are late.","ko":"서둘러, 우리 늦었어."}],"examples":[{"en":"I ended up loving the movie.","ko":"나는 결국 그 영화를 아주 좋아하게 됐어."},{"en":"Cheer up, tomorrow is a new day.","ko":"기운 내, 내일은 새로운 날이야."},{"en":"Please fill up the tank.","ko":"탱크를 가득 채워 주세요."},{"en":"We used up all the paper.","ko":"우리는 종이를 다 써버렸어."}],"dialogue":[{"w":"A","en":"Hurry up, the train is leaving.","ko":"서둘러, 기차가 떠나."},{"w":"B","en":"I know, but I used up all my energy.","ko":"알아, 근데 나 힘을 다 써버렸어."},{"w":"A","en":"Cheer up, we will make it.","ko":"기운 내, 우리 탈 수 있어."},{"w":"B","en":"If not, we will end up taking a taxi.","ko":"안 되면, 결국 택시를 타게 되겠지."}],"quiz":[{"q":"'결국 ~하게 되다'는?","opts":["end up","cheer up","fill up"],"a":0,"ex":"end up = 결국 ~하게 되다."},{"q":"'서두르다'는?","opts":["use up","hurry up","cheer up"],"a":1,"ex":"hurry up = 서두르다."},{"q":"'다 써버리다'는?","opts":["fill up","cheer up","use up"],"a":2,"ex":"use up = 다 써버리다, 소진하다."}],"speak":["We ended up staying home.","Cheer up!","Hurry up, please.","We used it all up."]},{"id":"u145","tag":"구동사","title":"9: down","en":"Phrasal Verbs 9: down","intro":"\u003cb>down\u003c/b>은 아래로, 줄어들거나 멈추는 느낌이에요. break down(고장 나다), calm down(진정하다), slow down(속도를 줄이다), turn down(거절하다/줄이다), write down(적다). 감정이나 속도가 내려가는 이미지로 기억하세요.","patterns":[{"en":"My car broke down.","ko":"내 차가 고장 났어."},{"en":"Calm down and breathe.","ko":"진정하고 숨 쉬어."},{"en":"Write down my number.","ko":"내 번호를 적어."}],"examples":[{"en":"The bus broke down on the way.","ko":"버스가 가는 길에 고장 났어."},{"en":"Please calm down, it is fine.","ko":"제발 진정해, 괜찮아."},{"en":"Slow down, you are driving too fast.","ko":"속도 줄여, 너무 빨리 운전하고 있어."},{"en":"She turned down the job offer.","ko":"그녀는 그 일자리 제안을 거절했어."}],"dialogue":[{"w":"A","en":"My car broke down again this morning.","ko":"오늘 아침에 내 차가 또 고장 났어."},{"w":"B","en":"Calm down, let me write down the address.","ko":"진정해, 내가 주소를 적을게."},{"w":"A","en":"Can you turn down the music too?","ko":"음악 소리도 줄여 줄래?"},{"w":"B","en":"Sure, and please slow down when you speak.","ko":"그래, 그리고 말할 때 좀 천천히 해."}],"quiz":[{"q":"'고장 나다'는?","opts":["break down","calm down","slow down"],"a":0,"ex":"break down = 고장 나다."},{"q":"'진정하다'는?","opts":["turn down","calm down","write down"],"a":1,"ex":"calm down = 진정하다."},{"q":"'(제안을) 거절하다'는?","opts":["slow down","write down","turn down"],"a":2,"ex":"turn down = 거절하다, (소리를) 줄이다."}],"speak":["My car broke down.","Calm down.","Please slow down.","Write it down."]}]</script>
<script>
const UNITS = JSON.parse(document.getElementById("unitData").textContent);
document.getElementById("totalCount").textContent = UNITS.length;
document.getElementById("totalCount2").textContent = UNITS.length;

const STORE_KEY = "speakup_progress_v2";
let progress = {};
try{ progress = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ progress = {}; }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }catch(e){} }

const app = document.getElementById("app");
function esc(s){ return String(s).replace(/'/g,"\\'"); }
function refreshProgress(){
  const done = Object.keys(progress).filter(k=>progress[k]).length;
  document.getElementById("doneCount").textContent = done;
  document.getElementById("progFill").style.width = (done/UNITS.length*100)+"%";
}

/* 섹션 순서(첫 등장 순) */
const SECTIONS = [];
UNITS.forEach(u=>{ if(!SECTIONS.includes(u.tag)) SECTIONS.push(u.tag); });

/* 음성: 듣기 */
let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, rate=0.95){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang="en-US"; u.rate=rate;
  const v = voices.find(v=>/en-US/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang));
  if(v) u.voice=v; speechSynthesis.speak(u);
}

let searchTerm = "";
function renderHome(){
  refreshProgress();
  const idxOf = {}; UNITS.forEach((u,i)=>idxOf[u.id]=i);
  const term = searchTerm.trim().toLowerCase();
  const match = u => !term || (u.title+" "+u.en+" "+u.tag).toLowerCase().includes(term);

  let sectionsHtml = SECTIONS.map(sec=>{
    const items = UNITS.filter(u=>u.tag===sec && match(u));
    if(!items.length) return "";
    const doneN = items.filter(u=>progress[u.id]).length;
    const cards = items.map(u=>`
      <div class="unit-card ${progress[u.id]?'done':''}" onclick="openUnit('${u.id}')">
        <div class="done-dot">✓</div>
        <div class="num">UNIT ${idxOf[u.id]+1}</div>
        <h4>${u.title}</h4>
        <p class="en">${u.en}</p>
      </div>`).join("");
    return `<div class="section">
      <div class="sec-head"><h3>${sec}</h3><span class="cnt">${doneN}/${items.length}</span><span class="bar"></span></div>
      <div class="grid">${cards}</div>
    </div>`;
  }).join("");

  if(!sectionsHtml.trim()) sectionsHtml = `<div class="no-res">‘${searchTerm}’ 검색 결과가 없어요.</div>`;

  app.innerHTML = `
    <div class="hero">
      <h2>👋 회화가 되는 영문법, 전체 커리큘럼을 직접 말하며</h2>
      <p>16개 파트 · 145개 유닛. 각 유닛마다 <b>설명 → 예문 듣기 → 실전 대화 → 퀴즈 → 말하기</b>.
      🔊 로 원어민 발음을 듣고, 🎤 로 따라 말하면 발음이 채점됩니다. 진도는 자동 저장돼요.</p>
    </div>
    <div class="search">
      <span class="ico">🔎</span>
      <input id="searchInput" type="text" placeholder="유닛 검색 (예: 현재완료, phrasal, 관사...)" value="${searchTerm.replace(/"/g,'&quot;')}" />
      <button class="clear" id="clearBtn" onclick="clearSearch()">지우기</button>
    </div>
    ${sectionsHtml}`;

  const inp = document.getElementById("searchInput");
  const clr = document.getElementById("clearBtn");
  clr.style.display = searchTerm ? "block" : "none";
  inp.oninput = (e)=>{
    searchTerm = e.target.value;
    const pos = e.target.selectionStart;
    renderHome();
    const ni = document.getElementById("searchInput");
    ni.focus(); try{ ni.setSelectionRange(pos,pos); }catch(_){}
  };
  if(term){ inp.focus(); const L=inp.value.length; try{inp.setSelectionRange(L,L);}catch(_){} }
}
function clearSearch(){ searchTerm=""; renderHome(); }

function openUnit(id){
  const u = UNITS.find(x=>x.id===id);
  const idx = UNITS.findIndex(x=>x.id===id);
  window.__unit = u; quizState = {};
  app.innerHTML = `
    <button class="back" onclick="renderHome()">← 유닛 목록</button>
    <div><span class="tag">UNIT ${idx+1} · ${u.tag}</span></div>
    <h2 style="margin:8px 0 2px;font-size:22px">${u.title}</h2>
    <p style="margin:0 0 4px;color:var(--mut);font-size:14px">${u.en}</p>
    <div class="tabs">
      <button class="tab active" data-t="learn" onclick="switchTab(this)">📖 설명</button>
      <button class="tab" data-t="ex" onclick="switchTab(this)">🔊 예문</button>
      <button class="tab" data-t="dlg" onclick="switchTab(this)">💬 대화</button>
      <button class="tab" data-t="quiz" onclick="switchTab(this)">✏️ 퀴즈</button>
      <button class="tab" data-t="speak" onclick="switchTab(this)">🎤 말하기</button>
    </div>
    <div class="panel active" data-p="learn">${renderLearn(u)}</div>
    <div class="panel" data-p="ex">${renderExamples(u)}</div>
    <div class="panel" data-p="dlg">${renderDialogue(u)}</div>
    <div class="panel" data-p="quiz">${renderQuiz(u)}</div>
    <div class="panel" data-p="speak">${renderSpeak(u)}</div>`;
  window.scrollTo(0,0);
}
function switchTab(btn){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  btn.classList.add("active");
  const t = btn.dataset.t;
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active", p.dataset.p===t));
}
function renderLearn(u){
  const pats = (u.patterns||[]).map(p=>`<div class="pat"><div><div class="p-en">${p.en}</div><div class="p-ko">${p.ko}</div></div></div>`).join("");
  return `<div class="box"><h3>💡 핵심 개념</h3><p class="lead">${u.intro}</p></div>
    <div class="box"><h3>🔑 핵심 패턴</h3>${pats}</div>`;
}
function renderExamples(u){
  const rows = (u.examples||[]).map(e=>`
    <div class="ex-row"><div class="ex-txt"><div class="ex-en">${e.en}</div><div class="ex-ko">${e.ko}</div></div>
      <button class="say" onclick="speak('${esc(e.en)}')" title="발음 듣기">🔊</button></div>`).join("");
  return `<div class="box"><h3>🔊 예문 듣기</h3><p class="kv" style="margin:-4px 0 6px">🔊 를 눌러 원어민 발음을 들어보세요.</p>${rows}</div>`;
}
function renderDialogue(u){
  const lines = (u.dialogue||[]).map(d=>`
    <div class="dlg ${d.w==='A'?'a':'b'}"><div class="who">${d.w}</div>
      <div class="bubble"><div class="b-en"><span>${d.en}</span><button class="say" onclick="speak('${esc(d.en)}')">🔊</button></div>
      <div class="b-ko">${d.ko}</div></div></div>`).join("");
  const full = (u.dialogue||[]).map(d=>d.en).join(" ... ");
  return `<div class="box"><h3>💬 실전 대화</h3><p class="kv" style="margin:-4px 0 10px">이 표현이 실제 대화에서 어떻게 쓰이는지 보세요.</p>${lines}
    <button class="btn primary" style="margin-top:8px" onclick="speak('${esc(full)}',0.92)">▶ 대화 전체 듣기</button></div>`;
}
function renderQuiz(u){
  const qs = (u.quiz||[]).map((q,qi)=>{
    const opts = q.opts.map((o,oi)=>`<button class="opt" onclick="answer(this,${qi},${oi},${q.a})">${o}</button>`).join("");
    return `<div class="q" data-qi="${qi}"><div class="q-txt">${qi+1}. ${String(q.q).replace(/___/g,'<span class="blank">____</span>')}</div>
      ${opts}<div class="explain">💡 ${q.ex}</div></div>`;
  }).join("");
  return `<div class="box"><h3>✏️ 연습 퀴즈</h3>${qs}<div id="quizResult"></div></div>`;
}
let quizState = {};
function answer(btn, qi, chosen, correct){
  const wrap = btn.closest(".q");
  if(wrap.dataset.answered) return; wrap.dataset.answered="1";
  wrap.querySelectorAll(".opt").forEach((b,i)=>{ b.disabled=true;
    if(i===correct) b.classList.add("correct");
    if(i===chosen && chosen!==correct) b.classList.add("wrong"); });
  wrap.querySelector('.explain').classList.add("show");
  quizState[qi] = (chosen===correct); checkQuizDone();
}
function checkQuizDone(){
  const u = window.__unit;
  if(Object.keys(quizState).length < u.quiz.length) return;
  const score = Object.values(quizState).filter(Boolean).length;
  document.getElementById("quizResult").innerHTML = `
    <div class="quiz-done"><div class="score">${score} / ${u.quiz.length}</div>
      <div style="color:var(--mut);margin-top:4px">${score===u.quiz.length?'완벽해요! 🎉':'좋아요, 오답 해설을 다시 읽어보세요 👍'}</div></div>
    <button class="done-btn" onclick="markDone('${u.id}')">✓ 이 유닛 완료 표시하고 목록으로</button>`;
}
function markDone(id){ progress[id]=true; save(); renderHome(); }

let SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let sIndex = 0;
function renderSpeak(u){
  sIndex = 0; const supported = !!SR;
  setTimeout(()=>updateSpeakCard(u),0);
  return `<div class="box speak-card">
    <div class="kv"><span id="spCount">1</span> / ${(u.speak||[]).length}</div>
    <div class="speak-target" id="spTarget"></div>
    <div class="speak-ko" id="spKo"></div>
    <button class="say" style="width:44px;height:44px;font-size:19px;margin:0 auto 14px" onclick="speak(document.getElementById('spTarget').textContent)">🔊</button>
    <div><button class="mic" id="micBtn" onclick="startRec()" ${supported?'':'disabled'}>🎤</button></div>
    <div class="heard" id="heard">${supported?'🎤 버튼을 누르고 문장을 따라 말해보세요':'⚠️ 이 브라우저는 음성인식을 지원하지 않아요. Chrome에서 말하기 채점이 가능합니다. (듣기 🔊 는 사용 가능)'}</div>
    <div class="speak-nav">
      <button class="btn" id="prevBtn" onclick="moveSpeak(-1)">← 이전</button>
      <button class="btn primary" id="nextBtn" onclick="moveSpeak(1)">다음 →</button>
    </div>
    <div class="hint">발음이 완벽하지 않아도 괜찮아요. 반복이 최고의 연습! 💪</div></div>`;
}
function updateSpeakCard(u){
  const arr = u.speak||[];
  document.getElementById("spCount").textContent = sIndex+1;
  document.getElementById("spTarget").textContent = arr[sIndex]||"";
  const m = (u.examples||[]).find(e=>e.en===arr[sIndex]) || (u.dialogue||[]).find(d=>d.en===arr[sIndex]);
  document.getElementById("spKo").textContent = m ? m.ko : "";
  document.getElementById("prevBtn").disabled = (sIndex===0);
  document.getElementById("nextBtn").textContent = (sIndex===arr.length-1)?'완료 ✓':'다음 →';
}
function moveSpeak(dir){
  const u = window.__unit;
  if(dir>0 && sIndex===(u.speak.length-1)){ markDone(u.id); return; }
  sIndex = Math.max(0, Math.min(u.speak.length-1, sIndex+dir)); updateSpeakCard(u);
}
function normalize(s){ return s.toLowerCase().replace(/[^a-z0-9']+/g," ").trim(); }
function similarity(a,b){
  a=normalize(a).split(" "); b=normalize(b).split(" ");
  const setB={}; b.forEach(w=>setB[w]=(setB[w]||0)+1);
  let hit=0; a.forEach(w=>{ if(setB[w]>0){hit++; setB[w]--;} });
  return Math.round(hit/Math.max(a.length,1)*100);
}
function startRec(){
  if(!SR) return;
  const u=window.__unit, target=u.speak[sIndex];
  const rec=new SR(); rec.lang="en-US"; rec.interimResults=false; rec.maxAlternatives=3;
  const btn=document.getElementById("micBtn"), heard=document.getElementById("heard");
  btn.classList.add("rec"); heard.textContent="🎙️ 듣는 중...";
  rec.onresult=(e)=>{
    let best="",bestScore=-1;
    for(let i=0;i<e.results[0].length;i++){ const t=e.results[0][i].transcript; const sc=similarity(t,target); if(sc>bestScore){bestScore=sc;best=t;} }
    const cls=bestScore>=70?'match-good':'match-bad';
    const emoji=bestScore>=90?'🌟 완벽해요!':bestScore>=70?'👍 좋아요!':'🔁 다시 해볼까요?';
    heard.innerHTML=`내가 말한 것: <b>“${best}”</b><br><span class="${cls}">일치율 ${bestScore}% · ${emoji}</span>`;
  };
  rec.onerror=()=>{ heard.textContent="⚠️ 인식 실패. 마이크 권한을 확인하고 다시 시도하세요."; btn.classList.remove("rec"); };
  rec.onend=()=>{ btn.classList.remove("rec"); };
  try{ rec.start(); }catch(err){ btn.classList.remove("rec"); }
}

renderHome();
</script>
</body>
</html>
