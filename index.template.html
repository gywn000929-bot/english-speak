<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Speak Up! · 회화 중심 영문법 인터랙티브 학습 (전체 145유닛)</title>
<style>
  /* dark = default root; light overridden in media query (build.js also emits data-theme overrides) */
  :root{
    --sans:'Segoe UI',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    --serif:'Iowan Old Style','Palatino Linotype','Book Antiqua',Georgia,'Nanum Myeongjo',serif;
    --bg:#141219; --panel:#1c1a24; --panel2:#232029; --raise:#2a2632;
    --ink:#f2eff7; --mut:#a29daf; --faint:#726d7e; --line:#302c39; --line2:#3b3646;
    --accent:#ff6551; --accent-soft:rgba(255,101,81,.14); --accent-ink:#ff8574;
    --good:#43c88a; --good-soft:rgba(67,200,138,.15); --bad:#ff6b81; --bad-soft:rgba(255,107,129,.13);
    --shadow:0 18px 50px -18px rgba(0,0,0,.6); --shadow-sm:0 4px 18px -8px rgba(0,0,0,.5);
    --r:16px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f4f1ea; --panel:#fffdf9; --panel2:#f7f4ec; --raise:#ffffff;
      --ink:#211f2a; --mut:#6d6878; --faint:#9a95a3; --line:#e7e1d5; --line2:#ddd6c8;
      --accent:#e04e2f; --accent-soft:rgba(224,78,47,.10); --accent-ink:#c8431f;
      --good:#2e9e6b; --good-soft:rgba(46,158,107,.12); --bad:#d6455c; --bad-soft:rgba(214,69,92,.09);
      --shadow:0 22px 48px -24px rgba(70,55,40,.35); --shadow-sm:0 6px 20px -12px rgba(70,55,40,.3);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;
    -webkit-font-smoothing:antialiased;line-height:1.62;letter-spacing:-.01em;word-break:keep-all}
  ::selection{background:var(--accent-soft);color:var(--accent-ink)}
  .wrap{max-width:940px;margin:0 auto;padding:0 18px 96px}
  a{color:var(--accent-ink)}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* Header */
  header.top{display:flex;align-items:center;gap:13px;padding:18px 0 14px;position:sticky;top:0;z-index:30;
    background:linear-gradient(180deg,var(--bg) 72%,transparent)}
  .mark{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;font-size:21px;
    background:var(--ink);color:var(--bg);box-shadow:var(--shadow-sm)}
  .brand h1{font-family:var(--serif);font-size:21px;margin:0;font-weight:700;letter-spacing:-.02em}
  .brand h1 .dot{color:var(--accent)}
  .brand p{margin:0;color:var(--mut);font-size:12px;letter-spacing:0}
  .prog{margin-left:auto;text-align:right;min-width:118px}
  .prog small{color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .prog .track{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
  .prog .fill{height:100%;width:0;background:var(--accent);transition:width .5s cubic-bezier(.2,.7,.2,1)}

  /* Hero */
  .hero{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:22px 22px 18px;
    margin-bottom:16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
  .hero .eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
  .hero h2{font-family:var(--serif);font-size:24px;line-height:1.24;margin:0 0 8px;font-weight:700;
    letter-spacing:-.02em;text-wrap:balance;max-width:30ch}
  .hero p{margin:0 0 16px;color:var(--mut);font-size:13.5px;max-width:62ch}
  .stats{display:flex;gap:26px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
  .stat .n{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .stat .l{font-size:11px;color:var(--faint);letter-spacing:.03em;margin-top:3px}
  .stat .n.acc{color:var(--accent)}

  /* Search */
  .search{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);
    border-radius:13px;padding:12px 15px;margin-bottom:22px;box-shadow:var(--shadow-sm);position:sticky;top:74px;z-index:20}
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search .ico{font-size:15px;color:var(--faint)}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:15px;font-family:inherit}
  .search input::placeholder{color:var(--faint)}
  .search .clear{background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:8px;
    padding:5px 10px;cursor:pointer;font-size:12px;display:none;font-weight:600}

  /* Sections */
  .section{margin-bottom:26px}
  .sec-head{display:flex;align-items:center;gap:12px;margin:0 2px 13px}
  .part-no{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--accent);
    font-variant-numeric:tabular-nums;flex:0 0 auto;letter-spacing:0}
  .sec-head h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
  .sec-head .cnt{color:var(--faint);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .sec-head .rule{flex:1;height:1px;background:var(--line)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:11px}
  .u-card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 15px;
    cursor:pointer;position:relative;transition:transform .14s ease,border-color .14s ease,box-shadow .14s ease;overflow:hidden}
  .u-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-sm)}
  .u-card .idx{font-size:10.5px;color:var(--faint);font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums}
  .u-card h4{margin:6px 0 3px;font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
  .u-card .en{color:var(--mut);font-size:11.5px;margin:0;line-height:1.42}
  .u-card .chk{position:absolute;top:13px;right:13px;width:18px;height:18px;border-radius:50%;
    background:var(--good);display:none;place-items:center;color:#fff;font-size:11px}
  .u-card.done .chk{display:grid}
  .u-card.done{border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
  .u-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);
    transform:scaleY(0);transform-origin:top;transition:transform .16s ease}
  .u-card:hover::before{transform:scaleY(1)}
  .no-res{color:var(--mut);text-align:center;padding:44px 0;font-size:14px}

  /* Unit view */
  .back{display:inline-flex;align-items:center;gap:7px;background:none;border:none;color:var(--mut);
    font-size:13.5px;cursor:pointer;padding:16px 0 6px;font-weight:600}
  .back:hover{color:var(--accent)}
  .u-tag{display:inline-block;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:99px;
    background:var(--accent-soft);color:var(--accent-ink);letter-spacing:.03em}
  .u-title{font-family:var(--serif);margin:9px 0 2px;font-size:25px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
  .u-sub{margin:0 0 4px;color:var(--mut);font-size:13.5px}
  .tabs{display:flex;gap:4px;margin:14px 0 16px;position:sticky;top:70px;z-index:15;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:var(--shadow-sm);flex-wrap:wrap}
  .tab{flex:1;min-width:64px;background:none;border:none;color:var(--mut);border-radius:9px;
    padding:9px 6px;font-size:12.5px;cursor:pointer;font-weight:600;transition:all .13s;white-space:nowrap}
  .tab.active{background:var(--accent);color:#fff}
  .panel{display:none;animation:fade .28s ease}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:19px;margin-bottom:13px;box-shadow:var(--shadow-sm)}
  .box h3{margin:0 0 12px;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--mut);text-transform:uppercase}
  .lead{color:var(--ink);font-size:15px;line-height:1.7}
  .lead b{color:var(--accent-ink);font-weight:700}
  .kv{color:var(--mut);font-size:13px}

  .pat{padding:12px 0;border-top:1px solid var(--line)}
  .pat:first-of-type{border-top:none;padding-top:2px}
  .pat .p-en{font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:-.01em}
  .pat .p-ko{color:var(--mut);font-size:12.5px;margin-top:1px}

  .ex-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-top:1px solid var(--line)}
  .ex-row:first-of-type{border-top:none;padding-top:2px}
  .ex-row .ex-txt{flex:1}
  .ex-row .ex-en{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
  .ex-row .ex-ko{color:var(--mut);font-size:12.5px}
  .say{flex:0 0 auto;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--accent-ink);cursor:pointer;font-size:16px;display:grid;place-items:center;transition:all .13s}
  .say:hover{background:var(--accent);color:#fff;border-color:transparent}
  .say:active{transform:scale(.92)}

  .dlg{display:flex;gap:10px;margin:13px 0}
  .dlg .who{flex:0 0 38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:14px}
  .dlg.a .who{background:var(--ink);color:var(--bg)}
  .dlg.b .who{background:var(--accent);color:#fff}
  .bubble{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:11px 14px;flex:1}
  .bubble .b-en{font-weight:600;font-size:14.5px;display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
  .bubble .b-ko{color:var(--mut);font-size:12.5px;margin-top:2px}
  .bubble .say{width:30px;height:30px;font-size:14px}

  /* Quiz */
  .quiz-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .quiz-top .qbar{flex:1;height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .quiz-top .qfill{height:100%;width:0;background:var(--accent);transition:width .35s ease}
  .quiz-top .qprog{font-size:12px;color:var(--mut);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .q{padding:16px 0;border-top:1px solid var(--line)}
  .q:first-of-type{border-top:none;padding-top:2px}
  .q .q-n{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.05em;font-variant-numeric:tabular-nums}
  .q .q-txt{font-weight:600;font-size:15px;margin:5px 0 11px;line-height:1.55}
  .q .q-txt .blank{color:var(--accent-ink);font-weight:800;letter-spacing:1px}
  .opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);border-radius:10px;padding:11px 14px;margin-bottom:7px;cursor:pointer;font-size:14px;transition:all .12s;font-family:inherit}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt.correct{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
  .opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
  .opt:disabled{cursor:default}
  .explain{font-size:13px;color:var(--mut);margin-top:5px;padding:10px 13px;background:var(--panel2);
    border-left:3px solid var(--accent);border-radius:8px;display:none}
  .explain.show{display:block}
  .quiz-done{text-align:center;padding:20px 10px 8px}
  .quiz-done .score{font-family:var(--serif);font-size:40px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  .quiz-done .msg{color:var(--mut);margin-top:2px;font-size:14px}

  .speak-card{text-align:center;padding:24px 18px}
  .speak-target{font-family:var(--serif);font-size:22px;font-weight:700;margin:8px 0 4px;letter-spacing:-.01em;text-wrap:balance}
  .speak-ko{color:var(--mut);font-size:13.5px;margin-bottom:18px}
  .mic{width:76px;height:76px;border-radius:50%;border:none;cursor:pointer;font-size:30px;color:#fff;
    background:var(--accent);box-shadow:0 12px 30px -8px var(--accent-soft);transition:transform .12s}
  .mic:active{transform:scale(.9)}
  .mic.rec{animation:pulse 1.1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent-soft)}70%{box-shadow:0 0 0 20px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .heard{margin-top:16px;min-height:26px;font-size:15px;color:var(--mut)}
  .heard b{color:var(--ink)}
  .speak-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:11px;
    padding:10px 17px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;transition:all .12s}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#fff;border-color:transparent}
  .btn:disabled{opacity:.4;cursor:default}
  .match-good{color:var(--good);font-weight:700}
  .match-bad{color:var(--bad)}
  .hint{font-size:12px;color:var(--faint);margin-top:14px}
  .done-btn{display:block;width:100%;margin-top:8px;padding:13px;border-radius:12px;border:none;
    background:var(--good);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .footer-note{text-align:center;color:var(--faint);font-size:11px;margin-top:28px;line-height:1.7}
  @media(max-width:520px){.wrap{padding:0 13px 82px}.hero h2{font-size:21px}.u-title{font-size:22px}
    .stats{gap:18px}.prog{min-width:96px}.search{top:70px}.tabs{top:66px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="mark">🗣️</div>
    <div class="brand">
      <h1>Speak Up<span class="dot">.</span></h1>
      <p>회화 중심 영문법 · 전체 <span id="totalCount">0</span>유닛</p>
    </div>
    <div class="prog">
      <small><span id="doneCount">0</span> / <span id="totalCount2">0</span> 완료</small>
      <div class="track"><div class="fill" id="progFill"></div></div>
    </div>
  </header>
  <main id="app"></main>
  <div class="footer-note">
    Grammar in Use Intermediate 커리큘럼(145유닛 · 16개 파트) 구성을 참고한 오리지널 학습 콘텐츠 ·
    발음 듣기 🔊 · 말하기 🎤 는 브라우저 음성 기능을 사용합니다 (Chrome 권장)
  </div>
</div>

<script type="application/json" id="unitData">__UNIT_DATA_JSON__</script>
<script>
const UNITS = JSON.parse(document.getElementById("unitData").textContent);
document.getElementById("totalCount").textContent = UNITS.length;
document.getElementById("totalCount2").textContent = UNITS.length;

const STORE_KEY = "speakup_progress_v2";
let progress = {};
try{ progress = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ progress = {}; }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }catch(e){} }

const app = document.getElementById("app");
function esc(s){ return String(s).replace(/'/g,"\\'"); }
function refreshProgress(){
  const done = Object.keys(progress).filter(k=>progress[k]).length;
  document.getElementById("doneCount").textContent = done;
  document.getElementById("progFill").style.width = (done/UNITS.length*100)+"%";
}
const SECTIONS = [];
UNITS.forEach(u=>{ if(!SECTIONS.includes(u.tag)) SECTIONS.push(u.tag); });
const pad2 = n => String(n).padStart(2,"0");

let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, rate=0.95){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang="en-US"; u.rate=rate;
  const v = voices.find(v=>/en-US/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang));
  if(v) u.voice=v; speechSynthesis.speak(u);
}

let searchTerm = "";
function renderHome(){
  refreshProgress();
  const idxOf = {}; UNITS.forEach((u,i)=>idxOf[u.id]=i);
  const term = searchTerm.trim().toLowerCase();
  const match = u => !term || (u.title+" "+u.en+" "+u.tag).toLowerCase().includes(term);
  const totalQ = UNITS.reduce((s,u)=>s+(u.quiz?u.quiz.length:0),0);

  let sectionsHtml = SECTIONS.map((sec,si)=>{
    const items = UNITS.filter(u=>u.tag===sec && match(u));
    if(!items.length) return "";
    const doneN = items.filter(u=>progress[u.id]).length;
    const cards = items.map(u=>`
      <div class="u-card ${progress[u.id]?'done':''}" onclick="openUnit('${u.id}')">
        <div class="chk">✓</div>
        <div class="idx">UNIT ${idxOf[u.id]+1}</div>
        <h4>${u.title}</h4>
        <p class="en">${u.en}</p>
      </div>`).join("");
    return `<div class="section">
      <div class="sec-head"><span class="part-no">${pad2(si+1)}</span><h3>${sec}</h3>
        <span class="cnt">${doneN}/${items.length}</span><span class="rule"></span></div>
      <div class="grid">${cards}</div></div>`;
  }).join("");
  if(!sectionsHtml.trim()) sectionsHtml = `<div class="no-res">‘${searchTerm}’ 검색 결과가 없어요.</div>`;

  app.innerHTML = `
    <div class="hero">
      <p class="eyebrow">Grammar in Use · Intermediate</p>
      <h2>회화가 되는 영문법, 전체 커리큘럼을 직접 말하며</h2>
      <p>유닛마다 설명 · 예문 듣기 · 실전 대화 · 퀴즈 · 말하기로 익혀요. 🔊 로 원어민 발음을 듣고,
      🎤 로 따라 말하면 발음이 채점됩니다. 진도는 자동 저장돼요.</p>
      <div class="stats">
        <div class="stat"><div class="n">${UNITS.length}</div><div class="l">유닛</div></div>
        <div class="stat"><div class="n">${SECTIONS.length}</div><div class="l">파트</div></div>
        <div class="stat"><div class="n acc">${totalQ.toLocaleString()}</div><div class="l">퀴즈 문제</div></div>
      </div>
    </div>
    <div class="search">
      <span class="ico">🔎</span>
      <input id="searchInput" type="text" placeholder="유닛 검색 (예: 현재완료, phrasal, 관사...)" value="${searchTerm.replace(/"/g,'&quot;')}" />
      <button class="clear" id="clearBtn" onclick="clearSearch()">지우기</button>
    </div>
    ${sectionsHtml}`;

  const inp = document.getElementById("searchInput");
  document.getElementById("clearBtn").style.display = searchTerm ? "block" : "none";
  inp.oninput = (e)=>{
    searchTerm = e.target.value; const pos = e.target.selectionStart;
    renderHome();
    const ni = document.getElementById("searchInput"); ni.focus();
    try{ ni.setSelectionRange(pos,pos); }catch(_){}
  };
  if(term){ inp.focus(); const L=inp.value.length; try{inp.setSelectionRange(L,L);}catch(_){} }
}
function clearSearch(){ searchTerm=""; renderHome(); }

function openUnit(id){
  const u = UNITS.find(x=>x.id===id);
  const idx = UNITS.findIndex(x=>x.id===id);
  window.__unit = u; quizState = {};
  app.innerHTML = `
    <button class="back" onclick="renderHome()">← 유닛 목록</button>
    <div><span class="u-tag">UNIT ${idx+1} · ${u.tag}</span></div>
    <h2 class="u-title">${u.title}</h2>
    <p class="u-sub">${u.en}</p>
    <div class="tabs">
      <button class="tab active" data-t="learn" onclick="switchTab(this)">📖 설명</button>
      <button class="tab" data-t="ex" onclick="switchTab(this)">🔊 예문</button>
      <button class="tab" data-t="dlg" onclick="switchTab(this)">💬 대화</button>
      <button class="tab" data-t="quiz" onclick="switchTab(this)">✏️ 퀴즈</button>
      <button class="tab" data-t="speak" onclick="switchTab(this)">🎤 말하기</button>
    </div>
    <div class="panel active" data-p="learn">${renderLearn(u)}</div>
    <div class="panel" data-p="ex">${renderExamples(u)}</div>
    <div class="panel" data-p="dlg">${renderDialogue(u)}</div>
    <div class="panel" data-p="quiz">${renderQuiz(u)}</div>
    <div class="panel" data-p="speak">${renderSpeak(u)}</div>`;
  window.scrollTo(0,0);
}
function switchTab(btn){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  btn.classList.add("active");
  const t = btn.dataset.t;
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active", p.dataset.p===t));
}
function renderLearn(u){
  const pats = (u.patterns||[]).map(p=>`<div class="pat"><div class="p-en">${p.en}</div><div class="p-ko">${p.ko}</div></div>`).join("");
  return `<div class="box"><h3>핵심 개념</h3><p class="lead">${u.intro}</p></div>
    <div class="box"><h3>핵심 패턴</h3>${pats}</div>`;
}
function renderExamples(u){
  const rows = (u.examples||[]).map(e=>`
    <div class="ex-row"><div class="ex-txt"><div class="ex-en">${e.en}</div><div class="ex-ko">${e.ko}</div></div>
      <button class="say" onclick="speak('${esc(e.en)}')" title="발음 듣기">🔊</button></div>`).join("");
  return `<div class="box"><h3>예문 듣기</h3>${rows}</div>`;
}
function renderDialogue(u){
  const lines = (u.dialogue||[]).map(d=>`
    <div class="dlg ${d.w==='A'?'a':'b'}"><div class="who">${d.w}</div>
      <div class="bubble"><div class="b-en"><span>${d.en}</span><button class="say" onclick="speak('${esc(d.en)}')">🔊</button></div>
      <div class="b-ko">${d.ko}</div></div></div>`).join("");
  const full = (u.dialogue||[]).map(d=>d.en).join(" ... ");
  return `<div class="box"><h3>실전 대화</h3>${lines}
    <button class="btn primary" style="margin-top:8px" onclick="speak('${esc(full)}',0.92)">▶ 대화 전체 듣기</button></div>`;
}
function renderQuiz(u){
  const n = (u.quiz||[]).length;
  const qs = (u.quiz||[]).map((q,qi)=>{
    const opts = q.opts.map((o,oi)=>`<button class="opt" onclick="answer(this,${qi},${oi},${q.a})">${o}</button>`).join("");
    return `<div class="q" data-qi="${qi}"><div class="q-n">Q${qi+1}</div>
      <div class="q-txt">${String(q.q).replace(/___/g,'<span class="blank">____</span>')}</div>
      ${opts}<div class="explain">💡 ${q.ex}</div></div>`;
  }).join("");
  return `<div class="box">
    <div class="quiz-top"><div class="qbar"><div class="qfill" id="qfill"></div></div><span class="qprog" id="qprog">0 / ${n}</span></div>
    ${qs}<div id="quizResult"></div></div>`;
}
let quizState = {};
function answer(btn, qi, chosen, correct){
  const wrap = btn.closest(".q");
  if(wrap.dataset.answered) return; wrap.dataset.answered="1";
  wrap.querySelectorAll(".opt").forEach((b,i)=>{ b.disabled=true;
    if(i===correct) b.classList.add("correct");
    if(i===chosen && chosen!==correct) b.classList.add("wrong"); });
  wrap.querySelector('.explain').classList.add("show");
  quizState[qi] = (chosen===correct);
  const u = window.__unit, total = u.quiz.length, answered = Object.keys(quizState).length;
  const qf = document.getElementById("qfill"), qp = document.getElementById("qprog");
  if(qf) qf.style.width = (answered/total*100)+"%";
  if(qp) qp.textContent = answered+" / "+total;
  checkQuizDone();
}
function checkQuizDone(){
  const u = window.__unit;
  if(Object.keys(quizState).length < u.quiz.length) return;
  const score = Object.values(quizState).filter(Boolean).length, total = u.quiz.length;
  const pct = Math.round(score/total*100);
  const msg = pct===100?'완벽해요! 🎉':pct>=80?'훌륭해요! 👏':pct>=60?'좋아요, 오답 해설을 다시 봐요 👍':'복습하고 다시 도전해요 💪';
  document.getElementById("quizResult").innerHTML = `
    <div class="quiz-done"><div class="score">${score} / ${total}</div><div class="msg">${msg}</div></div>
    <button class="done-btn" onclick="markDone('${u.id}')">✓ 이 유닛 완료 표시하고 목록으로</button>`;
  document.getElementById("quizResult").scrollIntoView({behavior:"smooth",block:"center"});
}
function markDone(id){ progress[id]=true; save(); renderHome(); }

let SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let sIndex = 0;
function renderSpeak(u){
  sIndex = 0; const supported = !!SR;
  setTimeout(()=>updateSpeakCard(u),0);
  return `<div class="box speak-card">
    <div class="kv"><span id="spCount">1</span> / ${(u.speak||[]).length}</div>
    <div class="speak-target" id="spTarget"></div>
    <div class="speak-ko" id="spKo"></div>
    <button class="say" style="width:44px;height:44px;font-size:18px;margin:0 auto 16px" onclick="speak(document.getElementById('spTarget').textContent)">🔊</button>
    <div><button class="mic" id="micBtn" onclick="startRec()" ${supported?'':'disabled'}>🎤</button></div>
    <div class="heard" id="heard">${supported?'🎤 버튼을 누르고 문장을 따라 말해보세요':'⚠️ 이 브라우저는 음성인식을 지원하지 않아요. Chrome에서 말하기 채점이 가능합니다.'}</div>
    <div class="speak-nav">
      <button class="btn" id="prevBtn" onclick="moveSpeak(-1)">← 이전</button>
      <button class="btn primary" id="nextBtn" onclick="moveSpeak(1)">다음 →</button>
    </div>
    <div class="hint">발음이 완벽하지 않아도 괜찮아요. 반복이 최고의 연습! 💪</div></div>`;
}
function updateSpeakCard(u){
  const arr = u.speak||[];
  document.getElementById("spCount").textContent = sIndex+1;
  document.getElementById("spTarget").textContent = arr[sIndex]||"";
  const m = (u.examples||[]).find(e=>e.en===arr[sIndex]) || (u.dialogue||[]).find(d=>d.en===arr[sIndex]);
  document.getElementById("spKo").textContent = m ? m.ko : "";
  document.getElementById("prevBtn").disabled = (sIndex===0);
  document.getElementById("nextBtn").textContent = (sIndex===arr.length-1)?'완료 ✓':'다음 →';
}
function moveSpeak(dir){
  const u = window.__unit;
  if(dir>0 && sIndex===(u.speak.length-1)){ markDone(u.id); return; }
  sIndex = Math.max(0, Math.min(u.speak.length-1, sIndex+dir)); updateSpeakCard(u);
}
function normalize(s){ return s.toLowerCase().replace(/[^a-z0-9']+/g," ").trim(); }
function similarity(a,b){
  a=normalize(a).split(" "); b=normalize(b).split(" ");
  const setB={}; b.forEach(w=>setB[w]=(setB[w]||0)+1);
  let hit=0; a.forEach(w=>{ if(setB[w]>0){hit++; setB[w]--;} });
  return Math.round(hit/Math.max(a.length,1)*100);
}
function startRec(){
  if(!SR) return;
  const u=window.__unit, target=u.speak[sIndex];
  const rec=new SR(); rec.lang="en-US"; rec.interimResults=false; rec.maxAlternatives=3;
  const btn=document.getElementById("micBtn"), heard=document.getElementById("heard");
  btn.classList.add("rec"); heard.textContent="🎙️ 듣는 중...";
  rec.onresult=(e)=>{
    let best="",bestScore=-1;
    for(let i=0;i<e.results[0].length;i++){ const t=e.results[0][i].transcript; const sc=similarity(t,target); if(sc>bestScore){bestScore=sc;best=t;} }
    const cls=bestScore>=70?'match-good':'match-bad';
    const emoji=bestScore>=90?'🌟 완벽해요!':bestScore>=70?'👍 좋아요!':'🔁 다시 해볼까요?';
    heard.innerHTML=`내가 말한 것: <b>“${best}”</b><br><span class="${cls}">일치율 ${bestScore}% · ${emoji}</span>`;
  };
  rec.onerror=()=>{ heard.textContent="⚠️ 인식 실패. 마이크 권한을 확인하고 다시 시도하세요."; btn.classList.remove("rec"); };
  rec.onend=()=>{ btn.classList.remove("rec"); };
  try{ rec.start(); }catch(err){ btn.classList.remove("rec"); }
}

renderHome();
</script>
</body>
</html>
