f the museum is open처럼 if로 연결하고 주어+동사로 정리해야 합니다.","key":["if the museum is open 어순","Yes/No는 if/whether","도치 제거"]},{"type":"mc","q":"Which sounds natural?","opts":["Do you know who did call?","Do you know who called?","Do you know who does called?"],"a":1,"ex":"who가 주어이므로 did 없이 who called가 자연스럽습니다."},{"type":"write","ko":"이 길이 맞는지 여쭤봐도 될까요?","model":"May I ask if this is the right way?","alts":["Could you tell me whether this is the right way?"],"nuance":"Is this the right way를 그대로 넣으면 도치가 남습니다. if this is the right way처럼 if로 연결하고 주어+동사로 정리해야 정중하고 자연스럽습니다.","key":["if this is 어순","Yes/No는 if/whether","May I ask 정중 표현"]},{"type":"mc","q":"Please tell me ___ the report is finished.","opts":["what","that","whether"],"a":2,"ex":"보고서가 끝났는지 Yes/No를 묻는 것이므로 whether(또는 if)를 씁니다."},{"type":"write","ko":"그들이 언제 도착하는지 아세요?","model":"Do you know when they will arrive?","alts":["Do you know when they are arriving?"],"nuance":"when will they arrive를 그대로 넣으면 도치가 남습니다. when they will arrive처럼 주어(they)를 조동사 앞에 두어야 자연스럽습니다.","key":["when they will arrive 어순","조동사 도치 제거","Do you know 도입"]},{"type":"mc","q":"I cannot remember ___ I put my keys.","opts":["where","that where","where did"],"a":0,"ex":"where I put my keys가 올바른 어순입니다. did는 필요 없습니다."},{"type":"write","ko":"이게 얼마인지 여쭤봐도 될까요?","model":"May I ask how much this costs?","alts":["Could you tell me how much this is?"],"nuance":"how much does this cost를 그대로 넣으면 does가 남습니다. does를 빼고 how much this costs처럼 동사에 -s를 붙여야 합니다. May I ask로 시작하면 정중합니다.","key":["how much this costs 어순","does 제거 후 costs","May I ask 정중 표현"]},{"type":"mc","q":"Turn into indirect: 「Are you ready?」 -> Let me know ___ you are ready.","opts":["that","if","what"],"a":1,"ex":"준비됐는지 Yes/No를 묻는 것이므로 if로 연결하고 are you를 you are로 바꿉니다."}]},{"id":"ch9","title":"전달된 의문문 (화법)","en":"She asked if / where ...","intro":"남이 한 질문을 전할 땐 \u003cb>ask\u003c/b>를 쓰고, Yes/No 질문은 \u003cb>if/whether\u003c/b>, 의문사 질문은 그 \u003cb>의문사\u003c/b>로 잇습니다. 어순은 평서문이고, 전달동사가 과거면 \u003cb>시제가 한 칸 뒤로\u003c/b>(is→was, do→did, will→would) 이동해요.","patterns":[{"en":"asked + (사람) + if/whether + 주어 + 동사(과거로)","ko":"Yes/No 질문"},{"en":"asked + (사람) + 의문사 + 주어 + 동사(과거로)","ko":"Wh- 질문"}],"examples":[{"en":"'Are you ready?' → He asked if I was ready.","ko":"그는 내가 준비됐는지 물었다."},{"en":"'Where do you live?' → She asked me where I lived.","ko":"그녀는 내가 어디 사는지 물었다."},{"en":"'What are you doing?' → He asked what I was doing.","ko":"그는 내가 뭘 하는지 물었다."},{"en":"'Will you come?' → They asked if I would come.","ko":"그들은 내가 올 건지 물었다."}],"tip":"전달동사가 과거면 시제를 뒤로! 그리고 어순은 반드시 \u003cb>평서문\u003c/b>(의문문 도치 없음).","quiz":[{"type":"mc","q":"Report this question: (She said to me) Do you like coffee? -> She asked me ___ I liked coffee.","opts":["if","that","do"],"a":0,"ex":"Yes/No 의문문은 ask + if(또는 whether)로 전달합니다. that은 평서문 전달용입니다."},{"type":"write","ko":"그녀는 나에게 어디에 사는지 물었다.","model":"She asked me where I lived.","alts":["She asked where I lived."],"nuance":"의문사 의문문은 where 뒤에 「주어+동사」 평서문 어순으로 전달합니다. 전달동사(asked)가 과거라서 live도 lived로 한 칸 뒤로 갑니다. do you live? 처럼 do를 넣거나 도치하면 어색하게 들립니다.","key":["ask + 의문사","평서문 어순","시제 일치(과거)"]},{"type":"mc","q":"Report this question: (He asked) Where do you work? -> He asked me where I ___.","opts":["do work","worked","did work"],"a":1,"ex":"전달문에서는 do를 없애고 평서문 어순으로 만듭니다. 전달동사가 과거이므로 work -> worked."},{"type":"write","ko":"그는 나에게 시간이 있는지 물었다.","model":"He asked me if I had time.","alts":["He asked me whether I had time.","He asked if I had time."],"nuance":"Yes/No 질문이라 if 또는 whether로 잇습니다. asked가 과거라서 have -> had로 시제를 한 칸 뒤로 옮깁니다. 직접화법의 Do you have time? 어순을 그대로 쓰면 안 됩니다.","key":["ask + if/whether","평서문 어순","have->had"]},{"type":"mc","q":"Report this question: (She asked) What time is it? -> She asked me what time ___.","opts":["is it","it was","was it"],"a":1,"ex":"의문사 뒤에는 「it was」처럼 평서문 어순이 옵니다. is -> was는 과거 전달동사에 맞춘 시제 일치입니다."},{"type":"write","ko":"나는 그에게 그 영화를 봤는지 물었다.","model":"I asked him if he had seen the movie.","alts":["I asked him whether he had seen the movie."],"nuance":"과거의 경험(Have you seen ...?)을 과거 시점에서 전달하면 현재완료 have seen이 과거완료 had seen으로 한 칸 더 뒤로 갑니다. 자연스럽고 격식 있게 들립니다.","key":["ask + if","have seen->had seen","평서문 어순"]},{"type":"mc","q":"Choose the natural reported question: (Original) Are you ready?","opts":["He asked me that I was ready.","He asked me if I was ready.","He asked me was I ready."],"a":1,"ex":"Yes/No 질문은 if/whether로 전달하며, 도치 없이 「I was」 어순을 씁니다. that은 쓰지 않습니다."},{"type":"write","ko":"그녀는 내가 왜 늦었는지 물었다.","model":"She asked me why I was late.","alts":["She asked why I was late."],"nuance":"why 뒤에 「주어+동사」 평서문 어순으로 씁니다. 원문이 Why are you late? 라도 도치를 풀어 I was로 만들고, 과거 전달동사에 맞춰 am->was로 시제를 내립니다.","key":["ask + why","평서문 어순","am->was"]},{"type":"mc","q":"Report this question: (They asked) Can you swim? -> They asked me ___ I could swim.","opts":["that","if","can"],"a":1,"ex":"조동사 can 의문문도 Yes/No이므로 if/whether로 전달하고, 시제 일치로 can -> could가 됩니다."},{"type":"write","ko":"손님이 화장실이 어디 있는지 물었다.","model":"A customer asked where the restroom was.","alts":["A customer asked me where the bathroom was.","A guest asked where the restroom was."],"nuance":"의문사 where 뒤에 「the restroom was」 평서문 어순으로 씁니다. Where is the restroom? 의 도치를 풀고, asked가 과거라 is->was로 내립니다. 서비스 상황에서 아주 자연스럽습니다.","key":["ask + where","평서문 어순","is->was"]},{"type":"mc","q":"Report this question: (He asked) Did you call her? -> He asked me if I ___ her.","opts":["called","had called","did call"],"a":1,"ex":"직접화법의 과거(Did you call)는 전달 시 과거완료 had called로 한 칸 더 뒤로 갑니다. did는 없앱니다."},{"type":"write","ko":"그는 내가 그 소식을 들었는지 물었다.","model":"He asked me if I had heard the news.","alts":["He asked whether I had heard the news."],"nuance":"Have you heard ...? (현재완료)를 과거 시점에서 전달하면 had heard(과거완료)로 내려갑니다. Yes/No라서 if/whether를 쓰고 평서문 어순을 지킵니다.","key":["ask + if","have heard->had heard","평서문 어순"]},{"type":"mc","q":"Choose the natural reported question: (Original) Where is the station?","opts":["She asked where was the station.","She asked where the station was.","She asked where is the station."],"a":1,"ex":"의문사 뒤에는 도치 없이 「the station was」 어순이 옵니다. 과거 전달동사에 맞춰 is->was."},{"type":"write","ko":"면접관은 내가 그 프로그램을 사용할 수 있는지 물었다.","model":"The interviewer asked me if I could use the program.","alts":["The interviewer asked whether I could use the software."],"nuance":"Can you use ...? 의 can은 시제 일치로 could가 됩니다. Yes/No 질문이라 if/whether로 잇고, you->I, use는 평서문 어순으로 그대로 둡니다. 면접 상황에서 정중하고 자연스럽습니다.","key":["ask + if","can->could","평서문 어순"]},{"type":"mc","q":"Report this question: (She asked) When will you finish? -> She asked me when I ___ finish.","opts":["will","would","won't"],"a":1,"ex":"will은 과거 전달동사에 맞춰 would로 바뀝니다. 의문사 when 뒤에는 「I would finish」 평서문 어순."},{"type":"write","ko":"엄마는 내가 밥을 먹었는지 물었다.","model":"My mom asked me if I had eaten.","alts":["My mom asked if I had eaten yet.","My mother asked whether I had eaten."],"nuance":"Did you eat? / Have you eaten? 둘 다 과거 시점 전달에서 had eaten으로 내려갑니다. if/whether로 잇고 도치 없이 「I had eaten」 어순을 씁니다. 일상 대화에서 매우 흔합니다.","key":["ask + if","시제 한 칸 뒤로","평서문 어순"]},{"type":"mc","q":"Choose the correct one: (Original) Do you have a pen?","opts":["He asked me if did I have a pen.","He asked me if I had a pen.","He asked me if have I a pen."],"a":1,"ex":"if 뒤에는 do/did를 없애고 「I had」 평서문 어순을 씁니다. 도치는 하지 않습니다."},{"type":"write","ko":"그 학생은 선생님에게 시험이 언제인지 물었다.","model":"The student asked the teacher when the exam was.","alts":["The student asked when the test was."],"nuance":"When is the exam? 의 도치를 풀어 「the exam was」로 만들고, asked가 과거라 is->was로 내립니다. 의문사 when 뒤 평서문 어순이 핵심입니다.","key":["ask + when","평서문 어순","is->was"]},{"type":"mc","q":"Report this question: (He asked) Who broke the window? -> He asked who ___ the window.","opts":["did break","broke","had break"],"a":1,"ex":"who가 주어인 의문문은 어순이 이미 평서문이라 그대로 두고, 과거 전달동사에 맞춰 broke를 씁니다. did는 넣지 않습니다."},{"type":"write","ko":"그녀는 내가 그 파티에 올 건지 물었다.","model":"She asked me if I would come to the party.","alts":["She asked whether I was going to come to the party."],"nuance":"Will you come ...? 의 will은 시제 일치로 would가 됩니다. Yes/No라서 if/whether를 쓰고, you->I, 도치 없이 「I would come」 어순으로 전달합니다.","key":["ask + if","will->would","평서문 어순"]},{"type":"mc","q":"Choose the natural reported question: (Original) What are you doing?","opts":["She asked me what was I doing.","She asked me what I was doing.","She asked me what am I doing."],"a":1,"ex":"의문사 what 뒤에 「I was doing」 평서문 어순. 현재진행 are doing은 과거진행 was doing으로 내려갑니다."},{"type":"write","ko":"경찰관이 그에게 어디 가는 중이었는지 물었다.","model":"The police officer asked him where he was going.","alts":["The officer asked where he was going."],"nuance":"Where are you going? 을 과거 시점에서 전달하면 are going -> was going으로 내려갑니다. 의문사 where 뒤 평서문 어순 「he was going」을 지켜야 자연스럽습니다.","key":["ask + where","are going->was going","평서문 어순"]},{"type":"mc","q":"Report this question: (I asked) Have you finished? -> I asked her if she ___ finished.","opts":["has","had","have"],"a":1,"ex":"현재완료 have finished는 과거 시점 전달에서 과거완료 had finished로 내려갑니다. 주어도 she로 바뀝니다."},{"type":"write","ko":"그는 나에게 그녀의 전화번호를 아는지 물었다.","model":"He asked me if I knew her phone number.","alts":["He asked whether I knew her number."],"nuance":"Do you know ...? 에서 do를 없애고 know->knew로 시제를 내립니다. Yes/No라서 if/whether를 쓰고 「I knew」 평서문 어순으로 잇습니다.","key":["ask + if","know->knew","do 삭제"]},{"type":"mc","q":"Choose the correct one: (Original) How much does it cost?","opts":["She asked how much did it cost.","She asked how much it cost.","She asked how much does it cost."],"a":1,"ex":"의문사구 how much 뒤에는 do/does를 없애고 「it cost」 평서문 어순을 씁니다. 과거 전달이라 cost(과거형)."},{"type":"write","ko":"나는 그에게 나를 도와줄 수 있는지 물었다.","model":"I asked him if he could help me.","alts":["I asked whether he could help me."],"nuance":"Can you help me? 의 can->could로 시제 일치, you->he로 주어 변환, if/whether로 잇습니다. 도치 없이 「he could help」 어순이면 정중하고 자연스럽습니다.","key":["ask + if","can->could","주어 변환"]},{"type":"mc","q":"Report this question: (They asked) Whether is it true? style -> They asked whether it ___ true.","opts":["is","was","were"],"a":1,"ex":"whether 뒤 평서문 어순 「it was」. 과거 전달동사에 맞춰 is->was로 시제 일치."},{"type":"write","ko":"그녀는 내가 무엇을 원하는지 물었다.","model":"She asked me what I wanted.","alts":["She asked what I wanted."],"nuance":"What do you want? 에서 do를 없애고 want->wanted로 내립니다. 의문사 what 뒤 「I wanted」 평서문 어순이 핵심입니다. do you want 어순을 그대로 두면 틀립니다.","key":["ask + what","do 삭제","want->wanted"]},{"type":"mc","q":"Choose the natural one: (Original) Are you coming with us?","opts":["He asked if I was coming with them.","He asked if was I coming with them.","He asked that I was coming with them."],"a":0,"ex":"Yes/No는 if로, 도치 없이 「I was coming」. us는 화자 기준으로 them으로 바뀝니다."},{"type":"write","ko":"선생님은 우리에게 숙제를 다 했는지 물었다.","model":"The teacher asked us if we had done our homework.","alts":["The teacher asked whether we had finished our homework."],"nuance":"Did you do ...? / Have you done ...? 는 전달 시 had done으로 내려갑니다. you->we, your->our로 바뀌고 if/whether로 잇습니다. 도치 없는 「we had done」 어순을 지킵니다.","key":["ask + if","시제 한 칸 뒤로","대명사 변환"]},{"type":"mc","q":"Report this question: (He asked) Which one do you prefer? -> He asked which one I ___.","opts":["do prefer","preferred","did prefer"],"a":1,"ex":"which one 뒤에 do를 없애고 「I preferred」 평서문 어순. 과거 전달이라 prefer->preferred."},{"type":"write","ko":"그는 나에게 회의가 취소됐는지 물었다.","model":"He asked me if the meeting had been canceled.","alts":["He asked whether the meeting was canceled."],"nuance":"Has the meeting been canceled? 의 현재완료 수동태는 전달 시 had been canceled로 내려갑니다. Yes/No라서 if/whether, 도치 없이 「the meeting had been canceled」 어순을 씁니다.","key":["ask + if","has been->had been","평서문 어순"]},{"type":"mc","q":"Choose the correct one: (Original) Why did you leave early?","opts":["She asked why did I leave early.","She asked why I had left early.","She asked why I did leave early."],"a":1,"ex":"의문사 why 뒤 평서문 어순, did는 삭제. 직접화법 과거(left)는 전달 시 과거완료 had left로 내려갑니다."},{"type":"write","ko":"그녀는 나에게 언제 돌아올 거냐고 물었다.","model":"She asked me when I would be back.","alts":["She asked when I would come back."],"nuance":"When will you be back? 의 will->would로 시제 일치, you->I로 주어 변환. 의문사 when 뒤 「I would be back」 평서문 어순을 지킵니다.","key":["ask + when","will->would","평서문 어순"]},{"type":"mc","q":"Report this question: (I asked) Is there any milk? -> I asked if there ___ any milk.","opts":["is","was","are"],"a":1,"ex":"There is ...? 의문문도 if로 전달하고 「there was」 평서문 어순으로, 과거 전달동사에 맞춰 is->was."},{"type":"write","ko":"아이가 왜 하늘이 파란지 물었다.","model":"The child asked why the sky was blue.","alts":["The kid asked why the sky is blue."],"nuance":"Why is the sky blue? 의 도치를 풀어 「the sky was blue」로 만듭니다. 원칙적으로 asked 과거에 맞춰 is->was. 다만 변하지 않는 사실이면 is를 그대로 두기도 합니다.","key":["ask + why","평서문 어순","일반적 진실은 시제 유지 가능"]},{"type":"mc","q":"Choose the natural one: (Original) How old are you?","opts":["He asked how old was I.","He asked how old I was.","He asked how old am I."],"a":1,"ex":"의문사구 how old 뒤에 「I was」 평서문 어순. are -> was는 과거 전달동사에 맞춘 시제 일치."},{"type":"write","ko":"그는 나에게 그 열쇠를 봤는지 물었다.","model":"He asked me if I had seen the keys.","alts":["He asked whether I had seen his keys."],"nuance":"Have you seen ...? 는 전달 시 had seen으로 내려갑니다. Yes/No라 if/whether를 쓰고 「I had seen」 도치 없는 어순을 지킵니다. 물건을 찾을 때 아주 흔한 표현입니다.","key":["ask + if","have seen->had seen","평서문 어순"]},{"type":"mc","q":"Report this question: (She asked) Do they speak English? -> She asked if they ___ English.","opts":["speak","spoke","speaks"],"a":1,"ex":"do를 없애고 「they spoke」 평서문 어순. 과거 전달동사에 맞춰 speak->spoke로 시제 일치."},{"type":"write","ko":"직원이 나에게 예약을 했는지 물었다.","model":"The staff member asked me if I had made a reservation.","alts":["The employee asked whether I had a reservation."],"nuance":"Did you make a reservation? / Do you have a reservation? 을 과거로 전달하면 had made / had가 됩니다. if/whether로 잇고 도치 없이 「I had made」 어순을 씁니다. 식당이나 호텔에서 자연스럽습니다.","key":["ask + if","시제 한 칸 뒤로","평서문 어순"]},{"type":"mc","q":"Choose the correct one: (Original) What does this word mean?","opts":["She asked what did this word mean.","She asked what this word meant.","She asked what does this word mean."],"a":1,"ex":"의문사 what 뒤에 does를 없애고 「this word meant」 평서문 어순. 과거 전달이라 mean->meant."},{"type":"write","ko":"그녀는 내가 그를 전에 만난 적이 있는지 물었다.","model":"She asked me if I had met him before.","alts":["She asked whether I had met him before."],"nuance":"Have you met him before? 의 현재완료는 전달 시 과거완료 had met으로 내려갑니다. Yes/No라 if/whether, you->I, 도치 없는 「I had met」 어순을 지킵니다.","key":["ask + if","have met->had met","평서문 어순"]},{"type":"mc","q":"Report this question: (He asked) Where did you buy it? -> He asked where I ___ it.","opts":["bought","had bought","did buy"],"a":1,"ex":"직접화법 과거(bought)는 전달 시 과거완료 had bought로 내려갑니다. did는 삭제하고 「I had bought」 평서문 어순."},{"type":"write","ko":"나는 그에게 내일 시간이 되는지 물었다.","model":"I asked him if he was free tomorrow.","alts":["I asked whether he was available tomorrow."],"nuance":"Are you free tomorrow? 를 전달하면 are->was로 시제를 내립니다(계획은 tomorrow가 그대로일 수 있음). Yes/No라 if/whether, you->he, 도치 없는 「he was free」 어순을 씁니다.","key":["ask + if","are->was","평서문 어순"]},{"type":"mc","q":"Choose the natural one: (Original) Who are you waiting for?","opts":["She asked who I was waiting for.","She asked who was I waiting for.","She asked who am I waiting for."],"a":0,"ex":"의문사 who(목적어)일 때는 도치를 풀어 「I was waiting for」. 현재진행 are waiting -> was waiting."},{"type":"write","ko":"그는 나에게 어느 쪽 길로 가야 하는지 물었다.","model":"He asked me which way he should go.","alts":["He asked which way to go."],"nuance":"Which way should I go? 에서 should는 시제가 잘 안 변하므로 그대로 두되, I->he로 주어를 바꾸고 도치를 풀어 「he should go」로 만듭니다. which way 뒤 평서문 어순이 핵심입니다.","key":["ask + 의문사","평서문 어순","주어 변환"]},{"type":"mc","q":"Report this question: (They asked) Are we late? -> They asked if they ___ late.","opts":["are","were","was"],"a":1,"ex":"if 뒤 「they were」 평서문 어순. are->were는 과거 전달동사에 맞춘 시제 일치, we->they로 주어 변환."},{"type":"write","ko":"그녀는 나에게 그 책을 다 읽었는지 물었다.","model":"She asked me if I had finished the book.","alts":["She asked whether I had read the whole book."],"nuance":"Have you finished ...? 는 전달 시 had finished로 내려갑니다. Yes/No라 if/whether, you->I, 도치 없는 「I had finished」 어순을 지킵니다.","key":["ask + if","have finished->had finished","평서문 어순"]},{"type":"mc","q":"Choose the correct one: (Original) Can I help you?","opts":["He asked if he could help me.","He asked if could he help me.","He asked that he could help me."],"a":0,"ex":"can->could로 시제 일치, I->he, you->me로 대명사 변환. if 뒤 도치 없는 「he could help」 어순."},{"type":"write","ko":"손님이 우리가 몇 시에 문을 닫는지 물었다.","model":"A customer asked what time we closed.","alts":["A customer asked when we closed."],"nuance":"What time do you close? 에서 do를 없애고 close->closed로 내립니다. you->we로 바꾸고 「we closed」 평서문 어순을 씁니다. 가게 상황에서 매우 자연스럽습니다.","key":["ask + what time","do 삭제","close->closed"]},{"type":"mc","q":"Report this question: (He asked) Will it rain? -> He asked if it ___ rain.","opts":["will","would","was"],"a":1,"ex":"will은 과거 전달동사에 맞춰 would로 바뀝니다. Yes/No라 if로 잇고 「it would rain」 평서문 어순."},{"type":"write","ko":"그는 나에게 왜 전화를 받지 않았는지 물었다.","model":"He asked me why I hadn't answered the phone.","alts":["He asked why I didn't answer the phone."],"nuance":"Why didn't you answer ...? 의 과거는 전달 시 과거완료 hadn't answered로 내려갑니다. 의문사 why 뒤 도치 없는 「I hadn't answered」 어순을 지킵니다.","key":["ask + why","didn't->hadn't","평서문 어순"]},{"type":"mc","q":"Choose the natural one: (Original) Is this seat taken?","opts":["She asked if was this seat taken.","She asked if this seat was taken.","She asked that this seat was taken."],"a":1,"ex":"Yes/No 수동태 의문문도 if로 전달, 도치 없이 「this seat was taken」. is->was 시제 일치."},{"type":"write","ko":"아이는 우리가 곧 도착하는지 계속 물었다.","model":"The child kept asking if we were almost there.","alts":["The kid kept asking whether we were there yet."],"nuance":"Are we there yet? 를 전달하면 are->were로 내려갑니다. Yes/No라 if/whether로 잇고 도치 없는 「we were」 어순을 씁니다. 여행 중 아이의 전형적인 질문입니다.","key":["ask + if","are->were","평서문 어순"]},{"type":"mc","q":"Report this question: (I asked) How does this work? -> I asked how it ___.","opts":["works","worked","did work"],"a":1,"ex":"의문사 how 뒤에 does를 없애고 「it worked」 평서문 어순. 과거 전달이라 work->worked."},{"type":"write","ko":"그녀는 나에게 그 회의에 참석할 수 있는지 물었다.","model":"She asked me if I could attend the meeting.","alts":["She asked whether I would be able to attend the meeting."],"nuance":"Can you attend ...? 의 can->could로 시제 일치, you->I. Yes/No라 if/whether로 잇고 도치 없는 「I could attend」 어순을 씁니다. 업무 맥락에서 정중하게 들립니다.","key":["ask + if","can->could","평서문 어순"]},{"type":"mc","q":"Choose the correct one: (Original) What happened here?","opts":["He asked what had happened there.","He asked what did happen there.","He asked what happened here still."],"a":0,"ex":"의문사 what(주어)일 때 어순은 그대로. 과거 happened는 전달 시 had happened로 내려가고, here->there로 바뀝니다."},{"type":"write","ko":"나는 그들에게 저녁으로 무엇을 먹고 싶은지 물었다.","model":"I asked them what they wanted for dinner.","alts":["I asked what they wanted to eat for dinner."],"nuance":"What do you want ...? 에서 do를 없애고 want->wanted로 내립니다. you->they로 바꾸고 「they wanted」 평서문 어순을 씁니다. 일상에서 아주 흔한 표현입니다.","key":["ask + what","do 삭제","want->wanted"]},{"type":"mc","q":"Report this question: (She asked) Do you want to come? -> She asked whether I ___ to come.","opts":["want","wanted","do want"],"a":1,"ex":"whether 뒤 do를 없애고 「I wanted」 평서문 어순. 과거 전달동사에 맞춰 want->wanted."},{"type":"write","ko":"그는 나에게 어젯밤에 어디 있었는지 물었다.","model":"He asked me where I had been the night before.","alts":["He asked where I was the previous night."],"nuance":"Where were you last night? 의 were는 전달 시 had been으로 더 내려가고, last night은 the night before로 바뀝니다. 의문사 where 뒤 도치 없는 「I had been」 어순을 지킵니다.","key":["ask + where","were->had been","시간표현 변환"]},{"type":"mc","q":"Choose the natural one: (Original) Whose bag is this?","opts":["She asked whose bag that was.","She asked whose bag was that.","She asked whose bag is this."],"a":0,"ex":"의문사구 whose bag 뒤 「that was」 평서문 어순. is->was 시제 일치, this->that로 지시어 변환."},{"type":"write","ko":"면접관은 나에게 왜 이 회사에서 일하고 싶은지 물었다.","model":"The interviewer asked me why I wanted to work for the company.","alts":["The interviewer asked why I wanted to work there."],"nuance":"Why do you want to work ...? 에서 do를 없애고 want->wanted로 내립니다. this company는 the company나 there로 바꾸고 「I wanted」 평서문 어순을 씁니다. 면접 상황의 전형적인 질문입니다.","key":["ask + why","do 삭제","want->wanted"]},{"type":"mc","q":"Report this question: (He asked) Did she agree? -> He asked if she ___.","opts":["agreed","had agreed","did agree"],"a":1,"ex":"직접화법 과거(agreed)는 전달 시 과거완료 had agreed로 내려갑니다. did는 삭제, if 뒤 평서문 어순."},{"type":"write","ko":"그녀는 나에게 그 주소를 다시 말해 줄 수 있는지 물었다.","model":"She asked me if I could repeat the address.","alts":["She asked whether I could say the address again."],"nuance":"Can you repeat ...? 의 can->could로 시제 일치, you->I. Yes/No라 if/whether로 잇고 도치 없는 「I could repeat」 어순을 씁니다. 정중한 요청 상황에서 자연스럽습니다.","key":["ask + if","can->could","평서문 어순"]},{"type":"mc","q":"Choose the correct one: (Original) Have they arrived?","opts":["I asked if they had arrived.","I asked if had they arrived.","I asked that they had arrived."],"a":0,"ex":"현재완료 have arrived는 전달 시 had arrived로 내려갑니다. Yes/No라 if, 도치 없는 「they had arrived」 어순."},{"type":"write","ko":"그는 나에게 그 파일을 어디에 저장했는지 물었다.","model":"He asked me where I had saved the file.","alts":["He asked where I saved the file."],"nuance":"Where did you save ...? 에서 did를 없애고 과거를 과거완료 had saved로 내립니다. 의문사 where 뒤 도치 없는 「I had saved」 어순을 지킵니다. 업무 대화에서 흔합니다.","key":["ask + where","did 삭제","시제 한 칸 뒤로"]},{"type":"mc","q":"Report this question: (They asked) Are you feeling okay? -> They asked if I ___ okay.","opts":["am feeling","was feeling","were feeling"],"a":1,"ex":"현재진행 are feeling은 전달 시 was feeling으로 내려갑니다(주어 I). if 뒤 도치 없는 평서문 어순."},{"type":"write","ko":"나는 그에게 그 셔츠를 얼마 주고 샀는지 물었다.","model":"I asked him how much he had paid for the shirt.","alts":["I asked how much he paid for the shirt."],"nuance":"How much did you pay ...? 에서 did를 없애고 과거를 과거완료 had paid로 내립니다. you->he로 바꾸고 how much 뒤 「he had paid」 평서문 어순을 씁니다.","key":["ask + how much","did 삭제","시제 한 칸 뒤로"]}]},{"id":"ch10","title":"전치사 의문문 · 그 밖의 질문들","en":"What ... for? / What ... like? / what to do","intro":"회화형 의문문 마무리! 전치사는 보통 \u003cb>문장 끝\u003c/b>으로 갑니다(What are you looking \u003cb>for\u003c/b>?). 그 외 자주 쓰는 \u003cb>What ... like?\u003c/b>(어때?), \u003cb>What/How about ...?\u003c/b>(제안), \u003cb>의문사 + to부정사\u003c/b>(what to do), \u003cb>선택의문문\u003c/b>(A or B?)도 함께 익혀요.","patterns":[{"en":"의문사 ... 전치사? (전치사는 끝으로)","ko":"Who are you talking to?"},{"en":"What is/are ~ like?","ko":"어떤지 묘사 요청"},{"en":"의문사 + to부정사","ko":"I don't know what to do."}],"examples":[{"en":"What are you looking for?","ko":"뭐 찾고 있어?"},{"en":"What's your new job like?","ko":"새 직장 어때?"},{"en":"How about grabbing a coffee?","ko":"커피 한잔 어때?"},{"en":"I'm not sure where to go.","ko":"어디로 가야 할지 모르겠어."}],"tip":"전치사는 대개 \u003cb>문장 끝\u003c/b>. 'For what are you looking?'보다 'What are you looking for?'가 훨씬 자연스러워요.","quiz":[{"type":"mc","q":"What are you ___ for? (지금 뭘 찾고 있어?)","opts":["look","looking","looked"],"a":1,"ex":"진행형이므로 be동사(are) 뒤에는 looking이 와야 해요. 전치사 for는 문장 끝에 그대로 둡니다."},{"type":"write","ko":"뭘 보고 있어?","model":"What are you looking at?","alts":["What are you staring at?"],"nuance":"영어 회화에서는 전치사(at)를 문장 끝에 두는 것이 가장 자연스럽습니다. At what are you looking?처럼 앞으로 빼면 아주 딱딱하고 문어체로 들려요. 일상 대화에서는 무조건 끝에 붙이세요.","key":["look at","전치사 문장 끝","진행형"]},{"type":"mc","q":"Reorder: (talking / who / you / are / to)? (너 누구랑 얘기하는 거야?)","opts":["Who are you talking to","To who are you talking","Who to are you talking"],"a":0,"ex":"회화에서는 Who are you talking to?가 자연스럽습니다. 전치사 to를 끝에 둡니다. (문법적으로 엄밀하면 whom이지만 일상에서는 who를 씁니다.)"},{"type":"write","ko":"네 새 상사는 어떤 사람이야?","model":"What is your new boss like?","alts":["What is your new manager like?"],"nuance":"성격이나 특징을 물을 때는 What ... like?를 씁니다. How is your boss?는 안부(잘 지내는지)를 묻는 느낌이라 성격을 물을 때는 어색해요. like를 문장 끝에 두는 것을 잊지 마세요.","key":["What...like?","성격을 물음","like 문장 끝"]},{"type":"mc","q":"성격/특징을 물을 때: ___ is she like?","opts":["How","What","Which"],"a":1,"ex":"사람이나 사물의 성격, 특징을 물을 때는 What ... like?를 씁니다. How is she?는 안부를 묻는 표현이에요."},{"type":"write","ko":"오늘 날씨 어때?","model":"What is the weather like today?","alts":["How is the weather today?"],"nuance":"날씨의 상태를 물을 때는 What is the weather like?가 아주 흔하고 자연스럽습니다. How is the weather?도 쓰지만, What...like?는 구체적인 모습(비, 맑음 등)을 그려보게 하는 느낌이에요.","key":["What...like?","날씨","일상 표현"]},{"type":"mc","q":"영화 보러 가는 거 어때? ___ going to a movie?","opts":["How about","What do you","Would you"],"a":0,"ex":"How about + -ing는 제안할 때 씁니다. How about going ...?는 (~하는 거) 어때?라는 뜻이에요."},{"type":"write","ko":"산책하는 거 어때?","model":"How about going for a walk?","alts":["What about taking a walk?","How about a walk?"],"nuance":"제안할 때 How about + 동명사(-ing)를 씁니다. How about go로 쓰면 틀려요. What about ...?도 거의 같은 뜻으로 쓰이며, 명사만 붙여 How about a walk?처럼 짧게 말해도 자연스럽습니다.","key":["How about + -ing","제안","동명사"]},{"type":"mc","q":"주말에 캠핑 가는 거 어때? What ___ camping this weekend?","opts":["about go","about going","to go"],"a":1,"ex":"What about 뒤에도 동명사(-ing)가 옵니다. What about going이 맞아요."},{"type":"write","ko":"커피 한 잔 어때?","model":"How about a cup of coffee?","alts":["What about some coffee?","Do you want some coffee?"],"nuance":"명사를 바로 붙여 How about + 명사로 간단히 제안할 수 있어요. 카페에서 아주 흔한 표현입니다. 동사를 넣고 싶다면 How about grabbing a coffee?처럼 -ing를 씁니다.","key":["How about + 명사","제안","-ing"]},{"type":"mc","q":"어디로 가야 할지 모르겠어. I do not know where ___.","opts":["to go","going","go"],"a":0,"ex":"의문사 + to부정사 구조입니다. where to go는 (어디로 가야 할지)라는 뜻이에요."},{"type":"write","ko":"뭘 사야 할지 모르겠어.","model":"I do not know what to buy.","alts":["I have no idea what to buy."],"nuance":"의문사 + to부정사(what to buy)는 (무엇을 ~해야 할지)를 간결하게 표현합니다. I do not know what I should buy를 줄인 느낌이라 회화에서 아주 자주 쓰여요.","key":["what to + 동사","의문사+to부정사","간결한 표현"]},{"type":"mc","q":"언제 시작해야 할지 알려줘. Tell me ___.","opts":["when start","when to start","when starting"],"a":1,"ex":"의문사 when + to부정사입니다. when to start는 (언제 시작해야 할지)라는 뜻이에요."},{"type":"write","ko":"이걸 어떻게 쓰는지 알려줄 수 있어?","model":"Can you show me how to use this?","alts":["Could you show me how to use this?","Can you teach me how to use this?"],"nuance":"how to + 동사(how to use)는 (~하는 방법)을 나타내는 아주 유용한 표현입니다. show me나 teach me 뒤에 자연스럽게 붙습니다. 원어민이 일상에서 정말 자주 쓰는 패턴이에요.","key":["how to + 동사","방법을 물음","show me"]},{"type":"mc","q":"커피 마실래, 차 마실래? Would you like coffee ___ tea?","opts":["and","or","but"],"a":1,"ex":"둘 중 하나를 고르는 선택의문문에는 or를 씁니다. A or B? 구조예요."},{"type":"write","ko":"여기서 먹을래, 아니면 포장할래?","model":"Do you want to eat here or take it to go?","alts":["For here or to go?","Would you like to eat in or take out?"],"nuance":"선택의문문 A or B?로 두 가지 중 하나를 고르게 합니다. 미국 카페/식당에서는 For here or to go?라는 짧은 표현이 관용적으로 정말 자주 쓰여요. or 앞뒤를 살짝 올렸다 내리는 억양이 자연스럽습니다.","key":["A or B?","선택의문문","for here or to go"]},{"type":"mc","q":"이거 누구 거야? Reorder: (is / whose / this)?","opts":["Whose is this","Whose this is","Is whose this"],"a":0,"ex":"소유를 물을 때 Whose is this?라고 합니다. 의문사 Whose가 맨 앞, 그다음 동사 is 순서예요."},{"type":"write","ko":"이 가방 누구 거야?","model":"Whose bag is this?","alts":["Whose is this bag?"],"nuance":"Whose 뒤에 명사를 붙여 Whose bag is this?라고 하면 (이 가방 누구 거야?)가 됩니다. Who is this bag?이라고 하면 틀려요 — 소유는 반드시 whose를 씁니다.","key":["whose","소유를 물음","Whose + 명사"]},{"type":"mc","q":"무슨 얘기 하고 있었어? What were you talking ___?","opts":["about","for","of"],"a":0,"ex":"talk about(~에 대해 이야기하다)의 전치사 about을 문장 끝에 둡니다. What were you talking about?이 자연스러워요."},{"type":"write","ko":"이거 무슨 재료로 만든 거야?","model":"What is this made of?","alts":["What is this made out of?"],"nuance":"재료를 물을 때 be made of를 쓰고 전치사 of를 문장 끝에 둡니다. Of what is this made?는 지나치게 격식체라 회화에서는 쓰지 않아요. of를 끝에 두는 것이 훨씬 자연스럽습니다.","key":["be made of","전치사 문장 끝","재료를 물음"]},{"type":"mc","q":"어디 출신이야? Where are you ___?","opts":["from","in","at"],"a":0,"ex":"출신을 물을 때 Where are you from?이라고 합니다. 전치사 from을 문장 끝에 둡니다."},{"type":"write","ko":"이 노래는 어떤 느낌이야?","model":"What is this song like?","alts":["What does this song sound like?"],"nuance":"곡의 분위기나 느낌을 물을 때 What is it like? 또는 What does it sound like?를 씁니다. 청각적 인상을 강조하려면 sound like가 더 생생하게 들려요. like를 문장 끝에 두는 점을 기억하세요.","key":["What...like?","sound like","느낌을 물음"]},{"type":"mc","q":"제안: What about ___ a break? (좀 쉬는 거 어때?)","opts":["take","taking","to take"],"a":1,"ex":"What about 뒤에는 동명사(-ing)가 옵니다. taking a break가 맞아요."},{"type":"write","ko":"이번 주말에 영화 보는 거 어때?","model":"How about watching a movie this weekend?","alts":["What about seeing a movie this weekend?","Do you want to watch a movie this weekend?"],"nuance":"How about + -ing로 부드럽게 제안합니다. watch a movie(집에서)와 see a movie(극장에서)는 뉘앙스가 살짝 다르지만 회화에서는 거의 섞어 씁니다. this weekend는 문장 끝에 자연스럽게 붙여요.","key":["How about + -ing","제안","this weekend"]},{"type":"mc","q":"누구를 초대할지 정하자. Let us decide ___.","opts":["who invite","who to invite","who inviting"],"a":1,"ex":"의문사 who + to부정사입니다. who to invite는 (누구를 초대할지)라는 뜻이에요."},{"type":"write","ko":"이거 어떻게 여는지 모르겠어.","model":"I do not know how to open this.","alts":["I cannot figure out how to open this."],"nuance":"how to + 동사로 (~하는 방법)을 표현합니다. I do not know how open this처럼 to를 빼면 틀려요. figure out을 쓰면 (이리저리 해봐도 방법을 못 찾겠다)는 뉘앙스가 더해집니다.","key":["how to + 동사","방법","to 필수"]},{"type":"mc","q":"버스로 갈래, 지하철로 갈래? Should we take the bus ___ the subway?","opts":["nor","or","and"],"a":1,"ex":"선택의문문은 A or B? 구조로 or를 씁니다."},{"type":"write","ko":"차 마실래, 커피 마실래?","model":"Would you like tea or coffee?","alts":["Do you want tea or coffee?","Tea or coffee?"],"nuance":"A or B? 선택의문문입니다. 격식 있게 권할 때는 Would you like ...?, 편하게 물을 때는 짧게 Tea or coffee?라고만 해도 완벽히 자연스러워요. or 앞의 tea를 살짝 올리고 coffee를 내리는 억양을 씁니다.","key":["A or B?","Would you like","선택의문문"]},{"type":"mc","q":"뭘 기다리고 있어? What are you waiting ___?","opts":["for","on","at"],"a":0,"ex":"wait for(~을 기다리다)의 for를 문장 끝에 둡니다. What are you waiting for?가 자연스러워요."},{"type":"write","ko":"이 상자 안에 뭐가 들어 있어?","model":"What is in this box?","alts":["What is inside this box?"],"nuance":"전치사 in을 활용해 What is in this box?라고 간단히 묻습니다. inside를 쓰면 (안쪽에)라는 느낌이 조금 더 강조돼요. 아주 자연스러운 일상 질문입니다.","key":["What is in ...?","전치사","일상 질문"]},{"type":"m hich ... better","A or B?","prefer"]},{"type":"mc","q":"이 편지 누구한테 온 거야? Who is this letter ___?","opts":["from","to","by"],"a":0,"ex":"보낸 사람을 물을 때 from을 문장 끝에 둡니다. Who is this letter from?이 자연스러워요."},{"type":"write","ko":"무엇에 대해 걱정하고 있어?","model":"What are you worried about?","alts":["What are you worrying about?"],"nuance":"be worried about에서 전치사 about을 문장 끝에 둡니다. About what are you worried?는 지나치게 딱딱해요. worried(형용사, 상태)와 worrying(진행형, 지금 하는 행동) 둘 다 되지만 worried가 더 흔합니다.","key":["worried about","전치사 문장 끝","상태 표현"]},{"type":"write","ko":"이 단어 어떻게 발음하는지 알려줄래?","model":"Can you tell me how to pronounce this word?","alts":["How do you pronounce this word?"],"nuance":"how to + 동사(how to pronounce)로 (~하는 방법)을 물어봅니다. tell me 뒤에 붙여 정중하게 부탁하거나, 더 직접적으로 How do you pronounce ...?라고 물어도 됩니다. 둘 다 원어민에게 매우 자연스러워요.","key":["how to pronounce","방법을 물음","tell me"]},{"type":"mc","q":"이 의자 뭘로 만들어졌어? What is this chair made ___?","opts":["from","of","for"],"a":1,"ex":"재료를 말할 때 be made of를 쓰고 of를 문장 끝에 둡니다. What is this chair made of?가 맞아요."},{"type":"write","ko":"우리 지금 갈까, 아니면 좀 더 기다릴까?","model":"Should we go now or wait a bit longer?","alts":["Do you want to go now or wait a little longer?"],"nuance":"A or B? 선택의문문으로 두 행동 중 하나를 고르게 합니다. Should we ...?는 함께 결정하자는 느낌이라 친근해요. a bit longer, a little longer 모두 (조금 더)라는 뜻으로 자연스럽습니다.","key":["A or B?","Should we","선택의문문"]},{"type":"write","ko":"파티에 뭘 입고 갈지 모르겠어.","model":"I do not know what to wear to the party.","alts":["I have no idea what to wear to the party."],"nuance":"what to wear는 (무엇을 입을지)를 간결하게 나타냅니다. 뒤에 to the party처럼 장소를 붙이면 자연스러워요. 옷차림을 고민할 때 원어민이 정말 흔히 쓰는 표현입니다.","key":["what to wear","의문사+to부정사","일상 표현"]},{"type":"mc","q":"뭘 도와드릴까요? What can I help you ___?","opts":["with","for","to"],"a":0,"ex":"help ... with에서 with를 문장 끝에 둡니다. What can I help you with?는 (뭘 도와드릴까요?)라는 자연스러운 표현이에요."},{"type":"write","ko":"이 노래 누가 부른 거야?","model":"Who sings this song?","alts":["Who is this song by?","Who sang this song?"],"nuance":"주어를 묻는 의문사 who는 uance":"A or B? 선택의문문입니다. just를 넣으면 (그냥)이라는 편안한 뉘앙스가 살아요. stay home과 stay in 모두 (집에 있다)는 뜻으로 자연스럽습니다. or 앞뒤 억양에 신경 쓰면 더 자연스러워요.","key":["A or B?","stay home / stay in","just"]},{"type":"write","ko":"이 문 어떻게 잠그는지 모르겠어.","model":"I do not know how to lock this door.","alts":["I cannot figure out how to lock this door."],"nuance":"how to + 동사(how to lock)로 방법을 나타냅니다. figure out을 쓰면 (아무리 해봐도 방법을 못 찾겠다)는 답답함이 담겨요. how 뒤에 to를 빼먹지 않는 것이 중요합니다.","key":["how to lock","방법","to 필수"]},{"type":"mc","q":"뭘 찾고 있으세요? What are you looking ___?","opts":["for","after","up"],"a":0,"ex":"look for(~을 찾다)의 for를 문장 끝에 둡니다. look after는 (돌보다), look up은 (찾아보다)로 뜻이 달라요."},{"type":"write","ko":"어디서 표를 사야 할지 알려줄 수 있어?","model":"Can you tell me where to buy tickets?","alts":["Do you know where to buy tickets?"],"nuance":"where to + 동사(where to buy)로 (어디서 ~해야 할지)를 표현합니다. tell me나 Do you know 뒤에 붙여 정중하게 물어봐요. 여행이나 낯선 곳에서 아주 유용한 자연스러운 표현입니다.","key":["where to buy","의문사+to부정사","tell me"]},{"type":"mc","q":"제안: How about ___ tonight instead? (대신 오늘 밤은 어때?)","opts":["tonight","doing it tonight","to tonight"],"a":1,"ex":"How about 뒤에 동사가 오려면 -ing(doing)를 씁니다. 명사구 tonight만 단독으로 쓰면 어색해요 (How about tonight?은 시간 제안으로는 가능하지만, 문맥상 동작이면 doing it tonight)."},{"type":"write","ko":"네 고향은 어떤 곳이야?","model":"What is your hometown like?","alts":["What is it like where you grew up?"],"nuance":"장소의 특징이나 분위기를 물을 때 What ... like?를 씁니다. What is your hometown like?는 (고향이 어떤 곳이야?)라는 뜻이에요. like를 문장 끝에 두는 것을 잊지 마세요. 스몰토크에서 아주 자연스럽습니다.","key":["What...like?","장소 특징","like 문장 끝"]},{"type":"mc","q":"누구랑 사이좋게 지내? Who do you get along ___?","opts":["with","to","on"],"a":0,"ex":"get along with(~와 사이좋게 지내다)의 with를 문장 끝에 둡니다. Who do you get along with?가 자연스러워요."},{"type":"write","ko":"이 문제를 어떻게 풀어야 할지 모르겠어.","model":"I do not know how to solve this problem.","alts":["I am not sure how to solve this problem."],"nuance":"how to + 동사(how to solve)로 (~하는 방법)을 나타냅니다. solve는 (문제를 풀다/해결하다)에 딱 맞는 동사예요. 공부나 업무에서 막힐 때 원어민이 흔히 쓰는 자연스러운 표현입니다.","key":["how to solve","방법","solve a problem"]},{"type":"write","ko":"주말 어땠어?","model":"How was your weekend?","alts":["What did you do this weekend?"],"nuance":"지난 일의 경험/느낌을 물을 때는 How was ...?를 씁니다. What was your weekend like?도 되지만, 안부처럼 가볍게 물을 때는 How was your weekend?가 가장 흔하고 자연스러워요. 월요일 스몰토크의 단골 표현입니다.","key":["How was ...?","경험을 물음","스몰토크"]},{"type":"mc","q":"어느 걸 고를지 결정했어? Have you decided ___?","opts":["which choose","which to choose","to which choose"],"a":1,"ex":"which + to부정사입니다. which to choose는 (어느 것을 고를지)라는 뜻이에요."},{"type":"write","ko":"이 소포 누구한테 보내는 거야?","model":"Who is this package for?","alts":["Who are you sending this package to?"],"nuance":"수신자를 물을 때 for나 to를 문장 끝에 둡니다. Who is this package for?는 (누구를 위한 거야?), Who are you sending it to?는 (누구한테 보내?)로 살짝 다르지만 둘 다 자연스러워요. 전치사를 끝에 두는 것이 핵심입니다.","key":["for / to 문장 끝","수신자를 물음","전치사"]},{"type":"mc","q":"뭐에 대한 이야기야? (책·영화 등) What is it ___?","opts":["about","of","for"],"a":0,"ex":"be about(~에 관한 것이다)에서 about을 문장 끝에 둡니다. What is it about?은 줄거리를 물을 때 아주 흔한 표현이에요."},{"type":"write","ko":"이 영화 무슨 내용이야?","model":"What is this movie about?","alts":["What is the movie about?"],"nuance":"줄거리나 주제를 물을 때 What is it about?을 씁니다. about을 문장 끝에 두는 것이 자연스러워요. About what is this movie?는 어색합니다. 영화, 책, 노래 등 콘텐츠의 내용을 물을 때 두루 쓰는 표현입니다.","key":["be about","전치사 문장 끝","줄거리를 물음"]},{"type":"write","ko":"지금 나갈까, 아니면 비 그칠 때까지 기다릴까?","model":"Should we leave now or wait until the rain stops?","alts":["Do you want to leave now or wait for the rain to stop?"],"nuance":"A or B? 선택의문문으로 두 행동을 놓고 고르게 합니다. until the rain stops(비가 그칠 때까지)와 wait for the rain to stop(비가 그치기를 기다리다) 둘 다 자연스러워요. or 앞을 올리고 뒤를 내리는 억양이 자연스럽습니다.","key":["A or B?","until / wait for","선택의문문"]},{"type":"mc","q":"성격은 좋은데 외모를 물을 때: ___ does he look like?","opts":["What","How","Which"],"a":0,"ex":"외모를 물을 때는 What ... look like?를 씁니다. How does he look?은 (그가 (지금) 어때 보여?)로 상태를 묻는 느낌이라 결이 달라요."},{"type":"write","ko":"이거 어디에 쓰는 거야?","model":"What is this used for?","alts":["What do you use this for?"],"nuance":"용도를 물을 때 be used for에서 for를 문장 끝에 둡니다. What is this used for?는 (이거 어디에 쓰는 거야?)라는 아주 자연스러운 질문이에요. For what is this used?는 딱딱하니 회화에서는 for를 끝에 두세요.","key":["be used for","전치사 문장 끝","용도를 물음"]},{"type":"mc","q":"택배 기다리는 중이야? Reorder: (for / are / what / waiting / you)?","opts":["What are you waiting for","For what are you waiting","What for are you waiting"],"a":0,"ex":"회화에서는 What are you waiting for?가 자연스럽습니다. wait for의 for를 문장 끝에 둡니다."},{"type":"write","ko":"네 새 룸메이트는 어때? (성격)","model":"What is your new roommate like?","alts":["How is your new roommate?"],"nuance":"룸메이트의 성격을 물을 때 What ... like?를 씁니다. How is your roommate?는 안부(잘 지내?)처럼 들릴 수 있어서 성격을 콕 집어 물으려면 What ... like?가 더 정확해요. like를 문장 끝에 두는 것을 기억하세요.","key":["What...like?","성격을 물음","like 문장 끝"]},{"type":"mc","q":"어느 셔츠를 살지 못 정하겠어. I cannot decide ___.","opts":["which shirt to buy","which shirt buy","which to shirt buy"],"a":0,"ex":"which + 명사 + to부정사입니다. which shirt to buy는 (어느 셔츠를 살지)라는 뜻이에요."},{"type":"write","ko":"밖에서 먹을까, 아니면 뭐 좀 만들어 먹을까?","model":"Should we eat out or cook something?","alts":["Do you want to eat out or make something at home?"],"nuance":"A or B? 선택의문문입니다. eat out(외식하다)과 cook something/make something(직접 해 먹다)을 대비시켰어요. Should we ...?는 함께 정하자는 친근한 느낌을 줍니다. or 앞뒤 억양에 유의하세요.","key":["A or B?","eat out","cook something"]},{"type":"mc","q":"뭘 웃고 있어? What are you ___?","opts":["laughing at","laughing on","laughing for"],"a":0,"ex":"laugh at(~을 보고 웃다)의 at을 문장 끝에 둡니다. What are you laughing at?이 자연스러워요."},{"type":"write","ko":"파티에 누구를 초대해야 할지 모르겠어.","model":"I do not know who to invite to the party.","alts":["I am not sure who to invite to the party."],"nuance":"who + to부정사(who to invite)로 (누구를 초대할지)를 간결하게 표현합니다. 엄격한 문법으로는 whom이지만 회화에서는 who가 훨씬 흔하고 자연스러워요. 뒤에 to the party를 붙이면 문장이 완성됩니다.","key":["who to invite","의문사+to부정사","who vs whom"]},{"type":"write","ko":"이 단어 무슨 뜻이야?","model":"What does this word mean?","alts":["What is the meaning of this word?"],"nuance":"단어의 뜻을 물을 때 What does ... mean?이 가장 자연스럽습니다. What is the meaning of ...?도 맞지만 살짝 격식체예요. 회화에서는 mean을 쓴 첫 번째 표현을 훨씬 자주 씁니다.","key":["What does ... mean?","뜻을 물음","일상 표현"]},{"type":"mc","q":"제안: How about we ___ it tomorrow? (내일 하는 거 어때?)","opts":["did","do","doing"],"a":1,"ex":"How about we 뒤에는 동사 원형이 옵니다. How about we do it tomorrow?가 맞아요."},{"type":"write","ko":"공항에 어떻게 가는지 알려줄 수 있어?","model":"Can you tell me how to get to the airport?","alts":["Do you know how to get to the airport?"],"nuance":"how to get to + 장소는 (~에 가는 방법)을 묻는 아주 유용한 표현입니다. get to는 (~에 도착하다/가다)라는 뜻이에요. 길을 물을 때 원어민이 자연스럽게 쓰는 정중한 구조입니다.","key":["how to get to","길을 물음","tell me"]},{"type":"mc","q":"이 선물 누구를 위한 거야? Who is this gift ___?","opts":["for","to","with"],"a":0,"ex":"(누구를 위한)이라는 뜻으로 for를 문장 끝에 둡니다. Who is this gift for?가 자연스러워요."},{"type":"write","ko":"뭐 마실래, 물이나 주스?","model":"What would you like to drink, water or juice?","alts":["Do you want water or juice?"],"nuance":"선택지를 제시하는 A or B?를 문장 끝에 붙였습니다. 정중하게 권할 때는 What would you like to drink?로 열고 뒤에 water or juice?로 선택지를 줘요. 편하게는 Water or juice?만으로도 충분히 자연스럽습니다.","key":["A or B?","What would you like","선택 제시"]},{"type":"write","ko":"내일 뭐 할 거야?","model":"What are you doing tomorrow?","alts":["What are you up to tomorrow?","Do you have any plans for tomorrow?"],"nuance":"가까운 미래의 계획을 물을 때 현재진행형(are you doing)을 자주 씁니다. What are you up to?는 (뭐 할 거야? / 뭐 하고 지내?)라는 캐주얼한 표현이에요. plans for tomorrow에서 for를 문장 끝에 두는 것도 자연스럽습니다.","key":["현재진행 미래","What are you up to","plans for"]}]}]</script>
<script>
const CHAPTERS = JSON.parse(document.getElementById("chapterData").textContent);
/* 전역 문제 은행: 각 챕터의 문제에 안정적 id/챕터정보 부여 */
const QBANK = [];
CHAPTERS.forEach((c,ci)=>{ (c.quiz||[]).forEach((q,qi)=>{
  QBANK.push(Object.assign({}, q, { id:"ch"+(ci+1)+"-"+qi, ci, ctitle:c.title }));
}); });
document.getElementById("chTotal").textContent = CHAPTERS.length;

const KEY="qmaster_v2";
let store={read:{},wrong:[]};
try{ store = Object.assign(store, JSON.parse(localStorage.getItem(KEY))||{}); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
const app = document.getElementById("app");
function esc(s){ return String(s).replace(/'/g,"\\'"); }

let voices=[]; function lv(){ voices = window.speechSynthesis?speechSynthesis.getVoices():[]; }
if(window.speechSynthesis){ lv(); speechSynthesis.onvoiceschanged=lv; }
function speak(t,rate=0.95){ if(!window.speechSynthesis)return; speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=rate;
  const v=voices.find(v=>/en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang)); if(v)u.voice=v; speechSynthesis.speak(u); }

function refreshProg(){
  const d=Object.keys(store.read).filter(k=>store.read[k]).length;
  document.getElementById("chDone").textContent=d;
  document.getElementById("progFill").style.width=(d/CHAPTERS.length*100)+"%";
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function chCount(ci){ return CHAPTERS[ci].quiz ? CHAPTERS[ci].quiz.length : 0; }

/* ---------- HOME ---------- */
function home(){
  refreshProg();
  const chItems = CHAPTERS.map((c,i)=>`
    <div class="ch-item ${store.read[c.id]?'done':''}" onclick="reader(${i})">
      <div class="ch-num">${i+1}</div>
      <div class="ch-meta"><div class="t">${c.title}</div><div class="e">${c.en}</div></div>
      <div class="ch-q">${chCount(i)}문제</div>
      <div class="ch-chk">✓</div>
    </div>`).join("");
  const wrongN = store.wrong.length;
  app.innerHTML = `
    <div class="hero">
      <p class="eyebrow">Master English Questions</p>
      <h2>의문문, 정말 못 하는 질문이 없도록</h2>
      <p>챕터마다 학습 + 문제. 절반은 <b style="color:var(--accent-ink)">선택형</b>, 절반은 <b style="color:var(--accent-ink)">한글→영어 작문</b>이에요. 작문은 맞다·틀리다가 아니라, 쓴 뒤에 <b style="color:var(--accent-ink)">원어민에게 어떻게 들리는지·어떻게 하면 자연스러운지</b> 코칭이 나와요.</p>
      <div class="stats">
        <div class="stat"><div class="n">${CHAPTERS.length}</div><div class="l">학습 챕터</div></div>
        <div class="stat"><div class="n acc">${QBANK.length}</div><div class="l">연습 문제</div></div>
        <div class="stat"><div class="n">${QBANK.filter(q=>(q.type||'mc')==='write').length}</div><div class="l">영작 문제</div></div>
      </div>
    </div>
    <div class="sec-label"><h3>📚 챕터별 학습 &amp; 문제</h3><span class="rule"></span></div>
    <div class="ch-list">${chItems}</div>
    <div class="sec-label"><h3>✏️ 전체 퀴즈</h3><span class="rule"></span></div>
    <div class="modes">
      <button class="mode wide" onclick="startTest(30)" style="border-color:var(--accent)">
        <div class="mi">🎯</div><div class="mt">종합 테스트 (랜덤 30문제)</div>
        <div class="md">모든 챕터에서 무작위 30문제 · 끝나면 점수와 오답 리뷰</div></button>
      <button class="mode" onclick="startTest(50)"><div class="mi">🔥</div><div class="mt">실력 점검 50문제</div><div class="md">더 길게, 전 범위 랜덤</div></button>
      <button class="mode" onclick="startWrong()" ${wrongN?'':'disabled'}><div class="mi">🔁</div><div class="mt">오답 다시풀기</div><div class="md">${wrongN?wrongN+'문제 대기 중':'아직 없음'}</div></button>
    </div>`;
  window.scrollTo(0,0);
}

/* ---------- READER ---------- */
function reader(i){
  const c = CHAPTERS[i];
  const pats = (c.patterns||[]).map(p=>`<div class="pat"><div class="pe">${p.en}</div><div class="pk">${p.ko}</div></div>`).join("");
  const exs = (c.examples||[]).map(e=>`
    <div class="ex-row"><div class="et"><div class="ee">${e.en}</div><div class="ek">${e.ko}</div></div>
      <button class="say" onclick="speak('${esc(e.en)}')">🔊</button></div>`).join("");
  app.innerHTML = `
    <button class="back" onclick="home()">← 목차</button>
    <div class="ch-head"><span class="u-tag">CHAPTER ${i+1} / ${CHAPTERS.length}</span></div>
    <h2 class="ch-title">${c.title}</h2>
    <p class="ch-sub">${c.en}</p>
    <div class="box"><h4>개념</h4><p class="lead">${c.intro}</p></div>
    <div class="box"><h4>핵심 패턴</h4>${pats}</div>
    <div class="box"><h4>예문 듣기</h4>${exs}</div>
    <div class="box"><div class="tip"><span class="th">이것만은!</span>${c.tip}</div></div>
    <button class="cta" onclick="startChapter(${i})">📝 이 챕터 문제 풀기 (${chCount(i)}문제)</button>
    <button class="btn primary" style="width:100%;margin-bottom:12px" onclick="markRead('${c.id}')">✓ 이 챕터 학습 완료</button>
    <div class="ch-nav">
      <button class="btn" ${i===0?'disabled':''} onclick="reader(${i-1})">← 이전 챕터</button>
      <button class="btn" ${i===CHAPTERS.length-1?'disabled':''} onclick="reader(${i+1})">다음 챕터 →</button>
    </div>`;
  window.scrollTo(0,0);
}
function markRead(id){ store.read[id]=true; save(); home(); }

/* ---------- QUIZ RUNNER ---------- */
let Q={list:[],i:0,mcScore:0,mcTotal:0,writeCount:0,wrong:[],title:""};
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function startChapter(ci){ runQuiz(shuffle(QBANK.filter(q=>q.ci===ci)), CHAPTERS[ci].title); }
function startTest(n){ runQuiz(shuffle(QBANK).slice(0,n), "종합 테스트"); }
function startWrong(){
  const set=new Set(store.wrong);
  const list=QBANK.filter(q=>set.has(q.id));
  if(!list.length){ home(); return; }
  runQuiz(shuffle(list), "오답 다시풀기");
}
function runQuiz(list,title){
  Q={list,i:0,mcScore:0,mcTotal:list.filter(q=>(q.type||'mc')==='mc').length,writeCount:0,wrong:[],title};
  renderQ();
}
function qHeader(){
  const n=Q.list.length;
  return `<button class="back" onclick="home()">← 홈 (그만두기)</button>
    <div class="q-top"><div class="qbar"><div class="qfill" id="qfill" style="width:${(Q.i)/n*100}%"></div></div>
      <span class="qmeta">${Q.i+1} / ${n} · ✓${Q.mcScore}</span></div>
    <div class="q-cat">${Q.title}${Q.list[Q.i].ctitle && Q.list[Q.i].ctitle!==Q.title ? ' · '+Q.list[Q.i].ctitle : ''}</div>`;
}
function renderQ(){
  if(Q.i>=Q.list.length){ return renderResult(); }
  const q=Q.list[Q.i];
  if((q.type||'mc')==='write') return renderWrite(q);
  const n=Q.list.length;
  const opts=q.opts.map((o,oi)=>`<button class="opt" id="opt${oi}" onclick="pick(${oi})">${o}</button>`).join("");
  app.innerHTML=qHeader()+`
    <div class="q-text">${String(q.q).replace(/___/g,'<span class="blank">____</span>')}</div>
    <div id="opts">${opts}</div>
    <div class="explain" id="exp">💡 ${q.ex}</div>
    <div class="q-actions"><button class="btn primary" id="nextBtn" style="display:none" onclick="nextQ()">${Q.i===n-1?'결과 보기 →':'다음 →'}</button></div>`;
  window.scrollTo(0,0);
}
function pick(oi){
  const q=Q.list[Q.i];
  if(document.getElementById("opt0").disabled) return;
  const correct=q.a;
  document.querySelectorAll(".opt").forEach((b,i)=>{ b.disabled=true;
    if(i===correct)b.classList.add("correct");
    if(i===oi&&oi!==correct)b.classList.add("wrong"); });
  document.getElementById("exp").classList.add("show");
  document.getElementById("nextBtn").style.display="inline-block";
  if(oi===correct){ Q.mcScore++; store.wrong = store.wrong.filter(x=>x!==q.id); }
  else { Q.wrong.push({q, chosen:oi}); if(!store.wrong.includes(q.id)) store.wrong.push(q.id); }
  save();
  const qf=document.getElementById("qfill"); if(qf) qf.style.width=((Q.i+1)/Q.list.length*100)+"%";
}
function renderWrite(q){
  app.innerHTML=qHeader()+`
    <div class="w-badge">✍️ 영작 · 한국어를 영어로</div>
    <div class="w-prompt">${q.ko}</div>
    <div class="w-hint">직접 영어로 써본 뒤 확인하면, 원어민에게 어떻게 들리는지 코칭이 나와요.</div>
    <textarea class="w-in" id="writeIn" placeholder="여기에 영어로 써보세요..." autocomplete="off" autocapitalize="off"></textarea>
    <div class="q-actions" id="wConfirm"><button class="btn primary" onclick="revealWrite()">내 답 확인하기 →</button></div>
    <div class="reveal" id="reveal"></div>`;
  window.scrollTo(0,0);
  const ta=document.getElementById("writeIn"); if(ta) ta.focus();
}
function coverage(text, key){
  if(!key||!key.length) return null;
  const t=(text||"").toLowerCase();
  let hit=0; key.forEach(k=>{ if(t.includes(String(k).toLowerCase())) hit++; });
  return {hit, total:key.length};
}
function revealWrite(){
  const q=Q.list[Q.i], n=Q.list.length;
  const ta=document.getElementById("writeIn"); if(!ta) return;
  const mine=ta.value.trim(); ta.disabled=true;
  const alts=(q.alts||[]).filter(Boolean);
  const altHtml=alts.length?`<div class="r-card"><div class="rl">다른 자연스러운 표현</div>`+
    alts.map(a=>`<div class="r-alt"><span style="flex:1">${a}</span><button class="say" onclick="speak('${esc(a)}')">🔊</button></div>`).join("")+`</div>`:"";
  const cov=coverage(mine, q.key);
  const selfHtml=cov?`<div class="r-self">셀프 체크: 핵심 표현 <b>${cov.hit}</b> / ${cov.total} 포함 · 채점이 아니라 참고용이에요 😊</div>`:"";
  document.getElementById("reveal").innerHTML=`
    <div class="r-card"><div class="rl">📝 내가 쓴 문장</div><div class="r-mine">${mine?escapeHtml(mine):'(입력하지 않음)'}</div></div>
    <div class="r-card"><div class="rl">✅ 자연스러운 표현</div>
      <div class="r-model"><span class="rm-t">${q.model}</span><button class="say" onclick="speak('${esc(q.model)}')">🔊</button></div></div>
    ${altHtml}
    <div class="r-nuance"><span class="rn-h">💬 원어민에게는 이렇게 들려요</span>${q.nuance}</div>
    ${selfHtml}
    <div class="w-btns">
      <button class="btn" onclick="writeDone(false)">📝 오답노트에 담기</button>
      <button class="btn primary" onclick="writeDone(true)">✅ 잘 됐어요${Q.i===n-1?' · 결과':' · 다음'}</button>
    </div>`;
  const wc=document.getElementById("wConfirm"); if(wc) wc.style.display='none';
  const qf=document.getElementById("qfill"); if(qf) qf.style.width=((Q.i+1)/Q.list.length*100)+"%";
}
function writeDone(ok){
  const q=Q.list[Q.i]; Q.writeCount++;
  if(ok){ store.wrong = store.wrong.filter(x=>x!==q.id); }
  else { Q.wrong.push({q, write:true}); if(!store.wrong.includes(q.id)) store.wrong.push(q.id); }
  save(); nextQ();
}
function nextQ(){ Q.i++; renderQ(); }
function renderResult(){
  const mcT=Q.mcTotal, mcS=Q.mcScore, pct=mcT?Math.round(mcS/mcT*100):100;
  const msg = mcT===0 ? '작문 연습 완료! 🎉'
    : (pct===100?'완벽해요! 🎉':pct>=80?'훌륭해요! 👏':pct>=60?'좋아요 👍 오답을 다시 봐요.':'복습하고 다시 도전해요 💪');
  const scoreLine = mcT
    ? `<div class="big">${mcS} / ${mcT}</div><div class="msg">선택형 정답 · 작문 연습 ${Q.writeCount}개 완료</div>`
    : `<div class="big">✍️ ${Q.writeCount}</div><div class="msg">작문 연습 완료</div>`;
  const rev = Q.wrong.length ? `<div class="rev"><div class="rh">다시 볼 문제 (${Q.wrong.length})</div>`+
    Q.wrong.map(w=> w.write
      ? `<div class="rev-item"><div class="rq">✍️ ${w.q.ko}</div><div class="ra">자연스러운 표현: <span class="ok">${w.q.model}</span></div><div class="rx">💬 ${w.q.nuance}</div></div>`
      : `<div class="rev-item"><div class="rq">${String(w.q.q).replace(/___/g,'____')}</div><div class="ra">정답: <span class="ok">${w.q.opts[w.q.a]}</span> · 내 답: ${w.q.opts[w.chosen]}</div><div class="rx">💡 ${w.q.ex}</div></div>`
    ).join("")+`</div>` : `<p class="ch-sub" style="text-align:center">다시 볼 문제가 없어요 🙌</p>`;
  app.innerHTML=`<button class="back" onclick="home()">← 홈</button>
    <div class="box"><div class="result">
      ${scoreLine}
      <div class="result-btns">
        ${Q.wrong.length?`<button class="btn primary" onclick="runQuiz(shuffle([${Q.wrong.map(w=>JSON.stringify(w.q.id)).join(',')}].map(id=>QBANK.find(q=>q.id===id))),'오답 다시풀기')">🔁 다시 풀기</button>`:''}
        <button class="btn" onclick="home()">홈으로</button>
      </div>
    </div>${rev}</div>`;
  window.scrollTo(0,0);
}

home();
</script>
</body>
</html>
