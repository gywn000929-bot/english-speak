<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>의문문 마스터 · 인터랙티브 전자책</title>
<style>
  :root{
    --sans:'Segoe UI',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    --serif:'Iowan Old Style','Palatino Linotype','Book Antiqua',Georgia,'Nanum Myeongjo',serif;
    --bg:#141219; --panel:#1c1a24; --panel2:#232029; --raise:#2a2632;
    --ink:#f2eff7; --mut:#a29daf; --faint:#726d7e; --line:#302c39; --line2:#3b3646;
    --accent:#ff6551; --accent-soft:rgba(255,101,81,.14); --accent-ink:#ff8574;
    --good:#43c88a; --good-soft:rgba(67,200,138,.15); --bad:#ff6b81; --bad-soft:rgba(255,107,129,.13);
    --shadow-sm:0 6px 22px -12px rgba(0,0,0,.6); --r:16px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f4f1ea; --panel:#fffdf9; --panel2:#f7f4ec; --raise:#ffffff;
      --ink:#211f2a; --mut:#6d6878; --faint:#9a95a3; --line:#e7e1d5; --line2:#ddd6c8;
      --accent:#e04e2f; --accent-soft:rgba(224,78,47,.10); --accent-ink:#c8431f;
      --good:#2e9e6b; --good-soft:rgba(46,158,107,.12); --bad:#d6455c; --bad-soft:rgba(214,69,92,.09);
      --shadow-sm:0 8px 24px -14px rgba(70,55,40,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;
    -webkit-font-smoothing:antialiased;line-height:1.62;letter-spacing:-.01em;word-break:keep-all}
  ::selection{background:var(--accent-soft);color:var(--accent-ink)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px 90px}
  button{font-family:inherit}

  header.top{display:flex;align-items:center;gap:13px;padding:18px 0 14px;position:sticky;top:0;z-index:30;
    background:linear-gradient(180deg,var(--bg) 72%,transparent)}
  .mark{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;font-size:20px;
    background:var(--ink);color:var(--bg)}
  .brand h1{font-family:var(--serif);font-size:20px;margin:0;font-weight:700;letter-spacing:-.02em}
  .brand h1 .q{color:var(--accent)}
  .brand p{margin:0;color:var(--mut);font-size:12px}
  .prog{margin-left:auto;text-align:right;min-width:120px}
  .prog small{color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
  .prog .track{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
  .prog .fill{height:100%;width:0;background:var(--accent);transition:width .5s}

  .hero{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:22px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
  .hero .eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
  .hero h2{font-family:var(--serif);font-size:25px;line-height:1.24;margin:0 0 8px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
  .hero p{margin:0 0 16px;color:var(--mut);font-size:13.5px}
  .stats{display:flex;gap:26px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
  .stat .n{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .stat .n.acc{color:var(--accent)}
  .stat .l{font-size:11px;color:var(--faint);margin-top:3px}

  .sec-label{display:flex;align-items:center;gap:10px;margin:20px 2px 12px}
  .sec-label h3{margin:0;font-size:14px;font-weight:700}
  .sec-label .rule{flex:1;height:1px;background:var(--line)}

  .ch-list{display:flex;flex-direction:column;gap:9px}
  .ch-item{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
    border-radius:13px;padding:14px 16px;cursor:pointer;transition:transform .13s,border-color .13s}
  .ch-item:hover{transform:translateX(3px);border-color:var(--accent)}
  .ch-num{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--accent);flex:0 0 auto;width:26px;font-variant-numeric:tabular-nums}
  .ch-meta{flex:1;min-width:0}
  .ch-meta .t{font-size:15px;font-weight:700}
  .ch-meta .e{font-size:11.5px;color:var(--mut)}
  .ch-q{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:99px;padding:3px 9px}
  .ch-chk{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:11px;color:transparent}
  .ch-item.done .ch-chk{background:var(--good);border-color:var(--good);color:#fff}

  .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mode{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;cursor:pointer;text-align:left;transition:transform .13s,border-color .13s}
  .mode:hover{transform:translateY(-3px);border-color:var(--accent)}
  .mode .mi{font-size:22px}
  .mode .mt{font-weight:700;font-size:15px;margin-top:8px}
  .mode .md{color:var(--mut);font-size:12px;margin-top:2px}
  .mode.wide{grid-column:1 / -1}
  .mode:disabled{opacity:.5;cursor:default;transform:none}

  .back{display:inline-flex;align-items:center;gap:7px;background:none;border:none;color:var(--mut);
    font-size:13.5px;cursor:pointer;padding:16px 0 8px;font-weight:600}
  .back:hover{color:var(--accent)}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:13px;box-shadow:var(--shadow-sm)}
  .box h4{margin:0 0 11px;font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--mut);text-transform:uppercase}
  .lead{font-size:15.5px;line-height:1.75}
  .lead b,.tip b{color:var(--accent-ink);font-weight:700}
  .ch-head .u-tag{display:inline-block;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink)}
  .ch-title{font-family:var(--serif);margin:9px 0 2px;font-size:24px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
  .ch-sub{margin:0 0 6px;color:var(--mut);font-size:13.5px}
  .pat{padding:11px 0;border-top:1px solid var(--line)}
  .pat:first-of-type{border-top:none;padding-top:2px}
  .pat .pe{font-family:var(--serif);font-weight:700;font-size:15.5px}
  .pat .pk{color:var(--mut);font-size:12.5px;margin-top:1px}
  .ex-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
  .ex-row:first-of-type{border-top:none;padding-top:2px}
  .ex-row .et{flex:1}
  .ex-row .ee{font-size:15px;font-weight:600}
  .ex-row .ek{color:var(--mut);font-size:12.5px}
  .say{flex:0 0 auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
    color:var(--accent-ink);cursor:pointer;font-size:15px;display:grid;place-items:center;transition:all .13s}
  .say:hover{background:var(--accent);color:#fff;border-color:transparent}
  .tip{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:10px;padding:13px 15px;font-size:13.5px;color:var(--ink)}
  .tip .th{font-weight:800;color:var(--accent-ink);margin-right:5px}
  .cta{display:block;width:100%;padding:15px;border-radius:13px;border:none;background:var(--accent);color:#fff;
    font-size:15px;font-weight:700;cursor:pointer;margin-bottom:12px}
  .ch-nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:11px 17px;
    cursor:pointer;font-size:14px;font-weight:600;transition:all .12s}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#fff;border-color:transparent}
  .btn:disabled{opacity:.4;cursor:default}

  .q-top{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .q-top .qbar{flex:1;height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .q-top .qfill{height:100%;width:0;background:var(--accent);transition:width .35s}
  .q-top .qmeta{font-size:12px;color:var(--mut);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .q-cat{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:14px 0 4px;text-transform:uppercase}
  .q-text{font-size:17px;font-weight:600;line-height:1.55;margin-bottom:14px}
  .q-text .blank{color:var(--accent-ink);font-weight:800;letter-spacing:1px}
  .opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:11px;padding:13px 15px;margin-bottom:9px;cursor:pointer;font-size:15px;transition:all .12s}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt.correct{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
  .opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
  .opt:disabled{cursor:default}
  .explain{font-size:13.5px;color:var(--mut);margin-top:8px;padding:12px 14px;background:var(--panel2);
    border-left:3px solid var(--accent);border-radius:9px;display:none}
  .explain.show{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .q-actions{margin-top:14px;text-align:right}
  .result{text-align:center;padding:14px 6px}
  .result .big{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  .result .msg{color:var(--mut);margin:2px 0 16px}
  .rev{text-align:left;margin-top:14px}
  .rev .rh{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
  .rev-item{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:8px;background:var(--panel2)}
  .rev-item .rq{font-size:14px;font-weight:600}
  .rev-item .ra{font-size:13px;margin-top:5px}
  .rev-item .ra .ok{color:var(--good);font-weight:700}
  .rev-item .rx{font-size:12.5px;color:var(--mut);margin-top:3px}
  .result-btns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .footer-note{text-align:center;color:var(--faint);font-size:11px;margin-top:26px;line-height:1.7}
  .footer-note a{color:var(--accent-ink)}
  @media(max-width:520px){.wrap{padding:0 13px 80px}.modes{grid-template-columns:1fr}.hero h2{font-size:22px}}
</style>
</head>

pts":["far","tall","often"],"a":2,"ex":"업데이트 빈도는 how often."},{"q":"Choose the most natural full question: 'How ___?' asking a friend's age politely.","opts":["much are you","old are you","far are you"],"a":1,"ex":"나이를 물을 땐 How old are you."}]},{"id":"ch5","title":"주어 의문문 vs 목적어 의문문","en":"Who broke it? vs Who did you meet?","intro":"이게 한국인이 가장 많이 헷갈리는 부분! 의문사가 \u003cb>주어\u003c/b>이면 do/does/did를 \u003cb>쓰지 않고\u003c/b> 바로 동사가 와요. 의문사가 \u003cb>목적어\u003c/b>이면 보통의 의문문 어순(do/did 사용)입니다.","patterns":[{"en":"주어 의문문: Who + 동사 ~? (do 없음)","ko":"Who called you? / What happened?"},{"en":"목적어 의문문: Who + did + 주어 + 동사원형 ~?","ko":"Who did you call?"}],"examples":[{"en":"Who broke the window?","ko":"누가 창문 깼어? (누가 = 주어)"},{"en":"Who did you invite?","ko":"누구를 초대했어? (누구를 = 목적어)"},{"en":"What happened last night?","ko":"어젯밤에 무슨 일 있었어?"},{"en":"What did she say to you?","ko":"그녀가 너한테 뭐라고 했어?"}],"tip":"의문사가 주어면 \u003cb>did를 넣지 마세요\u003c/b>. 'Who \u003cb>did\u003c/b> call you?' ✗ → 'Who called you?' ✓","quiz":[{"q":"Who ___ the window? (누가 창문을 깼어?)","opts":["broke","did break","did broke"],"a":0,"ex":"의문사 Who가 주어라서 did 없이 바로 동사 broke."},{"q":"Who ___ you meet at the party? (누구를 만났어?)","opts":["were","did","broke"],"a":1,"ex":"Who가 목적어라 보통 의문문 어순 Who did you meet."},{"q":"What ___ last night? (어젯밤 무슨 일이 있었어?)","opts":["did happen","did happened","happened"],"a":2,"ex":"What이 주어이므로 did 없이 happened."},{"q":"What ___ she say to you? (그녀가 뭐라고 했어?)","opts":["did","was","said"],"a":0,"ex":"What이 목적어라 did she say 어순."},{"q":"주어 의문문: 누가 전화했어?","opts":["Who did call you?","Who called you?","Who did you call?"],"a":1,"ex":"Who가 주어면 did 없이 Who called you."},{"q":"목적어 의문문: 누구한테 전화했어?","opts":["Who called you?","Who you called?","Who did you call?"],"a":2,"ex":"Who가 목적어라 did you call."},{"q":"Who ___ this cake? It looks great. (누가 이 케이크 만들었어?)","opts":["made","did make","did made"],"a":0,"ex":"Who가 주어라 바로 made."},{"q":"Which team ___ the game yesterday? (어느 팀이 이겼어?)","opts":["did win","won","did won"],"a":1,"ex":"Which team이 주어라 did 없이 won."},{"q":"Which book ___ you read last month? (지난달에 어떤 책 읽었어?)","opts":["were","read","did"],"a":2,"ex":"Which book이 목적어라 did you read."},{"q":"틀린 문장을 고르세요.","opts":["Who did call you?","Who called you?","Who did you call?"],"a":0,"ex":"Who가 주어일 때 did를 넣으면 틀림."},{"q":"올바른 문장을 고르세요.","opts":["What did happen to your phone?","What happened to your phone?","What did happened to your phone?"],"a":1,"ex":"What이 주어라 did 없이 happened."},{"q":"Who ___ the door? Nobody is here now. (누가 문 열었어?)","opts":["did open","opened did","opened"],"a":2,"ex":"주어 의문문이라 opened만."},{"q":"Who ___ you help yesterday? (어제 누구를 도왔어?)","opts":["did","was","helped"],"a":0,"ex":"Who가 목적어라 did you help."},{"q":"다음 중 목적어 의문문은?","opts":["What happened?","What did you buy?","Who came in?"],"a":1,"ex":"What did you buy만 목적어 의문문 어순."},{"q":"다음 중 주어 의문문은?","opts":["Who did you invite?","What did you eat?","Who wrote this letter?"],"a":2,"ex":"Who wrote this letter가 주어 의문문."},{"q":"How many people ___ to the meeting? (몇 명이 왔어?)","opts":["came","did come","did came"],"a":0,"ex":"How many people이 주어라 did 없이 came."},{"q":"How many apples ___ you buy? (사과 몇 개 샀어?)","opts":["were","did","bought"],"a":1,"ex":"How many apples가 목적어라 did you buy."},{"q":"Who ___ my coffee? The cup is empty! (누가 내 커피 마셨어?)","opts":["did drink","drink did","drank"],"a":2,"ex":"주어 의문문이라 drank만."},{"q":"What ___ you do last weekend? (지난 주말에 뭐 했어?)","opts":["did","were","done"],"a":0,"ex":"What이 목적어라 did you do."},{"q":"영작: 무엇이 그 소리를 냈어?","opts":["What did make that sound?","What made that sound?","What did that sound make?"],"a":1,"ex":"What이 주어라 What made."},{"q":"영작: 그 소리를 누가 들었어?","opts":["Who did hear that sound?","Who did you heard?","Who heard that sound?"],"a":2,"ex":"Who가 주어라 Who heard."},{"q":"Who ___ the money on the table? (누가 탁자에 돈 뒀어?)","opts":["left","did left","did you left"],"a":0,"ex":"주어 의문문이라 left만."},{"q":"Whose bag ___ you take by mistake? (누구 가방을 실수로 가져갔어?)","opts":["were","did","took"],"a":1,"ex":"목적어라 did you take."},{"q":"틀린 문장을 고르세요.","opts":["What happened?","What did you do?","What did happened?"],"a":2,"ex":"did 뒤에는 동사원형 happen이라야 하고, 주어 의문문이면 did 없이 happened."},{"q":"Which student ___ the highest score? (어느 학생이 최고점 받았어?)","opts":["got","did get","did got"],"a":0,"ex":"Which student이 주어라 got만."},{"q":"Which restaurant ___ they choose for dinner? (어느 식당을 골랐어?)","opts":["were","did","chose"],"a":1,"ex":"목적어라 did they choose."},{"q":"Who ___ first this morning? (오늘 아침 누가 먼저 도착했어?)","opts":["did arrive","did arrived","arrived"],"a":2,"ex":"주어 의문문이라 arrived만."},{"q":"Who ___ you see at the station? (역에서 누구를 봤어?)","opts":["did","were","saw"],"a":0,"ex":"목적어라 did you see."},{"q":"올바른 문장을 고르세요.","opts":["Who does live next door?","Who lives next door?","Who do you lives?"],"a":1,"ex":"Who가 주어라 Who lives."},{"q":"올바른 문장을 고르세요.","opts":["Who does live with you?","Who live you with?","Who do you live with?"],"a":2,"ex":"Who가 목적어(전치사 with의)라 do you live with."},{"q":"What ___ on your desk? It smells strange. (책상에 뭐가 있어?)","opts":["is","did","does"],"a":0,"ex":"What이 주어라 be동사 바로 사용, What is."},{"q":"What ___ you put on my desk? (내 책상에 뭘 놨어?)","opts":["was","did","were"],"a":1,"ex":"목적어라 did you put."},{"q":"Who ___ the dishes tonight? (오늘밤 누가 설거지해?)","opts":["does doing","did doing","is doing"],"a":2,"ex":"주어 의문문 현재진행이라 Who is doing."},{"q":"영작: 누가 너를 초대했어?","opts":["Who invited you?","Who did invite you?","Who did you invited?"],"a":0,"ex":"Who가 주어라 Who invited you."},{"q":"영작: 너는 누구를 초대했어?","opts":["Who invited you?","Who did you invite?","Who you did invite?"],"a":1,"ex":"Who가 목적어라 did you invite."},{"q":"How ___ this happen? (이게 어떻게 일어났어?)","opts":["was","does happened","did"],"a":2,"ex":"How는 부사라 주어가 this. 보통 의문문 How did this happen."},{"q":"Who ___ the answer? Raise your hand. (누가 답을 알아?)","opts":["knows","does know","did knew"],"a":0,"ex":"Who가 주어라 Who knows."},{"q":"What language ___ they speak at home? (집에서 무슨 언어 써?)","opts":["are","do","speaks"],"a":1,"ex":"What language가 목적어라 do they speak."},{"q":"What ___ you so happy today? (뭐가 널 이렇게 행복하게 해?)","opts":["do make","did you make","makes"],"a":2,"ex":"What이 주어라 What makes you."},{"q":"Who ___ the meeting yesterday? (어제 누가 회의를 이끌었어?)","opts":["led","did led","did lead you"],"a":0,"ex":"주어 의문문이라 led만."},{"q":"틀린 문장을 고르세요.","opts":["Who broke the vase?","Who did broke the vase?","Who did you blame?"],"a":1,"ex":"Who 주어인데 did와 broke를 둘 다 써서 이중으로 틀림."},{"q":"Which door ___ during the storm? (폭풍 중에 어느 문이 부서졌어?)","opts":["did break","did broken","broke"],"a":2,"ex":"Which door가 주어라 broke만."},{"q":"Which door ___ you lock last night? (어젯밤 어느 문을 잠갔어?)","opts":["did","were","locked"],"a":0,"ex":"목적어라 did you lock."},{"q":"올바른 문장을 고르세요.","opts":["What did caused the delay?","What caused the delay?","What did the delay cause you?"],"a":1,"ex":"What이 주어라 What caused."},{"q":"영작: 누가 이걸 고쳤고, 너는 누구한테 부탁했어? (앞부분만) 누가 이걸 고쳤어?","opts":["Who did fix this?","Who did you fixed?","Who fixed this?"],"a":2,"ex":"Who가 주어라 Who fixed this."}]},{"id":"ch6","title":"부정의문문과 대답의 함정","en":"Negative questions & Yes/No traps","intro":"'Don't you ~? / Isn't it ~?'처럼 부정으로 물으면 놀람·확인·권유의 느낌이 나요. 가장 중요한 건 \u003cb>대답\u003c/b>! 영어는 질문이 부정이든 아니든, \u003cb>내용이 긍정이면 Yes, 부정이면 No\u003c/b>로 답합니다(한국어와 반대일 때가 많아요).","patterns":[{"en":"Don't you ~? / Aren't you ~? / Isn't it ~?","ko":"확인·놀람"},{"en":"사실이 긍정 → Yes (+긍정)","ko":"Yes, I do."},{"en":"사실이 부정 → No (+부정)","ko":"No, I don't."}],"examples":[{"en":"Don't you like it? Yes, I do! (사실 좋아함)","ko":"이거 안 좋아해? — 아니, 좋아해!"},{"en":"Aren't you tired? No, I'm not.","ko":"안 피곤해? — 응, 안 피곤해."},{"en":"Isn't this seat taken? No, it's free.","ko":"이 자리 주인 없어요? — 네, 비어 있어요."},{"en":"Didn't you get my message?","ko":"내 메시지 못 받았어?"}],"tip":"한국어 '응/아니'에 끌리지 말고 \u003cb>사실\u003c/b>로 판단! 좋아하면 무조건 Yes, 안 하면 무조건 No.","quiz":[{"q":"사실: 나는 커피를 좋아한다. Don't you like coffee? ___, I do.","opts":["Yes","No","Well"],"a":0,"ex":"사실이 긍정(좋아함)이면 질문이 부정이어도 Yes로 답해요."},{"q":"사실: 나는 피곤하지 않다. Aren't you tired? ___, I'm not.","opts":["Yes","No","Sure"],"a":1,"ex":"사실이 부정(안 피곤함)이면 No로 답합니다."},{"q":"'너 그거 안 좋아해?'를 자연스러운 영어로 고르세요.","opts":["You not like it?","Do you not liking it?","Don't you like it?"],"a":2,"ex":"부정의문문은 Don't you + 동사원형 형태예요."},{"q":"사실: 그것은 사실이다. Isn't it true? ___, it is.","opts":["No","Yes","Maybe"],"a":1,"ex":"사실이 긍정이면 Yes, it is.로 답해요."},{"q":"'그녀는 학생이 아니니?'를 영어로 고르세요.","opts":["Not she is a student?","She isn't student not?","Isn't she a student?"],"a":2,"ex":"be동사 부정의문문은 Isn't + 주어 순서입니다."},{"q":"사실: 나는 그를 모른다. Don't you know him? ___, I don't.","opts":["Yes","No","Right"],"a":1,"ex":"사실이 부정(모름)이면 No로 답합니다. 한국어 '응, 몰라'에 속지 마세요."},{"q":"Aren't you hungry? ___ 사실이 '배고프다'라면 알맞은 대답은?","opts":["Yes, I am.","No, I am.","Yes, I'm not."],"a":0,"ex":"배고픈 게 사실(긍정)이면 Yes, I am.으로 답해요."},{"q":"빈칸: ___ you have a car? (너 차 없어? 라는 부정의문문)","opts":["Don't","Aren't","Isn't"],"a":0,"ex":"have는 일반동사라 Don't you have ~? 형태를 씁니다."},{"q":"사실: 이 자리는 비어 있다. Isn't this seat taken? ___, it's free.","opts":["Yes","No","Well"],"a":1,"ex":"자리가 비었다는 것은 taken이 아님(부정)이므로 No로 답해요."},{"q":"'너 어제 안 왔어?'를 영어로 고르세요.","opts":["Don't you came yesterday?","You didn't came yesterday?","Didn't you come yesterday?"],"a":2,"ex":"과거 부정의문문은 Didn't you + 동사원형이에요."},{"q":"어법상 틀린 문장을 고르세요.","opts":["Doesn't he works here?","Doesn't he work here?","Isn't he here?"],"a":0,"ex":"Doesn't 뒤에는 동사원형 work가 와야 합니다."},{"q":"사실: 그들은 부부가 맞다. Aren't they married? ___, they are.","opts":["No","Yes","Not"],"a":1,"ex":"결혼한 게 사실(긍정)이므로 Yes, they are.로 답해요."},{"q":"'우리 늦지 않았어?'를 영어로 고르세요.","opts":["Aren't we late?","We aren't late not?","Not we are late?"],"a":0,"ex":"Aren't we late? 가 자연스러운 부정의문문입니다."},{"q":"사실: 그 가게는 문을 닫았다(영업 안 함). Isn't the shop open? ___, it's closed.","opts":["Yes","No","Sure"],"a":1,"ex":"열려 있지 않음(부정)이 사실이니 No로 답합니다."},{"q":"빈칸: ___ you finish the report? (보고서 아직 안 끝냈어?)","opts":["Didn't","Aren't","Weren't"],"a":0,"ex":"과거 일반동사 부정의문문이라 Didn't you finish ~? 입니다. t","Aren't","Haven't"],"a":0,"ex":"과거 일반동사 부정의문문이라 Didn't they arrive ~? 입니다."},{"q":"사실: 나는 아직 안 끝냈다. Haven't you finished yet? ___, not yet.","opts":["Yes","No","Sure"],"a":1,"ex":"아직 안 끝남(부정)이 사실이니 No, not yet.으로 답해요."},{"q":"'우리 전에 만난 적 없어?'를 영어로 고르세요.","opts":["Haven't we met before?","Don't we met before?","Aren't we meet before?"],"a":0,"ex":"현재완료 부정의문문 Haven't we met before? 를 씁니다."},{"q":"어법상 옳은 문장을 고르세요.","opts":["Don't she like tea?","Doesn't she like tea?","Doesn't she likes tea?"],"a":1,"ex":"3인칭 단수라 Doesn't she like ~? 가 맞아요."},{"q":"사실: 그것은 내 것이 아니다. Isn't it yours? ___, it isn't mine.","opts":["Yes","No","Right"],"a":1,"ex":"내 것이 아님(부정)이 사실이니 No로 답합니다."},{"q":"'너 그 파티에 안 갔어?'를 영어로 고르세요.","opts":["Don't you went the party?","Weren't you go the party?","Didn't you go to the party?"],"a":2,"ex":"과거 부정의문문 Didn't you go ~? 를 씁니다."},{"q":"사실: 나는 지금 바쁘다. Aren't you busy now? ___, I am.","opts":["No","Yes","Well"],"a":1,"ex":"바쁜 게 사실(긍정)이면 Yes, I am.으로 답해요."},{"q":"빈칸: ___ you seen my keys? (내 열쇠 못 봤어?)","opts":["Haven't","Didn't","Aren't"],"a":0,"ex":"경험/완료를 물으므로 Haven't you seen ~? 가 자연스러워요."},{"q":"사실: 그 식당은 비싸지 않다. Isn't it expensive? ___, it's cheap.","opts":["Yes","No","Sure"],"a":1,"ex":"비싸지 않음(부정)이 사실이니 No, it's cheap.으로 답합니다."},{"q":"'그녀는 영어 못하지 않아?'를 영어로 고르세요.","opts":["Doesn't she can speak English?","Isn't she speak English?","Can't she speak English?"],"a":2,"ex":"can의 부정의문문은 Can't she speak ~? 예요."},{"q":"사실: 나는 그를 초대했다. Didn't you invite him? ___, I did.","opts":["No","Yes","Maybe"],"a":1,"ex":"초대한 게 사실(긍정)이므로 Yes, I did.로 답해요."},{"q":"어법상 틀린 대답을 고르세요. Don't you agree? (사실: 동의함)","opts":["No, I do.","Yes, I do.","Yes, I agree."],"a":0,"ex":"동의가 사실이면 Yes, I do.가 맞고 No, I do.는 모순이에요."},{"q":"'너 그 문 안 잠갔어?'를 영어로 고르세요.","opts":["Didn't you lock the door?","Don't you locked the door?","Aren't you lock the door?"],"a":0,"ex":"과거 부정의문문 Didn't you lock ~? 를 씁니다."},{"q":"사실: 우리는 준비가 안 됐다. Aren't we ready? ___, we're not.","opts":["Yes","No","Well"],"a" ~할지 말지' 선택은 whether ... or로 표현."}]},{"id":"ch9","title":"전달된 의문문 (화법)","en":"She asked if / where ...","intro":"남이 한 질문을 전할 땐 \u003cb>ask\u003c/b>를 쓰고, Yes/No 질문은 \u003cb>if/whether\u003c/b>, 의문사 질문은 그 \u003cb>의문사\u003c/b>로 잇습니다. 어순은 평서문이고, 전달동사가 과거면 \u003cb>시제가 한 칸 뒤로\u003c/b>(is→was, do→did, will→would) 이동해요.","patterns":[{"en":"asked + (사람) + if/whether + 주어 + 동사(과거로)","ko":"Yes/No 질문"},{"en":"asked + (사람) + 의문사 + 주어 + 동사(과거로)","ko":"Wh- 질문"}],"examples":[{"en":"'Are you ready?' → He asked if I was ready.","ko":"그는 내가 준비됐는지 물었다."},{"en":"'Where do you live?' → She asked me where I lived.","ko":"그녀는 내가 어디 사는지 물었다."},{"en":"'What are you doing?' → He asked what I was doing.","ko":"그는 내가 뭘 하는지 물었다."},{"en":"'Will you come?' → They asked if I would come.","ko":"그들은 내가 올 건지 물었다."}],"tip":"전달동사가 과거면 시제를 뒤로! 그리고 어순은 반드시 \u003cb>평서문\u003c/b>(의문문 도치 없음).","quiz":[{"q":"Report this question: 'Are you tired?' She asked me ___ tired.","opts":["if I was","if am I","that I was"],"a":0,"ex":"Yes/No 질문은 if + 평서문 어순, 과거로 was."},{"q":"Report this question: 'Do you like tea?' He asked me ___ tea.","opts":["do I like","if I liked","that I like"],"a":1,"ex":"Yes/No는 if, do는 사라지고 동사를 과거 liked로."},{"q":"Report this question: 'Where do you live?' She asked me where ___.","opts":["do I live","did I live","I lived"],"a":2,"ex":"의문사 뒤는 평서문 어순, live는 과거 lived."},{"q":"Report this question: 'What is your name?' He asked me what my name ___.","opts":["was","is","were"],"a":0,"ex":"전달동사가 과거라 is는 was로."},{"q":"Report this question: 'Can you swim?' They asked me ___ swim.","opts":["if I can","if I could","whether can I"],"a":1,"ex":"can은 과거 could로, if + 평서문 어순."},{"q":"Fill in: 'Will you help me?' She asked me ___ help her.","opts":["that I will","will I","if I would"],"a":2,"ex":"will은 would로 바뀌고, 대명사 me는 her로."},{"q":"Report this question: 'When does the bus leave?' He asked when the bus ___.","opts":["left","does leave","did leave"],"a":0,"ex":"의문사 뒤 평서문, does leave는 과거 left로."},{"q":"Which is correct? 'Are they ready?' He asked ___.","opts":["if were they ready","if they were ready","that they are ready"],"a":1,"ex":"Yes/No는 if + 주어 + 동사(was/were)."},{"q":"Report this question: 'Why are you late?' The teacher asked me why I ___ late.","opts":["am","be","was"],"a":2,"ex":"의문사 why 뒤 평서문, am은 과거 was로."},{"q":"Fill in: 'Do you have a pen?' She asked me ___ a pen.","opts":["whether I had","do I have","if had I"],"a":0,"ex":"Yes/No는 whether/if, have는 과거 had로."},{"q":"Report this question: 'How old are you?' He asked me how old I ___.","opts":["am","was","were"],"a":1,"ex":"주어가 I이므로 was, 시제는 한 칸 뒤로."},{"q":"Which is correct? 'Is it raining?' She asked ___.","opts":["if was it raining","that it is raining","if it was raining"],"a":2,"ex":"Yes/No는 if + 평서문, is는 was로."},{"q":"Report this question: 'What do you want?' He asked me what I ___.","opts":["wanted","want","do want"],"a":0,"ex":"의문사 뒤 평서문, want는 과거 wanted로."},{"q":"Fill in: 'Have you finished?' She asked me ___ finished.","opts":["if have I","if I had","that I have"],"a":1,"ex":"현재완료 have finished는 과거완료 had로."},{"q":"Report this question: 'Where is the station?' A man asked me where the station ___.","opts":["is","be","was"],"a":2,"ex":"전달동사 과거라 is는 was로."},{"q":"Which is the correct reported form? 'Do you know him?'","opts":["He asked if I knew him.","He asked did I know him.","He asked that I know him."],"a":0,"ex":"Yes/No는 if, know는 과거 knew로."},{"q":"Report this question: 'Who is calling?' She asked who ___ calling.","opts":["is","was","were"],"a":1,"ex":"의문사 who가 주어, is는 was로."},{"q":"Fill in: 'Are you hungry?' He asked me ___ hungry.","opts":["whether was I","if am I","whether I was"],"a":2,"ex":"Yes/No는 whether + 주어 + was."},{"q":"Report this question: 'How do you feel?' The nurse asked me how I ___.","opts":["felt","feel","do feel"],"a":0,"ex":"의문사 뒤 평서문, feel은 과거 felt로."},{"q":"Which is correct? 'Does she work here?' They asked ___.","opts":["if does she work here","if she worked here","that she works here"],"a":1,"ex":"Yes/No는 if, does는 빠지고 work는 worked로."},{"q":"Report this question: 'What time is it?' He asked me what time it ___.","opts":["is","be","was"],"a":2,"ex":"is는 was로, 어순은 평서문."},{"q":"Fill in: 'Can I sit here?' She asked ___ sit there.","opts":["if she could","if can she","that she can"],"a":0,"ex":"can은 could로, here는 there로 바뀌기도 함."},{"q":"Report this question: 'Why did you leave?' He asked me why I ___.","opts":["left","had left","did leave"],"a":1,"ex":"과거 did leave는 과거완료 had left로."},{"q":"Which is correct? 'Are you coming?' She asked ___.","opts":["was I coming","if am I coming","if I was coming"],"a":2,"ex":"Yes/No는 if + 평서문, am은 was로."},{"q":"Report this question: 'Where are my keys?' He asked where his keys ___.","opts":["were","are","be"],"a":0,"ex":"대명사 my는 his로, are는 were로."},{"q":"Fill in: 'Do you understand?' The teacher asked me ___ understood.","opts":["that I","if I","whether did I"],"a":1,"ex":"Yes/No는 if, do는 빠지고 understand는 과거로."},{"q":"Which is the correct reported form? 'What are you reading?'","opts":["She asked what was I reading.","She asked that I read.","She asked what I was reading."],"a":2,"ex":"의문사 뒤 평서문, are는 was로."},{"q":"Report this question: 'Is he your brother?' She asked me ___ my brother.","opts":["if he was","if was he","that he is"],"a":0,"ex":"Yes/No는 if + he + was, 대명사는 문맥 유지."},{"q":"Fill in: 'How much does it cost?' He asked me how much it ___.","opts":["did cost","cost","costs"],"a":1,"ex":"의문사 뒤 평서문, does cost는 과거 cost로."},{"q":"Which is correct? 'Have they arrived?' I asked ___.","opts":["if had they arrived","that they arrived","if they had arrived"],"a":2,"ex":"현재완료는 과거완료로, if + 평서문."},{"q":"Report this question: 'When will you call me?' She asked when I ___ call her.","opts":["would","will","did"],"a":0,"ex":"will은 would로, me는 her로."},{"q":"Spot the error: 'She asked me where did I go.' The correct form is:","opts":["She asked me where did I went.","She asked me where I went.","She asked me where do I go."],"a":1,"ex":"의문사 뒤는 도치 없이 평서문, go는 went로."},{"q":"Spot the error: 'He asked that I was ready.' The correct form is:","opts":["He asked that I ready.","He asked was I ready.","He asked if I was ready."],"a":2,"ex":"Yes/No 전달은 that이 아니라 if/whether."},{"q":"Fill in: 'Do you speak English?' The tourist asked me ___ English.","opts":["if I spoke","do I speak","if did I speak"],"a":0,"ex":"Yes/No는 if, speak는 과거 spoke로."},{"q":"Which is correct? 'Who wrote this?' She asked who ___ it.","opts":["had written","wrote","did write"],"a":1,"ex":"who가 주어이고 단순 과거 wrote로 자연스럽게 전달."},{"q":"Report this question: 'Are you feeling better?' The doctor asked me ___ better.","opts":["if was I feeling","that I feel","if I was feeling"],"a":2,"ex":"Yes/No는 if, am feeling은 was feeling으로."},{"q":"KR -> EN: '그는 내가 어디 사는지 물었다.'","opts":["He asked where I lived.","He asked where did I live.","He asked that I live."],"a":0,"ex":"의문사 where + 평서문 어순, live는 lived로."},{"q":"KR -> EN: '그녀는 내가 준비됐는지 물었다.'","opts":["She asked was I ready.","She asked if I was ready.","She asked that I am ready."],"a":1,"ex":"Yes/No 질문은 if + I + was ready."},{"q":"Spot the error: 'They asked me if would I come.' The correct form is:","opts":["They asked me if come I would.","They asked me would I come.","They asked me if I would come."],"a":2,"ex":"if 뒤는 평서문 어순: 주어 + would + 동사."},{"q":"Report this question: 'What were you doing?' He asked me what I ___ doing.","opts":["was","were","had been"],"a":0,"ex":"주어 I이므로 was doing, 어순 평서문."},{"q":"Fill in: 'Did you see the movie?' She asked me ___ the movie.","opts":["if I saw yesterday","if I had seen","did I see"],"a":1,"ex":"과거 did see는 과거완료 had seen으로."},{"q":"KR -> EN: '나는 그에게 그가 바쁜지 물었다.'","opts":["I asked him was he busy.","I asked him that he is busy.","I asked him if he was busy."],"a":2,"ex":"Yes/No는 if, is는 was로, 대명사 유지."},{"q":"Which is the correct reported form? 'Where have you been?'","opts":["She asked where I had been.","She asked where had I been.","She asked where have I been."],"a":0,"ex":"의문사 뒤 평서문, have been은 had been으로."},{"q":"Report this question: 'Is this seat free?' A woman asked me ___ that seat was free.","opts":["that","whether","what"],"a":1,"ex":"Yes/No 전달은 whether/if, this는 that으로."},{"q":"KR -> EN: '선생님은 내가 숙제를 끝냈는지 물으셨다.'","opts":["The teacher asked did I finish my homework.","The teacher asked that I finished my homework.","The teacher asked if I had finished my homework."],"a":2,"ex":"Yes/No는 if, 현재완료/과거는 had finished로."}]},{"id":"ch10","title":"전치사 의문문 · 그 밖의 질문들","en":"What ... for? / What ... like? / what to do","intro":"회화형 의문문 마무리! 전치사는 보통 \u003cb>문장 끝\u003c/b>으로 갑니다(What are you looking \u003cb>for\u003c/b>?). 그 외 자주 쓰는 \u003cb>What ... like?\u003c/b>(어때?), \u003cb>What/How about ...?\u003c/b>(제안), \u003cb>의문사 + to부정사\u003c/b>(what to do), \u003cb>선택의문문\u003c/b>(A or B?)도 함께 익혀요.","patterns":[{"en":"의문사 ... 전치사? (전치사는 끝으로)","ko":"Who are you talking to?"},{"en":"What is/are ~ like?","ko":"어떤지 묘사 요청"},{"en":"의문사 + to부정사","ko":"I don't know what to do."}],"examples":[{"en":"What are you looking for?","ko":"뭐 찾고 있어?"},{"en":"What's your new job like?","ko":"새 직장 어때?"},{"en":"How about grabbing a coffee?","ko":"커피 한잔 어때?"},{"en":"I'm not sure where to go.","ko":"어디로 가야 할지 모르겠어."}],"tip":"전치사는 대개 \u003cb>문장 끝\u003c/b>. 'For what are you looking?'보다 'What are you looking for?'가 훨씬 자연스러워요.","quiz":[{"q":"What are you looking ___? (뭐 찾고 있어?)","opts":["for","to","at"],"a":0,"ex":"look for: ~을 찾다. 전치사 for가 끝에 남아요."},{"q":"더 자연스러운 문장을 고르세요.","opts":["For what are you waiting?","What are you waiting for?","What for are you waiting?"],"a":1,"ex":"전치사는 보통 문장 끝으로: What are you waiting for?"},{"q":"Who are you talking ___? (누구랑 얘기하고 있어?)","opts":["with","of","to"],"a":2,"ex":"talk to somebody: ~에게 말하다. 전치사 to가 끝에."},{"q":"새 학교 어때? : What is your new school ___?","opts":["like","likes","liking"],"a":0,"ex":"What ... like?는 상태나 인상을 물어요."},{"q":"커피 한잔 어때? : How about ___ a coffee?","opts":["to grab","grabbing","grab"],"a":1,"ex":"How about + 동사ing로 제안해요."},{"q":"뭐 해야 할지 모르겠어. : I do not know what ___.","opts":["to do","doing","do"],"a":0,"ex":"의문사 + to부정사: what to do."},{"q":"차 마실래, 커피 마실래? : Would you like tea ___ coffee?","opts":["and","or","but"],"a":1,"ex":"선택의문문은 A or B로 물어요."},{"q":"What are you afraid ___? (뭐가 무서워?)","opts":["to","for","of"],"a":2,"ex":"be afraid of: ~을 두려워하다."},{"q":"이 선물은 누구를 위한 거야? : Who is this present ___?","opts":["for","to","with"],"a":0,"ex":"for somebody: ~을 위한. 전치사 for가 끝에."},{"q":"산책 좀 어때? : What about ___ for a walk?","opts":["go","going","to go","went"],"a":1,"ex":"What about + 동사ing로 제안해요."},{"q":"어디로 가야 할지 확실치 않아. : I am not sure where ___.","opts":["to go","going","go"],"a":0,"ex":"where to go: 어디로 가야 할지."},{"q":"누구랑 같이 가고 싶어? : Who do you want to go ___?","opts":["with","for","at"],"a":0,"ex":"go with somebody: ~와 함께 가다."},{"q":"틀린 부분을 고르세요.","opts":["What are you thinking about?","About what are you thinking?","What are you looking at?"],"a":1,"ex":"자연스러운 회화는 전치사를 문장 끝에 둡니다."},{"q":"네 형은 어떤 사람이야? : What is your brother ___?","opts":["like","looks","as"],"a":0,"ex":"What is ~ like?로 성격이나 특징을 물어요."},{"q":"밖에서 먹는 거 어때? : How about ___ out tonight?","opts":["eat","eating","to eat"],"a":1,"ex":"How about + 동사ing."},{"q":"이 편지 누구한테서 온 거야? : Who is this letter ___?","opts":["of","to","from"],"a":2,"ex":"from somebody: ~로부터. 출처를 물을 때 from."},{"q":"무엇을 사야 할지 결정했어? : Have you decided what ___?","opts":["buy","to buy","buying"],"a":1,"ex":"what to buy: 무엇을 살지."},{"q":"버스로 갈까 지하철로 갈까? : Should we go by bus ___ by subway?","opts":["and","or","so"],"a":1,"ex":"선택의문문: A or B."},{"q":"뭐 얘기하는 거야? : What are you talking ___?","opts":["about","to","for"],"a":0,"ex":"talk about: ~에 대해 이야기하다."},{"q":"날씨 어때? (오늘) : What is the weather ___ today?","opts":["like","likes","as"],"a":0,"ex":"What is the weather like?는 날씨를 묻는 대표 표현."},{"q":"이 열쇠는 어디에 쓰는 거야? : What is this key ___?","opts":["for","to","by"],"a":0,"ex":"What ... for?는 용도나 목적을 물어요."},{"q":"영화 보러 가는 거 어때? : What about ___ to a movie?","opts":["go","to go","going"],"a":2,"ex":"What about + 동사ing로 제안."},{"q":"언제 시작해야 할지 말해 줘. : Tell me when ___.","opts":["to start","starting","start"],"a":0,"ex":"when to start: 언제 시작할지."},{"q":"펜으로 쓸까 연필로 쓸까? : Do you write with a pen ___ a pencil?","opts":["or","and","nor"],"a":0,"ex":"선택의문문: A or B."},{"q":"뭘 기다리고 있는 거야? 를 영작하면?","opts":["What are you waiting for?","What do you wait?","For what you wait?"],"a":0,"ex":"wait for + 목적어, 전치사는 끝에."},{"q":"너희 새 이웃은 어때? : What are your new neighbors ___?","opts":["like","likes","alike"],"a":0,"ex":"복수 주어여도 What are ~ like? 형태."},{"q":"이 사진 좀 어때? (같이 보자는 제안) : How about ___ at this photo?","opts":["look","looking","to look"],"a":1,"ex":"How about + 동사ing."},{"q":"어떻게 시작해야 할지 모르겠어. : I have no idea how ___.","opts":["to begin","begin","beginning"],"a":0,"ex":"how to begin: 어떻게 시작할지."},{"q":"걸어갈래, 택시 탈래? : Do you want to walk ___ take a taxi?","opts":["and","or","but"],"a":1,"ex":"선택의문문: A or B."},{"q":"넌 뭐에 관심 있어? : What are you interested ___?","opts":["on","at","in"],"a":2,"ex":"be interested in: ~에 관심 있다."},{"q":"자연스러운 문장을 고르세요.","opts":["To whom did you give it?","Who did you give it to?","Whom to you give it?"],"a":1,"ex":"회화에서는 전치사 to를 문장 끝에 둡니다."},{"q":"너희 선생님은 어떤 분이셔? : What is your teacher ___?","opts":["like","kind","looks"],"a":0,"ex":"What is ~ like?로 사람의 특징을 물어요."},{"q":"오늘 밤 게임 하는 거 어때? : What about ___ a game tonight?","opts":["play","playing","to play"],"a":1,"ex":"What about + 동사ing."},{"q":"누구에게 물어봐야 할지 모르겠어. : I do not know who ___.","opts":["to ask","asking","ask"],"a":0,"ex":"who to ask: 누구에게 물을지."},{"q":"빨간색 원해, 파란색 원해? : Do you want the red one ___ the blue one?","opts":["and","so","or"],"a":2,"ex":"선택의문문: A or B."},{"q":"이건 누구 거야? 를 영작하면?","opts":["Who does this belong to?","To whom this belongs?","Who to this belongs?"],"a":0,"ex":"belong to, 전치사 to는 문장 끝에 자연스럽게."},{"q":"넌 무엇을 잘하니? : What are you good ___?","opts":["for","to","at"],"a":2,"ex":"be good at: ~을 잘하다."},{"q":"제주도 어때? (여행지가 어떤지) : What is Jeju Island ___?","opts":["like","likes","liked"],"a":0,"ex":"What is ~ like?로 장소가 어떤지 물어요."},{"q":"우리 좀 쉬는 거 어때? : How about ___ a break?","opts":["take","taking","to take"],"a":1,"ex":"How about + 동사ing."},{"q":"이 기계 사용법을 배웠어. : I learned how ___ this machine.","opts":["to use","using","use"],"a":0,"ex":"how to use: 어떻게 사용할지, 사용법."},{"q":"여기 남을래, 나갈래? : Will you stay here ___ go out?","opts":["and","or","for"],"a":1,"ex":"선택의문문: A or B."},{"q":"뭐 웃는 거야? : What are you laughing ___?","opts":["for","to","at"],"a":2,"ex":"laugh at: ~을 보고 웃다."},{"q":"틀린 부분을 고르세요.","opts":["What is your job like?","How is your job like?","What are you looking for?"],"a":1,"ex":"어떤지 물을 땐 What ... like?를 쓰고 How는 like와 함께 쓰지 않아요."},{"q":"뭐라고 말해야 할지 몰랐어. : I did not know what ___.","opts":["say","to say","saying"],"a":1,"ex":"what to say: 무엇을 말할지."},{"q":"지금 갈까, 나중에 갈까? : Shall we leave now ___ later?","opts":["and","or","nor"],"a":1,"ex":"선택의문문: A or B."}]}]</script>
<script>
const CHAPTERS = JSON.parse(document.getElementById("chapterData").textContent);
/* 전역 문제 은행: 각 챕터의 문제에 안정적 id/챕터정보 부여 */
const QBANK = [];
CHAPTERS.forEach((c,ci)=>{ (c.quiz||[]).forEach((q,qi)=>{
  QBANK.push({ id:"ch"+(ci+1)+"-"+qi, ci, ctitle:c.title, q:q.q, opts:q.opts, a:q.a, ex:q.ex });
}); });
document.getElementById("chTotal").textContent = CHAPTERS.length;

const KEY="qmaster_v2";
let store={read:{},wrong:[]};
try{ store = Object.assign(store, JSON.parse(localStorage.getItem(KEY))||{}); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
const app = document.getElementById("app");
function esc(s){ return String(s).replace(/'/g,"\\'"); }

let voices=[]; function lv(){ voices = window.speechSynthesis?speechSynthesis.getVoices():[]; }
if(window.speechSynthesis){ lv(); speechSynthesis.onvoiceschanged=lv; }
function speak(t,rate=0.95){ if(!window.speechSynthesis)return; speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=rate;
  const v=voices.find(v=>/en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang)); if(v)u.voice=v; speechSynthesis.speak(u); }

function refreshProg(){
  const d=Object.keys(store.read).filter(k=>store.read[k]).length;
  document.getElementById("chDone").textContent=d;
  document.getElementById("progFill").style.width=(d/CHAPTERS.length*100)+"%";
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function chCount(ci){ return CHAPTERS[ci].quiz ? CHAPTERS[ci].quiz.length : 0; }

/* ---------- HOME ---------- */
function home(){
  refreshProg();
  const chItems = CHAPTERS.map((c,i)=>`
    <div class="ch-item ${store.read[c.id]?'done':''}" onclick="reader(${i})">
      <div class="ch-num">${i+1}</div>
      <div class="ch-meta"><div class="t">${c.title}</div><div class="e">${c.en}</div></div>
      <div class="ch-q">${chCount(i)}문제</div>
      <div class="ch-chk">✓</div>
    </div>`).join("");
  const wrongN = store.wrong.length;
  app.innerHTML = `
    <div class="hero">
      <p class="eyebrow">Master English Questions</p>
      <h2>의문문, 정말 못 하는 질문이 없도록</h2>
      <p>10개 챕터마다 학습 + 문제가 붙어 있어요. 총 ${QBANK.length}개 문제로 반복 훈련하고, 틀린 문제는 자동으로 오답노트에 모입니다.</p>
      <div class="stats">
        <div class="stat"><div class="n">${CHAPTERS.length}</div><div class="l">학습 챕터</div></div>
        <div class="stat"><div class="n acc">${QBANK.length}</div><div class="l">연습 문제</div></div>
        <div class="stat"><div class="n">${Math.round(QBANK.length/CHAPTERS.length)}</div><div class="l">챕터당 문제</div></div>
      </div>
    </div>
    <div class="sec-label"><h3>📚 챕터별 학습 &amp; 문제</h3><span class="rule"></span></div>
    <div class="ch-list">${chItems}</div>
    <div class="sec-label"><h3>✏️ 전체 퀴즈</h3><span class="rule"></span></div>
    <div class="modes">
      <button class="mode wide" onclick="startTest(30)" style="border-color:var(--accent)">
        <div class="mi">🎯</div><div class="mt">종합 테스트 (랜덤 30문제)</div>
        <div class="md">모든 챕터에서 무작위 30문제 · 끝나면 점수와 오답 리뷰</div></button>
      <button class="mode" onclick="startTest(50)"><div class="mi">🔥</div><div class="mt">실력 점검 50문제</div><div class="md">더 길게, 전 범위 랜덤</div></button>
      <button class="mode" onclick="startWrong()" ${wrongN?'':'disabled'}><div class="mi">🔁</div><div class="mt">오답 다시풀기</div><div class="md">${wrongN?wrongN+'문제 대기 중':'아직 없음'}</div></button>
    </div>`;
  window.scrollTo(0,0);
}

/* ---------- READER ---------- */
function reader(i){
  const c = CHAPTERS[i];
  const pats = (c.patterns||[]).map(p=>`<div class="pat"><div class="pe">${p.en}</div><div class="pk">${p.ko}</div></div>`).join("");
  const exs = (c.examples||[]).map(e=>`
    <div class="ex-row"><div class="et"><div class="ee">${e.en}</div><div class="ek">${e.ko}</div></div>
      <button class="say" onclick="speak('${esc(e.en)}')">🔊</button></div>`).join("");
  app.innerHTML = `
    <button class="back" onclick="home()">← 목차</button>
    <div class="ch-head"><span class="u-tag">CHAPTER ${i+1} / ${CHAPTERS.length}</span></div>
    <h2 class="ch-title">${c.title}</h2>
    <p class="ch-sub">${c.en}</p>
    <div class="box"><h4>개념</h4><p class="lead">${c.intro}</p></div>
    <div class="box"><h4>핵심 패턴</h4>${pats}</div>
    <div class="box"><h4>예문 듣기</h4>${exs}</div>
    <div class="box"><div class="tip"><span class="th">이것만은!</span>${c.tip}</div></div>
    <button class="cta" onclick="startChapter(${i})">📝 이 챕터 문제 풀기 (${chCount(i)}문제)</button>
    <button class="btn primary" style="width:100%;margin-bottom:12px" onclick="markRead('${c.id}')">✓ 이 챕터 학습 완료</button>
    <div class="ch-nav">
      <button class="btn" ${i===0?'disabled':''} onclick="reader(${i-1})">← 이전 챕터</button>
      <button class="btn" ${i===CHAPTERS.length-1?'disabled':''} onclick="reader(${i+1})">다음 챕터 →</button>
    </div>`;
  window.scrollTo(0,0);
}
function markRead(id){ store.read[id]=true; save(); home(); }

/* ---------- QUIZ RUNNER ---------- */
let Q={list:[],i:0,score:0,wrong:[],title:""};
function startChapter(ci){ runQuiz(shuffle(QBANK.filter(q=>q.ci===ci)), CHAPTERS[ci].title); }
function startTest(n){ runQuiz(shuffle(QBANK).slice(0,n), "종합 테스트"); }
function startWrong(){
  const set=new Set(store.wrong);
  const list=QBANK.filter(q=>set.has(q.id));
  if(!list.length){ home(); return; }
  runQuiz(shuffle(list), "오답 다시풀기");
}
function runQuiz(list,title){ Q={list,i:0,score:0,wrong:[],title}; renderQ(); }
function renderQ(){
  if(Q.i>=Q.list.length){ return renderResult(); }
  const q=Q.list[Q.i], n=Q.list.length;
  const opts=q.opts.map((o,oi)=>`<button class="opt" id="opt${oi}" onclick="pick(${oi})">${o}</button>`).join("");
  app.innerHTML=`<button class="back" onclick="home()">← 홈 (그만두기)</button>
    <div class="q-top"><div class="qbar"><div class="qfill" id="qfill" style="width:${(Q.i)/n*100}%"></div></div>
      <span class="qmeta">${Q.i+1} / ${n} · ✓${Q.score}</span></div>
    <div class="q-cat">${Q.title}${q.ctitle && q.ctitle!==Q.title ? ' · '+q.ctitle : ''}</div>
    <div class="q-text">${String(q.q).replace(/___/g,'<span class="blank">____</span>')}</div>
    <div id="opts">${opts}</div>
    <div class="explain" id="exp">💡 ${q.ex}</div>
    <div class="q-actions"><button class="btn primary" id="nextBtn" style="display:none" onclick="nextQ()">${Q.i===n-1?'결과 보기 →':'다음 →'}</button></div>`;
  window.scrollTo(0,0);
}
function pick(oi){
  const q=Q.list[Q.i];
  if(document.getElementById("opt0").disabled) return;
  const correct=q.a;
  document.querySelectorAll(".opt").forEach((b,i)=>{ b.disabled=true;
    if(i===correct)b.classList.add("correct");
    if(i===oi&&oi!==correct)b.classList.add("wrong"); });
  document.getElementById("exp").classList.add("show");
  document.getElementById("nextBtn").style.display="inline-block";
  if(oi===correct){ Q.score++; store.wrong = store.wrong.filter(x=>x!==q.id); }
  else { Q.wrong.push({q, chosen:oi}); if(!store.wrong.includes(q.id)) store.wrong.push(q.id); }
  save();
  const qf=document.getElementById("qfill"); if(qf) qf.style.width=((Q.i+1)/Q.list.length*100)+"%";
}
function nextQ(){ Q.i++; renderQ(); }
function renderResult(){
  const n=Q.list.length, pct=n?Math.round(Q.score/n*100):0;
  const msg = pct===100?'완벽해요! 🎉 못 푸는 질문이 없네요.':pct>=80?'훌륭해요! 👏 거의 다 왔어요.':pct>=60?'좋아요 👍 오답을 다시 보면 확실해져요.':'괜찮아요 💪 오답노트로 복습해요.';
  const rev = Q.wrong.length ? `<div class="rev"><div class="rh">틀린 문제 다시 보기 (${Q.wrong.length})</div>`+
    Q.wrong.map(w=>`<div class="rev-item">
      <div class="rq">${String(w.q.q).replace(/___/g,'____')}</div>
      <div class="ra">정답: <span class="ok">${w.q.opts[w.q.a]}</span> · 내 답: ${w.q.opts[w.chosen]}</div>
      <div class="rx">💡 ${w.q.ex}</div></div>`).join("")+`</div>` : `<p class="ch-sub" style="text-align:center">전부 맞혔어요! 오답이 없습니다 🙌</p>`;
  app.innerHTML=`<button class="back" onclick="home()">← 홈</button>
    <div class="box"><div class="result">
      <div class="big">${Q.score} / ${n}</div><div class="msg">${msg}</div>
      <div class="result-btns">
        ${Q.wrong.length?`<button class="btn primary" onclick="runQuiz(shuffle([${Q.wrong.map(w=>JSON.stringify(w.q.id)).join(',')}].map(id=>QBANK.find(q=>q.id===id))),'오답 다시풀기')">🔁 틀린 것만 다시</button>`:''}
        <button class="btn" onclick="home()">홈으로</button>
      </div>
    </div>${rev}</div>`;
  window.scrollTo(0,0);
}

home();
</script>
</body>
</html>
