<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>의문문 마스터 · 인터랙티브 전자책</title>
<style>
  :root{
    --sans:'Segoe UI',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    --serif:'Iowan Old Style','Palatino Linotype','Book Antiqua',Georgia,'Nanum Myeongjo',serif;
    --bg:#141219; --panel:#1c1a24; --panel2:#232029; --raise:#2a2632;
    --ink:#f2eff7; --mut:#a29daf; --faint:#726d7e; --line:#302c39; --line2:#3b3646;
    --accent:#ff6551; --accent-soft:rgba(255,101,81,.14); --accent-ink:#ff8574;
    --good:#43c88a; --good-soft:rgba(67,200,138,.15); --bad:#ff6b81; --bad-soft:rgba(255,107,129,.13);
    --shadow-sm:0 6px 22px -12px rgba(0,0,0,.6); --r:16px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f4f1ea; --panel:#fffdf9; --panel2:#f7f4ec; --raise:#ffffff;
      --ink:#211f2a; --mut:#6d6878; --faint:#9a95a3; --line:#e7e1d5; --line2:#ddd6c8;
      --accent:#e04e2f; --accent-soft:rgba(224,78,47,.10); --accent-ink:#c8431f;
      --good:#2e9e6b; --good-soft:rgba(46,158,107,.12); --bad:#d6455c; --bad-soft:rgba(214,69,92,.09);
      --shadow-sm:0 8px 24px -14px rgba(70,55,40,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;
    -webkit-font-smoothing:antialiased;line-height:1.62;letter-spacing:-.01em;word-break:keep-all}
  ::selection{background:var(--accent-soft);color:var(--accent-ink)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px 90px}
  button{font-family:inherit}

  header.top{display:flex;align-items:center;gap:13px;padding:18px 0 14px;position:sticky;top:0;z-index:30;
    background:linear-gradient(180deg,var(--bg) 72%,transparent)}
  .mark{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;font-size:20px;
    background:var(--ink);color:var(--bg)}
  .brand h1{font-family:var(--serif);font-size:20px;margin:0;font-weight:700;letter-spacing:-.02em}
  .brand h1 .q{color:var(--accent)}
  .brand p{margin:0;color:var(--mut);font-size:12px}
  .prog{margin-left:auto;text-align:right;min-width:120px}
  .prog small{color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
  .prog .track{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
  .prog .fill{height:100%;width:0;background:var(--accent);transition:width .5s}

  .hero{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:22px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
  .hero .eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
  .hero h2{font-family:var(--serif);font-size:25px;line-height:1.24;margin:0 0 8px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
  .hero p{margin:0 0 16px;color:var(--mut);font-size:13.5px}
  .stats{display:flex;gap:26px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
  .stat .n{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .stat .n.acc{color:var(--accent)}
  .stat .l{font-size:11px;color:var(--faint);margin-top:3px}

  .sec-label{display:flex;align-items:center;gap:10px;margin:20px 2px 12px}
  .sec-label h3{margin:0;font-size:14px;font-weight:700}
  .sec-label .rule{flex:1;height:1px;background:var(--line)}

  .ch-list{display:flex;flex-direction:column;gap:9px}
  .ch-item{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
    border-radius:13px;padding:14px 16px;cursor:pointer;transition:transform .13s,border-color .13s}
  .ch-item:hover{transform:translateX(3px);border-color:var(--accent)}
  .ch-num{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--accent);flex:0 0 auto;width:26px;font-variant-numeric:tabular-nums}
  .ch-meta{flex:1;min-width:0}
  .ch-meta .t{font-size:15px;font-weight:700}
  .ch-meta .e{font-size:11.5px;color:var(--mut)}
  .ch-q{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:99px;padding:3px 9px}
  .ch-chk{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:11px;color:transparent}
  .ch-item.done .ch-chk{background:var(--good);border-color:var(--good);color:#fff}

  .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mode{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;cursor:pointer;text-align:left;transition:transform .13s,border-color .13s}
  .mode:hover{transform:translateY(-3px);border-color:var(--accent)}
  .mode .mi{font-size:22px}
  .mode .mt{font-weight:700;font-size:15px;margin-top:8px}
  .mode .md{color:var(--mut);font-size:12px;margin-top:2px}
  .mode.wide{grid-column:1 / -1}
  .mode:disabled{opacity:.5;cursor:default;transform:none}

  .back{display:inline-flex;align-items:center;gap:7px;background:none;border:none;color:var(--mut);
    font-size:13.5px;cursor:pointer;padding:16px 0 8px;font-weight:600}
  .back:hover{color:var(--accent)}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:13px;box-shadow:var(--shadow-sm)}
  .box h4{margin:0 0 11px;font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--mut);text-transform:uppercase}
  .lead{font-size:15.5px;line-height:1.75}
  .lead b,.tip b{color:var(--accent-ink);font-weight:700}
  .ch-head .u-tag{display:inline-block;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink)}
  .ch-title{font-family:var(--serif);margin:9px 0 2px;font-size:24px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
  .ch-sub{margin:0 0 6px;color:var(--mut);font-size:13.5px}
  .pat{padding:11px 0;border-top:1px solid var(--line)}
  .pat:first-of-type{border-top:none;padding-top:2px}
  .pat .pe{font-family:var(--serif);font-weight:700;font-size:15.5px}
  .pat .pk{color:var(--mut);font-size:12.5px;margin-top:1px}
  .ex-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
  .ex-row:first-of-type{border-top:none;padding-top:2px}
  .ex-row .et{flex:1}
  .ex-row .ee{font-size:15px;font-weight:600}
  .ex-row .ek{color:var(--mut);font-size:12.5px}
  .say{flex:0 0 auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
    color:var(--accent-ink);cursor:pointer;font-size:15px;display:grid;place-items:center;transition:all .13s}
  .say:hover{background:var(--accent);color:#fff;border-color:transparent}
  .tip{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:10px;padding:13px 15px;font-size:13.5px;color:var(--ink)}
  .tip .th{font-weight:800;color:var(--accent-ink);margin-right:5px}
  .cta{display:block;width:100%;padding:15px;border-radius:13px;border:none;background:var(--accent);color:#fff;
    font-size:15px;font-weight:700;cursor:pointer;margin-bottom:12px}
  .ch-nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:11px 17px;
    cursor:pointer;font-size:14px;font-weight:600;transition:all .12s}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#fff;border-color:transparent}
  .btn:disabled{opacity:.4;cursor:default}

  .q-top{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .q-top .qbar{flex:1;height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .q-top .qfill{height:100%;width:0;background:var(--accent);transition:width .35s}
  .q-top .qmeta{font-size:12px;color:var(--mut);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .q-cat{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:14px 0 4px;text-transform:uppercase}
  .q-text{font-size:17px;font-weight:600;line-height:1.55;margin-bottom:14px}
  .q-text .blank{color:var(--accent-ink);font-weight:800;letter-spacing:1px}
  .opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:11px;padding:13px 15px;margin-bottom:9px;cursor:pointer;font-size:15px;transition:all .12s}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt.correct{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
  .opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
  .opt:disabled{cursor:default}
  .explain{font-size:13.5px;color:var(--mut);margin-top:8px;padding:12px 14px;background:var(--panel2);
    border-left:3px solid var(--accent);border-radius:9px;display:none}
  .explain.show{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .q-actions{margin-top:14px;text-align:right}
  .w-badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.03em;color:#fff;background:var(--accent);border-radius:99px;padding:3px 10px;margin-bottom:8px}
  .w-prompt{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.4;margin:2px 0 4px;text-wrap:balance}
  .w-hint{font-size:12px;color:var(--faint);margin-bottom:12px}
  textarea.w-in{width:100%;min-height:74px;resize:vertical;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);border-radius:12px;padding:13px 15px;font-size:16px;font-family:inherit;line-height:1.5}
  textarea.w-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .reveal{margin-top:14px}
  .r-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:10px}
  .r-card .rl{font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .r-mine{color:var(--mut);font-size:15px;font-style:italic}
  .r-model{display:flex;align-items:center;gap:10px}
  .r-model .rm-t{flex:1;font-size:16px;font-weight:700;color:var(--good)}
  .r-alt{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px dashed var(--line);font-size:14.5px}
  .r-alt:first-of-type{border-top:none}
  .r-nuance{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:10px;padding:13px 15px;font-size:14px;line-height:1.65}
  .r-nuance .rn-h{font-weight:800;color:var(--accent-ink);display:block;margin-bottom:3px}
  .r-self{font-size:12.5px;color:var(--mut);margin:2px 2px 0}
  .r-self b{color:var(--good)}
  .w-btns{display:flex;gap:9px;margin-top:12px}
  .w-btns .btn{flex:1;text-align:center}
  .result{text-align:center;padding:14px 6px}
  .result .big{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  .result .msg{color:var(--mut);margin:2px 0 16px}
  .rev{text-align:left;margin-top:14px}
  .rev .rh{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
  .rev-item{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:8px;background:var(--panel2)}
  .rev-item .rq{font-size:14px;font-weight:600}
  .rev-item .ra{font-size:13px;margin-top:5px}
  .rev-item .ra .ok{color:var(--good);font-weight:700}
  .rev-item .rx{font-size:12.5px;color:var(--mut);margin-top:3px}
  .result-btns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .footer-note{text-align:center;color:var(--faint);font-size:11px;margin-top:26px;line-height:1.7}
  .footer-note a{color:var(--accent-ink)}
  @media(max-width:520px){.wrap{padding:0 13px 80px}.modes{grid-template-columns:1fr}.hero h2{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="mark">❓</div>
    <div class="brand">
      <h1>의문문 마스터<span class="q">?</span></h1>
      <p>질문을 완벽하게 · 인터랙티브 전자책</p>
    </div>
    <div class="prog">
      <small><span id="chDone">0</span> / <span id="chTotal">0</span> 챕터</small>
      <div class="track"><div class="fill" id="progFill"></div></div>
    </div>
  </header>
  <main id="app"></main>
  <div class="footer-note">
    회화 중심 오리지널 학습 콘텐츠 · 발음 듣기 🔊 는 브라우저 음성 기능(Chrome 권장) ·
    <a href="https://gywn000929-bot.github.io/english-speak/">← 전체 145유닛 앱으로</a>
  </div>

","ko":"너 어디 출신이야?","model":"Where are you from?","alts":["Where do you come from?"],"nuance":"출신을 물을 때 be동사를 써서 Where are you from?이 가장 흔하고 자연스러워요. 동사 come을 쓰면 Where do you come from?처럼 do가 등장해요. 「Where you from?」은 be동사를 생략한 아주 캐주얼한 말투예요.","key":["Where","are","from"]},{"type":"mc","q":"Does 뒤 주어로 알맞은 것은?","opts":["they","you","she"],"a":2,"ex":"does는 3인칭 단수(he/she/it)와 함께 써요."},{"type":"write","ko":"우리 지금 가야 해?","model":"Do we have to go now?","alts":["Do we need to go now?"],"nuance":"의무를 물을 때 have to를 쓰면 조동사 do가 필요해요. Do we have to go?가 자연스럽고, need to로 바꿔도 좋아요. 「Must we go?」도 문법상 맞지만 다소 격식 있고 딱딱하게 들려요.","key":["Do","have to","go"]},{"type":"mc","q":"「그녀가 뭐라고 했어?」의 올바른 영어는?","opts":["What did she say?","What did she said?","What she said?"],"a":0,"ex":"did가 과거를 담당하니 동사는 원형 say. What did she say?"},{"type":"write","ko":"너 이 노래 알아?","model":"Do you know this song?","alts":["Have you heard this song?"],"nuance":"알고 있냐고 물을 때 일반동사 know의 현재라 Do you know로 시작해요. 들어본 적 있냐는 뉘앙스면 현재완료 Have you heard도 자연스러워요. 상황에 따라 do 의문문과 have 의문문을 골라 쓰면 돼요.","key":["Do","know","song"]},{"type":"write","ko":"저 좀 도와주실 수 있어요?","model":"Could you help me?","alts":["Can you give me a hand?"],"nuance":"부탁할 때 Could you ~?는 조동사 could가 앞으로 나가고 do는 쓰지 않아요. Could가 Can보다 정중하게 들려요. give me a hand는 도와달라는 자연스러운 관용 표현이에요.","key":["Could","you","help"]},{"type":"mc","q":"다음 중 동사원형이 잘못 쓰인 문장은?","opts":["Did you eat?","Does he plays?","Do they know?"],"a":1,"ex":"does 뒤에는 원형 play. Does he plays?는 틀렸어요."},{"type":"write","ko":"너 몇 시에 일어나?","model":"What time do you wake up?","alts":["What time do you get up?"],"nuance":"의문사 What time + do + you + 원형 wake up 순서예요. wake up과 get up 둘 다 자연스럽게 「일어나다」를 뜻해요. do you wakes처럼 s를 붙이지 않도록 주의하세요. 주어가 you라 원형이에요.","key":["What time","do","wake up"]},{"type":"mc","q":"「너 개 있어?」의 올바른 영어는?","opts":["Do you have a dog?","Are you have a dog?","Do you a dog?"],"a":0,"ex":"소유를 묻는 have동사의 현재 의문문. Do you have a dog?"},{"type":"write","ko":"영화 몇 시에 시작해?","model":"What time does the movie start?","alts":["When does the movie start?"],"nuance":"the movie는 3인칭 단수라 does를 쓰고 동사는 원형 start예요. 「What time the movie starts?」처럼 does를 빼고 starts만 쓰면 의문문 어순이 아니라 어색해요. 시각을 묻는 What time과 When 둘 다 자연스럽게 쓸 수 있어요.","key":["What time","does","start"]}]},{"id":"ch2","title":"Yes/No 의문문과 짧은 대답","en":"Yes/No questions & short answers","intro":"예/아니오로 답하는 의문문이에요. 물어본 \u003cb>(조)동사를 그대로 받아\u003c/b> 짧게 답합니다. 'Yes, I do. / No, she isn't.' 처럼요.","patterns":[{"en":"Do you ~? → Yes, I do. / No, I don't.","ko":"일반동사"},{"en":"Are you ~? → Yes, I am. / No, I'm not.","ko":"be동사"},{"en":"Have you ~? → Yes, I have. / No, I haven't.","ko":"완료·조동사"}],"examples":[{"en":"Do you like coffee? Yes, I do.","ko":"커피 좋아해? 응, 좋아해."},{"en":"Is it raining? No, it isn't.","ko":"비 와? 아니, 안 와."},{"en":"Have you eaten? Yes, I have.","ko":"밥 먹었어? 응, 먹었어."},{"en":"Can you swim? No, I can't.","ko":"수영할 줄 알아? 아니, 못 해."}],"tip":"짧은 대답에서 \u003cb>물어본 조동사를 그대로\u003c/b> 받아요. 'Do you ~?'에 'Yes, I am.'은 ✗ → 'Yes, I do.' ✓","quiz":[{"type":"mc","q":"Do you like coffee? — Yes, I ___.","opts":["am","do","like"],"a":1,"ex":"do로 물었으니 짧은 대답도 do로 받아요. 일반동사 질문에 am이나 동사(like)를 쓰지 않습니다."},{"type":"write","ko":"너 커피 좋아해? — 응, 좋아해.","model":"Do you like coffee? — Yes, I do.","alts":["Do you like coffee? — Yeah, I do."],"nuance":"짧은 대답의 핵심은 물어본 조동사를 그대로 받는 거예요. Do로 물으면 Yes, I do.로 답합니다. Yes, I like it.도 되지만 짧은 대답 연습에서는 Yes, I do.가 기본형이에요. Yes, I am.은 be동사 질문에나 쓰는 대답이라 어색합니다.","key":["Do you ~? -> Yes, I do.","물어본 조동사 그대로 받기"]},{"type":"mc","q":"___ she your sister? — No, she isn't.","opts":["Is","Does","Do"],"a":0,"ex":"대답이 she isn't이므로 be동사 질문입니다. 주어 she에 맞는 be동사는 Is예요."},{"type":"write","ko":"지금 비 와? — 아니, 안 와.","model":"Is it raining? — No, it isn't.","alts":["Is it raining? — No, it's not."],"nuance":"비가 오는지 물을 때 한국어를 직역해 Does it rain now?라고 하면 지금 이 순간이 아니라 평소에 비가 오느냐는 뜻으로 들려요. 지금 진행 중인 일은 현재진행형 Is it raining?이 자연스럽습니다. 짧은 대답은 No, it isn't. 또는 No, it's not.","key":["Is it raining? (지금 진행)","No, it isn't. / No, it's not."]},{"type":"mc","q":"Have you eaten? — Yes, I ___.","opts":["did","am","have"],"a":2,"ex":"Have로 물었으니 짧은 대답도 have로 받아요. 완료형 질문에는 have/haven't로 답합니다."},{"type":"mc","q":"Can you swim? — No, I ___.","opts":["can't","don't","amn't"],"a":0,"ex":"조동사 can으로 물었으니 can't로 받아요. amn't라는 형태는 존재하지 않습니다."},{"type":"write","ko":"밥 먹었어? — 응, 먹었어.","model":"Have you eaten? — Yes, I have.","alts":["Did you eat? — Yes, I did.","Have you eaten yet? — Yeah, I have."],"nuance":"Have you eaten?으로 물으면 Yes, I have.로 받는 게 규칙이에요. 물어본 조동사(have)를 그대로 대답에 씁니다. Did you eat?처럼 과거형으로 물었다면 Yes, I did.가 맞아요. 질문의 형태에 대답을 맞추는 게 포인트예요.","key":["Have you ~? -> Yes, I have.","Did you ~? -> Yes, I did."]},{"type":"mc","q":"Does he work here? — No, he ___.","opts":["isn't","doesn't","don't"],"a":1,"ex":"Does로 물었으니 주어 he에 맞춰 doesn't로 받아요. isn't는 be동사 대답이라 틀립니다."},{"type":"write","ko":"너 학생이야? — 응, 맞아.","model":"Are you a student? — Yes, I am.","alts":["Are you a student? — Yeah, I am."],"nuance":"be동사로 물으면 대답도 be동사로 받아요. Are you ~?에는 Yes, I am.이 정답이고, 여기서 Yes, I do.라고 하면 어색합니다. 짧은 대답에서 am은 절대 줄이지 않아요. Yes, I'm. 은 틀린 형태이니 Yes, I am.으로 온전히 씁니다.","key":["Are you ~? -> Yes, I am.","Yes, I'm.은 틀림 (am은 안 줄임)"]},{"type":"mc","q":"Did they arrive on time? — Yes, they ___.","opts":["were","have","did"],"a":2,"ex":"Did로 물었으니 짧은 대답도 did로 받아요. were나 have는 다른 질문에 쓰는 대답입니다."},{"type":"write","ko":"너 지금 바빠? — 아니, 안 바빠.","model":"Are you busy right now? — No, I'm not.","alts":["Are you busy? — No, not really."],"nuance":"be동사 부정 짧은 대답은 No, I'm not.이에요. 여기서는 am을 not과 함께 I'm not으로 줄여 쓰는 게 자연스럽습니다. No, I amn't. 같은 형태는 영어에 없어요. 부드럽게 말하고 싶으면 No, not really.(별로 안 바빠)도 자주 씁니다.","key":["No, I'm not.","amn't는 존재하지 않음"]},{"type":"mc","q":"Will you come to the party? — Yes, I ___.","opts":["do","will","am"],"a":1,"ex":"조동사 will로 물었으니 짧은 대답도 will로 받아요."},{"type":"write","ko":"그녀 여기 살아? — 아니, 안 살아.","model":"Does she live here? — No, she doesn't.","alts":["Does she live here? — No, she doesn't. She moved."],"nuance":"3인칭 단수 주어의 일반동사 질문은 Does로 시작하고, 짧은 대답도 doesn't로 받아요. No, she isn't.라고 하면 be동사 질문에 쓰는 대답이라 어긋납니다. Does로 물으면 does/doesn't로 답한다는 짝을 기억하세요.","key":["Does she ~? -> No, she doesn't.","isn't 아님"]},{"type":"mc","q":"Are they coming? — No, they ___.","opts":["don't","isn't","aren't"],"a":2,"ex":"주어 they의 be동사 부정은 aren't예요. isn't는 단수(he/she/it)에 씁니다."},{"type":"write","ko":"너 그 영화 봤어? — 응, 봤어. 진짜 재밌더라.","model":"Did you see that movie? — Yes, I did. It was really good.","alts":["Have you seen that movie? — Yes, I have. It was great."],"nuance":"봤냐고 과거의 경험을 물을 땐 Did you see ~?가 자연스럽고 대답은 Yes, I did.예요. Yes, I saw.처럼 동사만 남기면 어색하게 들려서 Yes, I did.로 받는 게 좋습니다. 뒤에 소감을 붙이면 대화가 훨씬 자연스러워져요.","key":["Did you ~? -> Yes, I did.","Yes, I saw.보다 Yes, I did."]},{"type":"write","ko":"너 아직 배고파? — 아니, 이제 배불러.","model":"Are you still hungry? — No, I'm full now.","alts":["Are you still hungry? — No, I'm good.","Still hungry? — Nah, I'm stuffed."],"nuance":"아직 배고프냐는 상태는 be동사로 Are you still hungry?라고 물어요. 배부르다는 No, I'm full.이 자연스럽고, No, I'm good.도 이제 됐다는 뜻으로 흔히 씁니다. 직역한 No, my stomach is full.보다 I'm full.이 훨씬 원어민스럽게 들려요.","key":["Are you still hungry? -> No, I'm full.","No, I'm good. (됐어)"]},{"type":"mc","q":"Do you have a minute? — Sure, I ___.","opts":["have","am","do"],"a":2,"ex":"여기서 have는 소유의 일반동사라 Do로 묻습니다. 따라서 짧은 대답은 I do예요."},{"type":"write","ko":"잠깐 시간 돼? — 응, 돼.","model":"Do you have a minute? — Yeah, I do.","alts":["Do you have a sec? — Sure.","Got a minute? — Yeah."],"nuance":"여기서 have는 소유를 뜻하는 일반동사라 Do you have ~?로 묻고 대답은 I do예요. 이 have를 완료형 조동사로 착각해 Yes, I have.라고 하면 어색합니다. 캐주얼하게는 Got a minute? — Sure.도 아주 흔하게 씁니다.","key":["Do you have ~? (소유) -> Yes, I do.","Got a minute? (캐주얼)"]},{"type":"mc","q":"Was he at home last night? — Yes, he ___.","opts":["did","was","were"],"a":1,"ex":"Was(be동사 과거)로 물었으니 주어 he에 맞춰 was로 받아요."},{"type":"write","ko":"너 운전할 줄 알아? — 아니, 못 해.","model":"Can you drive? — No, I can't.","alts":["Can you drive? — No, I can't. I never learned."],"nuance":"능력을 물을 땐 조동사 can을 써서 Can you drive?라고 하고 대답도 can/can't로 받아요. No, I don't.이라고 하면 습관을 부정하는 느낌이라 여기선 어색합니다. 물어본 조동사를 그대로 대답에 넣는 규칙이 여기서도 똑같이 적용돼요.","key":["Can you ~? -> No, I can't.","don't 아님"]},{"type":"mc","q":"다음 중 do 의문문에 대한 짧은 대답으로 자연스러운 것은?","opts":["No, I'm not.","No, I haven't.","No, I don't."],"a":2,"ex":"Do you ~? 질문에는 don't로 받는 것이 맞아요. 나머지는 be동사, 완료형 질문의 대답입니다."},{"type":"write","ko":"그 사람들 결혼했어? — 응, 했어.","model":"Are they married? — Yes, they are.","alts":["Are they married? — Yeah, they are."],"nuance":"결혼한 상태를 물을 땐 be동사 형용사 표현 Are they married?가 자연스러워요. Did they marry?는 결혼이라는 행위 시점을 묻는 느낌이라 뉘앙스가 달라집니다. be동사로 물었으니 대답도 Yes, they are.로 받습니다.","key":["Are they married? (상태)","Yes, they are."]},{"type":"mc","q":"Should I bring my laptop? — Yes, you ___.","opts":["should","do","are"],"a":0,"ex":"조동사 should로 물었으니 짧은 대답도 should로 받아요."},{"type":"write","ko":"지난 주말에 재밌게 놀았어? — 응, 완전.","model":"Did you have a good weekend? — Yes, I did.","alts":["Did you have fun this weekend? — Yeah, totally."],"nuance":"주말 잘 보냈냐고 물을 땐 Did you have a good weekend?가 흔한 인사예요. 대답은 Yes, I did.가 기본이고, 캐주얼하게 Yeah, totally.나 It was great.로 감정을 더하면 더 자연스럽습니다. Did로 물으면 did로 받는다는 짝을 기억하세요.","key":["Did you have a good weekend?","Yes, I did. / Yeah, totally."]},{"type":"mc","q":"___ you finished your homework? — Yes, I have.","opts":["Did","Have","Do"],"a":1,"ex":"대답이 I have이므로 완료형 질문 Have you ~?가 맞아요."},{"type":"write","ko":"너 나한테 화났어? — 아니, 안 났어.","model":"Are you mad at me? — No, I'm not.","alts":["Are you angry with me? — No, not at all."],"nuance":"화났느냐는 감정 상태는 be동사로 Are you mad at me?라고 물어요. 화가 난 대상은 at으로 연결합니다. 대답은 No, I'm not.이고, 확실히 아니라고 안심시키려면 No, not at all.을 붙이면 더 부드럽고 자연스럽습니다.","key":["Are you mad at me?","No, I'm not. / No, not at all."]},{"type":"mc","q":"Do you and Tom work together? — Yes, we ___.","opts":["are","do","does"],"a":1,"ex":"Do로 물었고 주어가 we(복수)이므로 짧은 대답은 we do예요."},{"type":"write","ko":"이 자리 주인 있어요? — 아니요, 비어 있어요.","model":"Is this seat taken? — No, it isn't.","alts":["Is this seat taken? — No, it's free.","Is anyone sitting here? — No, go ahead."],"nuance":"자리에 사람이 있냐고 물을 땐 Is this seat taken?이 아주 자연스러운 표현이에요. 직역해서 Does this seat have an owner?라고 하면 콩글리시처럼 어색하게 들립니다. 대답은 No, it isn't. 또는 No, it's free.로 비어 있음을 알려주면 됩니다.","key":["Is this seat taken?","No, it isn't. / No, it's free."]},{"type":"mc","q":"Were you sleeping? — No, I ___.","opts":["didn't","wasn't","weren't"],"a":1,"ex":"주어 I의 be동사 과거 부정은 wasn't예요. weren't는 you/we/they에 씁니다."},{"type":"write","ko":"저 좀 도와주실 수 있어요? — 그럼요.","model":"Could you help me? — Sure.","alts":["Could you help me out? — Of course.","Can you give me a hand? — Yeah, sure."],"nuance":"정중하게 부탁할 땐 Can보다 Could you ~?가 더 공손하게 들려요. 대답으로 Yes, I could.는 어색하고, 실제로는 Sure. / Of course. / No problem.처럼 흔쾌히 받는 표현을 씁니다. 도와달라는 부탁에는 조동사 그대로 받기보다 관용적인 승낙 표현이 자연스러워요.","key":["Could you help me? (공손)","대답은 Sure. / Of course."]},{"type":"mc","q":"Does it hurt? — Yes, it ___.","opts":["is","hurts","does"],"a":2,"ex":"Does로 물었으니 짧은 대답은 does로 받아요. hurts처럼 동사를 반복하지 않습니다."},{"type":"write","ko":"너 개 키워? — 응, 키워. 두 마리.","model":"Do you have a dog? — Yes, I do. Two, actually.","alts":["Do you have any dogs? — Yeah, I do. I have two."],"nuance":"반려동물을 키우냐고 물을 땐 Do you have a dog?가 가장 자연스러워요. Do you raise a dog?는 가축을 사육한다는 느낌이라 어색합니다. 소유의 have라서 대답도 Yes, I do.로 받고, 뒤에 Two.처럼 정보를 덧붙이면 대화가 살아납니다.","key":["Do you have a dog? (raise 아님)","Yes, I do."]},{"type":"mc","q":"Aren't you cold? (사실 안 추움) 자연스러운 대답은?","opts":["Yes, I'm not.","No, I'm not.","No, I am."],"a":1,"ex":"부정의문문이라도 사실이 부정(안 추움)이면 No로 답해요. No, I'm not.이 맞습니다."},{"type":"write","ko":"너 그거 안 좋아해? — 아니, 좋아하는데!","model":"Don't you like it? — Yes, I do!","alts":["Don't you like it? — Actually, I do."],"nuance":"부정의문문 Don't you ~?에 답할 때 한국어 감각으로 아니라고 No라 하면 뜻이 뒤집혀요. 영어는 사실이 긍정(좋아함)이면 무조건 Yes로 답합니다. 그래서 좋아하면 Yes, I do!가 맞아요. 한국어 응/아니가 아니라 사실로 판단하는 게 핵심입니다.","key":["부정의문문이라도 사실이 긍정이면 Yes","좋아함 -> Yes, I do!"]},{"type":"mc","q":"Is she coming or not? — ___, she is.","opts":["Yes","No","Do"],"a":0,"ex":"온다는 긍정 사실이면 Yes로 답하고 be동사 she is로 받아요."},{"type":"write","ko":"너 그 소식 못 들었어? — 응, 못 들었어. 무슨 일인데?","model":"Haven't you heard the news? — No, I haven't. What happened?","alts":["Didn't you hear? — No, I didn't. What's up?"],"nuance":"부정의문문 Haven't you heard ~?에도 사실로 판단해요. 못 들은 게 사실이면 No, I haven't.로 답합니다. 여기서 한국어 응에 끌려 Yes라고 하면 들었다는 뜻이 돼 혼란을 줍니다. 뒤에 What happened?를 붙이면 자연스럽게 대화가 이어져요.","key":["Haven't you ~? 사실이 부정이면 No","No, I haven't."]},{"type":"mc","q":"다음 중 Is it far? 에 대한 자연스러운 짧은 대답은?","opts":["No, it doesn't.","No, it isn't.","No, it don't."],"a":1,"ex":"be동사 Is로 물었으니 isn't로 받아요. doesn't는 일반동사 질문의 대답입니다."},{"type":"write","ko":"우리 지금 출발할까? — 응, 그러자.","model":"Should we get going? — Yes, let's.","alts":["Should we head out now? — Yeah, let's go.","Should we get going? — Sure, let's."],"nuance":"이제 나갈까 하고 제안할 땐 Should we get going?이나 Should we head out?이 자연스러워요. 대답은 Yes, let's.처럼 짧게 하거나 Yeah, let's go.로 받습니다. 조동사 should로 물었지만 제안에는 let's로 호응하는 게 더 회화답게 들려요.","key":["Should we get going? (제안)","Yes, let's. / Yeah, let's go."]},{"type":"mc","q":"Has she called yet? — No, she ___.","opts":["didn't","isn't","hasn't"],"a":2,"ex":"Has로 물었으니 주어 she에 맞춰 hasn't로 받아요."},{"type":"write","ko":"너 이거 전에 해본 적 있어? — 응, 있어.","model":"Have you done this before? — Yes, I have.","alts":["Have you tried this before? — Yeah, I have."],"nuance":"경험을 물을 땐 완료형 Have you done this before?가 자연스러워요. before를 붙여 예전에 해봤냐는 뉘앙스를 살립니다. 대답은 물어본 조동사를 받아 Yes, I have.예요. Did you do this?로 물었다면 Yes, I did.로 답이 달라진다는 점도 함께 기억하세요.","key":["Have you done this before?","Yes, I have."]},{"type":"mc","q":"Do I know you? — ___, we met last year.","opts":["Yes","No","Does"],"a":0,"ex":"작년에 만났다는 긍정 사실이니 Yes로 답하는 게 자연스러워요."},{"type":"write","ko":"너 오늘 밤에 시간 있어? — 응, 있어. 왜?","model":"Are you free tonight? — Yes, I am. Why?","alts":["Are you free tonight? — Yeah, I am. What's up?","Do you have time tonight? — Yeah. Why?"],"nuance":"시간 있냐고 물을 때 가장 자연스러운 건 Are you free tonight?이에요. be동사로 물었으니 대답도 Yes, I am.으로 받습니다. Do you have time?도 되지만 그땐 Yes, I do.로 대답이 바뀝니다. 뒤에 Why?를 붙이면 상대가 이유를 말하게 자연스레 이어져요.","key":["Are you free tonight? -> Yes, I am.","질문 형태에 대답 맞추기"]},{"type":"mc","q":"Doesn't he live nearby? (사실 근처에 삼) 자연스러운 대답은?","opts":["No, he does.","Yes, he doesn't.","Yes, he does."],"a":2,"ex":"부정의문문이라도 근처에 산다는 긍정 사실이면 Yes, he does.로 답해요."},{"type":"write","ko":"너 나 기억해? — 응, 기억하지! 오랜만이야.","model":"Do you remember me? — Yes, I do! It's been a while.","alts":["Do you remember me? — Of course I do! Long time no see."],"nuance":"기억하냐고 물을 땐 Do you remember me?가 자연스럽고 대답은 Yes, I do.예요. 반가움을 더하려면 Of course I do!나 It's been a while.을 붙이면 훨씬 회화답게 들립니다. remember는 일반동사라 Yes, I am.이 아니라 Yes, I do.로 받는다는 점에 주의하세요.","key":["Do you remember me? -> Yes, I do.","It's been a while. 덧붙이기"]},{"type":"mc","q":"Did you lock the door? — No, I ___. Sorry!","opts":["don't","didn't","haven't"],"a":1,"ex":"Did로 물었으니 짧은 대답도 didn't로 받아요."}]},{"id":"ch3","title":"Wh- 의문사로 묻기","en":"who / what / which / whose / where / when / why","intro":"구체적인 정보를 물을 땐 \u003cb>의문사\u003c/b>를 문장 맨 앞에 두고 그 뒤는 Yes/No 의문문 어순과 같아요. \u003cb>what\u003c/b>은 범위가 열려 있고 \u003cb>which\u003c/b>는 정해진 선택지 중에서 고를 때 써요.","patterns":[{"en":"의문사 + do/does/did + 주어 + 동사원형?","ko":"What do you want?"},{"en":"which + (명사): 선택지 중에서","ko":"Which color do you like?"},{"en":"whose + 명사: 누구의 ~","ko":"Whose bag is this?"}],"examples":[{"en":"What do you do on weekends?","ko":"주말에 뭐 해?"},{"en":"Which one do you prefer, tea or coffee?","ko":"차랑 커피 중 뭐가 더 좋아?"},{"en":"Whose turn is it?","ko":"누구 차례야?"},{"en":"Why are you so quiet today?","ko":"오늘 왜 이렇게 조용해?"}],"tip":"열린 질문은 \u003cb>what\u003c/b>, 정해진 선택지는 \u003cb>which\u003c/b>. 'Which do you want, this or that?'처럼 선택지가 있으면 which!","quiz":[{"type":"mc","q":"___ is that guy in the blue jacket?","opts":["Who","What","Which"],"a":0,"ex":"사람의 정체를 물을 때는 Who를 씁니다. What은 직업이나 사물, Which는 선택지 중 고를 때 씁니다."},{"type":"write","ko":"이 근처에 화장실이 어디 있어요?","model":"Where is the restroom around here?","alts":["Where can I find a restroom nearby?"],"nuance":"장소를 물을 때는 Where로 시작합니다. around here나 nearby를 붙이면 (이 근처)라는 뉘앙스가 자연스럽게 살아납니다. 원어민에게는 아주 평범하고 공손한 질문으로 들립니다.","key":["Where","restroom","around here"]},{"type":"mc","q":"___ color do you like better, red or blue?","opts":["What","Which","Where"],"a":1,"ex":"red or blue처럼 정해진 선택지 안에서 고를 때는 Which를 씁니다. 선택지가 열려 있으면 What color를 씁니다."},{"type":"write","ko":"회의가 몇 시에 시작해요?","model":"What time does the meeting start?","alts":["When does the meeting start?"],"nuance":"시각을 콕 집어 물을 때는 What time이 가장 자연스럽습니다. When도 되지만 조금 더 넓은 (언제)의 느낌이라, 시각을 원하면 What time이 명확합니다.","key":["What time","does","start"]},{"type":"mc","q":"___ are you late again?","opts":["Why","How","When"],"a":0,"ex":"이유를 물을 때는 Why를 씁니다. again을 붙이면 (또)라는 약간의 답답함이 담깁니다."},{"type":"write","ko":"이거 누구 우산이에요?","model":"Whose umbrella is this?","alts":["Who does this umbrella belong to?"],"nuance":"소유주를 물을 때는 Whose + 명사가 가장 간결합니다. Who does ~ belong to는 조금 더 격식 있게 들립니다. Whose is this umbrella?도 가능하지만 Whose umbrella is this?가 더 자연스럽습니다.","key":["Whose","umbrella","is this"]},{"type":"mc","q":"___ do you usually get up in the morning?","opts":["What time","Where","Which"],"a":0,"ex":"기상 시각을 물으므로 What time이 맞습니다. Where는 장소, Which는 선택을 물을 때입니다."},{"type":"write","ko":"이 단어는 무슨 뜻이에요?","model":"What does this word mean?","alts":["What is the meaning of this word?"],"nuance":"뜻을 물을 때 원어민은 보통 What does ~ mean? 을 씁니다. 어순은 (의문사 What) + does + 주어 + 동사원형입니다. What is the meaning도 맞지만 조금 더 딱딱합니다.","key":["What","does","mean"]},{"type":"mc","q":"___ of these two bags is yours?","opts":["What","Which","Who"],"a":1,"ex":"these two bags라는 한정된 두 개 중에서 고르므로 Which를 씁니다. of these처럼 범위가 정해지면 거의 항상 Which입니다."},{"type":"write","ko":"주말에 보통 뭐 해요?","model":"What do you usually do on weekends?","alts":["What do you normally do on the weekend?"],"nuance":"습관적인 활동을 물을 때 What do you do가 자연스럽고, usually를 do 앞에 넣습니다. on weekends처럼 복수형을 쓰면 (주말마다)라는 습관의 느낌이 삽니다.","key":["What","usually","on weekends"]},{"type":"mc","q":"___ does this bus go to downtown?","opts":["Why","When","Whose"],"a":1,"ex":"버스가 언제 가는지 시간을 물으므로 When이 맞습니다. Why는 이유, Whose는 소유를 물을 때입니다."},{"type":"write","ko":"저 사람 이름이 뭐예요?","model":"What is that person's name?","alts":["What's her name?","What's his name?"],"nuance":"이름을 물을 때 영어는 Who가 아니라 What을 씁니다. 이름은 (정보)로 보기 때문입니다. Who is that person? 이라고 하면 정체 전체를 묻는 다른 질문이 됩니다.","key":["What","name","that person's"]},{"type":"mc","q":"___ made this cake? It is delicious.","opts":["Who","What","Which"],"a":0,"ex":"케이크를 만든 사람(주어)을 물으므로 Who를 씁니다. 이때 Who가 주어라 조동사 없이 바로 made가 옵니다."},{"type":"write","ko":"어느 길로 가야 해요?","model":"Which way should I go?","alts":["Which way do I need to go?"],"nuance":"길이 여러 갈래로 정해져 있고 그중 하나를 묻는 상황이라 Which way가 자연스럽습니다. What way라고는 잘 쓰지 않습니다. 선택지가 눈앞에 있으면 Which를 기억하세요.","key":["Which way","should","go"]},{"type":"mc","q":"___ do you think about my new plan?","opts":["What","How","Which"],"a":0,"ex":"의견을 물을 때 영어는 What do you think about ~? 을 씁니다. How do you think about은 틀린 표현으로, How는 방법을 물을 때만 씁니다."},{"type":"write","ko":"이 근처에서 언제 처음 만났죠?","model":"When did we first meet?","alts":["When was the first time we met?"],"nuance":"과거의 시점을 물을 때 When did + 주어 + 동사원형 순서를 씁니다. first를 넣으면 (처음)이라는 뜻이 명확해집니다. did를 썼으니 뒤 동사는 원형 meet이 됩니다.","key":["When","did","first meet"]},{"type":"mc","q":"___ languages do you speak?","opts":["What","Who","Whose"],"a":0,"ex":"어떤 언어들을 하는지 열린 범위를 물으므로 What languages가 맞습니다. 선택지가 미리 정해져 있지 않으면 What을 씁니다."},{"type":"write","ko":"왜 그렇게 생각해요?","model":"Why do you think so?","alts":["What makes you think that?"],"nuance":"이유를 물을 때 Why do you think so?가 가장 기본입니다. What makes you think that?은 (뭐 때문에 그렇게 생각해?)라는 조금 더 부드럽고 궁금해하는 뉘앙스입니다.","key":["Why","do you think","so"]},{"type":"mc","q":"___ one do you want, the big one or the small one?","opts":["What","Which","Where"],"a":1,"ex":"the big one or the small one이라는 두 선택지 중 하나를 고르므로 Which one이 맞습니다. 선택지가 제시되면 Which를 씁니다."},{"type":"write","ko":"이거 어떻게 사용하는 거예요?","model":"How do yo :"지어진 시점을 물을 때 수동태 When was ~ built?가 자연스럽습니다. 누가 지었는지 모를 때 특히 좋습니다. When did they build ~?는 능동으로, 막연한 they를 주어로 씁니다.","key":["When","was","built"]},{"type":"mc","q":"___ of your friends can speak French?","opts":["What","Which","Who"],"a":1,"ex":"your friends라는 정해진 그룹 안에서 고르므로 Which of your friends가 맞습니다. of + 특정 집단이 오면 Which를 씁니다."},{"type":"write","ko":"지금 어디 있어요?","model":"Where are you now?","alts":["Where are you right now?"],"nuance":"현재 위치를 물을 때 Where are you now?가 가장 간단하고 자연스럽습니다. right now를 쓰면 (바로 지금)이라는 강조가 살짝 더해집니다.","key":["Where","are you","now"]},{"type":"mc","q":"___ told you about the surprise party?","opts":["Who","Whose","Which"],"a":0,"ex":"말해 준 사람(주어)을 물으므로 Who가 맞습니다. Who가 주어라 조동사 없이 바로 told가 옵니다."},{"type":"write","ko":"보통 아침에 뭐 먹어요?","model":"What do you usually eat for breakfast?","alts":["What do you normally have for breakfast?"],"nuance":"습관을 물으므로 What do you usually eat 어순이 맞습니다. for breakfast로 (아침으로)를 표현합니다. eat 대신 have를 써도 아주 자연스럽습니다.","key":["What","usually eat","for breakfast"]},{"type":"mc","q":"___ time zone are you in right now?","opts":["What","Who","Why"],"a":0,"ex":"어떤 시간대인지 열린 범위를 물으므로 What time zone이 맞습니다. 선택지가 정해지지 않은 명사 앞에는 What을 씁니다."},{"type":"write","ko":"이 두 셔츠 중에 어떤 게 더 잘 어울려요?","model":"Which of these two shirts looks better on me?","alts":["Which shirt looks better on me?"],"nuance":"두 셔츠라는 한정된 선택지라 Which를 씁니다. looks better on me로 (나에게 더 잘 어울린다)를 표현하면 자연스럽습니다. What shirt는 어색합니다.","key":["Which","two shirts","looks better"]},{"type":"write","ko":"회의가 왜 취소됐어요?","model":"Why was the meeting canceled?","alts":["Why did they cancel the meeting?"],"nuance":"취소된 이유를 물을 때 수동태 Why was ~ canceled?가 자연스럽습니다. 누가 취소했는지 모를 때 특히 좋습니다. 미국식 철자는 canceled, 영국식은 cancelled입니다.","key":["Why","was","canceled"]},{"type":"mc","q":"___ is the weather like in Seoul today?","opts":["How","What","Which"],"a":1,"ex":"날씨를 물을 때 What is the weather like? 라는 관용 표현을 씁니다. like가 뒤에 오는 게 핵심입니다. How is the weather?도 되지만 like와 함께라면 What을 씁니다."},{"type":"write","ko":"이 사진 누가 찍었어요?","model":"Who took this photo?","alts":["Who took this picture?"],"nuance":"찍은 사람(주어)을 물으므로 Who took ~? 어순이 맞습니다. Who가 주어라 did 없이 과거형 took을 바로 씁니다. Who did take는 강조가 아닌 이상 쓰지 않습니다.","key":["Who","took","this photo"]},{"type":"mc","q":"___ are we meeting, tomorrow or the day after?","opts":["Where","When","Who"],"a":1,"ex":"tomorrow or the day after처럼 시점을 물으므로 When이 맞습니다. 날짜나 때를 물을 때는 When입니다."},{"type":"write","ko":"어느 게 당신 자리예요?","model":"Which one is your seat?","alts":["Which seat is yours?"],"nuance":"자리가 여러 개 있고 그중 하나를 물으므로 Which를 씁니다. Which one is your seat?와 Which seat is yours?는 둘 다 자연스럽습니다. What seat은 어색합니다.","key":["Which one","your seat","is"]},{"type":"write","ko":"이거 어디서 샀어요?","model":"Where did you buy this?","alts":["Where did you get this?"],"nuance":"구입 장소를 물으므로 Where로 시작합니다. did를 썼으니 뒤 동사는 원형 buy입니다. get을 쓰면 (어디서 났어?)처럼 조금 더 캐주얼합니다.","key":["Where","did you buy","this"]},{"type":"write","ko":"이 프로젝트 담당자가 누구예요?","model":"Who is in charge of this project?","alts":["Who is responsible for this project?"],"nuance":"책임자가 누구인지 사람을 물으므로 Who를 씁니다. be in charge of로 (~을 담당하다)를 표현합니다. responsible for도 같은 뜻으로 자연스럽습니다.","key":["Who","in charge of","project"]},{"type":"mc","q":"___ do you spell your last name?","opts":["What","How","Which"],"a":1,"ex":"철자를 물을 때는 방법을 묻는 How do you spell ~? 을 씁니다. What do you spell은 어색합니다."},{"type":"write","ko":"어느 나라에서 오셨어요?","model":"Which country are you from?","alts":["Where are you from?"],"nuance":"country라는 명사를 앞에 두고 물을 때는 보통 Which country are you from?을 씁니다. 더 간단하게는 Where are you from?이 가장 흔하게 쓰입니다.","key":["Which country","are you from"]},{"type":"mc","q":"___ did you say that? I did not hear you.","opts":["What","Who","Why"],"a":0,"ex":"방금 무슨 말을 했는지 되물으므로 What did you say?가 맞습니다. 못 들었을 때 자주 쓰는 표현입니다."},{"type":"write","ko":"이 노래 제목이 뭐예요?","model":"What is the title of this song?","alts":["What's this song called?"],"nuance":"제목이라는 정보를 물으므로 What을 씁니다. What is the title of ~?도 좋고, 회화에서는 What's this song called?가 더 자주 쓰입니다.","key":["What","title","song"]},{"type":"mc","q":"___ hours a day do you study English?","opts":["How much","How many","What"],"a":1,"ex":"hours는 셀 수 있는 명사이므로 How many hours를 씁니다. 셀 수 없는 양에는 How much를 씁니다."},{"type":"write","ko":"왜 아직도 안 자고 있어요?","model":"Why are you still awake?","alts":["Why are you still up?"],"nuance":"still awake로 (아직도 깨어 있는) 상태를 표현하고 이유를 Why로 묻습니다. still up도 같은 뜻의 캐주얼한 표현입니다. 걱정이나 놀람의 뉘앙스가 담깁니다.","key":["Why","still awake","are you"]},{"type":"mc","q":"___ seat would you like, a window or an aisle?","opts":["What","Which","Where"],"a":1,"ex":"a window or an aisle이라는 두 선택지 중에서 고르므로 Which seat이 맞습니다. 선택지가 제시되면 Which입니다."},{"type":"write","ko":"이 셔츠 어떤 사이즈로 드릴까요?","model":"What size shirt would you like?","alts":["Which size would you like?"],"nuance":"사이즈 종류가 정해지지 않고 열려 있을 때는 What size가 자연스럽습니다. would you like로 공손하게 물으면 매장에서 쓰는 자연스러운 표현이 됩니다. 진열된 몇 가지 중 고르는 상황이면 Which size도 가능합니다.","key":["What size","shirt","would you like"]},{"type":"write","ko":"그 사람이 뭐라고 했어요?","model":"What did he say?","alts":["What did she say?"],"nuance":"발언 내용을 물으므로 What did + 주어 + 동사원형 순서로 What did he say?가 맞습니다. did를 썼으니 say는 원형입니다. 성별에 따라 he나 she를 고릅니다.","key":["What","did","say"]},{"type":"mc","q":"___ is your birthday?","opts":["When","Where","Who"],"a":0,"ex":"생일이 언제인지 날짜(시점)를 물으므로 When이 맞습니다. 때를 물을 때는 When을 씁니다."},{"type":"write","ko":"우리 어디서 만날까요?","model":"Where should we meet?","alts":["Where do you want to meet?"],"nuance":"만날 장소를 상의할 때 Where should we meet?이 자연스럽습니다. should로 (~할까요?)라는 제안의 느낌을 줍니다. do you want to meet?은 상대의 선호를 더 존중하는 표현입니다.","key":["Where","should","meet"]},{"type":"mc","q":"___ of the two movies did you enjoy more?","opts":["What","Which","How"],"a":1,"ex":"the two movies라는 한정된 두 편 중에서 고르므로 Which가 맞습니다. of the two처럼 범위가 둘로 정해지면 항상 Which입니다."},{"type":"write","ko":"공항까지 시간이 얼마나 걸려요?","model":"How long does it take to get to the airport?","alts":["How long is it to the airport?"],"nuance":"소요 시간을 물을 때 How long does it take to ~?가 정석입니다. take가 (시간이 걸리다)라는 뜻으로 쓰입니다. get to로 (~에 도착하다)를 표현합니다.","key":["How long","does it take","get to"]},{"type":"mc","q":"___ are you crying? Is everything okay?","opts":["Why","What","When"],"a":0,"ex":"우는 이유를 물으므로 Why가 맞습니다. 뒤에 걱정하는 말을 덧붙이면 따뜻한 뉘앙스가 됩니다."},{"type":"write","ko":"이 자리 누구 자리예요?","model":"Whose seat is this?","alts":["Is this seat taken?"],"nuance":"자리의 주인을 물을 때 Whose seat is this?가 직접적입니다. 실제 상황에서는 Is this seat taken? (이 자리 임자 있어요?)이 더 부드럽고 흔하게 쓰입니다.","key":["Whose","seat","is this"]},{"type":"mc","q":"___ is the meeting going to be held?","opts":["Where","Who","Whose"],"a":0,"ex":"회의가 열릴 장소를 물으므로 Where가 맞습니다. be held는 (개최되다)라는 수동 표현입니다."},{"type":"write","ko":"어느 버스를 타야 강남에 가요?","model":"Which bus goes to Gangnam?","alts":["Which bus do I take to get to Gangnam?"],"nuance":"여러 버스 중 하나를 골라야 하므로 Which bus를 씁니다. Which bus goes to ~?는 (어느 버스가 ~로 가나요)로 버스를 주어로 둔 간결한 표현입니다. What bus는 어색합니다.","key":["Which bus","goes to","Gangnam"]},{"type":"write","ko":"이 기계는 어떻게 작동해요?","model":"How does this machine work?","alts":["How do you operate this machine?"],"nuance":"작동 원리나 방법을 물으므로 How를 씁니다. How does this machine work?는 스스로 어떻게 돌아가는지를, How do you operate ~?는 사람이 어떻게 다루는지를 묻는 미묘한 차이가 있습니다.","key":["How","does","work"]},{"type":"mc","q":"___ ideas do you have for the project?","opts":["Which","What","Whose"],"a":1,"ex":"어떤 아이디어들이 있는지 열린 범위를 물으므로 What ideas가 맞습니다. 선택지가 미리 정해지지 않았으므로 What입니다."},{"type":"write","ko":"저 소리 뭐였어요?","model":"What was that noise?","alts":["What was that sound?"],"nuance":"소리의 정체를 물으므로 What was that ~?를 씁니다. 과거의 순간에 난 소리라 was를 씁니다. noise는 (거슬리는 소리), sound는 (중립적인 소리)의 느낌 차이가 있습니다.","key":["What","was","that noise"]},{"type":"mc","q":"___ way is the exit, left or right?","opts":["What","Which","Where"],"a":1,"ex":"left or right라는 정해진 두 방향 중 고르므로 Which way가 맞습니다. 방향 선택에는 Which way를 씁니다."},{"type":"write","ko":"누구한테 물어봐야 해요?","model":"Who should I ask?","alts":["Who do I need to ask?"],"nuance":"물어볼 대상(사람)을 물으므로 Who로 시작합니다. Who should I ask?는 (누구한테 물어보는 게 좋을까요)라는 조언을 구하는 느낌이 있습니다. whom은 격식체라 회화에선 who가 자연스럽습니다.","key":["Who","should","ask"]},{"type":"write","ko":"수업이 몇 시에 끝나요?","model":"What time does the class end?","alts":["When does the class finish?"],"nuance":"끝나는 시각을 물으므로 What time을 씁니다. 어순은 What time + does + 주어 + 동사원형이라 end가 원형입니다. finish로 바꿔도 자연스럽습니다.","key":["What time","does","end"]},{"type":"mc","q":"___ is she talking to on the phone?","opts":["Who","What","Which"],"a":0,"ex":"통화 상대인 사람을 물으므로 Who가 맞습니다. 문장 끝의 to와 짝을 이루어 (누구와 통화하니)라는 뜻이 됩니다."},{"type":"write","ko":"우리 언제 다시 만날 수 있을까요?","model":"When can we meet again?","alts":["When can we get together again?"],"nuance":"다시 만날 시점을 물으므로 When can we ~? 어순을 씁니다. again으로 (다시)를 표현합니다. get together는 (모이다)라는 조금 더 편안한 느낌입니다.","key":["When","can we","meet again"]},{"type":"mc","q":"___ of these desserts should we order?","opts":["What","Which","Who"],"a":1,"ex":"these desserts라는 눈앞의 정해진 것들 중에서 고르므로 Which가 맞습니다. of these가 오면 Which를 씁니다."},{"type":"write","ko":"이거 어떻게 만들었어요?","model":"How did you make this?","alts":["How was this made?"],"nuance":"만든 방법을 물으므로 How did you make ~?를 씁니다. did를 썼으니 make는 원형입니다. How was this made?는 만든 사람보다 과정에 초점을 둔 수동 표현입니다.","key":["How","did you make","this"]},{"type":"write","ko":"왜 그 사람을 그렇게 좋아해요?","model":"Why do you like him so much?","alts":["What do you like about him?"],"nuance":"이유를 직접 물으면 Why do you like him so much?입니다. What do you like about him?은 (그의 어떤 점이 좋아?)라며 구체적인 부분을 부드럽게 묻는 뉘앙스입니다.","key":["Why","do you like","so much"]},{"type":"mc","q":"___ does the store open in the morning?","opts":["What time","Where","Which"],"a":0,"ex":"가게가 문 여는 시각을 물으므로 What time이 맞습니다. 여는 시간을 물을 때는 What time이 명확합니다."},{"type":"write","ko":"이거 다 누가 정리했어요?","model":"Who cleaned all of this up?","alts":["Who tidied all this up?"],"nuance":"정리한 사람(주어)을 물으므로 Who가 맞고 did 없이 과거형 cleaned를 바로 씁니다. clean up으로 (치우다, 정리하다)를 표현합니다. tidy up도 같은 뜻입니다.","key":["Who","cleaned up","all of this"]},{"type":"mc","q":"___ is this present for?","opts":["Who","Whose","Which"],"a":0,"ex":"선물을 받을 사람을 물으므로 Who ~ for?가 맞습니다. 문장 끝의 for와 짝을 이루어 (누구를 위한 선물이니)라는 뜻이 됩니다."},{"type":"write","ko":"우리 어느 역에서 내려야 해요?","model":"Which station should we get off at?","alts":["Where should we get off?"],"nuance":"여러 역 중 하나를 골라 내려야 하므로 Which station을 씁니다. get off at으로 (~에서 내리다)를 표현하며 문장 끝에 at을 둡니다. 간단히 Where should we get off?로도 자주 씁니다.","key":["Which station","should","get off at"]}]},{"id":"ch4","title":"How 의문문","en":"how + adjective / adverb","intro":"\u003cb>How\u003c/b>는 방법·상태를 묻고, 뒤에 형용사/부사를 붙이면 정도·수량을 물어요. \u003cb>how much\u003c/b>(양·가격), \u003cb>how many\u003c/b>(수), \u003cb>how long\u003c/b>(길이·기간), \u003cb>how often\u003c/b>(빈도), \u003cb>how far\u003c/b>(거리) 등 회화에서 매일 씁니다.","patterns":[{"en":"How + 형용사/부사 + 의문문?","ko":"How old are you?"},{"en":"How much/many + (명사) ~?","ko":"How many books do you have?"},{"en":"How long/often/far ~?","ko":"How long does it take?"}],"examples":[{"en":"How much is this?","ko":"이거 얼마예요?"},{"en":"How many people are coming?","ko":"몇 명이나 와?"},{"en":"How often do you exercise?","ko":"얼마나 자주 운동해?"},{"en":"How long have you lived here?","ko":"여기 얼마나 오래 살았어?"}],"tip":"셀 수 있으면 \u003cb>how many\u003c/b>, 셀 수 없으면 \u003cb>how much\u003c/b>. (how many \u003cb>waters\u003c/b> ✗ → how much water ✓)","quiz":[{"type":"mc","q":"___ do you get to work every morning?","opts":["How","How much","How many"],"a":0,"ex":"수단·방법을 물을 때는 How만 씁니다. How much/many는 양이나 수를 물을 때 쓰므로 여기서는 틀립니다."},{"type":"write","ko":"이 신발 얼마예요?","model":"How much are these shoes?","alts":["How much do these shoes cost?"],"nuance":"가격을 물을 때 가장 흔한 표현은 How much is/are ~? 입니다. 신발은 짝(복수)이라 are these shoes로 쓰는 게 자연스럽습니다. How much does it cost도 되지만 회화에서는 짧은 How much가 훨씬 많이 쓰입니다.","key":["How much are","가격 묻기","복수 are"]},{"type":"mc","q":"___ people are coming to the party?","opts":["How much","How many","How long"],"a":1,"ex":"people은 셀 수 있는 명사(가산 복수)이므로 How many를 씁니다. How much는 셀 수 없는 명사에 씁니다."},{"type":"write","ko":"여기서 공항까지 얼마나 멀어요?","model":"How far is it to the airport from here?","alts":["How far is the airport from here?"],"nuance":"거리를 물을 때는 How far를 씁니다. 주어 자리에 형식상 it을 넣어 How far is it to ~? 형태가 아주 자연스럽습니다. from here를 붙이면 출발 지점이 분명해집니다.","key":["How far","거리 묻기","How far is it to"]},{"type":"mc","q":"___ have you been studying English?","opts":["How long","How far","How old"],"a":0,"ex":"기간을 물을 때는 How long을 씁니다. 완료진행형과 함께 쓰면 지금까지 지속된 시간을 묻는 자연스러운 문장이 됩니다."},{"type":"write","ko":"얼마나 자주 운동하세요?","model":"How often do you work out?","alts":["How often do you exercise?"],"nuance":"빈도를 물을 때는 How often을 씁니다. work out은 헬스·운동을 뜻하는 일상 표현이고, exercise보다 캐주얼하게 들립니다. 대답은 보통 twice a week처럼 (횟수 + a + 기간)으로 합니다.","key":["How often","빈도 묻기","work out"]},{"type":"mc","q":"___ is your little brother?","opts":["How old","How long","How much"],"a":0,"ex":"나이를 물을 때는 How old를 씁니다. 대답은 He's seven (years old)처럼 합니다."},{"type":"write","ko":"거기까지 가는 데 시간이 얼마나 걸려요?","model":"How long does it take to get there?","alts":["How long does it take to get there by bus?"],"nuance":"소요 시간을 물을 때는 How long does it take to ~? 가 정석입니다. take는 (시간이) 걸리다라는 뜻이고 형식주어 it을 씁니다. 수단을 넣고 싶으면 뒤에 by bus, by car 등을 붙입니다.","key":["How long does it take","소요 시간","get there"]},{"type":"mc","q":"___ is the tower? It looks huge.","opts":["How old","How tall","How often"],"a":1,"ex":"건물·사람의 높이·키를 물을 때는 How tall을 씁니다. 건물의 높이에는 How tall 또는 How high를 쓰지만 tall이 더 흔합니다."},{"type":"write","ko":"이 근처에 사신 지 얼마나 되셨어요?","model":"How long have you lived around here?","alts":["How long have you been living around here?"],"nuance":"과거부터 지금까지 이어진 기간은 How long + 현재완료(have lived)로 묻습니다. around here는 이 근처라는 자연스러운 회화 표현입니다. 진행형(have been living)을 써도 뜻은 거의 같습니다.","key":["How long have you lived","현재완료","around here"]},{"type":"mc","q":"___ does it cost to rent a bike here?","opts":["How many","How much","How old"],"a":1,"ex":"비용은 셀 수 없는 개념이라 How much를 씁니다. How much does it cost to ~?는 (~하는 데) 비용이 얼마나 드는지 묻는 표현입니다."},{"type":"write","ko":"버스는 얼마나 자주 와요?","model":"How often does the bus come?","alts":["How often do the buses run?"],"nuance":"교통편의 운행 빈도도 How often으로 묻습니다. run은 (버스·기차가) 운행하다라는 뜻으로 원어민이 자주 씁니다. the bus come과 the buses run 둘 다 자연스럽습니다.","key":["How often","does the bus come","run"]},{"type":"mc","q":"___ come you didn't call me back?","opts":["How","How much","Why much"],"a":0,"ex":"How come은 왜?라는 뜻의 회화 표현으로, 뒤에 do/does 없이 평서문 어순(you didn't)이 그대로 옵니다. Why와 뜻은 같지만 더 캐주얼합니다."},{"type":"write","ko":"이 가방 얼마예요?","model":"How much is this bag?","alts":["How much does this bag cost?"],"nuance":"가격을 물을 때 How much is ~? 가 가장 간단하고 자연스럽습니다. 가게에서 물건을 들고 물을 때 이 한 마디면 충분합니다. cost를 쓰면 조금 더 격식 있게 들립니다.","key":["How much is","가격 묻기","단수 is"]},{"type":"mc","q":"A: I ran a marathon. B: Wow, ___ was it?","opts":["how long","how many","how old"],"a":0,"ex":"거리·길이를 물을 때 How long을 씁니다. 마라톤의 거리를 물으므로 how long이 맞습니다."},{"type":"write","ko":"영어 배운 지 얼마나 됐어요?","model":"How long have you been learning English?","alts":["How long have you studied English?"],"nuance":"학습 기간은 How long + 현재완료진행(have been learning)이 가장 자연스럽습니다. 지금도 계속 배우고 있다는 느낌을 줍니다. study를 써도 되지만 learn이 더 부드럽게 들립니다.","key":["How long have you been learning","현재완료진행","기간"]},{"type":"mc","q":"___ sugar do you want in your coffee?","opts":["How many","How much","How old"],"a":1,"ex":"sugar는 셀 수 없는 명사이므로 How much를 씁니다. 설탕 알갱이는 세지 않고 양으로 봅니다."},{"type":"write","ko":"키가 어떻게 되세요?","model":"How tall are you?","alts":[],"nuance":"사람의 키를 물을 때는 How tall are you? 가 정답입니다. How is your height? 같은 표현은 어색하니 쓰지 마세요. 대답은 I'm about 175 centimeters처럼 합니다.","key":["How tall are you","키 묻기"]},{"type":"mc","q":"___ do you spell your last name?","opts":["How much","How","How many"],"a":1,"ex":"철자를 어떻게 쓰는지 방법을 물으므로 How do you ~? 를 씁니다. How do you spell ~?은 철자를 물을 때 쓰는 굳어진 표현입니다."},{"type":"write","ko":"공항까지 택시비 얼마나 나와요?","model":"How much is a taxi to the airport?","alts":["How much does a taxi to the airport cost?"],"nuance":"요금을 물을 때 How much is + 명사 형태가 아주 실용적입니다. a taxi to the airport처럼 목적지를 붙이면 정확합니다. 택시 기사나 안내에게 그대로 쓸 수 있는 표현입니다.","key":["How much is a taxi","요금 묻기","to the airport"]},{"type":"mc","q":"___ do you say (감사합니다) in English?","opts":["How","How many","How long"],"a":0,"ex":"어떻게 말하는지 방법을 물을 때는 How do you say ~? 입니다. 다른 언어 표현을 영어로 뭐라고 하는지 물을 때 자주 씁니다."},{"type":"write","ko":"하루에 물을 얼마나 마셔요?","model":"How much water do you drink a day?","alts":["How much water do you drink in a day?"],"nuance":"water는 셀 수 없으므로 How much water로 시작합니다. a day는 하루에라는 빈도를 나타냅니다. in a day로 써도 자연스럽습니다.","key":["How much water","셀 수 없는 명사","a day"]},{"type":"mc","q":"___ children do you have?","opts":["How much","How many","How long"],"a":1,"ex":"children은 셀 수 있는 명사이므로 How many를 씁니다. 대답은 Two 또는 I have two kids처럼 합니다."},{"type":"write","ko":"이 건물은 몇 층이에요?","model":"How many floors does this building have?","alts":["How many stories is this building?"],"nuance":"층수는 셀 수 있으므로 How many floors로 묻습니다. does this building have를 붙이면 완전한 문장이 됩니다. 미국에서는 stories(층)라는 단어도 흔히 씁니다.","key":["How many floors","층수 묻기","building"]},{"type":"mc","q":"___ was your trip to Japan?","opts":["How","How much","How many"],"a":0,"ex":"경험이나 상태가 어땠는지 물을 때는 How was ~? 를 씁니다. 대답은 It was great처럼 합니다."},{"type":"write","ko":"보통 몇 시에 자요?","model":"What time do you usually go to bed?","alts":["When do you usually go to sleep?"],"nuance":"시각을 물을 때는 How가 아니라 What time을 씁니다. 한국어 (몇 시)는 How와 헷갈리기 쉽지만 영어에서는 What time이 정답입니다. go to bed는 자러 가다라는 일상 표현입니다.","key":["What time","시각 묻기","go to bed"]},{"type":"mc","q":"___ far is the station from here?","opts":["How","What","How much"],"a":0,"ex":"거리를 물을 때는 How far를 씁니다. far 앞에는 How가 와야 합니다."},{"type":"write","ko":"이 코트 얼마 주고 샀어요?","model":"How much did you pay for this coat?","alts":["How much was this coat?"],"nuance":"얼마 주고 샀는지 물을 때는 How much did you pay for ~? 가 자연스럽습니다. pay for 뒤에 물건을 넣습니다. 이미 산 물건이라 과거형 did/was를 씁니다.","key":["How much did you pay for","과거형","pay for"]},{"type":"mc","q":"___ often do you see your grandparents?","opts":["How","How much","How long"],"a":0,"ex":"빈도를 물을 때는 How often을 씁니다. often 앞에는 How가 옵니다."},{"type":"write","ko":"거기 어떻게 가요?","model":"How do you get there?","alts":["How can I get there?"],"nuance":"가는 방법·수단을 물을 때는 How do you get to ~? 또는 How do you get there? 를 씁니다. get은 (~에) 가다·도착하다라는 뜻으로 방향·수단을 물을 때 go보다 자주 씁니다.","key":["How do you get there","방법 묻기","get"]},{"type":"mc","q":"___ come you're still up? It's 2 a.m.","opts":["How","How many","Why come"],"a":0,"ex":"How come은 왜?라는 뜻이며 뒤에 평서문 어순(you're)이 옵니다. still up은 아직 안 자고 깨어 있다는 뜻입니다."},{"type":"write","ko":"영화 얼마나 길어요?","model":"How long is the movie?","alts":["How long does the movie run?"],"nuance":"영화·행사의 상영 시간(길이)은 How long is ~? 로 묻습니다. run을 쓰면 상영되다·지속되다라는 뉘앙스가 더해집니다. 대답은 About two hours처럼 합니다.","key":["How long is","상영 시간","movie"]},{"type":"mc","q":"___ money did you spend today?","opts":["How many","How much","How long"],"a":1,"ex":"money는 셀 수 없는 명사이므로 How much를 씁니다. How much money did you spend ~?는 얼마를 썼는지 묻는 표현입니다."},{"type":"write","ko":"이거 영어로 어떻게 읽어요?","model":"How do you read this in English?","alts":["How do you pronounce this in English?"],"nuance":"읽는 방법을 물을 때는 How do you read ~? 를 씁니다. 발음을 강조하려면 pronounce를 쓰면 더 정확합니다. in English를 붙여 어떤 언어로인지 분명히 합니다.","key":["How do you read","방법 묻기","in English"]},{"type":"mc","q":"___ is this river? Can we swim across it?","opts":["How wide","How old","How often"],"a":0,"ex":"폭·너비를 물을 때는 How wide를 씁니다. 강을 건널 수 있는지 묻는 맥락이라 너비가 맞습니다."},{"type":"write","ko":"하루에 담배 몇 개비 피워요?","model":"How many cigarettes do you smoke a day?","alts":["How many cigarettes a day do you smoke?"],"nuance":"담배 개비는 셀 수 있으므로 How many cigarettes로 묻습니다. a day는 하루에라는 빈도를 나타냅니다. 어순은 뒤에 a day를 붙이는 게 가장 자연스럽습니다.","key":["How many cigarettes","셀 수 있는 명사","a day"]},{"type":"mc","q":"___ was the weather in Busan?","opts":["How","How much","How many"],"a":0,"ex":"날씨가 어땠는지 상태를 물을 때는 How was ~? 를 씁니다. 대답은 It was sunny처럼 합니다."},{"type":"write","ko":"여기서 얼마나 오래 기다렸어요?","model":"How long have you been waiting here?","alts":["How long did you wait here?"],"nuance":"지금까지 기다린 시간을 물을 때는 How long have you been waiting? 이 자연스럽습니다. 진행의 지속을 강조합니다. 이미 끝난 일이면 과거형 How long did you wait? 를 씁니다.","key":["How long have you been waiting","현재완료진행","기다린 시간"]},{"type":"mc","q":"___ does this word mean?","opts":["How","What","How much"],"a":1,"ex":"단어의 뜻을 물을 때는 What does ~ mean? 을 씁니다. How does it mean은 틀린 표현입니다. 뜻을 물을 때는 What을 씁니다."},{"type":"write","ko":"이 강아지 몇 살이에요?","model":"How old is this puppy?","alts":["How old is your puppy?"],"nuance":"동물의 나이도 사람처럼 How old is ~? 로 묻습니다. 대답은 She's about three months old처럼 합니다. 아주 어리면 개월 수로 말합니다.","key":["How old is","나이 묻기","puppy"]},{"type":"mc","q":"___ do I get to the subway from here?","opts":["How much","How","How many"],"a":1,"ex":"길·방법을 물을 때는 How do I get to ~? 를 씁니다. 길 묻기의 정석 표현으로 get to 뒤에 목적지를 넣습니다."},{"type":"write","ko":"이 반에 학생이 몇 명이에요?","model":"How many students are there in this class?","alts":["How many students are in this class?"],"nuance":"학생 수는 셀 수 있으므로 How many students로 묻습니다. there be 구문(are there)을 쓰면 (~에 몇 명이 있다)라는 뜻이 분명해집니다. there를 빼고 are in this class로 써도 됩니다.","key":["How many students","there be 구문","in this class"]},{"type":"mc","q":"___ do you usually get to work, by car or by bus?","opts":["How much","How","How long"],"a":1,"ex":"수단을 물을 때는 How를 씁니다. by car or by bus로 수단을 예시하고 있으므로 방법을 묻는 How가 맞습니다."},{"type":"write","ko":"이 다리는 얼마나 길어요?","model":"How long is this bridge?","alts":["How long is the bridge?"],"nuance":"사물의 길이를 물을 때도 How long을 씁니다. 시간뿐 아니라 물리적 길이에도 씁니다. 대답은 About one kilometer처럼 합니다.","key":["How long is","길이 묻기","bridge"]},{"type":"mc","q":"___ times have you been to Europe?","opts":["How much","How many","How long"],"a":1,"ex":"times(횟수)는 셀 수 있으므로 How many를 씁니다. How many times ~?는 몇 번 ~했는지 묻는 표현입니다."},{"type":"write","ko":"인터넷이 왜 이렇게 느려요?","model":"How come the internet is so slow?","alts":["Why is the internet so slow?"],"nuance":"How come은 왜?라는 뜻으로 뒤에 평서문 어순(the internet is)이 그대로 옵니다. 불평·의아함을 나타낼 때 자연스럽습니다. Why를 쓰면 어순이 바뀌어 Why is the internet ~? 가 됩니다.","key":["How come","평서문 어순","so slow"]}]},{"id":"ch5","title":"주어 의문문 vs 목적어 의문문","en":"Who broke it? vs Who did you meet?","intro":"이게 한국인이 가장 많이 헷갈리는 부분! 의문사가 \u003cb>주어\u003c/b>이면 do/does/did를 \u003cb>쓰지 않고\u003c/b> 바로 동사가 와요. 의문사가 \u003cb>목적어\u003c/b>이면 보통의 의문문 어순(do/did 사용)입니다.","patterns":[{"en":"주어 의문문: Who + 동사 ~? (do 없음)","ko":"Who called you? / What happened?"},{"en":"목적어 의문문: Who + did + 주어 + 동사원형 ~?","ko":"Who did you call?"}],"examples":[{"en":"Who broke the window?","ko":"누가 창문 깼어? (누가 = 주어)"},{"en":"Who did you invite?","ko":"누구를 초대했어? (누구를 = 목적어)"},{"en":"What happened last night?","ko":"어젯밤에 무슨 일 있었어?"},{"en":"What did she say to you?","ko":"그녀가 너한테 뭐라고 했어?"}],"tip":"의문사가 주어면 \u003cb>did를 넣지 마세요\u003c/b>. 'Who \u003cb>did\u003c/b> call you?' ✗ → 'Who called you?' ✓","quiz":[{"type":"mc","q":"Who ___ the window? (누가 깨뜨렸는지, 주어 의문문)","opts":["did break","broke","did broke"],"a":1,"ex":"Who가 주어라서 do/does/did 없이 바로 과거형 broke를 씁니다. did break나 did broke는 필요 없어요."},{"type":"write","ko":"누가 어제 나한테 전화했어?","model":"Who called me yesterday?","alts":["Who phoned me yesterday?"],"nuance":"Who가 전화한 주체(주어)이므로 did 없이 called를 바로 씁니다. Who did call me? 라고 하면 원어민에게는 강조하거나 따지는 말투(도대체 누가 전화했다는 거야)처럼 들려 어색합니다. 주어 의문문은 평서문 어순에 Who만 앞에 놓는다고 생각하세요.","key":["주어 의문문","Who + 과거동사","did 불필요"]},{"type":"mc","q":"Who ___ you meet at the party? (누구를 만났는지, 목적어 의문문)","opts":["broke","does","did"],"a":2,"ex":"여기서 Who는 만난 대상(목적어)이고 주어는 you입니다. 목적어 의문문이라 did가 필요해요: Who did you meet?"},{"type":"mc","q":"What ___ on the table? (뭐가 있었는지, 주어 의문문)","opts":["was","did be","did was"],"a":0,"ex":"What이 주어이고 be동사 문장이라 did 없이 was를 바로 씁니다. be동사는 do/does/did와 함께 쓰지 않아요."},{"type":"write","ko":"누가 이걸 만들었어?","model":"Who made this?","alts":["Who created this?"],"nuance":"Who가 만든 주체(주어)라서 did 없이 made를 바로 씁니다. Who did make this? 는 흔한 실수인데 원어민에게는 (도대체) 누가 만들었냐고 캐묻는 강조로만 들려 평범한 질문으로는 어색합니다. 주어 의문문은 Who + 동사과거형이 기본이에요.","key":["주어 의문문","Who made","did 넣지 않기"]},{"type":"m 로 바로 씁니다. Who does can present? 처럼 do를 겹쳐 쓰면 안 돼요. 주어 의문문에서 can, will 같은 조동사가 이미 있으면 do/does/did를 추가하지 않습니다.","key":["주어 의문문","Who can present","조동사 중복 금지"]},{"type":"mc","q":"Who ___ the report? (누가 썼는지, 주어 의문문)","opts":["did write","did wrote","wrote"],"a":2,"ex":"Who가 주어이므로 did 없이 wrote를 바로 씁니다. 주어 의문문은 Who + 과거동사예요."},{"type":"write","ko":"너 그 영화 누구랑 봤어?","model":"Who did you watch the movie with?","alts":["Who did you see the movie with?"],"nuance":"주어는 you이고 Who는 함께 본 상대(목적어)라서 목적어 의문문입니다. 이때는 Who did you watch it with? 처럼 did를 넣고 문장 끝에 with를 붙이는 게 자연스러워요. did를 빼면 문장이 성립하지 않습니다.","key":["목적어 의문문","Who did you watch with","did 필요"]},{"type":"mc","q":"Who ___ my seat? (누가 내 자리에 앉았는지, 주어 의문문)","opts":["took","did take","did took"],"a":0,"ex":"Who가 주어이므로 did 없이 took를 바로 씁니다: Who took my seat? 주어 의문문은 조동사 없이 과거동사만 써요."},{"type":"write","ko":"너 지난 휴가 때 누구를 만났어?","model":"Who did you meet on your last vacation?","alts":["Who did you run into on your last vacation?"],"nuance":"주어는 you이고 Who는 만난 대상(목적어)이라서 목적어 의문문입니다. 이때는 Who did you meet? 처럼 did를 반드시 넣습니다. 주어를 묻는 Who met you? (누가 너를 만났어?)와는 뜻이 완전히 달라지니 주어/목적어 구분이 중요해요.","key":["목적어 의문문","Who did you meet","did 필요"]},{"type":"write","ko":"누가 먼저 시작했어?","model":"Who started first?","alts":["Who went first?","Who started it?"],"nuance":"Who가 시작한 사람(주어)이라서 did 없이 started를 바로 씁니다. Who did start first? 는 (도대체) 누가 먼저 시작했냐고 따지는 강조로 들려 일반 질문으로는 어색해요. 주어 의문문은 조동사 did를 빼고 과거동사만 씁니다.","key":["주어 의문문","Who started","did 없이"]}]},{"id":"ch6","title":"부정의문문과 대답의 함정","en":"Negative questions & Yes/No traps","intro":"'Don't you ~? / Isn't it ~?'처럼 부정으로 물으면 놀람·확인·권유의 느낌이 나요. 가장 중요한 건 \u003cb>대답\u003c/b>! 영어는 질문이 부정이든 아니든, \u003cb>내용이 긍정이면 Yes, 부정이면 No\u003c/b>로 답합니다(한국어와 반대일 때가 많아요).","patterns":[{"en":"Don't you ~? / Aren't you ~? / Isn't it ~?","ko":"확인·놀람"},{"en":"사실이 긍정 → Yes (+긍정)","ko":"Yes, I do."},{"en":"사실이 부정 → No (+부정)","ko":"No, I don't."}],"examples":[{"en":"Don't you like it? Yes, I do! (사실 좋아함)","ko":"이거 안 좋아해? — 아니, 좋아해!"},{"en":"Aren't you tired? No, I'm not.","ko":"안 피곤해? — 응, 안 피곤해."},{"en":"Isn't this seat taken? No, it's free.","ko":"이 자리 주인 없어요? — 네, 비어 있어요."},{"en":"Didn't you get my message?","ko":"내 메시지 못 받았어?"}],"tip":"한국어 '응/아니'에 끌리지 말고 \u003cb>사실\u003c/b>로 판단! 좋아하면 무조건 Yes, 안 하면 무조건 No.","quiz":[{"type":"mc","q":"질문: 「Don't you like coffee?」 대답할 사람은 '사실 커피를 좋아함(마신다)'. 자연스러운 대답은 ___","opts":["Yes, I do.","No, I do.","Yes, I don't."],"a":0,"ex":"영어는 부정의문문이어도 '사실'을 기준으로 답합니다. 커피를 좋아한다는 긍정 사실이면 무조건 Yes + 긍정동사(do). 한국어라면 '아니, 좋아해'처럼 No가 나올 수 있어 헷갈리지만 영어는 Yes, I do.가 맞습니다."},{"type":"write","ko":"너 커피 안 좋아해? (상대는 사실 좋아함) - 응, 좋아해.","model":"Yes, I do.","alts":["Yes, I love it.","Yes, I actually do."],"nuance":"한국어에서는 '안 좋아해?'에 '응'이 나오면 어색하게 느껴지지만, 영어는 질문의 부정 여부와 상관없이 사실이 긍정(좋아함)이면 Yes를 씁니다. Yes, I do.가 가장 자연스럽습니다. 여기서 규칙이 한국어와 반대라는 점을 꼭 기억하세요. 한국어는 질문에 동의/반대로 답하고, 영어는 사실 그 자체로 답합니다.","key":["부정의문문 대답","사실이 긍정이면 Yes","Yes, I do."]},{"type":"mc","q":"질문: 「Isn't it cold today?」 사실 '오늘 춥다'. 자연스러운 대답은 ___","opts":["No, it is.","Yes, it is.","Yes, it isn't."],"a":1,"ex":"사실이 '춥다'(긍정)이므로 Yes, it is. 한국어로는 '안 추워?'에 '응(맞아, 추워)'이라 헷갈리지만 영어는 사실이 긍정이면 Yes로 고정됩니다."},{"type":"write","ko":"오늘 안 춥지 않아? (사실은 추움) - 응, 추워.","model":"Yes, it is.","alts":["Yes, it is cold.","Yes, freezing."],"nuance":"영어에서 부정의문문에 답할 때는 질문 형태를 무시하고 사실만 봅니다. 실제로 춥다면 Yes, it is.로 답합니다. 한국어의 '응'과 우연히 일치하지만, 원리는 '동의'가 아니라 '사실이 긍정'이라서 Yes인 것입니다. 이 원리를 기준으로 잡아야 헷갈리지 않습니다.","key":["Isn't it...?","사실 긍정=Yes","Yes, it is."]},{"type":"mc","q":"질문: 「Don't you have a car?」 사실 '차가 없음'. 자연스러운 대답은 ___","opts":["Yes, I don't.","No, I don't.","Yes, I do."],"a":1,"ex":"차가 없다는 부정 사실이면 No + 부정동사(don't). 한국어 '차 없지?'에 '응(없어)'이라 답하는 것과 정반대로, 영어는 No, I don't.가 됩니다."},{"type":"write","ko":"너 차 없지? (사실 없음) - 응, 없어.","model":"No, I don't.","alts":["No, I don't have one.","No, not yet."],"nuance":"한국어는 '차 없지?'라는 질문에 동의하면서 '응'이라고 하지만, 영어는 사실이 부정(없음)이면 반드시 No로 시작합니다. No, I don't.가 정답이고 Yes를 쓰면 원어민은 차가 있다는 뜻으로 오해합니다. 사실이 부정이면 No, 이 규칙이 한국어의 '응/아니'와 반대라는 걸 기억하세요.","key":["사실 부정=No","No, I don't.","한국어 응과 반대"]},{"type":"mc","q":"「그거 네 거 아니야?」를 영어로. 가장 자연스러운 것은 ___","opts":["Isn't that yours?","Is not that yours?","That not yours?"],"a":0,"ex":"부정의문문은 조동사+n't 축약형을 문장 앞에 둡니다. Isn't that yours?가 자연스럽고, Is not that...?처럼 풀어 쓰면 매우 딱딱하거나 문어적입니다."},{"type":"write","ko":"그거 네 거 아니야?","model":"Isn't that yours?","alts":["Isn't this yours?"],"nuance":"부정의문문은 보통 상대가 그럴 거라고 예상하거나 확인하고 싶을 때 씁니다. Isn't that yours?는 '네 거일 것 같은데 맞지?'라는 뉘앙스입니다. 회화에서는 is not을 풀어 쓰지 않고 isn't로 축약하는 것이 자연스럽습니다.","key":["Isn't ...?","축약 isn't","확인 뉘앙스"]},{"type":"mc","q":"질문: 「Aren't you tired?」 사실 '안 피곤함'. 자연스러운 대답은 ___","opts":["Yes, I'm not.","No, I'm not.","No, I am."],"a":1,"ex":"안 피곤하다는 부정 사실이면 No, I'm not. 한국어 '안 피곤해?'에 '응(안 피곤해)'이라 하는 것과 반대로 영어는 No가 됩니다."},{"type":"write","ko":"너 안 피곤해? (사실 안 피곤함) - 응, 안 피곤해.","model":"No, I'm not.","alts":["No, I'm fine.","No, not really."],"nuance":"한국어는 '안 피곤해?'에 동의하며 '응, 안 피곤해'라고 하지만 영어는 사실이 부정(피곤하지 않음)이면 No로 시작합니다. No, I'm not.이 정답입니다. 여기서 Yes를 쓰면 오히려 피곤하다는 뜻이 되니 주의하세요. 영어는 '응/아니'가 아니라 사실의 긍정/부정으로 Yes/No를 결정합니다.","key":["Aren't you...?","사실 부정=No","No, I'm not."]},{"type":"mc","q":"질문: 「Didn't you eat?」 사실 '먹었음'. 자연스러운 대답은 ___","opts":["Yes, I did.","No, I did.","Yes, I didn't."],"a":0,"ex":"먹었다는 긍정 사실이면 Yes, I did. 한국어 '안 먹었어?'에 '아니, 먹었어'라 하는 것과 달리 영어는 사실 긍정이므로 Yes로 시작합니다."},{"type":"write","ko":"너 밥 안 먹었어? (사실 먹었음) - 아니, 먹었어.","model":"Yes, I did.","alts":["Yes, I already ate.","Yes, I did eat."],"nuance":"한국어는 '안 먹었어?'라는 질문 자체를 부정하며 '아니'라고 하지만, 영어는 먹은 것이 사실이면 Yes, I did.로 답합니다. 한국어의 '아니'가 영어에서는 Yes가 되는 대표적인 함정입니다. 질문이 부정이든 긍정이든, 실제로 먹었으면 Yes라는 규칙을 기준으로 삼으세요.","key":["Didn't you...?","사실 긍정=Yes","한국어 아니=영어 Yes"]},{"type":"mc","q":"질문: 「Doesn't she work here?」 사실 '여기서 일 안 함'. 자연스러운 대답은 ___","opts":["Yes, she doesn't.","No, she doesn't.","No, she does."],"a":1,"ex":"여기서 일하지 않는다는 부정 사실이면 No, she doesn't. 3인칭 단수라서 doesn't를 씁니다."},{"type":"write","ko":"그 사람 여기서 일하지 않아? (사실 일 안 함) - 응, 안 해.","model":"No, she doesn't.","alts":["No, she works somewhere else.","No, not here."],"nuance":"영어는 그녀가 여기서 일하지 않는다는 부정 사실이면 No, she doesn't.로 답합니다. 한국어의 '응(그래, 안 해)'과 뜻은 같지만 표현은 No로 시작하니 주의하세요. 사실이 부정이면 항상 No라는 점이 한국어의 '응'과 어긋나는 부분입니다.","key":["Doesn't she...?","사실 부정=No","No, she doesn't."]},{"type":"mc","q":"질문: 「Can't you swim?」 사실 '수영할 수 있음'. 자연스러운 대답은 ___","opts":["No, I can.","Yes, I can.","Yes, I can't."],"a":1,"ex":"수영할 수 있다는 긍정 사실이면 Yes, I can. can 의문문도 규칙은 동일하게 '사실 기준'입니다."},{"type":"write","ko":"너 수영 못 해? (사실은 할 수 있음) - 아니, 할 수 있어.","model":"Yes, I can.","alts":["Yes, I can swim.","Yes, actually I can."],"nuance":"한국어는 '수영 못 해?'를 부정하며 '아니, 할 수 있어'라고 하지만 영어는 할 수 있다는 사실이 긍정이므로 Yes, I can.으로 답합니다. 한국어의 '아니'가 영어의 Yes로 뒤집히는 전형적인 경우입니다. 능력을 물어도 규칙은 같아서, 실제로 가능하면 Yes입니다.","key":["Can't you...?","사실 긍정=Yes","한국어 아니=영어 Yes"]},{"type":"mc","q":"질문: 「Won't you come?」 사실 '안 갈 것임'. 자연스러운 대답은 ___","opts":["Yes, I won't.","No, I won't.","No, I will."],"a":1,"ex":"안 간다는 부정 사실이면 No, I won't. will 미래형 부정의문문도 사실 기준입니다."},{"type":"write","ko":"너 안 올 거야? (사실 안 감) - 응, 안 갈래.","model":"No, I won't.","alts":["No, I can't make it.","No, I'll pass."],"nuance":"영어는 오지 않을 것이라는 부정 사실이면 No, I won't.로 답합니다. 한국어 '응(안 갈래)'과 뜻은 통하지만 시작이 No라는 점이 다릅니다. 참고로 Won't you come?은 '와 주지 않을래?'처럼 권유로 쓰일 때도 있어, 그럴 땐 수락하면 Sure나 Yes로 답하기도 합니다.","key":["Won't you...?","사실 부정=No","No, I won't."]},{"type":"mc","q":"질문: 「Haven't you finished?」 사실 '아직 안 끝냄'. 자연스러운 대답은 ___","opts":["Yes, I haven't.","No, not yet.","Yes, I have."],"a":1,"ex":"아직 안 끝냈다는 부정 사실이면 No로 답합니다. No, not yet.이 자연스럽고, 완전한 형태는 No, I haven't.입니다."},{"type":"write","ko":"너 아직 안 끝냈어? (사실 안 끝남) - 응, 아직.","model":"No, not yet.","alts":["No, I haven't.","No, still working on it."],"nuance":"현재완료 부정의문문 Haven't you finished?에도 사실 기준이 적용됩니다. 아직 안 끝냈으면 No, I haven't. 또는 짧게 No, not yet.입니다. 한국어의 '응(아직 안 했어)'과 달리 영어는 No로 시작합니다. 사실이 부정이면 No라는 규칙을 놓치지 마세요.","key":["Haven't you...?","사실 부정=No","No, not yet."]},{"type":"mc","q":"질문: 「Isn't he your brother?」 사실 '내 형/동 +부정동사가 됩니다. 한국어처럼 질문에 대한 '응/아니'로 접근하면 이 짝이 어긋나기 쉬우니 사실을 먼저 판단하세요.","key":["Yes+긍정동사","No+부정동사","짝 맞추기"]},{"type":"mc","q":"질문: 「Didn't you like the food?」 사실 '좋았음'. 자연스러운 대답은 ___","opts":["No, I did.","Yes, I did.","Yes, I didn't."],"a":1,"ex":"좋았다는 긍정 사실이면 Yes, I did. 한국어 '음식 별로였어?'에 '아니, 좋았어'와 달리 영어는 Yes로 시작합니다."},{"type":"write","ko":"음식 별로였어? (사실은 좋았음) - 아니, 맛있었어.","model":"Yes, I did.","alts":["Yes, I loved it.","Yes, it was great."],"nuance":"한국어는 '별로였어?'를 부정하며 '아니, 좋았어'라고 하지만 영어는 좋았다는 긍정 사실이므로 Yes, I did.입니다. Yes, I loved it.은 더 강한 만족을 나타냅니다. 한국어의 '아니'가 영어의 Yes로 뒤집히는 함정에 주의하세요.","key":["Didn't you like...?","사실 긍정=Yes","Yes, I did."]},{"type":"mc","q":"질문: 「Isn't there any milk left?」 사실 '우유가 좀 남아 있음'. 자연스러운 대답은 ___","opts":["No, there is.","Yes, there is.","Yes, there isn't."],"a":1,"ex":"우유가 남아 있다는 긍정 사실이면 Yes, there is. there is 구문의 부정의문문도 사실 기준입니다."},{"type":"write","ko":"우유 하나도 안 남았어? (사실은 좀 남음) - 아니, 조금 있어.","model":"Yes, there is.","alts":["Yes, there's a little.","Yes, some is left."],"nuance":"한국어는 '안 남았어?'를 부정하며 '아니, 있어'라고 하지만 영어는 남아 있다는 긍정 사실이므로 Yes, there is.입니다. there is/are 구문도 예외 없이 사실 기준으로 답합니다. 한국어의 '아니'가 영어의 Yes로 바뀌는 점을 기억하세요.","key":["Isn't there...?","사실 긍정=Yes","Yes, there is."]},{"type":"mc","q":"질문: 「Shouldn't we tell her?」 사실 '말하면 안 됨(말 안 하는 게 맞음)'. 자연스러운 대답은 ___","opts":["Yes, we shouldn't.","No, we shouldn't.","No, we should."],"a":1,"ex":"말하지 말아야 한다는 부정 사실이면 No, we shouldn't. should 부정의문문도 사실 기준으로 답합니다."},{"type":"write","ko":"우리 그 사람한테 말해야 하지 않을까? (사실은 말 안 하는 게 나음) - 아니, 말 안 하는 게 나아.","model":"No, we shouldn't.","alts":["No, let's not.","No, it's better not to."],"nuance":"영어는 말하지 않는 게 낫다는 부정 사실이면 No, we shouldn't.로 답합니다. Shouldn't we...?는 제안하듯 묻는 표현이지만, 답은 여전히 사실 기준입니다. No, let's not.은 '그러지 말자'라는 자연스러운 회화 표현입니다. 사실이 부정이면 No라는 규칙을 조동사 should에도 그대로 적용하세요.","key":["Shouldn't we...?","사실 부정=No","No, we shouldn't."]},{"type":"mc","q":"질문: 「Don't you feel better now?」 사실 '기분이 나아짐'. 자연스러운 대답은 ___","opts":["No, I do.","Yes, I do.","Yes, I don't."],"a":1,"ex":"기분이 나아졌다는 긍정 사실이면 Yes, I do. 한국어 '이제 좀 낫지 않아?'에 '응(그래, 나아)'과 우연히 일치하지만 원리는 사실 긍정이라 Yes입니다."},{"type":"write","ko":"이제 좀 괜찮지 않아? (사실은 나아짐) - 응, 훨씬 나아.","model":"Yes, I do.","alts":["Yes, much better.","Yes, I feel a lot better."],"nuance":"영어는 기분이 나아졌다는 긍정 사실이면 Yes, I do.로 답합니다. 이 경우 한국어의 '응'과 영어의 Yes가 우연히 맞지만, 판단 기준은 사실이 긍정이라는 데 있습니다. Yes, much better.처럼 짧게 답해도 자연스럽습니다.","key":["Don't you feel...?","사실 긍정=Yes","Yes, much better."]},{"type":"mc","q":"질문: 「Aren't these seats taken?」 사실 '자리 안 찼음(비어 있음)'. 자연스러운 대답은 ___","opts":["Yes, they aren't.","No, they aren't.","No, they are."],"a":1,"ex":"자리가 비어 있다(taken이 아니다)는 부정 사실이면 No, they aren't. 사실이 부정이므로 No로 시작합니다."},{"type":"write","ko":"이 자리 임자 있지 않나요? (사실은 비어 있음) - 아니요, 비어 있어요.","model":"No, they aren't.","alts":["No, they're free.","No, go ahead and sit."],"nuance":"영어는 자리가 임자 없이 비어 있다(not taken)는 부정 사실이면 No, they aren't.로 답합니다. No, they're free.는 '비어 있어요'라는 친절한 표현입니다. 한국어 '아니요, 비어 있어요'와 이 경우 No끼리 일치하지만, 기준은 어디까지나 taken이 아니라는 사실이 부정이라 No라는 점입니다.","key":["Aren't ... taken?","사실 부정=No","No, they're free."]},{"type":"mc","q":"질문: 「Don't you speak English?」 사실 '영어를 함'. 자연스러운 대답은 ___","opts":["No, I do.","Yes, I do.","Yes, I don't."],"a":1,"ex":"영어를 한다는 긍정 사실이면 Yes, I do. 한국어 '영어 못 해?'에 '아니, 해'와 달리 영어는 Yes로 시작합니다."},{"type":"write","ko":"너 영어 못 해? (사실은 함) - 아니, 조금 해.","model":"Yes, I do.","alts":["Yes, a little.","Yes, I speak some English."],"nuance":"한국어는 '영어 못 해?'를 부정하며 '아니, 해'라고 하지만 영어는 영어를 한다는 긍정 사실이므로 Yes, I do.입니다. Yes, a little.처럼 정도를 덧붙이면 겸손하면서 자연스럽습니다. 한국어의 '아니'가 영어의 Yes로 뒤집히는 점을 기억하세요.","key":["Don't you speak...?","사실 긍정=Yes","Yes, I do."]},{"type":"mc","q":"부정의문문 대답에서 한국어와 영어가 '가장 크게' 어긋나는 상황은 ___","opts":["사실이 긍정인데 한국어로 '아니'라고 답할 때(영어는 Yes)","사실과 대답이 항상 똑같이 나올 때","질문이 긍정의문문일 때"],"a":0,"ex":"사실이 긍정이면 한국어에서는 질문을 부정하며 '아니'라고 하지만 영어는 Yes로 답합니다. 예: '안 먹었어?'(사실 먹음) - 한국어 '아니, 먹었어' vs 영어 Yes, I did. 이 지점에서 가장 헷갈립니다."},{"type":"write","ko":"(정리) '안 먹었어?'에 실제로 먹었다면 한국어는 '아니', 영어는 Yes.","model":"If you did eat, Korean says No but English says Yes.","alts":["When the fact is positive, Korean uses No but English uses Yes."],"nuance":"이 문장이 챕터의 함정을 한 줄로 요약합니다. 한국어는 질문에 대한 동의/반대로 답해서, 부정의문문에 사실이 긍정이면 '아니'가 나옵니다. 반면 영어는 사실만 보므로 같은 상황에서 Yes가 됩니다. 그래서 한국어 '아니'가 영어 Yes로, 한국어 '응'이 영어 No로 뒤집히는 경우가 생깁니다. 헷갈릴 때는 질문을 무시하고 '사실이 긍정인가 부정인가'만 자문하세요.","key":["한국어 아니=영어 Yes","질문 무시, 사실만","한 줄 요약"]},{"type":"mc","q":"질문: 「Hasn't the bus left yet?」 사실 '버스가 아직 안 떠남'. 자연스러운 대답은 ___","opts":["Yes, it hasn't.","No, it hasn't.","No, it has."],"a":1,"ex":"버스가 아직 안 떠났다는 부정 사실이면 No, it hasn't. 현재완료 3인칭 부정의문문도 사실 기준입니다."},{"type":"write","ko":"버스 아직 안 떠났어? (사실 아직 안 떠남) - 응, 아직 있어.","model":"No, it hasn't.","alts":["No, not yet.","No, it's still here."],"nuance":"영어는 버스가 아직 떠나지 않았다는 부정 사실이면 No, it hasn't.로 답합니다. 한국어 '응(그래, 아직 안 떠났어)'과 뜻은 같지만 영어는 No로 시작합니다. No, not yet.이나 No, it's still here.가 자연스럽습니다. 사실이 부정이면 No라는 규칙을 지키세요.","key":["Hasn't ... yet?","사실 부정=No","No, not yet."]},{"type":"mc","q":"질문: 「Isn't it too expensive?」 사실 '너무 비쌈'. 자연스러운 대답은 ___","opts":["No, it is.","Yes, it is.","Yes, it isn't."],"a":1,"ex":"너무 비싸다는 긍정 사실이면 Yes, it is. 한국어 '너무 비싸지 않아?'에 '응(그래, 비싸)'과 우연히 일치하지만 원리는 사실 긍정이라 Yes입니다."},{"type":"write","ko":"이거 너무 비싸지 않아? (사실 비쌈) - 응, 좀 비싸네.","model":"Yes, it is.","alts":["Yes, it's a bit pricey.","Yes, way too expensive."],"nuance":"영어는 비싸다는 긍정 사실이면 Yes, it is.로 답합니다. 이 경우 한국어의 '응'과 영어의 Yes가 우연히 맞지만, 이유는 동의라서가 아니라 사실이 긍정이라서입니다. Yes, it's a bit pricey.는 완곡하게 '좀 비싸다'는 표현입니다.","key":["Isn't it too...?","사실 긍정=Yes","Yes, it is."]},{"type":"mc","q":"질문: 「Didn't they win?」 사실 '졌음(못 이김)'. 자연스러운 대답은 ___","opts":["Yes, they didn't.","No, they didn't.","No, they did."],"a":1,"ex":"이기지 못했다는 부정 사실이면 No, they didn't. 사실이 부정이므로 No로 시작합니다."},{"type":"write","ko":"걔네 안 이겼어? (사실은 짐) - 응, 졌어.","model":"No, they didn't.","alts":["No, they lost.","No, unfortunately not."],"nuance":"영어는 이기지 못했다는 부정 사실이면 No, they didn't.로 답합니다. 한국어 '응(그래, 못 이겼어)'과 뜻은 통하지만 영어는 No로 시작합니다. No, they lost.가 가장 명확한 표현입니다. 사실이 부정이면 No라는 규칙이 한국어의 '응'과 어긋나는 경우입니다.","key":["Didn't they win?","사실 부정=No","No, they lost."]},{"type":"mc","q":"질문: 「Don't you remember me?」 사실 '기억함'. 자연스러운 대답은 ___","opts":["No, I do.","Yes, I do.","Yes, I don't."],"a":1,"ex":"기억한다는 긍정 사실이면 Yes, I do. 한국어 '나 기억 안 나?'에 '아니, 기억나'와 달리 영어는 Yes로 시작합니다."},{"type":"write","ko":"나 기억 안 나? (사실은 기억함) - 아니, 당연히 기억하지.","model":"Yes, I do.","alts":["Yes, of course I do.","Yes, I remember you."],"nuance":"한국어는 '기억 안 나?'를 부정하며 '아니, 기억나'라고 하지만 영어는 기억한다는 긍정 사실이므로 Yes, I do.입니다. Yes, of course I do.는 '당연하지'라는 반가운 느낌을 줍니다. 한국어의 '아니'가 영어의 Yes로 뒤집히는 대표 사례임을 기억하세요.","key":["Don't you remember me?","사실 긍정=Yes","Yes, of course I do."]}]},{"id":"ch7","title":"부가의문문 (question tags)","en":"..., isn't it? / ..., do you?","intro":"문장 끝에 붙여 '그렇지?' 하고 확인하는 꼬리표예요. 규칙은 간단! \u003cb>긍정문에는 부정 태그, 부정문에는 긍정 태그\u003c/b>를 붙이고, 앞 문장의 (조)동사와 주어를 대명사로 받습니다.","patterns":[{"en":"긍정문, + 부정 태그?","ko":"It's cold, isn't it?"},{"en":"부정문, + 긍정 태그?","ko":"You don't smoke, do you?"},{"en":"특수: I'm ~, aren't I? / Let's ~, shall we? / 명령문, will you?","ko":"예외 암기"}],"examples":[{"en":"You're coming, aren't you?","ko":"너 올 거지, 그렇지?"},{"en":"She can drive, can't she?","ko":"걔 운전할 수 있지, 안 그래?"},{"en":"You didn't call him, did you?","ko":"걔한테 전화 안 했지, 그렇지?"},{"en":"Let's take a break, shall we?","ko":"좀 쉬자, 어때?"}],"tip":"앞이 긍정이면 태그는 부정, 앞이 부정이면 태그는 긍정. 조동사가 없으면 \u003cb>do/does/did\u003c/b>로 받아요.","quiz":[{"type":"mc","q":"You live near the station, ___","opts":["don't you?","do you?","aren't you?"],"a":0,"ex":"긍정문(You live)에는 부정 태그를 붙입니다. 일반동사 현재형 긍정이므로 don't you? 가 맞습니다."},{"type":"write","ko":"너 커피 안 마시지, 그렇지?","model":"You don't drink coffee, do you?","alts":["You don't drink coffee, right?"],"nuance":"부정문 뒤에는 긍정 태그(do you?)를 붙입니다. 끝을 올려 읽으면 진짜 확인하는 질문처럼 들리고, 내려 읽으면 (안 마시는 거 알면서) 동의를 구하는 느낌입니다. right? 로 바꾸면 더 캐주얼합니다.","key":["부정문+긍정 태그","do you?","억양에 따른 뉘앙스"]},{"type":"mc","q":"She's from Busan, ___","opts":["is she?","isn't she?","doesn't she?"],"a":1,"ex":"She is(be동사 긍정)이므로 부정 태그 isn't she? 가 맞습니다. 주어와 be동사를 그대로 부정으로 받습니다."},{"type":"mc","q":"Let's take a break, ___","opts":["will we?","shall we?","don't we?"],"a":1,"ex":"Let's ~ 로 시작하는 청유문의 태그는 항상 shall we? 입니다."},{"type":"write","ko":"우리 오늘 저녁에 만나기로 했잖아, 그렇지?","model":"We're meeting tonight, aren't we?","alts":["We're supposed to meet tonight, aren't we?"],"nuance":"현재진행형으로 정해진 미래 약속을 말할 때 자연스럽습니다. aren't we? 를 내려 읽으면 (당연히 맞지?) 하고 동의를 구하는 확인이고, 올려 읽으면 혹시 취소됐나 하고 살짝 불안해서 되묻는 느낌이 됩니다.","key":["긍정+부정 태그","aren't we?","약속 확인"]},{"type":"mc","q":"I'm next in line, ___","opts":["amn't I?","aren't I?","am I?"],"a":1,"ex":"I am 의 부가의문문은 특수하게 aren't I? 를 씁니다. amn't I? 는 쓰지 않습니다."},{"type":"write","ko":"창문 좀 닫아 줄래?","model":"Close the window, will you?","alts":["Close the window, would you?","Shut the window, could you?"],"nuance":"명령문 뒤에 will you? 를 붙이면 딱딱한 명령이 부드러운 부탁으로 바뀝니다. would you? / could you? 는 한층 더 공손합니다. 억양을 부드럽게 올리면 정중하고, 낮게 눌러 말하면 짜증 섞인 재촉처럼 들릴 수 있으니 주의하세요.","key":["명령문+will you?","부탁으로 완화","공손도"]},{"type":"mc","q":"He didn't call you back, ___","opts":["didn't he?","did he?","does he?"],"a":1,"ex":"부정문(didn't call) 뒤에는 긍정 태그 did he? 를 붙입니다. 시제(과거)와 주어를 맞춥니다."},{"type":"mc","q":"They've finished the report, ___","opts":["haven't they?","don't they?","didn't they?"],"a":0,"ex":"현재완료 긍정(have finished)이므로 부정 태그 haven't they? 를 씁니다. 조동사 have를 그대로 받습니다."},{"type":"write","ko":"너 나한테 화난 거 아니지, 그렇지?","model":"You're not mad at me, are you?","alts":["You aren't upset with me, are you?"],"nuance":"부정문(You're not) 뒤에 긍정 태그 are you? 를 붙여 조심스럽게 확인하는 말입니다. 끝을 살짝 올려 말하면 상대의 눈치를 보며 진심으로 궁금해하는 느낌이 강해집니다. 관계가 걱정될 때 자주 쓰는 표현입니다.","key":["부정문+긍정 태그","are you?","조심스러운 확인"]},{"type":"mc","q":"Let's not tell her yet, ___","opts":["will we?","shall we?","don't we?"],"a":1,"ex":"Let's not ~ 역시 Let's 청유문이라 태그는 shall we? 를 씁니다."},{"type":"mc","q":"You can drive a stick shift, ___","opts":["can you?","don't you?","can't you?"],"a":2,"ex":"조동사 can 긍정이므로 부정 태그 can't you? 를 붙입니다."},{"type":"write","ko":"이 근처에 카페 하나 있었잖아, 그렇지?","model":"There used to be a cafe around here, didn't there?","alts":["There was a cafe near here, wasn't there?"],"nuance":"used to 의 태그는 didn't 를 쓰고, There 구문에서는 태그의 주어도 there 를 그대로 씁니다. 기억을 더듬으며 상대에게 확인받고 싶을 때 자연스럽고, 끝을 올려 말하면 (내 기억 맞지?) 하는 느낌이 살아납니다.","key":["used to+didn't","There ~ there 태그","기억 확인"]},{"type":"mc","q":"Nobody knew about the surprise, ___","opts":["did they?","didn't they?","do they?"],"a":0,"ex":"nobody 같은 부정 의미의 주어는 부정문 취급이라 긍정 태그 did they? 를 씁니다. 태그 주어는 they 로 받습니다."},{"type":"mc","q":"Open the door for me, ___","opts":["do you?","will you?","are you?"],"a":1,"ex":"명령문 뒤 부탁의 태그는 will you? 입니다."},{"type":"write","ko":"너 어제 그 영화 봤지, 안 그래?","model":"You watched that movie yesterday, didn't you?","alts":["You saw that movie yesterday, didn't you?"],"nuance":"과거 긍정문 뒤에 didn't you? 를 붙여 확인합니다. 억양을 내려 말하면 (봤을 거 알면서) 동의를 구하는 느낌이고, 올려 말하면 정말 봤는지 궁금해서 묻는 진짜 질문이 됩니다. 회화에서 아주 흔한 형태입니다.","key":["과거 긍정+didn't you?","동의 유도 vs 진짜 질문","억양"]},{"type":"mc","q":"We should leave now, ___","opts":["should we?","shouldn't we?","don't we?"],"a":1,"ex":"조동사 should 긍정이므로 부정 태그 shouldn't we? 를 씁니다."},{"type":"mc","q":"There isn't any milk left, ___","opts":["is there?","isn't there?","are there?"],"a":0,"ex":"There isn't (부정) 뒤에는 긍정 태그 is there? 를 씁니다. There 구문의 태그 주어는 there 입니다."},{"type":"write","ko":"우리 이제 슬슬 시작할까?","model":"Let's get started, shall we?","alts":["Let's begin, shall we?"],"nuance":"Let's ~ 청유문에는 항상 shall we? 를 붙입니다. 함께 하자고 부드럽게 권유하는 느낌이라 회의나 수업을 시작할 때 매우 자연스럽습니다. 끝을 살짝 올리면 정중하게 상대의 동의를 구하는 뉘앙스가 됩니다.","key":["Let's+shall we?","권유","시작할 때"]},{"type":"mc","q":"He rarely eats out, ___","opts":["doesn't he?","does he?","isn't he?"],"a":1,"ex":"rarely(거의 ~않다)는 부정어라 문장을 부정으로 봅니다. 따라서 긍정 태그 does he? 를 씁니다."},{"type":"mc","q":"You won't forget to lock up, ___","opts":["won't you?","will you?","do you?"],"a":1,"ex":"won't(부정) 뒤에는 긍정 태그 will you? 를 씁니다."},{"type":"write","ko":"저 좀 도와주실 수 있죠, 그렇죠?","model":"You can help me, o":"Yes/No형"}],"examples":[{"en":"Do you know what time it is?","ko":"지금 몇 시인지 알아?"},{"en":"Could you tell me where the station is?","ko":"역이 어디 있는지 알려주시겠어요?"},{"en":"I wonder if he is coming.","ko":"그가 올지 궁금해."},{"en":"I don't know why she left.","ko":"그녀가 왜 떠났는지 모르겠어."}],"tip":"간접의문문 안에서는 \u003cb>도치·do 사용 금지\u003c/b>. 'Do you know where \u003cb>is\u003c/b> the station?' ✗ → 'where the station is' ✓","quiz":[{"type":"mc","q":"I do not know where ___.","opts":["the station is","does the station is","is the station"],"a":0,"ex":"간접의문문은 문장 속에 들어가면 평서문 어순(주어+동사)이 됩니다. where the station is 가 맞습니다."},{"type":"write","ko":"화장실이 어디 있는지 알려주실 수 있나요?","model":"Could you tell me where the bathroom is?","alts":["Do you know where the bathroom is?"],"nuance":"where is the bathroom는 직접의문문 어순이라 문장 속에 그대로 넣으면 어색합니다. 간접의문문에서는 where the bathroom is처럼 주어+동사 순서로 바꿔야 정중하고 자연스럽게 들립니다. Could you tell me로 시작하면 훨씬 공손하게 들립니다.","key":["where the bathroom is 어순","Could you tell me 정중 표현","is 도치 제거"]},{"type":"mc","q":"Turn into indirect: 「What time does the store open?」 -> Do you know what time the store ___?","opts":["does open","opens","open"],"a":1,"ex":"do/does는 사라지고 주어(the store)에 맞춰 동사에 -s를 붙여 opens가 됩니다."},{"type":"write","ko":"그가 회의에 올지 안 올지 아세요?","model":"Do you know if he is coming to the meeting?","alts":["Do you know whether he is coming to the meeting?"],"nuance":"Yes/No 질문을 간접의문문으로 넣을 때는 if나 whether를 씁니다. is he coming처럼 도치를 그대로 두면 어색하니 he is coming으로 어순을 바꿔야 합니다. whether가 조금 더 격식 있게 들립니다.","key":["if/whether로 연결","he is coming 어순","도치 제거"]},{"type":"mc","q":"Can you tell me ___ he likes coffee?","opts":["what","that","if"],"a":2,"ex":"Yes/No로 답하는 의문문(그가 커피를 좋아하나요?)은 if나 whether로 연결합니다."},{"type":"write","ko":"이 단어가 무슨 뜻인지 여쭤봐도 될까요?","model":"May I ask what this word means?","alts":["Could you tell me what this word means?"],"nuance":"what does this word mean을 그대로 넣으면 도치와 does가 남아 어색합니다. what this word means처럼 주어+동사로 바꾸고 means에 -s를 붙여야 합니다. May I ask로 시작하면 아주 공손하게 들립니다.","key":["w
